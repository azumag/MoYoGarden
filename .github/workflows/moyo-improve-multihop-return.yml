name: MoYoGarden multi-hop cargo return improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-improve-multihop-return.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply multi-hop cargo return improvement
        run: python3 .github/scripts/moyo_multihop_return.py
      - name: Add failure diagnostics to generated test
        shell: bash
        run: >-
          node -e 'const fs=require("fs"); const p="tests/autonomy-material-return-relay.test.mjs"; let s=fs.readFileSync(p,"utf8"); const old="  assert.equal(deposited, true, \"cargo should cross both ownership handoffs and deposit at the origin storehouse\");"; const diag="  if (!deposited) console.error(JSON.stringify({ first: first.object.runtime.snapshot(), relay: relay.object.runtime.snapshot(), origin: origin.object.runtime.snapshot(), firstStorage: [...first.state.storage.values.entries()], relayStorage: [...relay.state.storage.values.entries()], originStorage: [...origin.state.storage.values.entries()] }, null, 2));\\n" + old; if (!s.includes(old)) throw new Error("diagnostic target missing"); fs.writeFileSync(p,s.replace(old,diag));'
      - name: Validate full build
        id: validate
        continue-on-error: true
        shell: bash
        run: npm run build > /tmp/moyo-build.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moyo-multihop-build-log
          path: /tmp/moyo-build.log
          retention-days: 1
      - name: Fail on validation error
        if: steps.validate.outcome != 'success'
        run: exit 1
      - name: Commit product change
        if: steps.validate.outcome == 'success'
        shell: bash
        run: |
          rm .github/workflows/moyo-improve-multihop-return.yml
          rm .github/scripts/moyo_multihop_return.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sim: relay gathered cargo across regions"
          git push origin HEAD:main
