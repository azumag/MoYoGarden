name: MoYoGarden multi-hop cargo return improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-improve-multihop-return.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply multi-hop cargo return improvement
        run: python3 .github/scripts/moyo_multihop_return.py
      - name: Validate full build
        run: npm run build
      - name: Commit product change
        shell: bash
        run: |
          rm .github/workflows/moyo-improve-multihop-return.yml
          rm .github/scripts/moyo_multihop_return.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sim: relay gathered cargo across regions"
          git push origin HEAD:main
