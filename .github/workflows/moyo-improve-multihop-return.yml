name: MoYoGarden multi-hop cargo return improvement

# Diagnostic rerun: inspect the promoted courier claim before relay simulation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-improve-multihop-return.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply multi-hop cargo return improvement
        run: |
          python3 .github/scripts/moyo_multihop_return.py
          python3 .github/scripts/moyo_multihop_test_tune.py
          python3 .github/scripts/moyo_multihop_diag.py
      - name: Validate full build
        id: validate
        continue-on-error: true
        shell: bash
        run: npm run build > /tmp/moyo-build.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moyo-multihop-promoted-courier-log
          path: /tmp/moyo-build.log
          retention-days: 1
      - name: Fail on validation error
        if: ${{ steps.validate.outcome != 'success' }}
        run: exit 1
