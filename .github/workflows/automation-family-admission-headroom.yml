name: Temporary family admission headroom improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-family-admission-headroom.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch family admission capacity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('src/settlement-migration.ts')
          text = migration.read_text()
          old = '''export function settlementFamilyAdmissionReady(state: WorldState, factionId: string): boolean {
            const faction = getFaction(state, factionId);
            if (faction === undefined) return false;
            const activeStructures = state.structures.filter((structure) =>
              structure.factionId === factionId && structure.status === "active"
            );
            if (!activeStructures.some((structure) => structure.type === "camp")) return false;
            if (settlementFamilyHousingHeadroom(state, factionId) <= 0) return false;
            const storageHeadroom = activeStructures.reduce(
              (sum, structure) => sum + Math.max(
                0,
                BUILD_RECIPES[structure.type].storageCapacity - inventoryTotal(structure.storage),
              ),
              0,
            );
            if (storageHeadroom <= 0) return false;
            const storedFoodAvailable = activeStructures.some((structure) => structure.storage.food > 0);
            return faction.resources.food > 0 || storedFoodAvailable || state.tiles.some((tile) =>
              isHexGridCell(state, tile)
              && tile.terrain !== "water"
              && tile.resource?.kind === "food"
              && tile.resource.amount > 0
            );
          }
          '''
          new = '''export function settlementFamilyAdmissionHeadroom(state: WorldState, factionId: string): number {
            const faction = getFaction(state, factionId);
            if (faction === undefined) return 0;
            const activeStructures = state.structures.filter((structure) =>
              structure.factionId === factionId && structure.status === "active"
            );
            if (!activeStructures.some((structure) => structure.type === "camp")) return 0;
            const housingHeadroom = settlementFamilyHousingHeadroom(state, factionId);
            if (housingHeadroom <= 0) return 0;
            const storageHeadroom = activeStructures.reduce(
              (sum, structure) => sum + Math.max(
                0,
                BUILD_RECIPES[structure.type].storageCapacity - inventoryTotal(structure.storage),
              ),
              0,
            );
            if (storageHeadroom <= 0) return 0;

            const storedFood = activeStructures.reduce(
              (sum, structure) => sum + Math.max(0, structure.storage.food),
              0,
            );
            const ledgerFood = Math.max(0, faction.resources.food);
            // The faction ledger and structure inventories can describe the same
            // stock, especially across rolling persisted states, so never add them.
            // Live food deposits are physically separate support that settlers can
            // harvest after arrival and therefore can extend the bounded headroom.
            const liveFood = state.tiles.reduce((sum, tile) =>
              sum + (
                isHexGridCell(state, tile)
                && tile.terrain !== "water"
                && tile.resource?.kind === "food"
                && tile.resource.amount > 0
                  ? tile.resource.amount
                  : 0
              ),
              0,
            );
            const foodSupport = Math.max(ledgerFood, storedFood) + liveFood;
            return Math.max(0, Math.min(housingHeadroom, Math.floor(foodSupport)));
          }

          export function settlementFamilyAdmissionReady(state: WorldState, factionId: string): boolean {
            return settlementFamilyAdmissionHeadroom(state, factionId) > 0;
          }
          '''
          if old not in text:
              raise SystemExit('settlement admission source block not found')
          migration.write_text(text.replace(old, new, 1))

          autonomy = Path('src/autonomy-region.ts')
          text = autonomy.read_text()
          old_import = '''  settlementFamilyAdmissionReady,
            settlementFamilyHousingHeadroom,
          '''
          new_import = '''  settlementFamilyAdmissionHeadroom,
          '''
          if old_import not in text:
              raise SystemExit('autonomy family import block not found')
          text = text.replace(old_import, new_import, 1)
          old_notify = '''      const familyHousingHeadroom = settlementFamilyHousingHeadroom(state, pioneer.factionId);

                if (familyHousingHeadroom <= 0 || !settlementFamilyAdmissionReady(state, pioneer.factionId)) continue;
          '''
          new_notify = '''      const familyAdmissionHeadroom = settlementFamilyAdmissionHeadroom(state, pioneer.factionId);

                if (familyAdmissionHeadroom <= 0) continue;
          '''
          if old_notify not in text:
              raise SystemExit('autonomy family admission block not found')
          text = text.replace(old_notify, new_notify, 1)
          old_max = '''              maxFollowers: familyHousingHeadroom,
          '''
          new_max = '''              maxFollowers: familyAdmissionHeadroom,
          '''
          if old_max not in text:
              raise SystemExit('autonomy maxFollowers block not found')
          autonomy.write_text(text.replace(old_max, new_max, 1))

          test_file = Path('tests/settlement-family-follow.test.mjs')
          text = test_file.read_text()
          old_import = '''  settlementFamilyAdmissionReady,
            settlementFamilyHousingHeadroom,
          '''
          new_import = '''  settlementFamilyAdmissionHeadroom,
            settlementFamilyAdmissionReady,
            settlementFamilyHousingHeadroom,
          '''
          if old_import not in text:
              raise SystemExit('family test import block not found')
          text = text.replace(old_import, new_import, 1)
          marker = '''test("family follow chooses a neighboring region that strictly approaches the final target", () => {
          '''
          added = '''test("family admission headroom is bounded by physical food support", () => {
            const state = createInitialWorld({ seed: 260924, width: 40, height: 24, regionId: "hex-q1-r0" });
            clearHex(state);
            const faction = state.factions[0];
            assert.ok(faction);
            const residentTemplate = baseAgent(state);
            state.structures = [{
              id: "frontier-camp",
              factionId: faction.id,
              type: "camp",
              position: { x: 19, y: 11 },
              status: "active",
              progress: 6,
              requiredProgress: 6,
              storage: { wood: 0, stone: 0, food: 1 },
            }];
            faction.resources = { wood: 0, stone: 0, food: 1 };
            state.agents = Array.from({ length: 4 }, (_, index) => ({
              ...structuredClone(residentTemplate),
              id: `resident-${index}`,
              factionId: faction.id,
              hp: 100,
            }));

            assert.equal(settlementFamilyHousingHeadroom(state, faction.id), 2);
            assert.equal(
              settlementFamilyAdmissionHeadroom(state, faction.id),
              1,
              "one physical food unit must not authorize two family followers",
            );

            const foodTile = state.tiles.find((tile) => isHexGridCell(state, tile) && tile.terrain !== "water");
            assert.ok(foodTile);
            foodTile.resource = { kind: "food", amount: 3, maxAmount: 3 };
            assert.equal(
              settlementFamilyAdmissionHeadroom(state, faction.id),
              2,
              "additional live food may fill the remaining housing headroom",
            );
          });

          '''
          if marker not in text:
              raise SystemExit('family test insertion marker not found')
          test_file.write_text(text.replace(marker, added + marker, 1))
          PY
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit validated improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/automation-family-admission-headroom.yml
          git add src/autonomy-region.ts src/settlement-migration.ts tests/settlement-family-follow.test.mjs .github/workflows/automation-family-admission-headroom.yml
          git commit -m "sim: bound family migration by food support"
          git push origin HEAD:main
