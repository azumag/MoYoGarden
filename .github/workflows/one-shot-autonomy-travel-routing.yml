name: One-shot cross-region travel routing improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-autonomy-travel-routing.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch source and regression tests
        run: python scripts/one-shot-autonomy-routing.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full build and tests
        run: npm run build
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/autonomy-region.ts tests/autonomous-halo-travel.test.mjs
          git commit -m "sim: price crowding into cross-region expeditions"
          git push origin HEAD:main
