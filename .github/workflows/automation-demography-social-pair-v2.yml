name: One-shot social demography pairing v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-demography-social-pair-v2.yml

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch partner selection and add regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          path = Path('src/runtime.ts')
          source = path.read_text()
          helper_pattern = re.compile(r'(function isAdultForReproduction\(agent: Agent, tick: number\): boolean \{.*?\n\}\n\n)(?=function applyLifeStageTransitions)', re.S)
          helpers = textwrap.dedent('''
          function areCloseReproductiveKin(first: Agent, second: Agent): boolean {
            const firstParents: readonly string[] = first.parents ?? [];
            const secondParents: readonly string[] = second.parents ?? [];
            if (firstParents.includes(second.id) || secondParents.includes(first.id)) return true;
            return firstParents.some((parentId) => secondParents.includes(parentId));
          }

          function pairConversationCount(state: WorldState, firstId: string, secondId: string): number {
            let count = 0;
            for (const event of state.events) {
              if (event.kind !== "agent_conversation" || event.tick > state.tick) continue;
              const targetAgentId = event.data?.targetAgentId;
              if ((event.agentId === firstId && targetAgentId === secondId) ||
                  (event.agentId === secondId && targetAgentId === firstId)) count += 1;
            }
            return count;
          }

          ''').lstrip()
          source, count = helper_pattern.subn(lambda m: m.group(1) + helpers, source, count=1)
          if count != 1: raise SystemExit('reproduction helper anchor changed')

          partner_pattern = re.compile(r'      const partner = healthyAdults\n.*?      if \(partner === undefined\) continue;', re.S)
          partner = '''      const partner = healthyAdults
            .filter((candidate) =>
              candidate.id !== parent.id &&
              reproductiveRole(candidate) === "partner" &&
              !areCloseReproductiveKin(parent, candidate) &&
              manhattanDistance(candidate.position, parent.position) <= POPULATION_PARENT_RADIUS
            )
            .map((candidate) => ({
              candidate,
              familiarity: pairConversationCount(state, parent.id, candidate.id),
              distance: manhattanDistance(candidate.position, parent.position),
            }))
            .sort((a, b) =>
              b.familiarity - a.familiarity ||
              a.distance - b.distance ||
              a.candidate.id.localeCompare(b.candidate.id)
            )[0]?.candidate;
      if (partner === undefined) continue;'''
          source, count = partner_pattern.subn(partner, source, count=1)
          if count != 1: raise SystemExit('partner selection anchor changed')
          path.write_text(source)

          Path('tests/population-pairing-social.test.mjs').write_text(textwrap.dedent(r'''
          import assert from "node:assert/strict";
          import test from "node:test";
          import { WorldRuntime } from "../dist-ts/src/runtime.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          test("conception avoids close kin and prefers recent social familiarity", () => {
            const state = createInitialWorld({ seed: 26091601 });
            const faction = state.factions.find((entry) => entry.id === "ember");
            assert.ok(faction);
            const templates = state.agents.filter((agent) => agent.factionId === faction.id);
            assert.ok(templates.length >= 2);
            for (const tile of state.tiles) if (tile.terrain === "water") tile.terrain = "plain";

            const p = {
              x: Math.max(1, Math.min(state.width - 2, templates[0].position.x)),
              y: Math.max(1, Math.min(state.height - 2, templates[0].position.y)),
            };
            state.agents = state.agents.filter((agent) => agent.factionId !== faction.id);
            let templateIndex = 0;
            const member = (id, name, reproductiveRole, position) => {
              const agent = structuredClone(templates[templateIndex++ % templates.length]);
              agent.id = id; agent.name = name; agent.position = position;
              agent.hp = 100; agent.energy = 100; agent.autonomy = false;
              agent.reproductiveRole = reproductiveRole;
              delete agent.pregnancy; delete agent.lastBirthTick; delete agent.parents; delete agent.task;
              return agent;
            };
            const parent = member("pair-parent", "Pair Parent", "gestational", { ...p });
            parent.parents = ["founder-a", "founder-b"];
            const sibling = member("pair-sibling", "Pair Sibling", "partner", { ...p });
            sibling.parents = ["founder-a", "founder-b"];
            const near = member("pair-near", "Pair Near", "partner", { ...p });
            const familiar = member("pair-familiar", "Pair Familiar", "partner", { x: p.x + 1, y: p.y });
            state.agents.push(parent, sibling, near, familiar);

            state.structures = state.structures.filter((structure) => structure.factionId !== faction.id);
            state.structures.push({
              id: "pairing-camp", factionId: faction.id, type: "camp", position: { ...p },
              status: "active", progress: 6, requiredProgress: 6,
              storage: { wood: 0, stone: 0, food: 100 },
            });
            faction.resources.food = 100;
            state.tick = 8_639;

            for (let i = 0; i < 3; i += 1) state.events.push({
              id: `kin-conversation-${i}`, tick: 8_600 + i, kind: "agent_conversation",
              message: "kin talk", agentId: parent.id, factionId: faction.id,
              position: { ...p }, data: { targetAgentId: sibling.id },
            });
            for (let i = 0; i < 2; i += 1) state.events.push({
              id: `familiar-conversation-${i}`, tick: 8_610 + i, kind: "agent_conversation",
              message: "familiar talk", agentId: parent.id, factionId: faction.id,
              position: { ...p }, data: { targetAgentId: familiar.id },
            });

            const next = new WorldRuntime({ state }).tick().state;
            const conceived = next.agents.find((agent) => agent.id === parent.id);
            assert.ok(conceived);
            assert.equal(conceived.pregnancy?.partnerId, familiar.id);
            assert.notEqual(conceived.pregnancy?.partnerId, sibling.id);
            assert.notEqual(conceived.pregnancy?.partnerId, near.id);
          });
          ''').lstrip())
          PY
      - run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/automation-demography-social-pair-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime.ts tests/population-pairing-social.test.mjs .github/workflows/automation-demography-social-pair-v2.yml
          git diff --cached --check
          git commit -m 'sim: prefer socially familiar unrelated mates'
          git push origin HEAD:main
