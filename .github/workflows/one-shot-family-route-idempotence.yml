name: One-shot family route idempotence validation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply focused family-route patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/settlement-migration.ts")
          text = path.read_text()

          old = '''function familyFollowPriority(agent: Agent): number {
            if (agent.pregnancy !== undefined) return 0;
            if (agent.lifeStage === "infant" || agent.lifeStage === "juvenile") return 2;
            return 1;
          }

          export function registerSettlementFamilyFollowers(
          '''
          new = '''function familyFollowPriority(agent: Agent): number {
            if (agent.pregnancy !== undefined) return 0;
            if (agent.lifeStage === "infant" || agent.lifeStage === "juvenile") return 2;
            return 1;
          }

          function canJoinSettlementFamilyTarget(agent: Agent, targetRegionId: string): boolean {
            return agent.settlementFamilyTargetRegionId === undefined
              || sameSettlementRegion(agent.settlementFamilyTargetRegionId, targetRegionId);
          }

          export function registerSettlementFamilyFollowers(
          '''
          if old not in text:
              raise SystemExit("familyFollowPriority anchor not found")
          text = text.replace(old, new, 1)

          old = '''      || agent.hp <= 0
                || agent.factionId !== factionId
                || sourceResidentMatchesReference(state, agent, pioneerId)
              ) return;
          '''
          new = '''      || agent.hp <= 0
                || agent.factionId !== factionId
                || sourceResidentMatchesReference(state, agent, pioneerId)
                || !canJoinSettlementFamilyTarget(agent, targetRegionId)
              ) return;
          '''
          if old not in text:
              raise SystemExit("family add guard anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if (
                (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
                && relative.parents?.includes(pioneerId)
              ) {
                add(relative, 2);
                const caregiverId = dependentCaregiverId(state, relative);
                const caregiver = state.agents.find((agent) => agent.id === caregiverId);
                add(caregiver, 0);
          '''
          new = '''    if (
                (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
                && relative.parents?.includes(pioneerId)
              ) {
                if (!canJoinSettlementFamilyTarget(relative, targetRegionId)) continue;
                const caregiverId = dependentCaregiverId(state, relative);
                const caregiver = state.agents.find((agent) => agent.id === caregiverId);
                if (caregiver !== undefined && !canJoinSettlementFamilyTarget(caregiver, targetRegionId)) continue;
                add(relative, 2);
                add(caregiver, 0);
          '''
          if old not in text:
              raise SystemExit("dependent caregiver anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path("tests/settlement-family-route-idempotence.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { globalHandoffAgentId } from "../dist-ts/src/agent-ownership.js";
          import { registerSettlementFamilyFollowers } from "../dist-ts/src/settlement-migration.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          function templateAgent(state) {
            const agent = state.agents[0];
            assert.ok(agent);
            return structuredClone(agent);
          }

          test("family registration preserves an existing different settlement route", () => {
            const state = createInitialWorld({ seed: 26092011, width: 40, height: 24, regionId: "garden-1" });
            const template = templateAgent(state);
            const pioneerId = globalHandoffAgentId("pioneer", state.regionId);
            const previousTarget = "hex-q0-r1";
            const requestedTarget = "hex-q1-r0";
            const partner = {
              ...structuredClone(template),
              id: "partner",
              factionId: template.factionId,
              hp: 100,
              settlementFamilyTargetRegionId: previousTarget,
            };
            const child = {
              ...structuredClone(template),
              id: "child",
              factionId: template.factionId,
              hp: 100,
              autonomy: false,
              lifeStage: "infant",
              parents: [pioneerId, partner.id],
              settlementFamilyTargetRegionId: previousTarget,
            };
            state.agents = [partner, child];

            const conflict = registerSettlementFamilyFollowers(
              state,
              pioneerId,
              requestedTarget,
              template.factionId,
              globalHandoffAgentId(partner.id, state.regionId),
              2,
            );
            assert.deepEqual(conflict.agentIds, []);
            assert.equal(conflict.candidateCount, 0);
            assert.equal(partner.settlementFamilyTargetRegionId, previousTarget);
            assert.equal(child.settlementFamilyTargetRegionId, previousTarget);

            partner.settlementFamilyTargetRegionId = requestedTarget;
            child.settlementFamilyTargetRegionId = requestedTarget;
            const retry = registerSettlementFamilyFollowers(
              state,
              pioneerId,
              requestedTarget,
              template.factionId,
              globalHandoffAgentId(partner.id, state.regionId),
              2,
            );
            assert.deepEqual(retry.agentIds, ["partner", "child"]);
            assert.equal(retry.candidateCount, 2);
            assert.equal(partner.settlementFamilyTargetRegionId, requestedTarget);
            assert.equal(child.settlementFamilyTargetRegionId, requestedTarget);
          });
          ''')
          PY

      - name: Validate and commit or clean up
        shell: bash
        run: |
          set +e
          npm run build
          build_status=$?
          git diff --check
          diff_status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ $build_status -ne 0 || $diff_status -ne 0 ]]; then
            git restore --source=HEAD -- src/settlement-migration.ts
            rm -f tests/settlement-family-route-idempotence.test.mjs
            git rm --ignore-unmatch .github/workflows/one-shot-family-route-idempotence.yml
            git add -A
            git commit -m "ci: remove failed family route validation"
            git push origin HEAD:main
            exit 1
          fi

          git rm .github/workflows/one-shot-family-route-idempotence.yml
          git add src/settlement-migration.ts tests/settlement-family-route-idempotence.test.mjs
          git commit -m "sim: preserve existing family migration routes"
          git push origin HEAD:main
