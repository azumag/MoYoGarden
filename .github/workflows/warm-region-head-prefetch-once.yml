name: Warm region HEAD prefetch one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/warm-region-head-prefetch-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Apply bodyless passive region prewarm
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          nav = Path("public/client/region-navigation.js")
          text = nav.read_text()
          old = '''export function regionWarmSnapshotRequestInit() {
            return {
              cache: "no-store",
              headers: { "x-moyo-prefetch": "1" },
            };
          }
          '''
          new = '''export function regionWarmSnapshotRequestInit() {
            return {
              method: "HEAD",
              cache: "no-store",
              headers: { "x-moyo-prefetch": "1" },
            };
          }
          '''
          if old not in text:
              raise SystemExit("regionWarmSnapshotRequestInit anchor not found")
          nav.write_text(text.replace(old, new, 1))

          halo = Path("src/halo-region.ts")
          text = halo.read_text()
          old = '''    const passivePrefetch =
                request.method === "GET" &&
                url.pathname === "/api/world/snapshot" &&
                request.headers.get("x-moyo-prefetch") === "1";
          '''
          new = '''    const passivePrefetch =
                (request.method === "GET" || request.method === "HEAD") &&
                url.pathname === "/api/world/snapshot" &&
                request.headers.get("x-moyo-prefetch") === "1";
          '''
          if old not in text:
              raise SystemExit("passivePrefetch anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if (url.pathname === INTERNAL_EDGE_PATH || url.pathname === PUBLIC_HALO_PATH) {
                const assignmentError = await this.ensureHaloAssigned(request);
                if (assignmentError !== undefined) return assignmentError;
              }

              if (request.method === "GET" && url.pathname === INTERNAL_EDGE_PATH) {
          '''
          new = '''    const bodylessPassivePrefetch =
                request.method === "HEAD" &&
                url.pathname === "/api/world/snapshot" &&
                request.headers.get("x-moyo-prefetch") === "1";
              if (
                url.pathname === INTERNAL_EDGE_PATH ||
                url.pathname === PUBLIC_HALO_PATH ||
                bodylessPassivePrefetch
              ) {
                const assignmentError = await this.ensureHaloAssigned(request);
                if (assignmentError !== undefined) return assignmentError;
              }

              if (bodylessPassivePrefetch) {
                response = new Response(null, {
                  status: 204,
                  headers: {
                    "cache-control": "no-store",
                    "access-control-allow-origin": "*",
                  },
                });
              } else if (request.method === "GET" && url.pathname === INTERNAL_EDGE_PATH) {
          '''
          if old not in text:
              raise SystemExit("fetchWithActivity anchor not found")
          halo.write_text(text.replace(old, new, 1))

          test_path = Path("tests/region-activity-do.test.mjs")
          text = test_path.read_text()
          old = '''  await object.fetch(request("/api/world/snapshot", { headers: { "x-moyo-prefetch": "1" } }));
            const warmHealth = await (await object.fetch(request("/api/health"))).json();
          '''
          new = '''  const warmResponse = await object.fetch(request("/api/world/snapshot", {
              method: "HEAD",
              headers: { "x-moyo-prefetch": "1" },
            }));
            assert.equal(warmResponse.status, 204);
            assert.equal(await warmResponse.text(), "", "passive warm-up should not serialize a world snapshot");
            const warmHealth = await (await object.fetch(request("/api/health"))).json();
          '''
          if old not in text:
              raise SystemExit("region activity warmup anchor not found")
          test_path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/region-navigation.test.mjs")
          text = test_path.read_text()
          old = '''  const init = regionWarmSnapshotRequestInit();
            assert.equal(init.cache, "no-store");
          '''
          new = '''  const init = regionWarmSnapshotRequestInit();
            assert.equal(init.method, "HEAD");
            assert.equal(init.cache, "no-store");
          '''
          if old not in text:
              raise SystemExit("region navigation warmup anchor not found")
          test_path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/warm-region-head-prefetch-once.yml
          git add public/client/region-navigation.js src/halo-region.ts tests/region-activity-do.test.mjs tests/region-navigation.test.mjs
          git commit -m "perf: prewarm regions without snapshot payloads"
          git push origin HEAD:main
