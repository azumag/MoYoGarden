name: One-shot family admission improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-family-admission-one-shot.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded family housing admission
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/(\\s+\\} from/(\\} from/' .github/scripts/family_admission_patch.py
          python3 .github/scripts/family_admission_patch.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full validation
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "14957082+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/settlement-migration.ts src/autonomy-region.ts tests/settlement-family-follow.test.mjs
          git diff --cached --check
          git commit -m "sim: bound family follow by housing capacity"
          git push origin HEAD:main
