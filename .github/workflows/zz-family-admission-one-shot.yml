name: One-shot family admission improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/zz-family-admission-one-shot.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded family housing admission
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/apply.py <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"{label} not found")
              return text.replace(old, new, 1)

          settlement = Path("src/settlement-migration.ts")
          s = settlement.read_text()
          s = replace_once(s,
          '''export function registerSettlementFamilyFollowers(
            state: WorldState,
            pioneerId: string,
            targetRegionId: string,
            factionId: string,
            pioneerPartnerId?: string,
          ): SettlementFamilyRegistrationResult {''',
          '''export function registerSettlementFamilyFollowers(
            state: WorldState,
            pioneerId: string,
            targetRegionId: string,
            factionId: string,
            pioneerPartnerId?: string,
            maxFollowers = MAX_SETTLEMENT_FAMILY_FOLLOWERS,
          ): SettlementFamilyRegistrationResult {''',
          "family registration signature")
          s = replace_once(s,
          '''  const selected = [...priorities]
            .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]))
            .slice(0, MAX_SETTLEMENT_FAMILY_FOLLOWERS)
            .map(([agentId]) => agentId);''',
          '''  const followerLimit = Number.isFinite(maxFollowers)
            ? Math.max(0, Math.min(MAX_SETTLEMENT_FAMILY_FOLLOWERS, Math.floor(maxFollowers)))
            : MAX_SETTLEMENT_FAMILY_FOLLOWERS;
          const selected = [...priorities]
            .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]))
            .slice(0, followerLimit)
            .map(([agentId]) => agentId);''',
          "family follower selection")
          marker = "export function settlementFamilyAdmissionReady(state: WorldState, factionId: string): boolean {\n"
          helper = '''export function settlementFamilyHousingHeadroom(state: WorldState, factionId: string): number {
            const activeCamps = state.structures.filter((structure) =>
              structure.factionId === factionId
              && structure.status === "active"
              && structure.type === "camp"
            ).length;
            const residents = state.agents.filter((agent) =>
              agent.factionId === factionId && agent.hp > 0
            ).length;
            return Math.max(0, activeCamps * RESIDENT_CAPACITY_PER_CAMP - residents);
          }

          '''
          s = replace_once(s, marker, helper + marker, "family admission function")
          s = replace_once(s,
          '''  if (!activeStructures.some((structure) => structure.type === "camp")) return false;
            const storageHeadroom = activeStructures.reduce(''',
          '''  if (!activeStructures.some((structure) => structure.type === "camp")) return false;
            if (settlementFamilyHousingHeadroom(state, factionId) <= 0) return false;
            const storageHeadroom = activeStructures.reduce(''',
          "family admission camp gate")
          settlement.write_text(s)

          autonomy = Path("src/autonomy-region.ts")
          a = autonomy.read_text()
          a = replace_once(a,
          '''  registerSettlementFamilyFollowers,
            settlementFamilyAdmissionReady,
            shouldScoutSettlementMigration,''',
          '''  registerSettlementFamilyFollowers,
            settlementFamilyAdmissionReady,
            settlementFamilyHousingHeadroom,
            shouldScoutSettlementMigration,''',
          "settlement import block")
          a = replace_once(a,
          '''      || typeof body.factionId !== "string"
                || (body.pioneerPartnerId !== undefined && typeof body.pioneerPartnerId !== "string")
                || regionAxialCoordinate(body.targetRegionId) === undefined''',
          '''      || typeof body.factionId !== "string"
                || (body.pioneerPartnerId !== undefined && typeof body.pioneerPartnerId !== "string")
                || (body.maxFollowers !== undefined && (
                  !Number.isInteger(body.maxFollowers) || body.maxFollowers < 0
                ))
                || regionAxialCoordinate(body.targetRegionId) === undefined''',
          "family registration validation")
          a = replace_once(a,
          '''      body.factionId,
                body.pioneerPartnerId,
              );''',
          '''      body.factionId,
                body.pioneerPartnerId,
                body.maxFollowers,
              );''',
          "family registration call")
          a = replace_once(a,
          '''      if (!settlementFamilyAdmissionReady(state, pioneer.factionId)) continue;
                try {''',
          '''      const familyHousingHeadroom = settlementFamilyHousingHeadroom(state, pioneer.factionId);
                if (familyHousingHeadroom <= 0 || !settlementFamilyAdmissionReady(state, pioneer.factionId)) continue;
                try {''',
          "pioneer admission gate")
          a = replace_once(a,
          '''              factionId: pioneer.factionId,
                        ...(pioneer.pregnancy?.partnerId === undefined''',
          '''              factionId: pioneer.factionId,
                        maxFollowers: familyHousingHeadroom,
                        ...(pioneer.pregnancy?.partnerId === undefined''',
          "family registration payload")
          autonomy.write_text(a)

          tests = Path("tests/settlement-family-follow.test.mjs")
          t = tests.read_text()
          t = replace_once(t,
          '''  registerSettlementFamilyFollowers,
            settlementFamilyAdmissionReady,
          } from "../dist-ts/src/settlement-migration.js";''',
          '''  registerSettlementFamilyFollowers,
            settlementFamilyAdmissionReady,
            settlementFamilyHousingHeadroom,
          } from "../dist-ts/src/settlement-migration.js";''',
          "test import block")
          if "family admission uses camp resident headroom" in t:
              raise SystemExit("test already present")
          t += '''

          test("family admission uses camp resident headroom and follower registration respects it", () => {
            const destination = createInitialWorld({ seed: 260922, width: 40, height: 24, regionId: "hex-q1-r0" });
            clearHex(destination);
            const faction = destination.factions[0];
            assert.ok(faction);
            const residentTemplate = baseAgent(destination);
            destination.structures = [{
              id: "frontier-camp",
              factionId: faction.id,
              type: "camp",
              position: { x: 19, y: 11 },
              status: "active",
              progress: 6,
              requiredProgress: 6,
              storage: { wood: 0, stone: 0, food: 0 },
            }];
            faction.resources = { wood: 0, stone: 0, food: 2 };
            destination.agents = Array.from({ length: 5 }, (_, index) => ({
              ...structuredClone(residentTemplate),
              id: `resident-${index}`,
              factionId: faction.id,
              hp: 100,
            }));
            assert.equal(settlementFamilyHousingHeadroom(destination, faction.id), 1);
            assert.equal(settlementFamilyAdmissionReady(destination, faction.id), true);
            destination.agents.push({
              ...structuredClone(residentTemplate),
              id: "resident-full",
              factionId: faction.id,
              hp: 100,
            });
            assert.equal(settlementFamilyHousingHeadroom(destination, faction.id), 0);
            assert.equal(settlementFamilyAdmissionReady(destination, faction.id), false);

            const source = createInitialWorld({ seed: 260923, width: 40, height: 24, regionId: "garden-1" });
            clearHex(source);
            const template = baseAgent(source);
            const pioneerId = globalHandoffAgentId("pioneer", source.regionId);
            const partner = {
              ...structuredClone(template),
              id: "partner",
              factionId: template.factionId,
              hp: 100,
            };
            const child = {
              ...structuredClone(template),
              id: "child",
              factionId: template.factionId,
              hp: 100,
              autonomy: false,
              lifeStage: "infant",
              parents: [pioneerId, partner.id],
            };
            source.agents = [partner, child];
            const limited = registerSettlementFamilyFollowers(
              source,
              pioneerId,
              "hex-q1-r0",
              template.factionId,
              globalHandoffAgentId(partner.id, source.regionId),
              1,
            );
            assert.deepEqual(limited.agentIds, ["partner"]);
            assert.equal(partner.settlementFamilyTargetRegionId, "hex-q1-r0");
            assert.equal(child.settlementFamilyTargetRegionId, undefined);
          });
          '''
          tests.write_text(t)
          PY
          python3 /tmp/apply.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full validation
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "14957082+chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/settlement-migration.ts src/autonomy-region.ts tests/settlement-family-follow.test.mjs
          git diff --cached --check
          git commit -m "sim: bound family follow by housing capacity"
          git push origin HEAD:main
