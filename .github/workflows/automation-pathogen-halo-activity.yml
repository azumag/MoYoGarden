name: Verify combined pathogen halo materialization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-pathogen-halo-activity.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply pathogen halo materialization patch
        shell: python
        run: |
          from pathlib import Path
          import re
          import textwrap

          pathogen_path = Path("src/pathogen.ts")
          source = pathogen_path.read_text()
          pattern = re.compile(
            r'export function pathogenHaloPressureMap\(.*?\n\}\n\n/\*\*\n \* Materialize environmental burden.*?export function pathogenHaloReservoirMap\(.*?\n\}\n\nfunction singlePathogenStep',
            re.DOTALL,
          )
          replacement = textwrap.dedent('''\
          interface MaterializedPathogenHaloMaps {
            pressure: Map<string, number>;
            reservoir: Map<string, number>;
          }

          function pathogenHaloRemoteKey(
            regionId: string,
            direction: HexGridDirection,
            position: GridPosition,
          ): string {
            return `${regionId}:${direction}:${positionKey(position)}`;
          }

          function materializePathogenHaloMaps(
            links: readonly HexHaloLink[],
            edges: readonly PathogenEdgeSnapshot[],
            environment: PathogenEnvironmentFrame | undefined,
            includePressure: boolean,
            includeReservoir: boolean,
          ): MaterializedPathogenHaloMaps {
            const pressureIndex = new Map<string, number>();
            const reservoirIndex = new Map<string, number>();
            for (const edge of edges) {
              if (includePressure) {
                for (const entry of edge.agents) {
                  pressureIndex.set(
                    pathogenHaloRemoteKey(edge.regionId, edge.direction, entry.position),
                    clamp01(entry.pressure),
                  );
                }
              }
              if (includeReservoir) {
                for (const entry of edge.reservoirs ?? []) {
                  reservoirIndex.set(
                    pathogenHaloRemoteKey(edge.regionId, edge.direction, entry.position),
                    clamp01(entry.burden),
                  );
                }
              }
            }

            const pressure = new Map<string, number>();
            const reservoir = new Map<string, number>();
            for (const link of links) {
              const remoteKey = pathogenHaloRemoteKey(
                link.neighborRegionId,
                link.neighborDirection,
                link.neighborPosition,
              );
              const localKey = positionKey(link.sourcePosition);
              if (includePressure) {
                const remotePressure = pressureIndex.get(remoteKey);
                if (remotePressure !== undefined && remotePressure > 0) {
                  // Keep exact seam behavior aligned with ordinary local adjacency.
                  const gainRatio = pathogenAdjacentContactGain(
                    link.sourcePosition,
                    link.direction,
                    environment,
                  ) / PATHOGEN_ADJACENT_CONTACT_GAIN;
                  pressure.set(
                    localKey,
                    unionPressure(pressure.get(localKey) ?? 0, remotePressure * gainRatio),
                  );
                }
              }
              if (includeReservoir) {
                const burden = reservoirIndex.get(remoteKey);
                if (burden !== undefined && burden > 0) {
                  reservoir.set(
                    localKey,
                    unionPressure(reservoir.get(localKey) ?? 0, burden),
                  );
                }
              }
            }
            return { pressure, reservoir };
          }

          /**
           * Materialize both cross-seam carrier pressure and environmental burden
           * in one pass. Runtime pathogen alarms need both maps together, so sharing
           * the remote-key lookup and halo-link traversal avoids repeating the same
           * geometry/string-index work on every cross-region pathogen step.
           */
          export function pathogenHaloMaps(
            links: readonly HexHaloLink[],
            edges: readonly PathogenEdgeSnapshot[],
            environment?: PathogenEnvironmentFrame,
          ): MaterializedPathogenHaloMaps {
            return materializePathogenHaloMaps(links, edges, environment, true, true);
          }

          export function pathogenHaloPressureMap(
            links: readonly HexHaloLink[],
            edges: readonly PathogenEdgeSnapshot[],
            environment?: PathogenEnvironmentFrame,
          ): Map<string, number> {
            return materializePathogenHaloMaps(links, edges, environment, true, false).pressure;
          }

          /**
           * Materialize environmental burden from the exact ghost cells paired with local
           * boundary cells. This is read-only: the neighbor keeps ownership of its tile
           * reservoir, while the local region receives only a transient exposure input.
           */
          export function pathogenHaloReservoirMap(
            links: readonly HexHaloLink[],
            edges: readonly PathogenEdgeSnapshot[],
          ): Map<string, number> {
            return materializePathogenHaloMaps(links, edges, undefined, false, true).reservoir;
          }

          function singlePathogenStep''')
          source, replaced = pattern.subn(replacement, source, count=1)
          if replaced != 1:
            raise SystemExit(f"expected pressure/reservoir map block, replaced={replaced}")
          pathogen_path.write_text(source)

          region_path = Path("src/pathogen-region.ts")
          region = region_path.read_text()
          old_import = '''  pathogenEdgeSnapshot,\n  pathogenHaloPressureMap,\n  pathogenHaloReservoirMap,\n  pathogenStepCount,'''
          new_import = '''  pathogenEdgeSnapshot,\n  pathogenHaloMaps,\n  pathogenStepCount,'''
          if old_import not in region:
            raise SystemExit("expected pathogen halo map imports not found")
          region = region.replace(old_import, new_import, 1)
          old_result = '''    return {\n      pressure: pathogenHaloPressureMap(links, edges, this.pathogenEnvironmentFrame(state)),\n      reservoir: pathogenHaloReservoirMap(links, edges),\n    };'''
          new_result = '''    return pathogenHaloMaps(links, edges, this.pathogenEnvironmentFrame(state));'''
          if old_result not in region:
            raise SystemExit("expected materialized pathogen halo result not found")
          region = region.replace(old_result, new_result, 1)
          region_path.write_text(region)

          test_path = Path("tests/pathogen-reservoir-halo.test.mjs")
          test = test_path.read_text()
          old_test_import = '''  pathogenEdgeSnapshot,\n  pathogenHaloReservoirMap,'''
          new_test_import = '''  pathogenEdgeSnapshot,\n  pathogenHaloMaps,\n  pathogenHaloPressureMap,\n  pathogenHaloReservoirMap,'''
          if old_test_import not in test:
            raise SystemExit("expected pathogen reservoir test imports not found")
          test = test.replace(old_test_import, new_test_import, 1)
          test += textwrap.dedent('''\

          test("combined pathogen halo materialization preserves pressure and reservoir semantics", () => {
            const links = [
              {
                sourceRegionId: "garden-1",
                sourcePosition: { x: 30, y: 11 },
                direction: "east",
                neighborRegionId: "garden-2",
                neighborPosition: { x: 8, y: 11 },
                neighborDirection: "west",
              },
              {
                sourceRegionId: "garden-1",
                sourcePosition: { x: 30, y: 11 },
                direction: "northeast",
                neighborRegionId: "hex-q1-r-1",
                neighborPosition: { x: 18, y: 22 },
                neighborDirection: "southwest",
              },
            ];
            const edges = [
              {
                regionId: "garden-2",
                direction: "west",
                revision: 8,
                tick: 60,
                agents: [{ position: { x: 8, y: 11 }, pressure: 0.35 }],
                reservoirs: [{ position: { x: 8, y: 11 }, burden: 0.4 }],
              },
              {
                regionId: "hex-q1-r-1",
                direction: "southwest",
                revision: 3,
                tick: 60,
                agents: [{ position: { x: 18, y: 22 }, pressure: 0.5 }],
                reservoirs: [{ position: { x: 18, y: 22 }, burden: 0.25 }],
              },
            ];

            const combined = pathogenHaloMaps(links, edges);
            assert.deepEqual(combined.pressure, pathogenHaloPressureMap(links, edges));
            assert.deepEqual(combined.reservoir, pathogenHaloReservoirMap(links, edges));
            assert.ok((combined.pressure.get("30,11") ?? 0) > 0.35);
            assert.ok((combined.reservoir.get("30,11") ?? 0) > 0.4);
          });
          ''')
          test_path.write_text(test)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified production change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-pathogen-halo-activity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pathogen.ts src/pathogen-region.ts tests/pathogen-reservoir-halo.test.mjs .github/workflows/automation-pathogen-halo-activity.yml
          git diff --cached --check
          git commit -m "perf: share pathogen halo materialization"
          git push origin HEAD:main
