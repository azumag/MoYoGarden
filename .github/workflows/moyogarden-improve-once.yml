name: MoYoGarden improve once

on:
  push:
    paths:
      - .github/workflows/moyogarden-improve-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch corner pathogen halo composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1))

          pathogen = Path("src/pathogen.ts")
          replace_once(pathogen,
              "interface MaterializedPathogenHaloMaps {\n  pressure: Map<string, number>;\n  reservoir: Map<string, number>;\n}",
              "interface MaterializedPathogenHaloMaps {\n"
              "  // Preserve raw maps for helper compatibility while runtime also receives\n"
              "  // already-composed exposure. A macro-hex corner can touch two remote\n"
              "  // regions, so each ghost adjacency must apply its own gain before union.\n"
              "  pressure: Map<string, number>;\n"
              "  reservoir: Map<string, number>;\n"
              "  pressureExposure: Map<string, number>;\n"
              "  reservoirExposure: Map<string, number>;\n"
              "}")
          replace_once(pathogen,
              "  const pressure = new Map<string, number>();\n  const reservoir = new Map<string, number>();\n  for (const link of links) {",
              "  const pressure = new Map<string, number>();\n"
              "  const reservoir = new Map<string, number>();\n"
              "  const pressureExposure = new Map<string, number>();\n"
              "  const reservoirExposure = new Map<string, number>();\n"
              "  for (const link of links) {")
          replace_once(pathogen,
              "        // Keep exact seam behavior aligned with ordinary local adjacency.\n"
              "        const gainRatio = pathogenAdjacentContactGain(\n"
              "          link.sourcePosition,\n"
              "          link.direction,\n"
              "          environment,\n"
              "        ) / PATHOGEN_ADJACENT_CONTACT_GAIN;\n"
              "        pressure.set(\n"
              "          localKey,\n"
              "          unionPressure(pressure.get(localKey) ?? 0, remotePressure * gainRatio),\n"
              "        );",
              "        // Preserve the historical raw-map value while composing true exposure\n"
              "        // independently for every ghost adjacency at macro-hex corners.\n"
              "        const gain = pathogenAdjacentContactGain(\n"
              "          link.sourcePosition,\n"
              "          link.direction,\n"
              "          environment,\n"
              "        );\n"
              "        const gainRatio = gain / PATHOGEN_ADJACENT_CONTACT_GAIN;\n"
              "        pressure.set(\n"
              "          localKey,\n"
              "          unionPressure(pressure.get(localKey) ?? 0, remotePressure * gainRatio),\n"
              "        );\n"
              "        pressureExposure.set(\n"
              "          localKey,\n"
              "          unionPressure(pressureExposure.get(localKey) ?? 0, remotePressure * gain),\n"
              "        );")
          replace_once(pathogen,
              "        reservoir.set(\n"
              "          localKey,\n"
              "          unionPressure(reservoir.get(localKey) ?? 0, burden),\n"
              "        );",
              "        reservoir.set(\n"
              "          localKey,\n"
              "          unionPressure(reservoir.get(localKey) ?? 0, burden),\n"
              "        );\n"
              "        reservoirExposure.set(\n"
              "          localKey,\n"
              "          unionPressure(\n"
              "            reservoirExposure.get(localKey) ?? 0,\n"
              "            burden * PATHOGEN_RESERVOIR_ADJACENT_EXPOSURE_GAIN,\n"
              "          ),\n"
              "        );")
          replace_once(pathogen,
              "  return { pressure, reservoir };\n}",
              "  return { pressure, reservoir, pressureExposure, reservoirExposure };\n}")
          replace_once(pathogen,
              "  haloReservoir: ReadonlyMap<string, number> = new Map(),\n): number {",
              "  haloReservoir: ReadonlyMap<string, number> = new Map(),\n"
              "  haloPressureExposure?: ReadonlyMap<string, number>,\n"
              "  haloReservoirExposure?: ReadonlyMap<string, number>,\n"
              "): number {")
          replace_once(pathogen,
              "  if (safeHaloSteps <= 0 || (haloPressure.size === 0 && haloReservoir.size === 0)) return changed;",
              "  if (\n"
              "    safeHaloSteps <= 0 ||\n"
              "    (\n"
              "      haloPressure.size === 0 &&\n"
              "      haloReservoir.size === 0 &&\n"
              "      (haloPressureExposure?.size ?? 0) === 0 &&\n"
              "      (haloReservoirExposure?.size ?? 0) === 0\n"
              "    )\n"
              "  ) return changed;")
          replace_once(pathogen,
              "    const pressure = haloPressure.get(positionKey(agent.position)) ?? 0;\n"
              "    const reservoirBurden = haloReservoir.get(positionKey(agent.position)) ?? 0;\n"
              "    if (pressure <= 0 && reservoirBurden <= 0) continue;\n"
              "    const rawExposure = unionPressure(\n"
              "      pressure * PATHOGEN_ADJACENT_CONTACT_GAIN,\n"
              "      reservoirBurden * PATHOGEN_RESERVOIR_ADJACENT_EXPOSURE_GAIN,\n"
              "    );",
              "    const key = positionKey(agent.position);\n"
              "    const pressure = haloPressure.get(key) ?? 0;\n"
              "    const reservoirBurden = haloReservoir.get(key) ?? 0;\n"
              "    const carrierExposure = haloPressureExposure === undefined\n"
              "      ? pressure * PATHOGEN_ADJACENT_CONTACT_GAIN\n"
              "      : haloPressureExposure.get(key) ?? 0;\n"
              "    const environmentalExposure = haloReservoirExposure === undefined\n"
              "      ? reservoirBurden * PATHOGEN_RESERVOIR_ADJACENT_EXPOSURE_GAIN\n"
              "      : haloReservoirExposure.get(key) ?? 0;\n"
              "    if (carrierExposure <= 0 && environmentalExposure <= 0) continue;\n"
              "    const rawExposure = unionPressure(carrierExposure, environmentalExposure);")

          text = pathogen.read_text()
          tick_start = text.index("export function applyPathogenTickRange(")
          prefix, suffix = text[:tick_start], text[tick_start:]
          old_sig = "  haloPressure: ReadonlyMap<string, number> = new Map(),\n  haloReservoir: ReadonlyMap<string, number> = new Map(),\n): number {"
          new_sig = "  haloPressure: ReadonlyMap<string, number> = new Map(),\n  haloReservoir: ReadonlyMap<string, number> = new Map(),\n  haloPressureExposure?: ReadonlyMap<string, number>,\n  haloReservoirExposure?: ReadonlyMap<string, number>,\n): number {"
          if old_sig not in suffix:
              raise SystemExit("missing applyPathogenTickRange signature anchor")
          suffix = suffix.replace(old_sig, new_sig, 1)
          old_call = "        haloReservoir,\n      );"
          new_call = "        haloReservoir,\n        haloPressureExposure,\n        haloReservoirExposure,\n      );"
          if old_call not in suffix:
              raise SystemExit("missing applyPathogenTickRange call anchor")
          suffix = suffix.replace(old_call, new_call, 1)
          pathogen.write_text(prefix + suffix)

          region = Path("src/pathogen-region.ts")
          replace_once(region,
              "interface MaterializedPathogenHalo {\n  pressure: Map<string, number>;\n  reservoir: Map<string, number>;\n}",
              "interface MaterializedPathogenHalo {\n"
              "  pressure: Map<string, number>;\n"
              "  reservoir: Map<string, number>;\n"
              "  pressureExposure: Map<string, number>;\n"
              "  reservoirExposure: Map<string, number>;\n"
              "}")
          replace_once(region,
              "      return { pressure: new Map(), reservoir: new Map() };",
              "      return {\n"
              "        pressure: new Map(),\n"
              "        reservoir: new Map(),\n"
              "        pressureExposure: new Map(),\n"
              "        reservoirExposure: new Map(),\n"
              "      };")
          replace_once(region,
              ": { pressure: new Map<string, number>(), reservoir: new Map<string, number>() };",
              ": {\n"
              "        pressure: new Map<string, number>(),\n"
              "        reservoir: new Map<string, number>(),\n"
              "        pressureExposure: new Map<string, number>(),\n"
              "        reservoirExposure: new Map<string, number>(),\n"
              "      };")
          replace_once(region,
              "      halo.pressure,\n      halo.reservoir,\n    );",
              "      halo.pressure,\n"
              "      halo.reservoir,\n"
              "      halo.pressureExposure,\n"
              "      halo.reservoirExposure,\n"
              "    );")

          test_file = Path("tests/pathogen-reservoir-halo.test.mjs")
          tests = test_file.read_text()
          marker = 'test("corner pathogen halo composes each ghost adjacency independently"'
          if marker not in tests:
              lines = [
                  "",
                  'test("corner pathogen halo composes each ghost adjacency independently", () => {',
                  '  const seamPosition = { x: 30, y: 11 };',
                  '  const links = [',
                  '    { sourceRegionId: "garden-1", sourcePosition: seamPosition, direction: "east", neighborRegionId: "garden-2", neighborPosition: { x: 8, y: 11 }, neighborDirection: "west" },',
                  '    { sourceRegionId: "garden-1", sourcePosition: seamPosition, direction: "northEast", neighborRegionId: "hex-q1-r-1", neighborPosition: { x: 18, y: 22 }, neighborDirection: "southWest" },',
                  '  ];',
                  '  const pressureEdges = [',
                  '    { regionId: "garden-2", direction: "west", revision: 8, tick: 60, agents: [{ position: { x: 8, y: 11 }, pressure: 1 }], reservoirs: [] },',
                  '    { regionId: "hex-q1-r-1", direction: "southWest", revision: 3, tick: 60, agents: [{ position: { x: 18, y: 22 }, pressure: 1 }], reservoirs: [] },',
                  '  ];',
                  '  const pressureHalo = pathogenHaloMaps(links, pressureEdges);',
                  '  const localPressureTarget = agent("local-pressure-target", { x: 0, y: 0 });',
                  '  applyPathogenSteps({ agents: [',
                  '    localPressureTarget,',
                  '    { ...agent("east-carrier", { x: 1, y: 0 }), pathogenLoad: 1 },',
                  '    { ...agent("northeast-carrier", { x: 1, y: -1 }), pathogenLoad: 1 },',
                  '  ], tiles: [] }, 1);',
                  '  const seamPressureTarget = agent("seam-pressure-target", seamPosition);',
                  '  applyPathogenSteps({ agents: [seamPressureTarget], tiles: [] }, 0, undefined, pressureHalo.pressure, 1, new Map(), pressureHalo.pressureExposure, new Map());',
                  '  assert.ok(',
                  '    Math.abs(agentPathogenLoad(seamPressureTarget) - agentPathogenLoad(localPressureTarget)) < 1e-12,',
                  '    "two carrier ghost cells at a macro-hex corner must equal two ordinary local adjacencies",',
                  '  );',
                  '',
                  '  const reservoirEdges = pressureEdges.map((edge) => ({ ...edge, agents: [], reservoirs: [{ position: { ...edge.agents[0].position }, burden: 1 }] }));',
                  '  const reservoirHalo = pathogenHaloMaps(links, reservoirEdges);',
                  '  const localReservoirTarget = agent("local-reservoir-target", { x: 0, y: 0 });',
                  '  applyPathogenSteps({ agents: [localReservoirTarget], tiles: [tile({ x: 1, y: 0 }, 1), tile({ x: 1, y: -1 }, 1)] }, 1);',
                  '  const seamReservoirTarget = agent("seam-reservoir-target", seamPosition);',
                  '  applyPathogenSteps({ agents: [seamReservoirTarget], tiles: [] }, 0, undefined, new Map(), 1, reservoirHalo.reservoir, new Map(), reservoirHalo.reservoirExposure);',
                  '  assert.ok(',
                  '    Math.abs(agentPathogenLoad(seamReservoirTarget) - agentPathogenLoad(localReservoirTarget)) < 1e-12,',
                  '    "two reservoir ghost cells at a macro-hex corner must equal two ordinary local adjacencies",',
                  '  );',
                  '});',
                  "",
              ]
              test_file.write_text(tests + "\n".join(lines))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit improvement
        shell: bash
        run: |
          rm .github/workflows/moyogarden-improve-once.yml
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/pathogen.ts src/pathogen-region.ts tests/pathogen-reservoir-halo.test.mjs .github/workflows/moyogarden-improve-once.yml
          git commit -m "sim: preserve pathogen exposure at hex corners"
          git push origin HEAD:main
