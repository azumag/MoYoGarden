name: MoYoGarden improve once

on:
  push:
    paths:
      - .github/workflows/moyogarden-improve-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch corner pathogen halo composition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pathogen = Path("src/pathogen.ts")
          text = pathogen.read_text()
          function_start = text.index("function materializePathogenHaloMaps(")
          start = text.index("  const pressure = new Map<string, number>();", function_start)
          end_marker = "  return { pressure, reservoir };"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = "\n".join([
              "  // A macro-hex corner can legitimately touch two neighboring regions. Combine",
              "  // each ghost cell after applying its own ordinary adjacent-cell gain; combining",
              "  // raw pressures/burdens first and multiplying once would undercount corners.",
              "  // Convert the accumulated exposure back to an equivalent single-neighbor value",
              "  // because applyPathogenSteps() owns the final base gain. These equivalent values",
              "  // may exceed 1 at corners, but multiplying by the base gain reconstructs a",
              "  // bounded exposure exactly and keeps the existing map contract intact.",
              "  const pressureExposure = new Map<string, number>();",
              "  const reservoirExposure = new Map<string, number>();",
              "  for (const link of links) {",
              "    const remoteKey = pathogenHaloRemoteKey(",
              "      link.neighborRegionId,",
              "      link.neighborDirection,",
              "      link.neighborPosition,",
              "    );",
              "    const localKey = positionKey(link.sourcePosition);",
              "    if (includePressure) {",
              "      const remotePressure = pressureIndex.get(remoteKey);",
              "      if (remotePressure !== undefined && remotePressure > 0) {",
              "        const gain = pathogenAdjacentContactGain(",
              "          link.sourcePosition,",
              "          link.direction,",
              "          environment,",
              "        );",
              "        pressureExposure.set(",
              "          localKey,",
              "          unionPressure(pressureExposure.get(localKey) ?? 0, remotePressure * gain),",
              "        );",
              "      }",
              "    }",
              "    if (includeReservoir) {",
              "      const burden = reservoirIndex.get(remoteKey);",
              "      if (burden !== undefined && burden > 0) {",
              "        reservoirExposure.set(",
              "          localKey,",
              "          unionPressure(",
              "            reservoirExposure.get(localKey) ?? 0,",
              "            burden * PATHOGEN_RESERVOIR_ADJACENT_EXPOSURE_GAIN,",
              "          ),",
              "        );",
              "      }",
              "    }",
              "  }",
              "",
              "  const pressure = new Map<string, number>();",
              "  for (const [key, exposure] of pressureExposure) {",
              "    pressure.set(key, exposure / PATHOGEN_ADJACENT_CONTACT_GAIN);",
              "  }",
              "  const reservoir = new Map<string, number>();",
              "  for (const [key, exposure] of reservoirExposure) {",
              "    reservoir.set(key, exposure / PATHOGEN_RESERVOIR_ADJACENT_EXPOSURE_GAIN);",
              "  }",
              "  return { pressure, reservoir };",
          ])
          pathogen.write_text(text[:start] + replacement + text[end:])

          test_file = Path("tests/pathogen-reservoir-halo.test.mjs")
          tests = test_file.read_text()
          marker = 'test("corner pathogen halo preserves each ghost adjacency"'
          if marker not in tests:
              addition = "\n".join([
                  "",
                  'test("corner pathogen halo preserves each ghost adjacency", () => {',
                  '  const seamPosition = { x: 30, y: 11 };',
                  '  const links = [',
                  '    { sourceRegionId: "garden-1", sourcePosition: seamPosition, direction: "east", neighborRegionId: "garden-2", neighborPosition: { x: 8, y: 11 }, neighborDirection: "west" },',
                  '    { sourceRegionId: "garden-1", sourcePosition: seamPosition, direction: "northEast", neighborRegionId: "hex-q1-r-1", neighborPosition: { x: 18, y: 22 }, neighborDirection: "southWest" },',
                  '  ];',
                  '  const pressureEdges = [',
                  '    { regionId: "garden-2", direction: "west", revision: 8, tick: 60, agents: [{ position: { x: 8, y: 11 }, pressure: 1 }], reservoirs: [] },',
                  '    { regionId: "hex-q1-r-1", direction: "southWest", revision: 3, tick: 60, agents: [{ position: { x: 18, y: 22 }, pressure: 1 }], reservoirs: [] },',
                  '  ];',
                  '',
                  '  const localTarget = agent("local-target-corner", { x: 0, y: 0 });',
                  '  applyPathogenSteps({ agents: [',
                  '    localTarget,',
                  '    { ...agent("east-carrier", { x: 1, y: 0 }), pathogenLoad: 1 },',
                  '    { ...agent("northeast-carrier", { x: 1, y: -1 }), pathogenLoad: 1 },',
                  '  ], tiles: [] }, 1);',
                  '  const localPressureLoad = agentPathogenLoad(localTarget);',
                  '  const pressureHalo = pathogenHaloMaps(links, pressureEdges);',
                  '  const seamTarget = agent("seam-target-corner", seamPosition);',
                  '  applyPathogenSteps({ agents: [seamTarget], tiles: [] }, 0, undefined, pressureHalo.pressure, 1, new Map());',
                  '  assert.ok(',
                  '    Math.abs(agentPathogenLoad(seamTarget) - localPressureLoad) < 1e-12,',
                  '    `two remote carriers must equal two local adjacent carriers: seam=${agentPathogenLoad(seamTarget)} local=${localPressureLoad}`,',
                  '  );',
                  '',
                  '  const reservoirEdges = pressureEdges.map((edge) => ({ ...edge, agents: [], reservoirs: [{ position: edge.agents[0].position, burden: 1 }] }));',
                  '  const singleReservoir = pathogenHaloReservoirMap([links[0]], [reservoirEdges[0]]);',
                  '  const singleTarget = agent("single-reservoir-target", seamPosition);',
                  '  applyPathogenSteps({ agents: [singleTarget], tiles: [] }, 0, undefined, new Map(), 1, singleReservoir);',
                  '  const singleReservoirLoad = agentPathogenLoad(singleTarget);',
                  '  const cornerReservoir = pathogenHaloReservoirMap(links, reservoirEdges);',
                  '  const cornerTarget = agent("corner-reservoir-target", seamPosition);',
                  '  applyPathogenSteps({ agents: [cornerTarget], tiles: [] }, 0, undefined, new Map(), 1, cornerReservoir);',
                  '  const expectedCornerReservoirLoad = 1 - Math.pow(1 - singleReservoirLoad, 2);',
                  '  assert.ok(',
                  '    Math.abs(agentPathogenLoad(cornerTarget) - expectedCornerReservoirLoad) < 1e-12,',
                  '    `two remote reservoirs must compose independently: corner=${agentPathogenLoad(cornerTarget)} expected=${expectedCornerReservoirLoad}`,',
                  '  );',
                  '});',
                  "",
              ])
              test_file.write_text(tests + addition)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit improvement
        shell: bash
        run: |
          rm .github/workflows/moyogarden-improve-once.yml
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/pathogen.ts tests/pathogen-reservoir-halo.test.mjs .github/workflows/moyogarden-improve-once.yml
          git commit -m "sim: preserve pathogen exposure at hex corners"
          git push origin HEAD:main
