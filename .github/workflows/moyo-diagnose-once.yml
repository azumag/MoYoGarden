name: MoYoGarden one-shot patch diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-diagnose-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture patch error
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          prefix = ""
          source = Path('.github/workflows/moyo-improve-once.yml').read_text()
          match = re.search(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', source)
          try:
              if match is None:
                  raise RuntimeError('embedded patch payload not found')
              code = base64.b64decode(prefix + match.group(1)).decode()
              exec(compile(code, '<moyo-improve-once>', 'exec'))
              message = 'PATCH_UNEXPECTEDLY_SUCCEEDED'
          except BaseException as exc:
              message = f'{type(exc).__name__}: {exc}'
          Path('.moyo-patch-error').write_text(message + '\n')
          PY
      - name: Persist diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .moyo-patch-error
          git commit -m 'chore: capture one-shot patch diagnostic'
          git push origin HEAD:main
