name: One-shot hex terrain environment colors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          HEAD_MESSAGE="$(git log -1 --pretty=%s)"
          if [[ "$HEAD_MESSAGE" != "fix: rerun hex terrain environment one-shot" ]]; then
            echo "Not the staging commit; nothing to do."
            exit 0
          fi
          npm install --no-audit --no-fund
          python3 .github/scripts/apply-hex-environment-colors.py
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/client/terrain.js public/client/hex-tile-rendering.js tests/hex-terrain-environment.test.mjs
          git commit -m "visual: tint hex terrain from environment state"
          git push origin HEAD:main
