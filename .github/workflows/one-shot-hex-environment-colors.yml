name: One-shot hex terrain environment colors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          HEAD_MESSAGE="$(git log -1 --pretty=%s)"
          if [[ "$HEAD_MESSAGE" != "fix: run hex terrain environment one-shot" ]]; then
            echo "Not the staging commit; nothing to do."
            exit 0
          fi
          npm install --no-audit --no-fund
          python3 <<'PY'
          from pathlib import Path

          terrain = Path("public/client/terrain.js")
          text = terrain.read_text()
          old_import = 'import { hexGridDistance } from "./hex-grid.js";'
          new_import = 'import { HEX_GRID_STEPS, hexGridDistance } from "./hex-grid.js";'
          if text.count(old_import) != 1:
              raise SystemExit(f"terrain import marker count={text.count(old_import)}")
          text = text.replace(old_import, new_import, 1)

          old_relief = '''function localRelief(stateTile, tile) {
  if (!tile || tile.terrain === "water" || !Number.isFinite(tile.elevation)) return 0;
  let minimum = tile.elevation;
  let maximum = tile.elevation;
  for (let dy = -1; dy <= 1; dy += 1) {
    for (let dx = -1; dx <= 1; dx += 1) {
      if (dx === 0 && dy === 0) continue;
      const neighbor = stateTile(tile.x + dx, tile.y + dy);
      if (!neighbor || neighbor.terrain === "water" || !Number.isFinite(neighbor.elevation)) continue;
      minimum = Math.min(minimum, neighbor.elevation);
      maximum = Math.max(maximum, neighbor.elevation);
    }
  }
  return clamp01((maximum - minimum) / 0.22);
}'''
          new_relief = '''export function environmentalRelief(stateTile, tile) {
  if (!tile || tile.terrain === "water" || !Number.isFinite(tile.elevation)) return 0;
  let minimum = tile.elevation;
  let maximum = tile.elevation;
  for (const step of HEX_GRID_STEPS) {
    const neighbor = stateTile(tile.x + step.x, tile.y + step.y);
    if (!neighbor || neighbor.terrain === "water" || !Number.isFinite(neighbor.elevation)) continue;
    minimum = Math.min(minimum, neighbor.elevation);
    maximum = Math.max(maximum, neighbor.elevation);
  }
  return clamp01((maximum - minimum) / 0.22);
}'''
          if text.count(old_relief) != 1:
              raise SystemExit(f"terrain relief marker count={text.count(old_relief)}")
          text = text.replace(old_relief, new_relief, 1)
          if text.count("function environmentalTerrainColor(stateTile, tile)") != 1:
              raise SystemExit("terrain color marker missing or duplicated")
          text = text.replace(
              "function environmentalTerrainColor(stateTile, tile)",
              "export function environmentalTerrainColor(stateTile, tile)",
              1,
          )
          if text.count("localRelief(stateTile, tile)") != 2:
              raise SystemExit(f"localRelief call count={text.count('localRelief(stateTile, tile)')}")
          text = text.replace("localRelief(stateTile, tile)", "environmentalRelief(stateTile, tile)")
          terrain.write_text(text)

          hex_render = Path("public/client/hex-tile-rendering.js")
          text = hex_render.read_text()
          import_marker = 'import { TERRAIN_COLORS, disposeObject } from "./shared.js";'
          import_replacement = import_marker + '\nimport { environmentalTerrainColor } from "./terrain.js";'
          if text.count(import_marker) != 1:
              raise SystemExit(f"hex render import marker count={text.count(import_marker)}")
          text = text.replace(import_marker, import_replacement, 1)
          old_color = '''function tileColor(tile) {
  const color = (TERRAIN_COLORS[tile.terrain] || TERRAIN_COLORS.plain).clone();
  const elevation = Number.isFinite(tile.elevation) ? tile.elevation : 0.5;
  const drainage = Number.isFinite(tile.drainage) ? clamp01(tile.drainage) : 0;
  if (tile.terrain !== "water") {
    color.offsetHSL(0, 0, (elevation - 0.5) * 0.055 + drainage * 0.025);
  }
  return color;
}'''
          new_color = '''function tileColor(stateTile, tile) {
  if (tile.terrain === "water") {
    return (TERRAIN_COLORS[tile.terrain] || TERRAIN_COLORS.plain).clone();
  }
  // The hex renderer used to drop the moisture/vegetation/relief tint that the
  // fallback terrain already derives from low-level world state. Reuse the same
  // environmental signal so the visible continuous world reflects simulation
  // conditions instead of looking like flat categorical biome paint.
  return environmentalTerrainColor(stateTile, tile);
}'''
          if text.count(old_color) != 1:
              raise SystemExit(f"hex color marker count={text.count(old_color)}")
          text = text.replace(old_color, new_color, 1)
          loop_marker = '''  const radius = hexCellRadius(state.width, state.height);
  const surfaceOptions = regionSurfaceOptions(state.width, state.height);

  for (const tile of state.tiles) {'''
          loop_replacement = '''  const radius = hexCellRadius(state.width, state.height);
  const surfaceOptions = regionSurfaceOptions(state.width, state.height);
  const stateTile = (x, y) => x >= 0 && y >= 0 && x < state.width && y < state.height
    ? state.tiles[y * state.width + x]
    : null;

  for (const tile of state.tiles) {'''
          if text.count(loop_marker) != 1:
              raise SystemExit(f"hex stateTile marker count={text.count(loop_marker)}")
          text = text.replace(loop_marker, loop_replacement, 1)
          if text.count("const color = tileColor(tile);") != 1:
              raise SystemExit(f"hex tileColor call count={text.count('const color = tileColor(tile);')}")
          text = text.replace("const color = tileColor(tile);", "const color = tileColor(stateTile, tile);", 1)
          hex_render.write_text(text)

          test = Path("tests/hex-terrain-environment.test.mjs")
          if test.exists():
              raise SystemExit("hex terrain environment test already exists")
          test.write_text('''import assert from "node:assert/strict";
import { readFile } from "node:fs/promises";
import test from "node:test";
import {
  environmentalMoisture,
  environmentalRelief,
  environmentalTerrainColor,
} from "../public/client/terrain.js";

function tile(x, y, elevation = 0.5, terrain = "plain") {
  return { x, y, elevation, terrain };
}

function lookup(entries) {
  const byPosition = new Map(entries.map((entry) => [`${entry.x}:${entry.y}`, entry]));
  return (x, y) => byPosition.get(`${x}:${y}`) ?? null;
}

test("terrain relief uses the six axial neighbors rather than square diagonals", () => {
  const center = tile(0, 0, 0.5);
  const squareOnlyDiagonal = tile(1, 1, 1);
  assert.equal(environmentalRelief(lookup([center, squareOnlyDiagonal]), center), 0);

  const axialNeighbor = tile(1, -1, 1);
  assert.equal(environmentalRelief(lookup([center, axialNeighbor]), center), 1);
});

test("environment tint responds to low-level water moisture on the hex metric", () => {
  const center = tile(0, 0, 0.35);
  const dryLookup = lookup([center]);
  const wetLookup = lookup([center, tile(1, -1, 0, "water")]);

  const dryMoisture = environmentalMoisture(dryLookup, center);
  const wetMoisture = environmentalMoisture(wetLookup, center);
  assert.ok(wetMoisture > dryMoisture);
  assert.notEqual(
    environmentalTerrainColor(wetLookup, center).getHex(),
    environmentalTerrainColor(dryLookup, center).getHex(),
  );
});

test("active hex terrain renderer consumes the shared environmental tint", async () => {
  const source = await readFile(
    new URL("../public/client/hex-tile-rendering.js", import.meta.url),
    "utf8",
  );
  assert.match(source, /environmentalTerrainColor\(stateTile, tile\)/);
  assert.match(source, /const color = tileColor\(stateTile, tile\)/);
});
''')
          PY
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/client/terrain.js public/client/hex-tile-rendering.js tests/hex-terrain-environment.test.mjs
          git commit -m "visual: tint hex terrain from environment state"
          git push origin HEAD:main
