name: One-shot storage sink cap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-storage-sink-cap.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded cargo sink fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/autonomy-region.ts")
          source = source_path.read_text()
          old = '''        const supply = Math.min(capacityLeft, availableSupply);
          if (supply <= 0) return [];
          return [{
            entry,
            travelDistance,
            pathCrowding,
            destinationCrowding,
            destinationStorageHeadroom,
            visibleSupply: supply,
          '''
          new = '''        const supply = Math.min(capacityLeft, availableSupply);
          // When the source cannot promise a return sink, a concrete remote
          // storage observation is also an upper bound on useful cargo. This
          // does not turn the halo summary into a reservation: concurrent
          // sources can still race, but one expedition no longer knowingly
          // gathers more than the only observed sink can accept. Missing
          // metadata stays backward-compatible and leaves the old sizing intact.
          const sinkBoundedSupply =
            destinationStorageHeadroom !== undefined && availableSourceReturnStorage <= 0
              ? Math.min(supply, destinationStorageHeadroom)
              : supply;
          if (sinkBoundedSupply <= 0) return [];
          return [{
            entry,
            travelDistance,
            pathCrowding,
            destinationCrowding,
            destinationStorageHeadroom,
            visibleSupply: sinkBoundedSupply,
          '''
          if source.count(old) != 1:
              raise SystemExit(f"expected exactly one planner sizing block, found {source.count(old)}")
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path("tests/autonomy-region-storage-headroom-summary.test.mjs")
          test_source = test_path.read_text()
          anchor = '''test("known-full destination is rejected when the source has no return storage", () => {
          '''
          addition = '''test("known destination storage headroom caps cargo when source cannot accept a return", () => {
            const { state, agent } = fixture();
            fillFactionStorage(state, agent.factionId);
            const east = halo(state, "east", "garden-2", agent.factionId, 2);
            const plan = planAutonomousHaloTravel(state, [east]);
            assert.ok(plan);
            assert.equal(plan.claimedSupply, 2);
          });

          test("unknown destination storage keeps legacy cargo sizing when source cannot accept a return", () => {
            const { state, agent } = fixture();
            fillFactionStorage(state, agent.factionId);
            const east = halo(state, "east", "garden-2", agent.factionId, undefined);
            const plan = planAutonomousHaloTravel(state, [east]);
            assert.ok(plan);
            assert.equal(plan.claimedSupply, Math.min(8, agent.capacity));
          });

          '''
          if addition not in test_source:
              if test_source.count(anchor) != 1:
                  raise SystemExit(f"expected exactly one test anchor, found {test_source.count(anchor)}")
              test_path.write_text(test_source.replace(anchor, addition + anchor, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation change to commit"
            exit 0
          fi
          git commit -m "fix: bound expedition cargo by known storage"
          git push origin HEAD:main
