name: One-shot frontier kit scope validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-frontier-kit-scope.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply narrow frontier-kit fix and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sim = Path("src/simulation.ts")
          text = sim.read_text()
          pattern = re.compile(
              r'(?m)^(\s*)&& agent\.settlementMigrationOriginRegionId !== undefined\n'
              r'\1&& hasInventory\(agent\.inventory, recipe\.cost\);$'
          )
          def replacement(match):
              indent = match.group(1)
              return (
                  f'{indent}&& agent.settlementMigrationOriginRegionId !== undefined\n'
                  f'{indent}&& agent.settlementMigrationOriginRegionId !== state.regionId\n'
                  f'{indent}&& hasInventory(agent.inventory, recipe.cost);'
              )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"simulation anchor count={count}")
          sim.write_text(text)

          tests = Path("tests/settlement-handoff.test.mjs")
          current = tests.read_text()
          title = 'test("source-region migration marker does not spend the kit before handoff", () => {'
          if title in current:
              raise SystemExit("regression already exists")
          addition = r'''
          
          test("source-region migration marker does not spend the kit before handoff", () => {
            const { source, builder, sourceCell } = migrationWorlds();
            const faction = source.factions.find((entry) => entry.id === builder.factionId);
            assert.ok(faction);
            const buildTile = source.tiles[sourceCell.y * source.width + sourceCell.x];
            assert.ok(buildTile);
            buildTile.terrain = "plain";
            delete buildTile.resource;
          
            for (const agent of source.agents) {
              agent.autonomy = false;
              delete agent.task;
            }
            const storageTile = source.tiles.find((tile) =>
              tile.terrain !== "water"
              && (tile.x !== sourceCell.x || tile.y !== sourceCell.y)
            );
            assert.ok(storageTile);
            source.structures = [{
              id: "source-storehouse",
              factionId: builder.factionId,
              type: "storehouse",
              position: { x: storageTile.x, y: storageTile.y },
              status: "active",
              progress: 8,
              requiredProgress: 8,
              storage: { ...BUILD_RECIPES.camp.cost },
            }];
            faction.resources = { wood: 100, stone: 100, food: 100 };
            builder.position = { ...sourceCell };
            builder.inventory = { ...BUILD_RECIPES.camp.cost };
            builder.settlementMigrationOriginRegionId = source.regionId;
            builder.task = {
              source: "autonomy",
              issuedAtTick: source.tick,
              type: "build",
              structureType: "camp",
              target: { ...sourceCell },
            };
          
            const beforeFaction = { ...faction.resources };
            const advanced = simulate(source).state;
            const afterBuilder = advanced.agents.find((agent) => agent.id === builder.id);
            const afterFaction = advanced.factions.find((entry) => entry.id === builder.factionId);
            const afterStorehouse = advanced.structures.find((structure) => structure.id === "source-storehouse");
            assert.ok(afterBuilder);
            assert.ok(afterFaction);
            assert.ok(afterStorehouse);
            assert.ok(advanced.structures.some((structure) =>
              structure.factionId === builder.factionId
              && structure.type === "camp"
              && structure.status === "building"
            ));
            assert.deepEqual(
              afterBuilder.inventory,
              BUILD_RECIPES.camp.cost,
              "the migration kit is only frontier cargo after ownership has crossed into another region",
            );
            assert.equal(afterFaction.resources.wood, beforeFaction.wood - BUILD_RECIPES.camp.cost.wood);
            assert.equal(afterFaction.resources.stone, beforeFaction.stone - BUILD_RECIPES.camp.cost.stone);
            assert.equal(afterStorehouse.storage.wood, 0);
            assert.equal(afterStorehouse.storage.stone, 0);
          });
          '''
          tests.write_text(current.rstrip() + addition + "\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          npm run build
          git diff --check

      - name: Commit validated product change and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-frontier-kit-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation.ts tests/settlement-handoff.test.mjs .github/workflows/automation-frontier-kit-scope.yml
          git commit -m "sim: scope pioneer kit spending to frontier regions"
          git push origin HEAD:main
