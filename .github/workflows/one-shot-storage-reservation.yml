name: One-shot storage reservation patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-storage-reservation.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: python scripts/one-shot-storage-reservation.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit tested change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-storage-reservation.yml scripts/one-shot-storage-reservation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts tests/autonomous-concurrent-travel-do.test.mjs .github/workflows/one-shot-storage-reservation.yml scripts/one-shot-storage-reservation.py
          git commit -m "sim: reserve storage across concurrent expeditions"
          git push origin HEAD:main
