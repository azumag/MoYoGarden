name: One-shot bounded social memory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-social-memory.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add bounded persistent social familiarity
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/protocol.ts",
              '''export interface AgentPregnancy {\n  partnerId: string;\n  conceivedAtTick: number;\n  dueAtTick: number;\n}\n\nexport interface Agent {''',
              '''export interface AgentPregnancy {\n  partnerId: string;\n  conceivedAtTick: number;\n  dueAtTick: number;\n}\n\nexport interface AgentSocialMemory {\n  agentId: string;\n  familiarity: number;\n  lastInteractionTick: number;\n}\n\nexport interface Agent {''',
          )
          replace_once(
              "src/protocol.ts",
              '''  pregnancy?: AgentPregnancy;\n  lastBirthTick?: number;\n  settlementMigrationOriginRegionId?: string;''',
              '''  pregnancy?: AgentPregnancy;\n  lastBirthTick?: number;\n  // Bounded low-level relationship memory survives event-log truncation while\n  // keeping old schemaVersion=1 residents readable when the field is absent.\n  socialMemory?: AgentSocialMemory[];\n  settlementMigrationOriginRegionId?: string;''',
          )

          replace_once(
              "src/runtime.ts",
              '''const SOCIAL_MAX_CONVERSATIONS_PER_TICK = 2;\nconst SOCIAL_ADVICE_ENERGY_THRESHOLD = LOW_ENERGY_THRESHOLD + 7;''',
              '''const SOCIAL_MAX_CONVERSATIONS_PER_TICK = 2;\nconst SOCIAL_MEMORY_LIMIT = 8;\nconst SOCIAL_FAMILIARITY_MAX = 32;\nconst SOCIAL_ADVICE_ENERGY_THRESHOLD = LOW_ENERGY_THRESHOLD + 7;''',
          )
          replace_once(
              "src/runtime.ts",
              '''function pairConversationCount(state: WorldState, firstId: string, secondId: string): number {\n  let count = 0;\n  for (const event of state.events) {\n    if (event.kind !== "agent_conversation" || event.tick > state.tick) continue;\n    const targetAgentId = event.data?.targetAgentId;\n    if (\n      (event.agentId === firstId && targetAgentId === secondId) ||\n      (event.agentId === secondId && targetAgentId === firstId)\n    ) {\n      count += 1;\n    }\n  }\n  return count;\n}\n''',
              '''function pairConversationCount(state: WorldState, firstId: string, secondId: string): number {\n  let count = 0;\n  for (const event of state.events) {\n    if (event.kind !== "agent_conversation" || event.tick > state.tick) continue;\n    const targetAgentId = event.data?.targetAgentId;\n    if (\n      (event.agentId === firstId && targetAgentId === secondId) ||\n      (event.agentId === secondId && targetAgentId === firstId)\n    ) {\n      count += 1;\n    }\n  }\n  return count;\n}\n\nfunction rememberedFamiliarity(agent: Agent, otherId: string): number {\n  const entry = agent.socialMemory?.find((memory) => memory.agentId === otherId);\n  return entry === undefined || !Number.isFinite(entry.familiarity)\n    ? 0\n    : Math.max(0, entry.familiarity);\n}\n\nfunction pairFamiliarity(state: WorldState, first: Agent, second: Agent): number {\n  // Read either side so rolling-deploy or handoff snapshots with one reciprocal\n  // memory missing still retain the strongest known relationship. Recent events\n  // remain a compatibility fallback for persisted worlds that predate socialMemory.\n  return Math.max(\n    rememberedFamiliarity(first, second.id),\n    rememberedFamiliarity(second, first.id),\n    pairConversationCount(state, first.id, second.id),\n  );\n}\n\nfunction rememberSocialInteraction(agent: Agent, otherId: string, tick: number): void {\n  if (agent.id === otherId) return;\n  const memory = (agent.socialMemory ?? []).map((entry) => ({ ...entry }));\n  const existing = memory.find((entry) => entry.agentId === otherId);\n  if (existing === undefined) {\n    memory.push({ agentId: otherId, familiarity: 1, lastInteractionTick: tick });\n  } else {\n    existing.familiarity = Math.min(\n      SOCIAL_FAMILIARITY_MAX,\n      Math.max(0, existing.familiarity) + 1,\n    );\n    existing.lastInteractionTick = tick;\n  }\n  memory.sort((a, b) =>\n    b.familiarity - a.familiarity ||\n    b.lastInteractionTick - a.lastInteractionTick ||\n    a.agentId.localeCompare(b.agentId)\n  );\n  agent.socialMemory = memory.slice(0, SOCIAL_MEMORY_LIMIT);\n}\n''',
          )
          replace_once(
              "src/runtime.ts",
              '''          familiarity: pairConversationCount(state, parent.id, candidate.id),''',
              '''          familiarity: pairFamiliarity(state, parent, candidate),''',
          )
          replace_once(
              "src/runtime.ts",
              '''    state.events.push({\n      id: `event-${state.tick}-${state.events.length + 1}`,\n      tick: state.tick,\n      kind: "agent_conversation",\n      message: `${speaker.name} to ${listener.name}: "${social.line}"`,\n      agentId: speaker.id,\n      factionId: speaker.factionId,\n      position: { ...speaker.position },\n      data: {\n        targetAgentId: listener.id,\n        targetAgentName: listener.name,\n        topic: social.topic,\n        line: social.line,\n        speakerRole: speaker.role,\n        listenerRole: listener.role,\n        ...(social.resource === undefined ? {} : { resource: social.resource }),\n        ...(social.target === undefined ? {} : { reportedTarget: { ...social.target } }),\n        ...(social.knowledgeSourceAgentId === undefined\n          ? {}\n          : { knowledgeSourceAgentId: social.knowledgeSourceAgentId }),\n        ...(social.relayed ? { relayed: true } : {}),\n        ...(adviceTarget === undefined ? {} : { adviceAccepted: true, adviceTarget }),\n      },\n    });\n    engaged.add(speaker.id);''',
              '''    state.events.push({\n      id: `event-${state.tick}-${state.events.length + 1}`,\n      tick: state.tick,\n      kind: "agent_conversation",\n      message: `${speaker.name} to ${listener.name}: "${social.line}"`,\n      agentId: speaker.id,\n      factionId: speaker.factionId,\n      position: { ...speaker.position },\n      data: {\n        targetAgentId: listener.id,\n        targetAgentName: listener.name,\n        topic: social.topic,\n        line: social.line,\n        speakerRole: speaker.role,\n        listenerRole: listener.role,\n        ...(social.resource === undefined ? {} : { resource: social.resource }),\n        ...(social.target === undefined ? {} : { reportedTarget: { ...social.target } }),\n        ...(social.knowledgeSourceAgentId === undefined\n          ? {}\n          : { knowledgeSourceAgentId: social.knowledgeSourceAgentId }),\n        ...(social.relayed ? { relayed: true } : {}),\n        ...(adviceTarget === undefined ? {} : { adviceAccepted: true, adviceTarget }),\n      },\n    });\n    rememberSocialInteraction(speaker, listener.id, state.tick);\n    rememberSocialInteraction(listener, speaker.id, state.tick);\n    engaged.add(speaker.id);''',
          )

          replace_once(
              "src/agent-ownership.ts",
              '''  if (agent.pregnancy?.partnerId === sourceLocalId) {\n    agent.pregnancy = { ...agent.pregnancy, partnerId: promotedId };\n  }\n}\n''',
              '''  if (agent.pregnancy?.partnerId === sourceLocalId) {\n    agent.pregnancy = { ...agent.pregnancy, partnerId: promotedId };\n  }\n  if (agent.socialMemory !== undefined) {\n    agent.socialMemory = agent.socialMemory.map((memory) =>\n      memory.agentId === sourceLocalId\n        ? { ...memory, agentId: promotedId }\n        : memory\n    );\n  }\n}\n''',
          )
          replace_once(
              "src/agent-ownership.ts",
              '''  // Recent events are the current low-level social memory used by pairing and\n  // information sharing. Once a local BOT ID is promoted, keep that bounded\n  // history on the same world-global identity so returning or later-following\n  // family members do not see the same individual as a stranger.\n  rewriteHistoricalAgentReference(snapshot.state, agent.id, promotedId);''',
              '''  // Recent events remain a rolling-deploy compatibility memory, while the\n  // bounded per-agent socialMemory above is the durable low-level relationship\n  // state. Promote both to the same world-global identity when a resident leaves.\n  rewriteHistoricalAgentReference(snapshot.state, agent.id, promotedId);''',
          )

          Path("tests/social-memory.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { applySocialInteractions } from "../dist-ts/src/runtime.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          test("conversation records reciprocal bounded familiarity outside the event log", () => {
            const state = createInitialWorld({ seed: 26091612 });
            const factionId = state.agents[0]?.factionId;
            assert.ok(factionId);
            const pair = state.agents.filter((agent) => agent.factionId === factionId).slice(0, 2);
            assert.equal(pair.length, 2);
            const [first, second] = pair;
            assert.ok(first);
            assert.ok(second);
            second.position = { ...first.position };
            first.hp = second.hp = 100;
            first.energy = second.energy = 100;
            first.autonomy = second.autonomy = false;
            state.agents = [first, second];
            state.events = [];
            state.tick = 12;

            assert.equal(applySocialInteractions(state), 1);
            assert.deepEqual(first.socialMemory, [{
              agentId: second.id,
              familiarity: 1,
              lastInteractionTick: state.tick,
            }]);
            assert.deepEqual(second.socialMemory, [{
              agentId: first.id,
              familiarity: 1,
              lastInteractionTick: state.tick,
            }]);
            assert.equal(state.events.filter((event) => event.kind === "agent_conversation").length, 1);

            // Prove the relationship state is independent from bounded event retention.
            state.events = [];
            assert.equal(first.socialMemory?.[0]?.agentId, second.id);
            assert.equal(second.socialMemory?.[0]?.agentId, first.id);
          });
          '''.replace("          ", ""))

          Path("tests/population-pairing-memory.test.mjs").write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { WorldRuntime } from "../dist-ts/src/runtime.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          test("conception prefers persisted social familiarity after conversation events expire", () => {
            const state = createInitialWorld({ seed: 26091613 });
            const faction = state.factions.find((entry) => entry.id === "ember");
            assert.ok(faction);
            const templates = state.agents.filter((agent) => agent.factionId === faction.id);
            assert.ok(templates.length >= 2);
            for (const tile of state.tiles) if (tile.terrain === "water") tile.terrain = "plain";

            const position = { x: 19, y: 11 };
            state.agents = state.agents.filter((agent) => agent.factionId !== faction.id);
            let templateIndex = 0;
            const makeMember = (id, reproductiveRole, memberPosition) => {
              const agent = structuredClone(templates[templateIndex % templates.length]);
              templateIndex += 1;
              assert.ok(agent);
              agent.id = id;
              agent.name = id;
              agent.position = memberPosition;
              agent.hp = 100;
              agent.energy = 100;
              agent.autonomy = false;
              agent.reproductiveRole = reproductiveRole;
              delete agent.pregnancy;
              delete agent.lastBirthTick;
              delete agent.parents;
              delete agent.socialMemory;
              delete agent.task;
              return agent;
            };

            const parent = makeMember("memory-parent", "gestational", { ...position });
            const stranger = makeMember("memory-stranger", "partner", { ...position });
            const familiar = makeMember("memory-familiar", "partner", { x: position.x + 1, y: position.y });
            parent.socialMemory = [{
              agentId: familiar.id,
              familiarity: 6,
              lastInteractionTick: 1_000,
            }];
            familiar.socialMemory = [{
              agentId: parent.id,
              familiarity: 6,
              lastInteractionTick: 1_000,
            }];
            state.agents.push(parent, stranger, familiar);

            state.structures = state.structures.filter((structure) => structure.factionId !== faction.id);
            state.structures.push({
              id: "memory-pairing-camp",
              factionId: faction.id,
              type: "camp",
              position: { ...position },
              status: "active",
              progress: 6,
              requiredProgress: 6,
              storage: { wood: 0, stone: 0, food: 100 },
            });
            faction.resources.food = 100;
            state.events = [];
            state.tick = 8_639;

            const next = new WorldRuntime({ state }).tick().state;
            const conceived = next.agents.find((agent) => agent.id === parent.id);
            assert.ok(conceived);
            assert.equal(conceived.pregnancy?.partnerId, familiar.id);
            assert.notEqual(conceived.pregnancy?.partnerId, stranger.id);
          });
          '''.replace("          ", ""))

          replace_once(
              "tests/handoff-social-identity.test.mjs",
              '''  const moverLocalId = mover.id;\n  source.events = [''',
              '''  const moverLocalId = mover.id;\n  mover.socialMemory = [{ agentId: peer.id, familiarity: 3, lastInteractionTick: source.tick }];\n  peer.socialMemory = [{ agentId: moverLocalId, familiarity: 3, lastInteractionTick: source.tick }];\n  source.events = [''',
          )
          replace_once(
              "tests/handoff-social-identity.test.mjs",
              '''  assert.equal(unrelated.agentId, peer.id);\n  assert.equal(unrelated.data?.targetAgentId, "someone-else");\n});''',
              '''  assert.equal(unrelated.agentId, peer.id);\n  assert.equal(unrelated.data?.targetAgentId, "someone-else");\n\n  const residentPeer = detached.value.snapshot.state.agents.find((entry) => entry.id === peer.id);\n  assert.ok(residentPeer);\n  assert.equal(residentPeer.socialMemory?.[0]?.agentId, promotedMoverId);\n  assert.equal(residentPeer.socialMemory?.[0]?.familiarity, 3);\n  assert.equal(\n    detached.value.agent.socialMemory?.[0]?.agentId,\n    peer.id,\n    "the moving BOT keeps the still-local peer identity; reciprocal memory will promote when that peer moves",\n  );\n});''',
          )
          PY

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit validated improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/protocol.ts src/runtime.ts src/agent-ownership.ts \
            tests/social-memory.test.mjs tests/population-pairing-memory.test.mjs \
            tests/handoff-social-identity.test.mjs
          git diff --cached --check
          git commit -m "sim: persist bounded social familiarity"
          git push origin HEAD:main
