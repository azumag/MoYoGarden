name: Stage activity-aware pathogen halo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-pathogen-halo-tier.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply focused patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pathogen-region.ts')
          text = path.read_text()
          old = '''import {
            buildConfiguredHexHaloLinks,
            buildDynamicHexHaloLinks,
            type HexHaloLink,
          } from "./hex-halo.js";'''
          new = '''import { type HexHaloLink } from "./hex-halo.js";
          import { haloLinksForActivity, type RegionActivityTier } from "./halo-region.js";'''
          if old not in text:
              raise SystemExit('pathogen import anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''export class RegionDurableObject extends AutonomyRegionDurableObject {'''
          helper = '''export function pathogenHaloLinksForActivity(
            state: Pick<WorldState, "width" | "height">,
            regionIds: readonly string[],
            sourceRegionId: string,
            tier: RegionActivityTier,
          ): HexHaloLink[] {
            return haloLinksForActivity(state, regionIds, sourceRegionId, tier);
          }

          '''
          if anchor not in text:
              raise SystemExit('pathogen class anchor not found')
          text = text.replace(anchor, helper + anchor, 1)

          old_method = '''  private pathogenHaloLinks(state: WorldState): HexHaloLink[] {
            // Regions that already participate in the shared global axial cell frame use
            // exact six-direction ownership at every activity tier. Historical IDs with
            // no global identity retain the configured compatibility halo.
            if (regionGlobalCellOrigin(state.regionId, state.width, state.height) !== undefined) {
              return buildDynamicHexHaloLinks(state, state.regionId);
            }
            return buildConfiguredHexHaloLinks(
              state,
              configuredRegionIds(this.pathogenEnv),
              state.regionId,
            );
          }'''
          new_method = '''  private pathogenHaloLinks(state: WorldState): HexHaloLink[] {
            return pathogenHaloLinksForActivity(
              state,
              configuredRegionIds(this.pathogenEnv),
              state.regionId,
              this.activityTier(),
            );
          }'''
          if old_method not in text:
              raise SystemExit('pathogen halo method anchor not found')
          text = text.replace(old_method, new_method, 1)
          path.write_text(text)

          test_path = Path('tests/pathogen-halo-scope.test.mjs')
          test_text = test_path.read_text()
          old_import = '''  pathogenHaloEdgeRequests,
            pathogenHaloLinksForAgents,
            shouldMaterializePathogenHalo,'''
          new_import = '''  pathogenHaloEdgeRequests,
            pathogenHaloLinksForActivity,
            pathogenHaloLinksForAgents,
            shouldMaterializePathogenHalo,'''
          if old_import not in test_text:
              raise SystemExit('test import anchor not found')
          test_text = test_text.replace(old_import, new_import, 1)

          insertion = '''
          test("background pathogen halo keeps persisted legacy fan-out bounded", () => {
            const extent = { width: 40, height: 24 };
            const configured = ["garden-1", "garden-2", "garden-3"];

            const active = pathogenHaloLinksForActivity(extent, configured, "garden-1", "active");
            const warm = pathogenHaloLinksForActivity(extent, configured, "garden-1", "warm");
            const cold = pathogenHaloLinksForActivity(extent, configured, "garden-1", "cold");

            assert.equal(new Set(active.map((link) => link.neighborRegionId)).size, 6);
            assert.equal(new Set(warm.map((link) => link.neighborRegionId)).size, 2);
            assert.equal(new Set(cold.map((link) => link.neighborRegionId)).size, 2);
            assert.ok(active.length > warm.length, "active viewing may read all six exact neighbors");
            assert.equal(cold.length, warm.length, "background tiers must keep the configured compatibility budget");

            const canonical = pathogenHaloLinksForActivity(extent, configured, "hex-q4-r-2", "cold");
            assert.equal(
              new Set(canonical.map((link) => link.neighborRegionId)).size,
              6,
              "canonical sparse regions must retain six-direction halo without REGION_IDS enumeration",
            );
          });
          '''
          first_test = 'test("pathogen halo fetch scope follows occupied boundary cells instead of all six seams", () => {'
          if first_test not in test_text:
              raise SystemExit('test insertion anchor not found')
          test_text = test_text.replace(first_test, insertion + '\n' + first_test, 1)
          test_path.write_text(test_text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit product change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/pathogen-region.ts tests/pathogen-halo-scope.test.mjs
          git diff --cached --check
          git commit -m "perf: bound background pathogen halo fan-out"
          git push origin HEAD:main
