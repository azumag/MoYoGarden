name: One-shot pathogen cleanup fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply patch
        run: python .github/scripts/apply-pathogen-cleanup.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-pathogen-cleanup.yml
          git rm .github/scripts/apply-pathogen-cleanup.py
          git add src/pathogen.ts tests/pathogen-quiescent-fast-path.test.mjs
          git diff --cached --check
          git commit -m 'fix: clear dormant pathogen reservoir markers'
          git push origin HEAD:main
