name: Stage pathogen reservoir ownership transfer v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pathogen-reservoir-transfer-staging-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply crash-safe reservoir ownership transfer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          # Keep the repository's intentionally small Cloudflare compatibility
          # declarations aligned with the real Durable Object KV transaction API.
          dts_path = Path("src/cloudflare.d.ts")
          dts = dts_path.read_text()
          old = '''interface DurableObjectStorage {
            get<T = unknown>(key: string): Promise<T | undefined>;
            put<T = unknown>(key: string, value: T): Promise<void>;
            getAlarm(): Promise<number | null>;
            setAlarm(scheduledTime: number | Date): Promise<void>;
            deleteAlarm(): Promise<void>;
          }
          '''.replace("          ", "")
          new = '''interface DurableObjectStorageTransaction {
            get<T = unknown>(key: string): Promise<T | undefined>;
            put<T = unknown>(key: string, value: T): Promise<void>;
            delete(key: string): Promise<boolean>;
          }

          interface DurableObjectStorage extends DurableObjectStorageTransaction {
            transaction<T>(callback: (txn: DurableObjectStorageTransaction) => Promise<T>): Promise<T>;
            getAlarm(): Promise<number | null>;
            setAlarm(scheduledTime: number | Date): Promise<void>;
            deleteAlarm(): Promise<void>;
          }
          '''.replace("          ", "")
          if dts.count(old) != 1:
              raise SystemExit(f"cloudflare transaction typing anchor count={dts.count(old)}")
          dts_path.write_text(dts.replace(old, new, 1))

          # Reuse the already-reviewed v1 product patch verbatim. Its first failure
          # was compile-time only: the local compatibility declaration lacked the
          # real DurableObjectStorage.transaction surface. Do not reuse v2's manual
          # multi-put rollback because that is not crash-atomic.
          workflow = Path(".github/workflows/pathogen-reservoir-transfer-staging.yml").read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          lines = embedded.splitlines()
          embedded = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(embedded, "pathogen-reservoir-transfer-staging.py", "exec"), {})

          # The transport planner returns a real tile snapshot as its target. The
          # contract we need here is exact cross-DO coordinate mapping, not a ban on
          # additional read-only terrain/reservoir fields in that snapshot.
          test_path = Path("tests/pathogen-reservoir-transfer-do.test.mjs")
          test_text = test_path.read_text()
          pattern = r'''assert\.deepEqual\(\s*transfer\.deltas\[0\]\.targetTile,\s*\{\s*x:\s*transition\.targetPosition\.x,\s*y:\s*transition\.targetPosition\.y,?\s*\},\s*\);'''
          replacement = '''assert.deepEqual(
            { x: transfer.deltas[0].targetTile.x, y: transfer.deltas[0].targetTile.y },
            { x: transition.targetPosition.x, y: transition.targetPosition.y },
          );'''
          test_text, count = re.subn(pattern, replacement, test_text, count=1)
          if count != 1:
              raise SystemExit(f"reservoir coordinate assertion anchor count={count}")
          test_path.write_text(test_text)
          PY

          npm install --no-audit --no-fund
          npm run build
          git diff --check

          rm -f \
            .github/workflows/pathogen-reservoir-transfer-staging.yml \
            .github/workflows/pathogen-reservoir-transfer-staging-v2.yml \
            .github/workflows/pathogen-reservoir-transfer-staging-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/cloudflare.d.ts src/pathogen.ts src/pathogen-region.ts tests/pathogen-reservoir-transfer-do.test.mjs .github/workflows
          git commit -m "sim: conserve pathogen reservoir across region seams"
          git push origin HEAD:main
