name: MoYoGarden one-shot improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-improve-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch live-neighbor height cache and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          live_path = Path('public/client/live-region-rendering.js')
          source = live_path.read_text()
          old_import = 'import { disposeObject, hash2 } from "./shared.js";\nimport { WorldView } from "./world-view.js";'
          new_import = 'import { isHexGridCell } from "./hex-grid.js";\nimport { disposeObject, hash2 } from "./shared.js";\nimport { WorldView } from "./world-view.js";'
          if old_import not in source:
              raise SystemExit('live-region import anchor changed')
          source = source.replace(old_import, new_import, 1)

          old_height = '''function surfaceHeightMap(state) {
            const result = new Map();
            for (const tile of state?.tiles ?? []) {
              if (!Number.isFinite(tile?.x) || !Number.isFinite(tile?.y)) continue;
              result.set(`${tile.x}:${tile.y}`, previewSurfaceHeight(tile));
            }
            return result;
          }'''
          new_height = '''function surfaceHeightMap(state) {
            const result = new Map();
            const width = Number.isInteger(state?.width) ? state.width : null;
            const height = Number.isInteger(state?.height) ? state.height : null;
            for (const tile of state?.tiles ?? []) {
              if (!Number.isFinite(tile?.x) || !Number.isFinite(tile?.y)) continue;
              // Persisted WorldState still uses the rectangular 40x24 envelope,
              // but only the axial hex footprint is renderable. Neighbor proxies
              // never query height outside that footprint, so do not allocate map
              // entries for compatibility-envelope cells on every live refresh.
              // Missing dimensions retain the legacy permissive behavior.
              if (width !== null && height !== null && !isHexGridCell(tile, width, height)) continue;
              result.set(`${tile.x}:${tile.y}`, previewSurfaceHeight(tile));
            }
            return result;
          }'''
          if old_height not in source:
              raise SystemExit('surfaceHeightMap anchor changed')
          source = source.replace(old_height, new_height, 1)
          live_path.write_text(source)

          test_path = Path('tests/live-region-window.test.mjs')
          tests = test_path.read_text()
          marker = 'test("live-neighbor height cache excludes rectangular compatibility-envelope cells"'
          if marker not in tests:
              tests += '''\n\ntest("live-neighbor height cache excludes rectangular compatibility-envelope cells", () => {
            assert.match(liveRegionSource, /import \\{ isHexGridCell \\} from "\\.\\/hex-grid\\.js"/);
            const heightStart = liveRegionSource.indexOf("function surfaceHeightMap(state)");
            const heightEnd = liveRegionSource.indexOf("function createNeighborResourceGlyph", heightStart);
            assert.ok(heightStart >= 0 && heightEnd > heightStart);
            const heightSource = liveRegionSource.slice(heightStart, heightEnd);
            assert.match(heightSource, /Number\\.isInteger\\(state\\?\\.width\\)/);
            assert.match(heightSource, /Number\\.isInteger\\(state\\?\\.height\\)/);
            assert.match(heightSource, /!isHexGridCell\\(tile, width, height\\)/);
            assert.match(heightSource, /width !== null && height !== null/);
          });\n'''
              test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified improvement and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/moyo-improve-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "perf: bound live-neighbor height cache to hex footprint"
          git push origin HEAD:main
