name: MoYoGarden one-shot return storage lease renewal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-improve-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch return storage wall-clock lease renewal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          code = base64.b64decode("").decode()
          exec(compile(code, "<moyo-improve-once>", "exec"))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/moyo-improve-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomy-material-return-relay.test.mjs .github/workflows/moyo-improve-once.yml
          git commit -m 'sim: renew return storage across relay delays'
          git push origin HEAD:main
