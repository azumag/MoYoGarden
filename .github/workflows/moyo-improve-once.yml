name: MoYoGarden one-shot return storage fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-improve-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch return storage reservation lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('src/autonomy-region.ts')
          s = p.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          s = replace_once(
              s,
              '  returnToSourceStorage?: boolean;\n  // Source-local reservation against a concrete remote storage observation.',
              '  returnToSourceStorage?: boolean;\n  // Capacity promised by the source settlement for cargo that has already\n  // been gathered but is still physically in transit. Keep this separate\n  // from `amount`, which shrinks as the remote supply claim is settled.\n  returnStorageAmount?: number;\n  // Source-local reservation against a concrete remote storage observation.',
              'interface field',
          )

          s = replace_once(
              s,
              '    && typeof value.amount === "number"\n    && Number.isFinite(value.amount)\n    && value.amount > 0',
              '    && typeof value.amount === "number"\n    && Number.isFinite(value.amount)\n    && value.amount >= 0\n    && (\n      value.amount > 0\n      || (\n        value.returnToSourceStorage === true\n        && typeof value.returnStorageAmount === "number"\n        && Number.isFinite(value.returnStorageAmount)\n        && value.returnStorageAmount > 0\n      )\n    )',
              'claim amount validator',
          )
          s = replace_once(
              s,
              '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")\n    && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");',
              '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")\n    && (value.returnStorageAmount === undefined || (\n      typeof value.returnStorageAmount === "number"\n      && Number.isFinite(value.returnStorageAmount)\n      && value.returnStorageAmount >= 0\n    ))\n    && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");',
              'return storage validator',
          )

          start = s.index('function reservedReturnStorageForFaction(')
          end = s.index('\n}\n\nfunction reservedDestinationStorageForFaction(', start) + 2
          block = s[start:end]
          block = replace_once(
              block,
              '    if (claim.returnToSourceStorage !== true || claim.expiresAtTick <= state.tick) return reserved;\n',
              '    if (claim.returnToSourceStorage !== true || claim.expiresAtTick <= state.tick) return reserved;\n    const reservedAmount = claim.returnStorageAmount ?? claim.amount;\n    if (reservedAmount <= 0) return reserved;\n',
              'return reservation amount',
          )
          block = block.replace('reserved + claim.amount', 'reserved + reservedAmount')
          s = s[:start] + block + s[end:]

          start = s.index('function returnHandoffForArrival(')
          end = s.index('\n}\n\nfunction returnTravelTargetForArrival(', start) + 2
          block = s[start:end]
          block = replace_once(block, '  const finalHop = selected.transition.targetRegionId === claim.sourceRegionId;\n', '', 'final hop marker')
          block = replace_once(
              block,
              '    ...(finalHop ? {} : {\n      claimId: claim.claimId,\n      claimSourceRegionId: claim.sourceRegionId,\n      returnToSourceStorage: true,\n    }),',
              '    claimId: claim.claimId,\n    claimSourceRegionId: claim.sourceRegionId,\n    returnToSourceStorage: true,',
              'final hop claim tracking',
          )
          s = s[:start] + block + s[end:]

          start = s.index('  private async settleArrivalSourceClaim(')
          end = s.index('\n  private async releaseArrivalSourceClaim(', start)
          block = s[start:end]
          pattern = re.compile(r'    const next = remainingAmount > 0\n      \? claims\.map\(\(entry\) => entry\.claimId === claim\.claimId\n        \? \{ \.\.\.entry, amount: remainingAmount, settledAmount \}\n        : entry\)\n      : claims\.filter\(\(entry\) => entry\.claimId !== claim\.claimId\);')
          replacement = '''    const keepReturnStorageReservation =
              claim.returnToSourceStorage === true
              && (claim.returnStorageAmount ?? claim.amount) > 0;
            const next = remainingAmount > 0 || keepReturnStorageReservation
              ? claims.map((entry) => entry.claimId === claim.claimId
                ? {
                    ...entry,
                    amount: remainingAmount,
                    settledAmount,
                    ...(keepReturnStorageReservation
                      ? {
                          returnStorageAmount: claim.returnStorageAmount ?? claim.amount,
                          expiresAtTick: Math.max(
                            claim.expiresAtTick,
                            tick + AUTONOMOUS_SUPPLY_CLAIM_TTL,
                          ),
                        }
                      : {}),
                  }
                : entry)
              : claims.filter((entry) => entry.claimId !== claim.claimId);'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          block, n = pattern.subn(replacement, block, count=1)
          if n != 1:
              raise SystemExit(f'settle source claim: expected 1 match, got {n}')
          s = s[:start] + block + s[end:]

          start = s.index('  private async reconcileArrivalClaims(')
          end = s.index('\n  private replaceRuntimeState(', start)
          block = s[start:end]
          block = replace_once(
              block,
              '          updatedClaim.returnToSourceStorage === true &&\n          pendingReturn === undefined &&',
              '          updatedClaim.returnToSourceStorage === true &&\n          claim.sourceRegionId !== after.regionId &&\n          pendingReturn === undefined &&',
              'source arrival waiting guard',
          )
          marker = '      // Keep admitted sink capacity until gathered cargo leaves this BOT.\n'
          insertion = (
              '      // Source-return capacity follows the physical cargo too. Supply\n'
              '      // settlement means the resource was gathered; it does not mean the\n'
              '      // promised source storage is free for another expedition yet.\n'
              '      const returnCargoOutstanding =\n'
              '        updatedClaim.returnToSourceStorage === true\n'
              '        && gatheredAmount > 0\n'
              '        && agent !== undefined\n'
              '        && agent.inventory[updatedClaim.resource] > 0;\n'
              '      if (returnCargoOutstanding) {\n'
              '        keep.push(updatedClaim);\n'
              '        continue;\n'
              '      }\n\n'
          )
          block = replace_once(block, marker, insertion + marker, 'return cargo outstanding')
          block = replace_once(
              block,
              '      if (reservationExhausted) {\n        dirty = true;\n        continue;\n      }',
              '      if (reservationExhausted && updatedClaim.returnToSourceStorage !== true) {\n        dirty = true;\n        continue;\n      }',
              'return release despite supply exhaustion',
          )
          s = s[:start] + block + s[end:]

          start = s.index('  private async startAutonomousTravels(')
          end = s.index('\n  private async resumeSettlementMigration(', start)
          block = s[start:end]
          block = replace_once(
              block,
              '          sourceFactionId: agent.factionId,\n          returnToSourceStorage,\n          ...(destinationStorageReserved ? { destinationStorageReserved: true } : {}),',
              '          sourceFactionId: agent.factionId,\n          returnToSourceStorage,\n          ...(returnToSourceStorage ? { returnStorageAmount: claimedSupply } : {}),\n          ...(destinationStorageReserved ? { destinationStorageReserved: true } : {}),',
              'initial return storage amount',
          )
          s = s[:start] + block + s[end:]
          p.write_text(s)

          t = Path('tests/autonomy-material-return-relay.test.mjs')
          x = t.read_text()
          x = replace_once(
              x,
              'const ARRIVAL_CLAIMS_KEY = "handoff:autonomy:arrival-claims:v1";\n',
              'const ARRIVAL_CLAIMS_KEY = "handoff:autonomy:arrival-claims:v1";\nconst SUPPLY_CLAIMS_KEY = "handoff:autonomy:claims:v1";\n',
              'test supply key',
          )
          x = replace_once(
              x,
              '  origin.object.runtime = new WorldRuntime({ state: originState }); await origin.object.persist();\n  await first.state.storage.put(ARRIVAL_CLAIMS_KEY, [{ claimId: "two-hop-return", sourceRegionId: "hex-q2-r0", agentId: courier.id, resource: "wood", registeredAtTick: 24, gatheredAmount: 4, settledAmount: 4, returnToSourceStorage: true }]);\n  let deposited = false;\n',
              '  origin.object.runtime = new WorldRuntime({ state: originState }); await origin.object.persist();\n  await origin.state.storage.put(SUPPLY_CLAIMS_KEY, [{ claimId: "two-hop-return", agentId: courier.id, resource: "wood", direction: "W", neighborRegionId: "garden-2", amount: 0, settledAmount: 4, expiresAtTick: originState.tick + 1000, sourceFactionId: courier.factionId, returnToSourceStorage: true, returnStorageAmount: 4 }]);\n  await first.state.storage.put(ARRIVAL_CLAIMS_KEY, [{ claimId: "two-hop-return", sourceRegionId: "hex-q2-r0", agentId: courier.id, resource: "wood", registeredAtTick: 24, gatheredAmount: 4, settledAmount: 4, returnToSourceStorage: true }]);\n  let deposited = false;\n  let observedFinalTransitReservation = false;\n',
              'test relay setup',
          )
          x = replace_once(
              x,
              '    const storehouse = origin.object.runtime.snapshot().structures.find((entry) => entry.id === "origin-storehouse");\n    if ((storehouse?.storage.wood ?? 0) >= 4) { deposited = true; break; }\n',
              '    const storehouse = origin.object.runtime.snapshot().structures.find((entry) => entry.id === "origin-storehouse");\n    const finalArrivalClaims = await origin.state.storage.get(ARRIVAL_CLAIMS_KEY);\n    const sourceClaims = await origin.state.storage.get(SUPPLY_CLAIMS_KEY);\n    if ((storehouse?.storage.wood ?? 0) < 4 && finalArrivalClaims?.some((entry) => entry.claimId === "two-hop-return") && sourceClaims?.some((entry) => entry.claimId === "two-hop-return" && entry.returnStorageAmount === 4)) observedFinalTransitReservation = true;\n    if ((storehouse?.storage.wood ?? 0) >= 4) { deposited = true; break; }\n',
              'test observe final transit',
          )
          x = replace_once(
              x,
              '  assert.equal(deposited, true, "cargo should cross both ownership handoffs and deposit at the origin storehouse");\n  const relayClaims = await relay.state.storage.get(ARRIVAL_CLAIMS_KEY);\n',
              '  assert.equal(observedFinalTransitReservation, true, "source storage must remain reserved after the final handoff until physical deposit");\n  assert.equal(deposited, true, "cargo should cross both ownership handoffs and deposit at the origin storehouse");\n  const sourceClaimsAfterDeposit = await origin.state.storage.get(SUPPLY_CLAIMS_KEY);\n  assert.ok(sourceClaimsAfterDeposit === undefined || sourceClaimsAfterDeposit.every((entry) => entry.claimId !== "two-hop-return"));\n  const relayClaims = await relay.state.storage.get(ARRIVAL_CLAIMS_KEY);\n',
              'test release after deposit',
          )
          t.write_text(x)
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/moyo-improve-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomy-material-return-relay.test.mjs .github/workflows/moyo-improve-once.yml
          git commit -m 'sim: reserve return storage until cargo deposit'
          git push origin HEAD:main
