name: One-shot pathogen wind continuity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-pathogen-wind-continuity.yml"

permissions:
  contents: write

concurrency:
  group: moyo-one-shot-pathogen-wind-continuity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply focused simulation change
        run: python .github/scripts/one-shot-pathogen-wind-continuity.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full validation
        run: npm run build

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pathogen.ts src/pathogen-region.ts tests/pathogen-wind-continuity.test.mjs
          git commit -m "sim: carry pathogen contact with shared wind"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Remove one-shot scaffolding
        run: |
          git rm .github/scripts/one-shot-pathogen-wind-continuity.py .github/workflows/one-shot-pathogen-wind-continuity.yml
          git commit -m "chore: remove pathogen wind patch workflow"
          git pull --rebase origin main
          git push origin HEAD:main
