name: Automation family stored-food admission

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply improvement
        run: python scripts/automation-family-stored-food.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit validated improvement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-family-stored-food.yml
          rm scripts/automation-family-stored-food.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settlement-migration.ts tests/settlement-family-follow.test.mjs .github/workflows/automation-family-stored-food.yml scripts/automation-family-stored-food.py
          git commit -m 'sim: count stored food for family settlement admission'
          git push origin HEAD:main
