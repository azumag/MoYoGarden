name: One-shot biological demography improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-biological-demography.yml

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace spontaneous population growth with biological demography
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          protocol_path = Path('src/protocol.ts')
          protocol = protocol_path.read_text()
          old_agent = '''export type AgentTask = MoveTask | GatherTask | BuildTask | DepositTask | TradeTask;

export interface Agent {
  id: string;
  name: string;
  factionId: string;
  role: AgentRole;
  position: GridPosition;
  hp: number;
  energy: number;
  capacity: number;
  inventory: Inventory;
  autonomy: boolean;
  goal: string;
  status: string;
  settlementMigrationOriginRegionId?: string;
  task?: AgentTask;
}
'''
          new_agent = '''export type AgentTask = MoveTask | GatherTask | BuildTask | DepositTask | TradeTask;

export type AgentLifeStage = "infant" | "juvenile" | "adult" | "elder";
export type ReproductiveRole = "gestational" | "partner";

export interface AgentPregnancy {
  partnerId: string;
  conceivedAtTick: number;
  dueAtTick: number;
}

export interface Agent {
  id: string;
  name: string;
  factionId: string;
  role: AgentRole;
  position: GridPosition;
  hp: number;
  energy: number;
  capacity: number;
  inventory: Inventory;
  autonomy: boolean;
  goal: string;
  status: string;
  // Demography is optional so persisted schemaVersion=1 worlds remain valid.
  // Legacy residents without these fields are treated as adult founders.
  birthTick?: number;
  lifeStage?: AgentLifeStage;
  reproductiveRole?: ReproductiveRole;
  parents?: [string, string];
  pregnancy?: AgentPregnancy;
  lastBirthTick?: number;
  settlementMigrationOriginRegionId?: string;
  task?: AgentTask;
}
'''
          if old_agent not in protocol:
              raise SystemExit('Agent interface anchor changed; refusing to patch')
          protocol_path.write_text(protocol.replace(old_agent, new_agent, 1))

          runtime_path = Path('src/runtime.ts')
          runtime = runtime_path.read_text()
          old_constants = '''// Population growth is demographic, not a minute-scale work cadence. With the
// production 10s virtual tick, 8,640 ticks is one day. Virtual-time catch-up
// deliberately preserves this elapsed-time meaning without creating a burst of
// new residents every few minutes when a sleeping region wakes up.
const POPULATION_GROWTH_INTERVAL = 8_640;
const POPULATION_FOOD_BUFFER_PER_AGENT = 4;
const POPULATION_GROWTH_FOOD_COST = 6;
const POPULATION_HEALTH_THRESHOLD = 70;
const POPULATION_ENERGY_THRESHOLD = 35;
const POPULATION_SETTLEMENT_RADIUS = 3;
const POPULATION_RESIDENT_CAPACITY_PER_CAMP = 6;
'''
          new_constants = '''// Demography runs on a compressed biological timescale. With the production
// 10s virtual tick, 8,640 ticks is one simulation day. Population can only grow
// through conception -> gestation -> birth; sleeping regions preserve the same
// elapsed virtual time through the existing bounded catch-up path.
const POPULATION_REPRODUCTION_INTERVAL = 8_640;
const POPULATION_GESTATION_TICKS = POPULATION_REPRODUCTION_INTERVAL;
const POPULATION_INFANCY_TICKS = POPULATION_REPRODUCTION_INTERVAL;
const POPULATION_MATURITY_TICKS = POPULATION_REPRODUCTION_INTERVAL * 3;
const POPULATION_POSTPARTUM_COOLDOWN_TICKS = POPULATION_REPRODUCTION_INTERVAL;
const POPULATION_FOOD_BUFFER_PER_AGENT = 4;
const POPULATION_BIRTH_FOOD_COST = 6;
const POPULATION_HEALTH_THRESHOLD = 70;
const POPULATION_ENERGY_THRESHOLD = 35;
const POPULATION_PARENT_RADIUS = 2;
const POPULATION_RESIDENT_CAPACITY_PER_CAMP = 6;
'''
          if old_constants not in runtime:
              raise SystemExit('population constants anchor changed; refusing to patch')
          runtime = runtime.replace(old_constants, new_constants, 1)

          growth_site_pattern = re.compile(
              r'function settlementGrowthSite\(state: WorldState, factionId: string\): GridPosition \| undefined \{.*?\n\}\n\n(?=function settlementResidentCapacity)',
              re.S,
          )
          runtime, removed = growth_site_pattern.subn('', runtime, count=1)
          if removed != 1:
              raise SystemExit('settlement growth-site anchor changed; refusing to patch')

          growth_pattern = re.compile(
              r'function applyPopulationGrowth\(state: WorldState\): void \{.*?\n\}\n\n(?=function factionSupplyShortage)',
              re.S,
          )
          new_demography = '''function demographicHash(value: string): number {
  let hash = 2166136261;
  for (let index = 0; index < value.length; index += 1) {
    hash ^= value.charCodeAt(index);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}

function reproductiveRole(agent: Agent): "gestational" | "partner" {
  return agent.reproductiveRole ?? (demographicHash(agent.id) % 2 === 0 ? "gestational" : "partner");
}

function isAdultForReproduction(agent: Agent, tick: number): boolean {
  if (agent.lifeStage === "elder") return false;
  if (agent.lifeStage === "adult") return true;
  if (agent.birthTick === undefined) return true;
  return tick - agent.birthTick >= POPULATION_MATURITY_TICKS;
}

function applyLifeStageTransitions(state: WorldState): void {
  for (const agent of state.agents) {
    if (agent.birthTick === undefined || agent.lifeStage === "adult" || agent.lifeStage === "elder") continue;
    const age = state.tick - agent.birthTick;
    if (age >= POPULATION_MATURITY_TICKS) {
      const role = populationRole(state, agent.factionId);
      agent.lifeStage = "adult";
      agent.role = role;
      agent.capacity = role === "builder" ? 32 : 24;
      agent.autonomy = true;
      agent.goal = populationGoal(role);
      if (agent.task?.source === "autonomy") delete agent.task;
      agent.status = "reached adulthood";
      continue;
    }
    if (age >= POPULATION_INFANCY_TICKS && agent.lifeStage === "infant") {
      agent.lifeStage = "juvenile";
      agent.status = "juvenile; growing with the settlement";
    }
  }
}

function birthDuePregnancies(state: WorldState): void {
  const gestationalParents = [...state.agents]
    .filter((agent) => agent.pregnancy !== undefined && agent.pregnancy.dueAtTick <= state.tick)
    .sort((a, b) => a.id.localeCompare(b.id));

  for (const parent of gestationalParents) {
    const pregnancy = parent.pregnancy;
    if (pregnancy === undefined) continue;
    const faction = getFaction(state, parent.factionId);
    if (faction === undefined) {
      delete parent.pregnancy;
      continue;
    }

    const population = state.agents.filter((agent) => agent.factionId === parent.factionId);
    const generation = population.length + 1;
    const role = populationRole(state, parent.factionId);
    const childId = `agent-${parent.factionId}-birth-${state.tick}-${generation}`;
    const prefix = faction.name.split(/\\s+/)[0] || faction.id;
    const nourished = consumeStoredFood(state, parent.factionId, POPULATION_BIRTH_FOOD_COST);

    state.agents.push({
      id: childId,
      name: `${prefix} ${generation}`,
      factionId: parent.factionId,
      role,
      position: { ...parent.position },
      hp: 100,
      energy: nourished ? 70 : 35,
      capacity: 8,
      inventory: emptyInventory(),
      autonomy: false,
      goal: "Grow safely before joining settlement work",
      status: nourished ? "infant; dependent on parents" : "infant; food insecure",
      birthTick: state.tick,
      lifeStage: "infant",
      reproductiveRole: demographicHash(childId) % 2 === 0 ? "gestational" : "partner",
      parents: [parent.id, pregnancy.partnerId],
    });
    delete parent.pregnancy;
    parent.lastBirthTick = state.tick;
    parent.status = `caring for newborn ${prefix} ${generation}`;
  }
}

function planConceptions(state: WorldState): void {
  if (state.tick === 0 || state.tick % POPULATION_REPRODUCTION_INTERVAL !== 0) return;

  for (const faction of [...state.factions].sort((a, b) => a.id.localeCompare(b.id))) {
    const population = state.agents
      .filter((agent) => agent.factionId === faction.id)
      .sort((a, b) => a.id.localeCompare(b.id));
    if (population.length < 2) continue;
    const pregnancies = population.filter((agent) => agent.pregnancy !== undefined).length;
    if (population.length + pregnancies >= settlementResidentCapacity(state, faction.id)) continue;

    const foodNeeded = population.length * POPULATION_FOOD_BUFFER_PER_AGENT + POPULATION_BIRTH_FOOD_COST;
    const storedFood = activeFactionStructures(state, faction.id)
      .reduce((sum, structure) => sum + structure.storage.food, 0);
    if (faction.resources.food < foodNeeded || storedFood < POPULATION_BIRTH_FOOD_COST) continue;

    const healthyAdults = population.filter((agent) =>
      isAdultForReproduction(agent, state.tick) &&
      agent.hp >= POPULATION_HEALTH_THRESHOLD &&
      agent.energy >= POPULATION_ENERGY_THRESHOLD
    );
    const gestationalParents = healthyAdults.filter((agent) =>
      reproductiveRole(agent) === "gestational" &&
      agent.pregnancy === undefined &&
      (agent.lastBirthTick === undefined || state.tick - agent.lastBirthTick >= POPULATION_POSTPARTUM_COOLDOWN_TICKS)
    );

    let conceived = false;
    for (const parent of gestationalParents) {
      const partner = healthyAdults
        .filter((candidate) =>
          candidate.id !== parent.id &&
          reproductiveRole(candidate) === "partner" &&
          manhattanDistance(candidate.position, parent.position) <= POPULATION_PARENT_RADIUS
        )
        .sort((a, b) =>
          manhattanDistance(a.position, parent.position) - manhattanDistance(b.position, parent.position) ||
          a.id.localeCompare(b.id)
        )[0];
      if (partner === undefined) continue;

      parent.pregnancy = {
        partnerId: partner.id,
        conceivedAtTick: state.tick,
        dueAtTick: state.tick + POPULATION_GESTATION_TICKS,
      };
      parent.reproductiveRole ??= "gestational";
      partner.reproductiveRole ??= "partner";
      parent.status = `expecting offspring with ${partner.name}`;
      conceived = true;
      break;
    }
    if (conceived) continue;
  }
}

function applyDemography(state: WorldState): void {
  applyLifeStageTransitions(state);
  birthDuePregnancies(state);
  planConceptions(state);
}

'''
          runtime, replaced = growth_pattern.subn(new_demography, runtime, count=1)
          if replaced != 1:
              raise SystemExit('population growth function anchor changed; refusing to patch')
          if '    applyPopulationGrowth(result.state);' not in runtime:
              raise SystemExit('population growth call anchor changed; refusing to patch')
          runtime = runtime.replace('    applyPopulationGrowth(result.state);', '    applyDemography(result.state);', 1)
          runtime_path.write_text(runtime)

          housing_path = Path('tests/population-housing-capacity.test.mjs')
          housing = housing_path.read_text()
          old_title = 'test("active camps bound population growth until residential capacity expands", () => {'
          if old_title not in housing:
              raise SystemExit('housing capacity test anchor changed; refusing to patch')
          housing_path.write_text('''import assert from "node:assert/strict";
import test from "node:test";
import { WorldRuntime } from "../dist-ts/src/runtime.js";
import { createInitialWorld } from "../dist-ts/src/world.js";

test("housing capacity gates conception and birth follows a completed gestation", () => {
  const state = createInitialWorld({ seed: 2030 });
  const faction = state.factions.find((entry) => entry.id === "ember");
  assert.ok(faction);
  const templates = state.agents.filter((agent) => agent.factionId === faction.id);
  assert.ok(templates.length >= 2);

  for (const tile of state.tiles) {
    if (tile.terrain === "water") tile.terrain = "plain";
  }

  const campPosition = { ...templates[0].position };
  state.agents = state.agents.filter((agent) => agent.factionId !== faction.id);
  for (let index = 0; index < 6; index += 1) {
    const template = structuredClone(templates[index % templates.length]);
    assert.ok(template);
    template.id = `housing-capacity-member-${index + 1}`;
    template.name = `Housing Member ${index + 1}`;
    template.position = { ...campPosition };
    template.hp = 100;
    template.energy = 100;
    template.autonomy = false;
    template.reproductiveRole = index % 2 === 0 ? "gestational" : "partner";
    delete template.pregnancy;
    delete template.lastBirthTick;
    delete template.task;
    state.agents.push(template);
  }

  state.structures = state.structures.filter((structure) => structure.factionId !== faction.id);
  state.structures.push({
    id: "housing-camp-a",
    factionId: faction.id,
    type: "camp",
    position: campPosition,
    status: "active",
    progress: 6,
    requiredProgress: 6,
    storage: { wood: 0, stone: 0, food: 100 },
  });
  faction.resources.food = 100;
  state.tick = 8_639;

  const blocked = new WorldRuntime({ state }).tick().state;
  assert.equal(blocked.agents.filter((agent) => agent.factionId === faction.id).length, 6);
  assert.equal(blocked.agents.some((agent) => agent.factionId === faction.id && agent.pregnancy !== undefined), false);

  const secondCampPosition = blocked.tiles.find((tile) =>
    tile.terrain !== "water" &&
    (tile.x !== campPosition.x || tile.y !== campPosition.y)
  );
  assert.ok(secondCampPosition);
  blocked.structures.push({
    id: "housing-camp-b",
    factionId: faction.id,
    type: "camp",
    position: { x: secondCampPosition.x, y: secondCampPosition.y },
    status: "active",
    progress: 6,
    requiredProgress: 6,
    storage: { wood: 0, stone: 0, food: 0 },
  });
  blocked.tick = 17_279;

  const conceived = new WorldRuntime({ state: blocked }).tick().state;
  const gestationalParent = conceived.agents.find(
    (agent) => agent.factionId === faction.id && agent.pregnancy !== undefined,
  );
  assert.ok(gestationalParent);
  assert.equal(conceived.agents.filter((agent) => agent.factionId === faction.id).length, 6);
  assert.equal(gestationalParent.pregnancy?.conceivedAtTick, 17_280);
  assert.equal(gestationalParent.pregnancy?.dueAtTick, 25_920);
  assert.equal(conceived.factions.find((entry) => entry.id === faction.id)?.resources.food, 100);

  conceived.tick = 25_919;
  const born = new WorldRuntime({ state: conceived }).tick().state;
  const newborn = born.agents.find(
    (agent) => agent.factionId === faction.id && agent.birthTick === 25_920,
  );
  assert.ok(newborn);
  assert.equal(born.agents.filter((agent) => agent.factionId === faction.id).length, 7);
  assert.equal(newborn.lifeStage, "infant");
  assert.equal(newborn.autonomy, false);
  assert.deepEqual(newborn.position, gestationalParent.position);
  assert.equal(newborn.parents?.[0], gestationalParent.id);
  assert.equal(newborn.parents?.[1], gestationalParent.pregnancy?.partnerId);
  assert.equal(born.factions.find((entry) => entry.id === faction.id)?.resources.food, 94);
  assert.equal(born.structures.find((structure) => structure.id === "housing-camp-a")?.storage.food, 94);
});
''')

          sim_path = Path('tests/simulation.test.mjs')
          sim = sim_path.read_text()
          test_pattern = re.compile(
              r'test\("food-secure settlements can grow their population when local hex space is available", \(\) => \{.*?\n\}\);\s*$',
              re.S,
          )
          replacement = '''test("population growth requires conception, gestation, and biological parentage", () => {
  const state = createInitialWorld({ seed: 2029 });
  const faction = state.factions.find((entry) => entry.id === "ember"); assert.ok(faction);
  const members = state.agents.filter((agent) => agent.factionId === faction.id);
  assert.ok(members.length >= 2);
  const originalIds = new Set(members.map((agent) => agent.id));
  const parent = members[0]; assert.ok(parent);
  const partner = members[1]; assert.ok(partner);
  const campPosition = { ...parent.position };

  faction.resources.food = 40;
  state.structures.push({
    id: "population-growth-camp",
    factionId: faction.id,
    type: "camp",
    position: campPosition,
    status: "active",
    progress: 6,
    requiredProgress: 6,
    storage: { wood: 0, stone: 0, food: 40 },
  });
  for (const member of members) {
    member.hp = 100;
    member.energy = 100;
    delete member.pregnancy;
    delete member.lastBirthTick;
    delete member.task;
  }
  parent.reproductiveRole = "gestational";
  partner.reproductiveRole = "partner";
  partner.position = { ...parent.position };
  state.tick = 8_639;

  const conceived = new WorldRuntime({ state }).tick().state;
  const conceivedParent = conceived.agents.find((entry) => entry.id === parent.id); assert.ok(conceivedParent);
  assert.equal(conceived.agents.filter((agent) => agent.factionId === faction.id).length, members.length);
  assert.equal(conceivedParent.pregnancy?.partnerId, partner.id);
  assert.equal(conceivedParent.pregnancy?.conceivedAtTick, 8_640);
  assert.equal(conceivedParent.pregnancy?.dueAtTick, 17_280);
  assert.equal(conceived.factions.find((entry) => entry.id === faction.id)?.resources.food, 40);

  conceived.tick = 17_279;
  const born = new WorldRuntime({ state: conceived }).tick().state;
  const nextMembers = born.agents.filter((agent) => agent.factionId === faction.id);
  const newcomer = nextMembers.find((agent) => !originalIds.has(agent.id)); assert.ok(newcomer);
  const camp = born.structures.find((structure) => structure.id === "population-growth-camp"); assert.ok(camp);

  assert.equal(nextMembers.length, members.length + 1);
  assert.equal(born.factions.find((entry) => entry.id === faction.id)?.resources.food, 34);
  assert.equal(camp.storage.food, 34);
  assert.equal(newcomer.lifeStage, "infant");
  assert.equal(newcomer.autonomy, false);
  assert.deepEqual(newcomer.parents, [parent.id, partner.id]);
  assert.deepEqual(newcomer.position, parent.position);

  born.tick = 25_919;
  const juvenile = new WorldRuntime({ state: born }).tick().state.agents.find((entry) => entry.id === newcomer.id);
  assert.ok(juvenile);
  assert.equal(juvenile.lifeStage, "juvenile");
  assert.equal(juvenile.autonomy, false);

  const juvenileState = born;
  juvenileState.tick = 43_199;
  const adult = new WorldRuntime({ state: juvenileState }).tick().state.agents.find((entry) => entry.id === newcomer.id);
  assert.ok(adult);
  assert.equal(adult.lifeStage, "adult");
  assert.equal(adult.autonomy, true);
});
'''
          sim, replaced_test = test_pattern.subn(replacement, sim, count=1)
          if replaced_test != 1:
              raise SystemExit('population simulation test anchor changed; refusing to patch')
          sim_path.write_text(sim)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate implementation
        run: npm run build

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/automation-biological-demography.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/protocol.ts src/runtime.ts tests/population-housing-capacity.test.mjs tests/simulation.test.mjs .github/workflows/automation-biological-demography.yml
          git diff --cached --check
          git commit -m 'sim: grow population through reproduction'
          git push origin HEAD:main