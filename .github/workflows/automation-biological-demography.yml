name: One-shot biological demography improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-biological-demography.yml

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply biological demography patch
        shell: bash
        run: |
          sed -i 's/growth_pattern.subn(new_demography, runtime, count=1)/growth_pattern.subn(lambda _match: new_demography, runtime, count=1)/' .github/automation-biological-demography.py
          sed -i 's/test_pattern.subn(replacement, sim, count=1)/test_pattern.subn(lambda _match: replacement, sim, count=1)/' .github/automation-biological-demography.py
          sed -i '/assert.equal(newcomer.lifeStage, "infant");/i\  const birthParent = born.agents.find((entry) => entry.id === parent.id); assert.ok(birthParent);' .github/automation-biological-demography.py
          sed -i 's/assert.deepEqual(newcomer.position, parent.position);/assert.deepEqual(newcomer.position, birthParent.position);/' .github/automation-biological-demography.py
          python3 .github/automation-biological-demography.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate implementation
        run: npm run build

      - name: Commit implementation and remove one-shot files
        shell: bash
        run: |
          rm -f .github/workflows/automation-biological-demography.yml .github/automation-biological-demography.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/protocol.ts src/runtime.ts tests/population-housing-capacity.test.mjs tests/simulation.test.mjs .github/workflows/automation-biological-demography.yml .github/automation-biological-demography.py
          git diff --cached --check
          git commit -m 'sim: grow population through reproduction'
          git push origin HEAD:main