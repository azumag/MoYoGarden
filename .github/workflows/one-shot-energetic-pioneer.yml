name: One-shot energetic pioneer improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-energetic-pioneer.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch settlement pioneer selection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/settlement-migration.ts')
          text = path.read_text()
          old = '''    || a.pathCrowding - b.pathCrowding\n    || a.crowding - b.crowding\n    || a.agent.id.localeCompare(b.agent.id)\n'''
          new = '''    || a.pathCrowding - b.pathCrowding\n    || a.crowding - b.crowding\n    // When two builders face the same destination and travel cost, send the\n    // one with more remaining energy. Migration is a long-running move and\n    // low-energy builders are more useful staying near the established camp.\n    || b.agent.energy - a.agent.energy\n    || a.agent.id.localeCompare(b.agent.id)\n'''
          if old not in text:
              raise SystemExit('expected settlement plan comparator not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cat > tests/settlement-pioneer-energy.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import { BUILD_RECIPES } from "../dist-ts/src/protocol.js";
          import { planAutonomousSettlementMigration } from "../dist-ts/src/settlement-migration.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          test("equivalent settlement routes prefer the higher-energy pioneer", () => {
            const state = createInitialWorld({ seed: 260914, width: 40, height: 24 });
            for (const tile of state.tiles) {
              if (!isHexGridCell(state, tile)) continue;
              tile.terrain = "plain";
              delete tile.resource;
            }
            const template = state.agents.find((agent) => agent.role === "builder");
            assert.ok(template);
            const low = structuredClone(template);
            const high = structuredClone(template);
            low.id = "agent-a-low-energy-pioneer";
            high.id = "agent-z-high-energy-pioneer";
            low.autonomy = true;
            high.autonomy = true;
            low.energy = 40;
            high.energy = 90;
            low.position = { x: 19, y: 11 };
            high.position = { x: 19, y: 11 };
            const kit = {
              wood: BUILD_RECIPES.camp.cost.wood,
              stone: BUILD_RECIPES.camp.cost.stone,
              food: BUILD_RECIPES.camp.cost.food,
            };
            low.inventory = { ...kit };
            high.inventory = { ...kit };
            low.task = { source: "autonomy", issuedAtTick: state.tick, type: "build", structureType: "camp" };
            high.task = structuredClone(low.task);
            state.agents = [low, high];
            state.structures = [];
            state.tick = 25;

            const plan = planAutonomousSettlementMigration(state, [{
              direction: "E",
              sourcePosition: { x: 30, y: 11 },
              neighborRegionId: "hex-q1-r0",
              neighborPosition: { x: 8, y: 11 },
              tile: {
                x: 8,
                y: 11,
                terrain: "plain",
                elevation: 0.5,
                resource: { kind: "food", amount: 8, maxAmount: 20 },
              },
            }]);
            assert.ok(plan);
            assert.equal(plan.agentId, high.id);
          });
          TEST
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full build and tests
        run: npm run build
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/settlement-migration.ts tests/settlement-pioneer-energy.test.mjs
          git commit -m "sim: prefer energetic pioneers for migration"
          git push origin HEAD:main
