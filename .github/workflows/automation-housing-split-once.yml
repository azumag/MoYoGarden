name: automation housing split once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-housing-split-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused settlement split fix and regression
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
      - run: npm ci
      - name: Validate
        run: |
          git diff --check
          npm run build
      - name: Commit product change
        run: |
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add -A
          git commit -m "sim: split settlements when local housing is exhausted"
          git push origin HEAD:main
