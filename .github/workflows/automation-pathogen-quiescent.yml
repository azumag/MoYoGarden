name: Apply pathogen quiescent optimization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-pathogen-quiescent.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage quiescent pathogen optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply optimization and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/pathogen.ts')
          source = path.read_text()
          needle = '''function singlePathogenStep(
            state: WorldState,
            environment: PathogenEnvironmentFrame | undefined,
          ): number {
            const allTiles = state.tiles ?? [];
          '''
          replacement = '''/**
           * A clean region cannot spontaneously create pathogen state: local
           * progression only transforms existing host burden/immunity or an
           * existing environmental reservoir. Cross-region halo exposure is
           * applied after local progression, so skipping the local hot path here
           * still allows a neighbor to introduce infection on the same cadence.
           *
           * Treat an explicitly stored zero as activity for one pass so legacy or
           * partially-written optional fields are cleaned by the normal mutation
           * path instead of becoming permanent inert state. Compatibility-envelope
           * tiles outside the active axial hex are deliberately ignored for the
           * same reason as singlePathogenStep itself.
           */
          export function pathogenStateIsQuiescent(
            state: Pick<WorldState, "agents" | "tiles" | "width" | "height">,
          ): boolean {
            const hasAgentState = state.agents.some((agent) => {
              const pathogen = agent as PathogenAgent;
              return pathogen.pathogenLoad !== undefined || pathogen.pathogenImmunity !== undefined;
            });
            if (hasAgentState) return false;

            const hasHexExtent =
              Number.isInteger(state.width) && state.width > 0 &&
              Number.isInteger(state.height) && state.height > 0;
            return !(state.tiles ?? []).some((tile) => {
              if (hasHexExtent && !isHexGridCell(state, tile)) return false;
              return (tile as PathogenTile).pathogenReservoir !== undefined;
            });
          }

          function singlePathogenStep(
            state: WorldState,
            environment: PathogenEnvironmentFrame | undefined,
          ): number {
            if (pathogenStateIsQuiescent(state)) return 0;
            const allTiles = state.tiles ?? [];
          '''
          if source.count(needle) != 1:
              raise SystemExit(f'expected one singlePathogenStep opening, found {source.count(needle)}')
          path.write_text(source.replace(needle, replacement, 1))

          Path('tests/pathogen-quiescent-fast-path.test.mjs').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import {
            agentPathogenLoad,
            applyPathogenSteps,
            pathogenStateIsQuiescent,
          } from "../dist-ts/src/pathogen.js";
          import { positionKey } from "../dist-ts/src/protocol.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          function cleanState(seed) {
            const state = createInitialWorld({ seed, width: 40, height: 24 });
            for (const agent of state.agents) {
              delete agent.pathogenLoad;
              delete agent.pathogenImmunity;
            }
            for (const tile of state.tiles) delete tile.pathogenReservoir;
            return state;
          }

          test("quiescent pathogen state skips local work without blocking halo introduction", () => {
            const state = cleanState(260919);
            assert.equal(pathogenStateIsQuiescent(state), true);

            const before = structuredClone(state);
            assert.equal(applyPathogenSteps(state, 1), 0);
            assert.deepEqual(state, before, "a clean local pathogen step should be a true no-op");

            const target = state.agents[0];
            assert.ok(target);
            const halo = new Map([[positionKey(target.position), 1]]);
            assert.ok(applyPathogenSteps(state, 1, undefined, halo, 1) > 0);
            assert.ok(agentPathogenLoad(target) > 0, "halo exposure must still seed a clean region");
          });

          test("quiescent detection ignores compatibility cells but preserves cleanup of active optional state", () => {
            const state = cleanState(260920);
            const hidden = state.tiles.find((tile) => !isHexGridCell(state, tile));
            const active = state.tiles.find((tile) => isHexGridCell(state, tile));
            const target = state.agents[0];
            assert.ok(hidden);
            assert.ok(active);
            assert.ok(target);

            hidden.pathogenReservoir = 0.7;
            assert.equal(
              pathogenStateIsQuiescent(state),
              true,
              "non-owned compatibility-envelope burden must not wake the pathogen hot path",
            );

            active.pathogenReservoir = 0;
            assert.equal(
              pathogenStateIsQuiescent(state),
              false,
              "an explicitly stored active reservoir gets one normal pass so it can be cleaned",
            );
            delete active.pathogenReservoir;

            target.pathogenLoad = 0;
            assert.equal(pathogenStateIsQuiescent(state), false);
            assert.ok(applyPathogenSteps(state, 1) > 0);
            assert.equal(target.pathogenLoad, undefined);
            assert.equal(pathogenStateIsQuiescent(state), true);
          });
          '''.replace('\n          ', '\n').lstrip())
          PY

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit product change and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pathogen.ts tests/pathogen-quiescent-fast-path.test.mjs
          git rm .github/workflows/automation-pathogen-quiescent.yml
          git commit -m "perf: skip dormant pathogen progression"
          git push origin HEAD:main
