name: MoYo remote storage lease renewal once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_moyo_remote_storage_lease_once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: python3 .github/scripts/moyo_remote_storage_lease_once.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck test and build
        run: npm run build
      - name: Commit improvement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_moyo_remote_storage_lease_once.yml
          rm .github/scripts/moyo_remote_storage_lease_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomous-concurrent-travel-do.test.mjs .github/workflows/_moyo_remote_storage_lease_once.yml .github/scripts/moyo_remote_storage_lease_once.py
          git diff --cached --check
          git commit -m 'sim: renew remote storage leases while traveling'
          git push origin HEAD:main
