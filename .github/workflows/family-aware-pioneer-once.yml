name: Family-aware pioneer one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-aware-pioneer-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply family-aware pioneer preference
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/settlement-migration.ts")
          text = path.read_text()

          old = '''interface SettlementPlanCandidate extends SettlementSeamCandidate {
            agent: Agent;
            issuedAtTick: number;
          }
          '''
          new = '''interface SettlementPlanCandidate extends SettlementSeamCandidate {
            agent: Agent;
            issuedAtTick: number;
            familySeparationCost: number;
          }
          '''
          if old not in text:
            raise SystemExit("SettlementPlanCandidate anchor not found")
          text = text.replace(old, new, 1)

          anchor = '''\nfunction sameSettlementRegion(a: string | undefined, b: string): boolean {\n'''
          helper = '''
          function familySeparationCost(state: WorldState, agent: Agent): number {
            let cost = 0;
            if (agent.pregnancy !== undefined && agent.pregnancy.dueAtTick > state.tick) {
              cost += 4;
            }
            for (const relative of state.agents) {
              if (
                relative.id === agent.id
                || relative.factionId !== agent.factionId
                || relative.hp <= 0
              ) {
                continue;
              }
              if (
                (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
                && relative.parents?.includes(agent.id)
              ) {
                cost += relative.lifeStage === "infant" ? 3 : 2;
              }
              if (
                relative.pregnancy?.partnerId === agent.id
                && relative.pregnancy.dueAtTick > state.tick
              ) {
                cost += 4;
              }
            }
            return cost;
          }
          '''
          if anchor not in text:
            raise SystemExit("sameSettlementRegion anchor not found")
          text = text.replace(anchor, "\n" + helper.strip() + "\n\nfunction sameSettlementRegion(a: string | undefined, b: string): boolean {\n", 1)

          old = '''    || a.crowding - b.crowding
              // Equivalent migration plans should use the builder with the larger
              // remaining energy reserve before falling back to stable agent ID order.
              || b.agent.energy - a.agent.energy
          '''
          new = '''    || a.crowding - b.crowding
              // When route and destination are otherwise equivalent, prefer a pioneer
              // whose departure disrupts fewer dependent family relationships. This is
              // a soft preference rather than a blockade, so a family-attached builder
              // can still found the frontier when no safer candidate exists.
              || a.familySeparationCost - b.familySeparationCost
              // Equivalent family impact then uses the larger remaining energy reserve
              // before falling back to stable agent ID order.
              || b.agent.energy - a.agent.energy
          '''
          if old not in text:
            raise SystemExit("plan comparator anchor not found")
          text = text.replace(old, new, 1)

          old = '''      issuedAtTick,
                support: candidate.support,
          '''
          new = '''      issuedAtTick,
                familySeparationCost: familySeparationCost(state, agent),
                support: candidate.support,
          '''
          if old not in text:
            raise SystemExit("plan candidate anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path("tests/settlement-family-pioneer.test.mjs")
          test_path.write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import { BUILD_RECIPES } from "../dist-ts/src/protocol.js";
          import { planAutonomousSettlementMigration } from "../dist-ts/src/settlement-migration.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          function frontierHalo() {
            return [{
              direction: "E",
              sourcePosition: { x: 30, y: 11 },
              neighborRegionId: "hex-q1-r0",
              neighborPosition: { x: 8, y: 11 },
              tile: {
                x: 8,
                y: 11,
                terrain: "plain",
                elevation: 0.5,
                resource: { kind: "food", amount: 8, maxAmount: 20 },
              },
            }];
          }

          function migrationBuilder(template, id, energy) {
            const builder = structuredClone(template);
            builder.id = id;
            builder.autonomy = true;
            builder.energy = energy;
            builder.position = { x: 19, y: 11 };
            builder.inventory = {
              wood: BUILD_RECIPES.camp.cost.wood,
              stone: BUILD_RECIPES.camp.cost.stone,
              food: BUILD_RECIPES.camp.cost.food,
            };
            builder.task = {
              source: "autonomy",
              issuedAtTick: 25,
              type: "build",
              structureType: "camp",
            };
            delete builder.parents;
            delete builder.pregnancy;
            return builder;
          }

          function migrationWorld() {
            const state = createInitialWorld({ seed: 260916, width: 40, height: 24 });
            for (const tile of state.tiles) {
              if (!isHexGridCell(state, tile)) continue;
              tile.terrain = "plain";
              delete tile.resource;
            }
            state.structures = [];
            state.tick = 25;
            return state;
          }

          test("equivalent settlement routes prefer a pioneer who leaves fewer dependents", () => {
            const state = migrationWorld();
            const template = state.agents.find((agent) => agent.role === "builder");
            assert.ok(template);
            const attached = migrationBuilder(template, "agent-a-attached", 95);
            const unattached = migrationBuilder(template, "agent-z-unattached", 70);
            const infant = structuredClone(template);
            infant.id = "agent-child";
            infant.autonomy = false;
            infant.lifeStage = "infant";
            infant.birthTick = 1;
            infant.energy = 60;
            infant.position = { x: 19, y: 10 };
            infant.parents = [attached.id, "agent-other-parent"];
            delete infant.task;
            delete infant.pregnancy;
            state.agents = [attached, unattached, infant];

            const plan = planAutonomousSettlementMigration(state, frontierHalo());
            assert.ok(plan);
            assert.equal(plan.agentId, unattached.id);
          });

          test("family attachment remains a soft preference when no other pioneer can migrate", () => {
            const state = migrationWorld();
            const template = state.agents.find((agent) => agent.role === "builder");
            assert.ok(template);
            const attached = migrationBuilder(template, "agent-attached-only", 80);
            const infant = structuredClone(template);
            infant.id = "agent-only-child";
            infant.autonomy = false;
            infant.lifeStage = "infant";
            infant.birthTick = 1;
            infant.position = { x: 19, y: 10 };
            infant.parents = [attached.id, "agent-other-parent"];
            delete infant.task;
            delete infant.pregnancy;
            state.agents = [attached, infant];

            const plan = planAutonomousSettlementMigration(state, frontierHalo());
            assert.ok(plan);
            assert.equal(plan.agentId, attached.id);
          });
          '''.replace(/^          /gm, ""))
          PY
      - name: Validate
        run: npm run build
      - name: Commit implementation
        run: |
          rm .github/workflows/family-aware-pioneer-once.yml
          git add src/settlement-migration.ts tests/settlement-family-pioneer.test.mjs .github/workflows/family-aware-pioneer-once.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sim: prefer pioneers who leave fewer dependents"
          git push origin HEAD:main
