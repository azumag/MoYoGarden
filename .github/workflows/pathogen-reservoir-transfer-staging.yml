name: Stage pathogen reservoir ownership transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pathogen-reservoir-transfer-staging.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded cross-DO pathogen reservoir ownership transfer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {text.count(old)}")
              return text.replace(old, new, 1)

          pathogen_path = Path("src/pathogen.ts")
          pathogen = pathogen_path.read_text()
          pathogen = replace_once(pathogen, '''export interface PathogenEdgeSnapshot {
            regionId: string;
            direction: HexGridDirection;
            revision: number;
            tick: number;
            agents: PathogenEdgePressure[];
            // Optional during rolling deploys so a newer region can still consume an
            // older neighbor snapshot that predates environmental reservoir export.
            reservoirs?: PathogenEdgeReservoir[];
          }

          type PathogenAgent = Agent & {''', '''export interface PathogenEdgeSnapshot {
            regionId: string;
            direction: HexGridDirection;
            revision: number;
            tick: number;
            agents: PathogenEdgePressure[];
            // Optional during rolling deploys so a newer region can still consume an
            // older neighbor snapshot that predates environmental reservoir export.
            reservoirs?: PathogenEdgeReservoir[];
          }

          export interface PathogenReservoirOutboundIntent {
            sourcePosition: GridPosition;
            desiredPosition: GridPosition;
            burden: number;
          }

          type PathogenAgent = Agent & {''', "pathogen intent interface")

          index_anchor = '''function pathogenReservoirIndex(tiles: readonly Tile[]): Map<string, number> {
            const result = new Map<string, number>();
            for (const tile of tiles) {
              const load = tilePathogenReservoir(tile);
              if (load > PATHOGEN_EPSILON) {
                result.set(positionKey(tile), load);
              }
            }
            return result;
          }
          '''
          index_insert = index_anchor + '''
          /**
           * Plan the share of environmental pathogen burden whose hydrology or wind
           * destination is owned by an adjacent macro-region.
           *
           * Local advection intentionally ignores these destinations because another
           * Durable Object owns the target cell. The region layer journals and debits
           * these intents before sending them, so a failed cross-DO request cannot
           * duplicate or destroy reservoir mass. Intents are derived only from already
           * persisted low-level flow/wind state; no disease event is synthesized here.
           */
          export function pathogenReservoirOutboundIntents(
            state: Pick<WorldState, "width" | "height" | "tiles">,
            environment: PathogenEnvironmentFrame | undefined,
          ): PathogenReservoirOutboundIntent[] {
            if (
              !Number.isInteger(state.width) || state.width <= 0 ||
              !Number.isInteger(state.height) || state.height <= 0
            ) return [];

            const grouped = new Map<string, PathogenReservoirOutboundIntent>();
            const request = (
              sourcePosition: GridPosition,
              desiredPosition: GridPosition,
              burden: number,
            ): void => {
              if (
                !Number.isFinite(burden) || burden <= PATHOGEN_EPSILON ||
                isHexGridCell(state, desiredPosition)
              ) return;
              const key = `${positionKey(sourcePosition)}>${positionKey(desiredPosition)}`;
              const current = grouped.get(key);
              if (current === undefined) {
                grouped.set(key, {
                  sourcePosition: { ...sourcePosition },
                  desiredPosition: { ...desiredPosition },
                  burden,
                });
              } else {
                current.burden += burden;
              }
            };

            for (const tile of state.tiles) {
              if (!isHexGridCell(state, tile)) continue;
              const current = tilePathogenReservoir(tile);
              if (current <= PATHOGEN_EPSILON) continue;

              if (tile.flowTo !== undefined && !isHexGridCell(state, tile.flowTo)) {
                const drainage = Number.isFinite(tile.drainage ?? Number.NaN)
                  ? clamp01(tile.drainage ?? 0)
                  : 0;
                if (drainage > 0) {
                  request(
                    tile,
                    tile.flowTo,
                    current * drainage * PATHOGEN_RESERVOIR_RUNOFF_TRANSPORT_GAIN,
                  );
                }
              }

              if (environment !== undefined) {
                const wind = sampleWorldWind(
                  environment.worldSeed,
                  environment.originX + tile.x,
                  environment.originY + tile.y,
                );
                const step = HEX_GRID_DIRECTION_STEPS[wind.direction];
                request(
                  tile,
                  { x: tile.x + step.x, y: tile.y + step.y },
                  current * wind.strength * PATHOGEN_RESERVOIR_WIND_TRANSPORT_GAIN,
                );
              }
            }

            return [...grouped.values()]
              .map((intent) => ({ ...intent, burden: Math.min(1, intent.burden) }))
              .sort((a, b) =>
                a.sourcePosition.y - b.sourcePosition.y ||
                a.sourcePosition.x - b.sourcePosition.x ||
                a.desiredPosition.y - b.desiredPosition.y ||
                a.desiredPosition.x - b.desiredPosition.x
              );
          }
          '''
          pathogen = replace_once(pathogen, index_anchor, index_insert, "pathogen outbound planner")
          pathogen = pathogen.replace(
              '''Only targets owned by this local state are eligible: cross-DO
           * flow/wind ownership is still a separate Issue #3 transaction step, and an
           * unresolved boundary outlet or gust must not teleport contamination or mutate a
           * neighbor.''',
              '''Only targets owned by this local state are applied here. Cross-DO
           * destinations are emitted by `pathogenReservoirOutboundIntents` and moved by
           * the region-level crash-safe ownership journal, so this local pass never
           * teleports contamination or mutates a neighboring Durable Object.''',
              1,
          )
          pathogen_path.write_text(pathogen)

          region_path = Path("src/pathogen-region.ts")
          region = region_path.read_text()
          region = replace_once(region, '''  pathogenEdgeSnapshot,
            pathogenHaloMaps,
            pathogenStepCount,
            type PathogenEdgeSnapshot,
            type PathogenEnvironmentFrame,
          } from "./pathogen.js";''', '''  pathogenEdgeSnapshot,
            pathogenHaloMaps,
            pathogenReservoirOutboundIntents,
            pathogenStepCount,
            tilePathogenReservoir,
            type PathogenEdgeSnapshot,
            type PathogenEnvironmentFrame,
            type PathogenReservoirOutboundIntent,
          } from "./pathogen.js";''', "pathogen-region imports")
          region = replace_once(region, '''import { regionGlobalCellOrigin } from "./region-topology.js";''', '''import { regionCellTransition, regionGlobalCellOrigin } from "./region-topology.js";''', "region topology import")

          materialized_anchor = '''interface MaterializedPathogenHalo {
            pressure: Map<string, number>;
            reservoir: Map<string, number>;
            pressureExposure: Map<string, number>;
            reservoirExposure: Map<string, number>;
          }
          '''
          materialized_insert = materialized_anchor + '''
          interface OutgoingPathogenReservoirTransfer {
            transferId: string;
            routeKey: string;
            fromRegionId: string;
            toRegionId: string;
            sourcePosition: GridPosition;
            desiredPosition: GridPosition;
            targetPosition: GridPosition;
            burden: number;
            createdAtTick: number;
          }

          interface IncomingPathogenReservoirRoute {
            routeKey: string;
            fromRegionId: string;
            sourcePosition: GridPosition;
            targetPosition: GridPosition;
            lastAcceptedTick: number;
            pendingBurden: number;
          }

          interface StoredPathogenRegion {
            state: WorldState;
            [key: string]: unknown;
          }
          '''
          region = replace_once(region, materialized_anchor, materialized_insert, "reservoir journal interfaces")

          region = replace_once(region, '''const INTERNAL_PATHOGEN_EDGE_PATH = "/api/internal/pathogen/edge";
          const DEFAULT_WORLD_SEED = 424_242;''', '''const INTERNAL_PATHOGEN_EDGE_PATH = "/api/internal/pathogen/edge";
          const INTERNAL_PATHOGEN_RESERVOIR_TRANSFER_PATH = "/api/internal/pathogen/reservoir/transfer";
          const OUTGOING_PATHOGEN_RESERVOIR_KEY = "pathogen:reservoir:outgoing:v1";
          const INCOMING_PATHOGEN_RESERVOIR_KEY = "pathogen:reservoir:incoming:v1";
          const PATHOGEN_RESERVOIR_TRANSFER_EPSILON = 1e-4;
          const DEFAULT_WORLD_SEED = 424_242;''', "reservoir journal constants")

          record_anchor = '''function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }
          '''
          record_insert = record_anchor + '''
          function gridPositionValue(value: unknown): GridPosition | undefined {
            if (!isRecord(value)) return undefined;
            const x = Number(value.x);
            const y = Number(value.y);
            return Number.isSafeInteger(x) && Number.isSafeInteger(y) ? { x, y } : undefined;
          }

          function samePosition(a: GridPosition, b: GridPosition): boolean {
            return a.x === b.x && a.y === b.y;
          }

          function pathogenReservoirRouteKey(
            fromRegionId: string,
            sourcePosition: GridPosition,
            toRegionId: string,
            targetPosition: GridPosition,
          ): string {
            return `${fromRegionId}:${positionKey(sourcePosition)}>${toRegionId}:${positionKey(targetPosition)}`;
          }

          function pathogenReservoirTransferValue(value: unknown): OutgoingPathogenReservoirTransfer | undefined {
            if (!isRecord(value)) return undefined;
            const sourcePosition = gridPositionValue(value.sourcePosition);
            const desiredPosition = gridPositionValue(value.desiredPosition);
            const targetPosition = gridPositionValue(value.targetPosition);
            if (
              typeof value.transferId !== "string" || value.transferId.length === 0 || value.transferId.length > 256 ||
              typeof value.fromRegionId !== "string" ||
              typeof value.toRegionId !== "string" ||
              sourcePosition === undefined || desiredPosition === undefined || targetPosition === undefined ||
              typeof value.burden !== "number" || !Number.isFinite(value.burden) ||
              value.burden <= PATHOGEN_RESERVOIR_TRANSFER_EPSILON || value.burden > 1 ||
              !Number.isSafeInteger(value.createdAtTick) || Number(value.createdAtTick) < 0
            ) return undefined;
            const createdAtTick = Number(value.createdAtTick);
            const routeKey = pathogenReservoirRouteKey(
              value.fromRegionId,
              sourcePosition,
              value.toRegionId,
              targetPosition,
            );
            return {
              transferId: value.transferId,
              routeKey,
              fromRegionId: value.fromRegionId,
              toRegionId: value.toRegionId,
              sourcePosition,
              desiredPosition,
              targetPosition,
              burden: value.burden,
              createdAtTick,
            };
          }
          '''
          region = replace_once(region, record_anchor, record_insert, "reservoir transfer parsing")

          region = replace_once(region, '''  private async ensurePathogenAssigned(request: Request): Promise<Response | undefined> {
              try {
                await this.ensureRegion(request, { activate: false });
                return undefined;
              } catch (error) {
                return json({ error: error instanceof Error ? error.message : "region routing failed" }, 400);
              }
            }
          ''', '''  private async ensurePathogenAssigned(
              request: Request,
              activate = false,
            ): Promise<Response | undefined> {
              try {
                await this.ensureRegion(request, { activate });
                return undefined;
              } catch (error) {
                return json({ error: error instanceof Error ? error.message : "region routing failed" }, 400);
              }
            }
          ''', "ensure pathogen assignment")

          method_anchor = '''  private async fetchNeighborPathogenEdge(
              regionId: string,
              direction: HexGridDirection,
              positions: readonly GridPosition[],
            ): Promise<PathogenEdgeSnapshot | undefined> {'''
          methods = '''  private async outgoingPathogenReservoirTransfers(): Promise<OutgoingPathogenReservoirTransfer[]> {
              return await this.pathogenState.storage.get<OutgoingPathogenReservoirTransfer[]>(
                OUTGOING_PATHOGEN_RESERVOIR_KEY,
              ) ?? [];
            }

            private async incomingPathogenReservoirRoutes(): Promise<IncomingPathogenReservoirRoute[]> {
              return await this.pathogenState.storage.get<IncomingPathogenReservoirRoute[]>(
                INCOMING_PATHOGEN_RESERVOIR_KEY,
              ) ?? [];
            }

            private reservoirTransferForIntent(
              state: WorldState,
              intent: PathogenReservoirOutboundIntent,
            ): OutgoingPathogenReservoirTransfer | undefined {
              const transition = regionCellTransition(
                state.regionId,
                intent.desiredPosition,
                state.width,
                state.height,
              );
              if (transition === undefined) return undefined;
              const routeKey = pathogenReservoirRouteKey(
                state.regionId,
                intent.sourcePosition,
                transition.targetRegionId,
                transition.targetPosition,
              );
              return {
                transferId: `${routeKey}@${state.tick}`,
                routeKey,
                fromRegionId: state.regionId,
                toRegionId: transition.targetRegionId,
                sourcePosition: { ...intent.sourcePosition },
                desiredPosition: { ...intent.desiredPosition },
                targetPosition: { ...transition.targetPosition },
                burden: intent.burden,
                createdAtTick: state.tick,
              };
            }

            /**
             * Atomically move outbound mass from the persisted source tile into a
             * source-owned journal before any cross-DO request is attempted. The
             * journal is therefore the owner while a neighbor is unavailable; retrying
             * cannot duplicate source mass and a crash cannot make it disappear.
             */
            private async reserveOutgoingPathogenReservoir(
              state: WorldState,
              environment: PathogenEnvironmentFrame | undefined,
            ): Promise<boolean> {
              const candidates = pathogenReservoirOutboundIntents(state, environment)
                .map((intent) => this.reservoirTransferForIntent(state, intent))
                .filter((value): value is OutgoingPathogenReservoirTransfer => value !== undefined);
              if (candidates.length === 0) return false;

              const access = runtimeAccess(this);
              const result = await this.pathogenState.storage.transaction(async (txn) => {
                const stored = await txn.get<StoredPathogenRegion>("region");
                if (stored === undefined || stored.state.regionId !== state.regionId) {
                  return { changed: false as const, state: undefined as WorldState | undefined };
                }
                const records = await txn.get<OutgoingPathogenReservoirTransfer[]>(
                  OUTGOING_PATHOGEN_RESERVOIR_KEY,
                ) ?? [];
                const occupiedRoutes = new Set(records.map((record) => record.routeKey));
                const nextState = structuredClone(stored.state);
                let changed = false;

                for (const candidate of candidates) {
                  if (occupiedRoutes.has(candidate.routeKey)) continue;
                  const tile = nextState.tiles.find((entry) => samePosition(entry, candidate.sourcePosition));
                  if (tile === undefined || !isHexGridCell(nextState, tile)) continue;
                  const current = tilePathogenReservoir(tile);
                  const amount = Math.min(current, candidate.burden);
                  if (amount <= PATHOGEN_RESERVOIR_TRANSFER_EPSILON) continue;
                  const target = tile as typeof tile & { pathogenReservoir?: number };
                  const remaining = Math.max(0, current - amount);
                  if (remaining <= PATHOGEN_RESERVOIR_TRANSFER_EPSILON) {
                    delete target.pathogenReservoir;
                  } else {
                    target.pathogenReservoir = remaining;
                  }
                  records.push({ ...candidate, burden: amount });
                  occupiedRoutes.add(candidate.routeKey);
                  changed = true;
                }

                if (!changed) return { changed: false as const, state: undefined as WorldState | undefined };
                stored.state = nextState;
                await txn.put("region", stored);
                await txn.put(OUTGOING_PATHOGEN_RESERVOIR_KEY, records);
                return { changed: true as const, state: nextState };
              });

              if (!result.changed || result.state === undefined) return false;
              access.runtime = new WorldRuntime({
                state: result.state,
                pendingCommands: access.runtime.pendingCommands(),
              });
              // Refresh ordinary region metadata after the atomic ownership move.
              // A crash before this best-effort write is still safe because the
              // transaction already persisted both the debited state and journal.
              await access.persist();
              access.broadcastSnapshot();
              return true;
            }

            private async flushOutgoingPathogenReservoir(): Promise<void> {
              const records = await this.outgoingPathogenReservoirTransfers();
              if (records.length === 0) return;
              const acknowledged = new Set<string>();
              for (const record of records) {
                try {
                  const response = await withPathogenEdgeDeadline((signal) =>
                    this.pathogenStub(record.toRegionId).fetch(new Request(
                      `https://moyo.internal${INTERNAL_PATHOGEN_RESERVOIR_TRANSFER_PATH}`,
                      {
                        method: "POST",
                        headers: {
                          "content-type": "application/json",
                          "x-moyo-region-internal": record.toRegionId,
                        },
                        body: JSON.stringify(record),
                        signal,
                      },
                    )),
                  );
                  if (response.ok) acknowledged.add(record.transferId);
                } catch (error) {
                  console.debug(
                    "MoYoGarden pathogen reservoir transfer unavailable",
                    record.toRegionId,
                    record.transferId,
                    error,
                  );
                }
              }
              if (acknowledged.size === 0) return;
              const current = await this.outgoingPathogenReservoirTransfers();
              await this.pathogenState.storage.put(
                OUTGOING_PATHOGEN_RESERVOIR_KEY,
                current.filter((record) => !acknowledged.has(record.transferId)),
              );
            }

            private async acceptIncomingPathogenReservoir(request: Request): Promise<Response> {
              let value: unknown;
              try {
                value = await request.json() as unknown;
              } catch {
                return json({ error: "valid reservoir transfer JSON is required" }, 400);
              }
              const transfer = pathogenReservoirTransferValue(value);
              if (transfer === undefined) return json({ error: "valid reservoir transfer is required" }, 400);

              const state = runtimeAccess(this).runtime.snapshot();
              if (transfer.toRegionId !== state.regionId) {
                return json({ error: "reservoir transfer target region mismatch" }, 409);
              }
              if (hexGridDistance(transfer.sourcePosition, transfer.desiredPosition) !== 1) {
                return json({ error: "reservoir transfer must cross exactly one hex cell" }, 409);
              }
              const transition = regionCellTransition(
                transfer.fromRegionId,
                transfer.desiredPosition,
                state.width,
                state.height,
              );
              if (
                transition === undefined ||
                transition.targetRegionId !== state.regionId ||
                !samePosition(transition.targetPosition, transfer.targetPosition) ||
                !isHexGridCell(state, transfer.targetPosition)
              ) {
                return json({ error: "reservoir transfer ownership mapping mismatch" }, 409);
              }

              let accepted = false;
              await this.pathogenState.storage.transaction(async (txn) => {
                const routes = await txn.get<IncomingPathogenReservoirRoute[]>(
                  INCOMING_PATHOGEN_RESERVOIR_KEY,
                ) ?? [];
                const existing = routes.find((route) => route.routeKey === transfer.routeKey);
                if (existing !== undefined) {
                  if (transfer.createdAtTick <= existing.lastAcceptedTick) return;
                  existing.lastAcceptedTick = transfer.createdAtTick;
                  existing.pendingBurden += transfer.burden;
                } else {
                  routes.push({
                    routeKey: transfer.routeKey,
                    fromRegionId: transfer.fromRegionId,
                    sourcePosition: { ...transfer.sourcePosition },
                    targetPosition: { ...transfer.targetPosition },
                    lastAcceptedTick: transfer.createdAtTick,
                    pendingBurden: transfer.burden,
                  });
                }
                accepted = true;
                await txn.put(INCOMING_PATHOGEN_RESERVOIR_KEY, routes);
              });
              return json({
                transferId: transfer.transferId,
                phase: accepted ? "accepted" : "duplicate",
              });
            }

            /**
             * Move accepted target-owned inbox mass onto its exact local tile. Inbox
             * cursors remain after pendingBurden reaches zero, giving bounded per-route
             * duplicate suppression without an ever-growing transfer-id ledger.
             */
            private async drainIncomingPathogenReservoir(): Promise<boolean> {
              const preview = await this.incomingPathogenReservoirRoutes();
              if (!preview.some((route) => route.pendingBurden > 0)) return false;
              const access = runtimeAccess(this);
              const result = await this.pathogenState.storage.transaction(async (txn) => {
                const stored = await txn.get<StoredPathogenRegion>("region");
                const routes = await txn.get<IncomingPathogenReservoirRoute[]>(
                  INCOMING_PATHOGEN_RESERVOIR_KEY,
                ) ?? [];
                if (stored === undefined) {
                  return { changed: false as const, state: undefined as WorldState | undefined };
                }
                const nextState = structuredClone(stored.state);
                let changed = false;
                for (const route of [...routes].sort((a, b) => a.routeKey.localeCompare(b.routeKey))) {
                  if (route.pendingBurden <= 0) continue;
                  const tile = nextState.tiles.find((entry) => samePosition(entry, route.targetPosition));
                  if (tile === undefined || !isHexGridCell(nextState, tile)) continue;
                  const current = tilePathogenReservoir(tile);
                  const accepted = Math.min(Math.max(0, 1 - current), route.pendingBurden);
                  if (accepted <= 0) continue;
                  (tile as typeof tile & { pathogenReservoir?: number }).pathogenReservoir = current + accepted;
                  route.pendingBurden = Math.max(0, route.pendingBurden - accepted);
                  changed = true;
                }
                if (!changed) {
                  return { changed: false as const, state: undefined as WorldState | undefined };
                }
                stored.state = nextState;
                await txn.put("region", stored);
                await txn.put(INCOMING_PATHOGEN_RESERVOIR_KEY, routes);
                return { changed: true as const, state: nextState };
              });
              if (!result.changed || result.state === undefined) return false;
              access.runtime = new WorldRuntime({
                state: result.state,
                pendingCommands: access.runtime.pendingCommands(),
              });
              await access.persist();
              access.broadcastSnapshot();
              return true;
            }

          ''' + method_anchor
          region = replace_once(region, method_anchor, methods, "reservoir transfer methods")

          fetch_anchor = '''  override async fetch(request: Request): Promise<Response> {
              const url = new URL(request.url);
              if (url.pathname === INTERNAL_PATHOGEN_EDGE_PATH) {'''
          fetch_replace = '''  override async fetch(request: Request): Promise<Response> {
              const url = new URL(request.url);
              if (url.pathname === INTERNAL_PATHOGEN_RESERVOIR_TRANSFER_PATH) {
                if (request.method !== "POST") return json({ error: "method not allowed" }, 405);
                const assignmentError = await this.ensurePathogenAssigned(request, true);
                if (assignmentError !== undefined) return assignmentError;
                return this.acceptIncomingPathogenReservoir(request);
              }
              if (url.pathname === INTERNAL_PATHOGEN_EDGE_PATH) {'''
          region = replace_once(region, fetch_anchor, fetch_replace, "transfer endpoint")

          alarm_old = '''  override async alarm(): Promise<void> {
              const access = runtimeAccess(this);
              const beforeTick = access.runtime.snapshot().tick;
              await super.alarm();

              const state = access.runtime.snapshot();
              const localSteps = pathogenStepCount(beforeTick, state.tick, PATHOGEN_LOCAL_INTERVAL);
              if (localSteps <= 0) return;
              const halo = shouldMaterializePathogenHalo(state, beforeTick, state.tick)
                ? await this.materializePathogenHalo(state)
                : {
                  pressure: new Map<string, number>(),
                  reservoir: new Map<string, number>(),
                  pressureExposure: new Map<string, number>(),
                  reservoirExposure: new Map<string, number>(),
                };
              const changed = applyPathogenTickRange(
                state,
                beforeTick,
                state.tick,
                this.pathogenEnvironmentFrame(state),
                halo.pressure,
                halo.reservoir,
                halo.pressureExposure,
                halo.reservoirExposure,
              );
              if (changed <= 0) return;

              access.runtime = new WorldRuntime({
                state,
                pendingCommands: access.runtime.pendingCommands(),
              });
              await access.persist();
              access.broadcastSnapshot();
            }
          '''
          alarm_new = '''  override async alarm(): Promise<void> {
              const access = runtimeAccess(this);
              const beforeTick = access.runtime.snapshot().tick;
              await super.alarm();

              // Accepted cross-DO burden is already owned by this Durable Object.
              // Materialize it before the next pathogen cadence, but never let a
              // newly received amount immediately traverse another macro-region.
              await this.drainIncomingPathogenReservoir();
              const state = access.runtime.snapshot();
              const localSteps = pathogenStepCount(beforeTick, state.tick, PATHOGEN_LOCAL_INTERVAL);
              if (localSteps <= 0) return;

              // Retry older source-owned journals first. While a route is pending,
              // reserveOutgoingPathogenReservoir refuses to create a second transfer
              // for that same route, keeping retry state bounded during outages.
              await this.flushOutgoingPathogenReservoir();
              const workingState = access.runtime.snapshot();
              const environment = this.pathogenEnvironmentFrame(workingState);
              const halo = shouldMaterializePathogenHalo(workingState, beforeTick, workingState.tick)
                ? await this.materializePathogenHalo(workingState)
                : {
                  pressure: new Map<string, number>(),
                  reservoir: new Map<string, number>(),
                  pressureExposure: new Map<string, number>(),
                  reservoirExposure: new Map<string, number>(),
                };
              const changed = applyPathogenTickRange(
                workingState,
                beforeTick,
                workingState.tick,
                environment,
                halo.pressure,
                halo.reservoir,
                halo.pressureExposure,
                halo.reservoirExposure,
              );
              if (changed > 0) {
                access.runtime = new WorldRuntime({
                  state: workingState,
                  pendingCommands: access.runtime.pendingCommands(),
                });
                await access.persist();
                access.broadcastSnapshot();
              }

              // Cross-DO transport is planned from the post-local-step residual.
              // This deliberately prevents newly arrived burden from chaining across
              // more than one macro-region in one pathogen cadence. Source debit and
              // outbox insertion are atomic; delivery can then be retried safely.
              const outboundState = access.runtime.snapshot();
              await this.reserveOutgoingPathogenReservoir(
                outboundState,
                this.pathogenEnvironmentFrame(outboundState),
              );
              await this.flushOutgoingPathogenReservoir();
            }
          '''
          region = replace_once(region, alarm_old, alarm_new, "pathogen alarm")
          region_path.write_text(region)

          test_path = Path("tests/pathogen-reservoir-transfer-do.test.mjs")
          test_path.write_text(r'''import assert from "node:assert/strict";
          import test from "node:test";
          import { HEX_GRID_DIRECTION_STEPS, isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import {
            applyPathogenSteps,
            pathogenReservoirOutboundIntents,
            tilePathogenReservoir,
          } from "../dist-ts/src/pathogen.js";
          import { RegionDurableObject } from "../dist-ts/src/pathogen-region.js";
          import { regionCellTransition, regionGlobalCellOrigin } from "../dist-ts/src/region-topology.js";
          import { sampleWorldWind } from "../dist-ts/src/world-scale.js";

          class MemoryStorage {
            constructor() { this.values = new Map(); this.alarm = null; }
            async get(key) { return structuredClone(this.values.get(key)); }
            async put(key, value) { this.values.set(key, structuredClone(value)); }
            async delete(key) { return this.values.delete(key); }
            async getAlarm() { return this.alarm; }
            async setAlarm(value) { this.alarm = value instanceof Date ? value.getTime() : Number(value); }
            async deleteAlarm() { this.alarm = null; }
            async transaction(callback) { return await callback(this); }
          }

          class MemoryState {
            constructor(storage = new MemoryStorage()) {
              this.storage = storage;
              this.sockets = [];
              this.ready = Promise.resolve();
            }
            blockConcurrencyWhile(callback) { this.ready = callback(); return this.ready; }
            acceptWebSocket(socket) { this.sockets.push(socket); }
            getWebSockets() { return [...this.sockets]; }
          }

          function fixture() {
            const entries = new Map();
            const env = {
              WORLD_SEED: "424242",
              REGION_IDS: "garden-1,garden-2,garden-3",
              DEFAULT_REGION_ID: "garden-1",
              TICK_MS: "10000",
              OPEN_COMMANDS: "false",
              ASSETS: { fetch: async () => new Response("not found", { status: 404 }) },
            };
            const instantiate = (id, storage = new MemoryStorage()) => {
              const state = new MemoryState(storage);
              const object = new RegionDurableObject(state, env);
              const entry = { id, storage, state, object };
              entries.set(id, entry);
              return entry;
            };
            const entry = (id) => entries.get(id) ?? instantiate(id);
            env.REGIONS = {
              idFromName: (name) => name,
              get: (id) => ({
                fetch: async (request) => {
                  const target = entry(id);
                  await target.state.ready;
                  return target.object.fetch(request);
                },
              }),
            };
            return {
              env,
              entries,
              entry,
              recreate(id) {
                const current = entry(id);
                return instantiate(id, current.storage);
              },
            };
          }

          function internalRequest(regionId, path, init = {}) {
            const headers = new Headers(init.headers);
            headers.set("x-moyo-region-internal", regionId);
            return new Request(`https://moyo.internal${path}`, { ...init, headers });
          }

          function findWindCrossing(regionId, state) {
            const origin = regionGlobalCellOrigin(regionId, state.width, state.height);
            assert.ok(origin);
            for (const tile of state.tiles) {
              if (!isHexGridCell(state, tile)) continue;
              const wind = sampleWorldWind(424242, origin.x + tile.x, origin.y + tile.y);
              const step = HEX_GRID_DIRECTION_STEPS[wind.direction];
              const desiredPosition = { x: tile.x + step.x, y: tile.y + step.y };
              const transition = regionCellTransition(regionId, desiredPosition, state.width, state.height);
              if (transition !== undefined && wind.strength > 0.05) {
                return { tile, wind, desiredPosition, transition, origin };
              }
            }
            throw new Error("expected at least one wind-driven boundary crossing");
          }

          test("outbound reservoir planner emits only exact cross-DO low-level transport", () => {
            const extent = { width: 40, height: 24 };
            const origin = regionGlobalCellOrigin("garden-1", extent.width, extent.height);
            assert.ok(origin);
            let chosen;
            for (let y = 0; y < extent.height && chosen === undefined; y += 1) {
              for (let x = 0; x < extent.width; x += 1) {
                if (!isHexGridCell(extent, { x, y })) continue;
                const wind = sampleWorldWind(424242, origin.x + x, origin.y + y);
                const step = HEX_GRID_DIRECTION_STEPS[wind.direction];
                const desiredPosition = { x: x + step.x, y: y + step.y };
                const transition = regionCellTransition("garden-1", desiredPosition, extent.width, extent.height);
                if (transition !== undefined && wind.strength > 0.05) {
                  chosen = { position: { x, y }, desiredPosition, wind, transition };
                  break;
                }
              }
            }
            assert.ok(chosen);
            const state = {
              ...extent,
              tiles: [{ ...chosen.position, terrain: "plain", pathogenReservoir: 0.8 }],
            };
            const environment = { worldSeed: 424242, originX: origin.x, originY: origin.y };
            const intents = pathogenReservoirOutboundIntents(state, environment);
            assert.equal(intents.length, 1);
            assert.deepEqual(intents[0].sourcePosition, chosen.position);
            assert.deepEqual(intents[0].desiredPosition, chosen.desiredPosition);
            assert.ok(Math.abs(intents[0].burden - 0.8 * chosen.wind.strength * 0.03) < 1e-12);
            assert.equal(
              regionCellTransition("garden-1", intents[0].desiredPosition, 40, 24)?.targetRegionId,
              chosen.transition.targetRegionId,
            );
          });

          test("cross-DO reservoir transfer debits source mass, journals delivery, and deduplicates retries", async () => {
            const world = fixture();
            const sourceId = "garden-1";
            const source = world.entry(sourceId);
            await source.state.ready;
            const initial = await (await source.object.fetch(
              internalRequest(sourceId, "/api/world/snapshot"),
            )).json();
            const crossing = findWindCrossing(sourceId, initial);

            const stored = await source.storage.get("region");
            const storedTile = stored.state.tiles.find(
              (tile) => tile.x === crossing.tile.x && tile.y === crossing.tile.y,
            );
            assert.ok(storedTile);
            storedTile.pathogenReservoir = 0.8;
            storedTile.drainage = 0;
            delete storedTile.flowTo;
            await source.storage.put("region", stored);
            const restored = world.recreate(sourceId);
            await restored.state.ready;

            for (let index = 0; index < 6; index += 1) await restored.object.alarm();

            const target = world.entry(crossing.transition.targetRegionId);
            await target.state.ready;
            const inbox = await target.storage.get("pathogen:reservoir:incoming:v1");
            assert.ok(Array.isArray(inbox));
            const pending = inbox.reduce((sum, route) => sum + route.pendingBurden, 0);
            assert.ok(pending > 0, "neighbor must own accepted reservoir mass before source forgets it");
            assert.deepEqual(
              await restored.storage.get("pathogen:reservoir:outgoing:v1"),
              [],
              "source outbox should clear only after target acknowledgement",
            );

            const sourceAfter = await (await restored.object.fetch(
              internalRequest(sourceId, "/api/world/snapshot"),
            )).json();
            const sourceTile = sourceAfter.tiles.find(
              (tile) => tile.x === crossing.tile.x && tile.y === crossing.tile.y,
            );
            assert.ok(sourceTile);
            assert.ok(tilePathogenReservoir(sourceTile) < 0.8);

            await target.object.alarm();
            const targetAfter = await (await target.object.fetch(
              internalRequest(crossing.transition.targetRegionId, "/api/world/snapshot"),
            )).json();
            const targetTile = targetAfter.tiles.find(
              (tile) => tile.x === crossing.transition.targetPosition.x && tile.y === crossing.transition.targetPosition.y,
            );
            assert.ok(targetTile);
            assert.ok(tilePathogenReservoir(targetTile) > 0);
            const drained = await target.storage.get("pathogen:reservoir:incoming:v1");
            assert.ok(drained.every((route) => route.pendingBurden === 0));

            const route = drained[0];
            assert.ok(route);
            const duplicateBody = {
              transferId: `${route.routeKey}@${route.lastAcceptedTick}`,
              fromRegionId: route.fromRegionId,
              toRegionId: crossing.transition.targetRegionId,
              sourcePosition: route.sourcePosition,
              desiredPosition: crossing.desiredPosition,
              targetPosition: route.targetPosition,
              burden: pending,
              createdAtTick: route.lastAcceptedTick,
            };
            const duplicate = await target.object.fetch(internalRequest(
              crossing.transition.targetRegionId,
              "/api/internal/pathogen/reservoir/transfer",
              {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(duplicateBody),
              },
            ));
            assert.equal(duplicate.status, 200);
            assert.equal((await duplicate.json()).phase, "duplicate");
            assert.ok((await target.storage.get("pathogen:reservoir:incoming:v1")).every(
              (entry) => entry.pendingBurden === 0,
            ));
          });
          '''.replace("          ", ""))
          PY

