name: One-shot family-aware pioneer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-family-pioneer.yml

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch family-aware settlement pioneer selection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/settlement-migration.ts")
          source = source_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)

          replace_once(
          '''interface SettlementPlanCandidate extends SettlementSeamCandidate {
            agent: Agent;
            issuedAtTick: number;
          }
          ''',
          '''interface SettlementPlanCandidate extends SettlementSeamCandidate {
            agent: Agent;
            issuedAtTick: number;
            familySeparationCost: number;
          }
          ''')

          replace_once(
          '''    || a.pathCrowding - b.pathCrowding
              || a.crowding - b.crowding
              // Equivalent migration plans should use the builder with the larger
              // remaining energy reserve before falling back to stable agent ID order.
              || b.agent.energy - a.agent.energy
          ''',
          '''    || a.pathCrowding - b.pathCrowding
              || a.crowding - b.crowding
              // When destination quality and travel effort tie, prefer a pioneer
              // whose departure does not strand an active pregnancy or dependent
              // child. This is a bounded local-family signal, not an atomic group
              // handoff; family members can follow in a later migration phase.
              || a.familySeparationCost - b.familySeparationCost
              // Equivalent migration plans should use the builder with the larger
              // remaining energy reserve before falling back to stable agent ID order.
              || b.agent.energy - a.agent.energy
          ''')

          eligible = '''function eligiblePioneer(agent: Agent): boolean {
            if (!agent.autonomy || agent.role !== "builder" || agent.energy <= LOW_ENERGY_THRESHOLD) return false;
            if (agent.task === undefined) return true;
            return agent.task.source === "autonomy"
              && agent.task.type === "build"
              && agent.task.structureType === "camp"
              && agent.task.structureId === undefined;
          }
          '''
          helper = eligible + '''
          export function settlementFamilySeparationCost(state: WorldState, agent: Agent): number {
            let cost = agent.pregnancy !== undefined ? 2 : 0;
            for (const resident of state.agents) {
              if (resident.id === agent.id || resident.factionId !== agent.factionId) continue;
              if (
                (resident.lifeStage === "infant" || resident.lifeStage === "juvenile")
                && resident.parents?.includes(agent.id)
              ) {
                cost += 1;
              }
              if (resident.pregnancy?.partnerId === agent.id) cost += 2;
            }
            return cost;
          }
          '''
          replace_once(eligible, helper)

          replace_once(
          '''      issuedAtTick,
                support: candidate.support,
                factionStorageHeadroom: candidate.factionStorageHeadroom,
          ''',
          '''      issuedAtTick,
                support: candidate.support,
                factionStorageHeadroom: candidate.factionStorageHeadroom,
                familySeparationCost: settlementFamilySeparationCost(state, agent),
          ''')

          source_path.write_text(source)

          test_path = Path("tests/settlement-migration.test.mjs")
          test_source = test_path.read_text()
          marker = 'test("equivalent pioneer routes prefer a builder without dependent family", () => {'
          if marker in test_source:
              raise SystemExit("family pioneer regression test already exists")
          test_source += r'''

test("equivalent pioneer routes prefer a builder without dependent family", () => {
  const { state, builder } = fixture();
  const freeBuilder = state.agents.find((agent) => agent.id !== builder.id && agent.lifeStage !== "infant");
  const dependent = state.agents.find((agent) => agent.id !== builder.id && agent.id !== freeBuilder?.id);
  assert.ok(freeBuilder);
  assert.ok(dependent);

  freeBuilder.id = "zz-free-builder";
  freeBuilder.role = "builder";
  freeBuilder.autonomy = true;
  freeBuilder.energy = 60;
  freeBuilder.position = { ...builder.position };
  freeBuilder.inventory = { wood: 0, stone: 0, food: 0 };
  freeBuilder.task = {
    source: "autonomy",
    issuedAtTick: state.tick,
    type: "build",
    structureType: "camp",
    target: { x: 20, y: 11 },
  };

  builder.energy = 100;
  dependent.lifeStage = "infant";
  dependent.birthTick = 0;
  dependent.parents = [builder.id, "other-parent"];

  const plan = planAutonomousSettlementMigration(state, eastHalo());
  assert.ok(plan);
  assert.equal(
    plan.agentId,
    freeBuilder.id,
    "a higher-energy parent should not be the first lone pioneer when an equivalent unattached builder exists",
  );
});

test("equivalent pioneer routes avoid separating either side of an active pregnancy", () => {
  const { state, builder } = fixture();
  const freeBuilder = state.agents.find((agent) => agent.id !== builder.id);
  const gestationalParent = state.agents.find((agent) => agent.id !== builder.id && agent.id !== freeBuilder?.id);
  assert.ok(freeBuilder);
  assert.ok(gestationalParent);

  freeBuilder.id = "zz-free-builder";
  freeBuilder.role = "builder";
  freeBuilder.autonomy = true;
  freeBuilder.energy = 60;
  freeBuilder.position = { ...builder.position };
  freeBuilder.inventory = { wood: 0, stone: 0, food: 0 };
  freeBuilder.task = {
    source: "autonomy",
    issuedAtTick: state.tick,
    type: "build",
    structureType: "camp",
    target: { x: 20, y: 11 },
  };

  builder.energy = 100;
  gestationalParent.pregnancy = {
    partnerId: builder.id,
    conceivedAtTick: state.tick - 1,
    dueAtTick: state.tick + 100,
  };

  const plan = planAutonomousSettlementMigration(state, eastHalo());
  assert.ok(plan);
  assert.equal(plan.agentId, freeBuilder.id);
});
'''
          test_path.write_text(test_source)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate full build
        run: npm run build

      - name: Commit tested improvement and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-family-pioneer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sim: prefer pioneers without dependent family"
          git push origin HEAD:main
