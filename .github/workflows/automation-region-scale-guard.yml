name: Automation region scale guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-region-scale-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply canonical coordinate guard and scale regression
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          worker = Path("src/worker.ts")
          text = worker.read_text()
          old = '''  if (requested !== undefined && requested !== "" && parseAxialRegionId(requested) !== undefined) {
            return requested;
          }
          '''
          new = '''  if (requested !== undefined && requested !== "" && parseAxialRegionId(requested) !== undefined) {
            // Canonical ids are intentionally sparse/list-free, but the shared global
            // cell frame still has to fit inside JavaScript safe integers. Reject an
            // unprojectable public coordinate as an unavailable region instead of
            // letting later topology/window projection throw a 500.
            try {
              if (regionGlobalCellOrigin(requested) === undefined) return undefined;
            } catch {
              return undefined;
            }
            return requested;
          }
          '''
          if old not in text:
              raise SystemExit("resolveRegion canonical anchor not found")
          worker.write_text(text.replace(old, new, 1))

          Path("tests/region-scale-budget.test.mjs").write_text(dedent(r'''
          import assert from "node:assert/strict";
          import test from "node:test";
          import worker from "../dist-ts/src/worker-entry.js";

          class CountingNamespace {
            constructor() {
              this.fetches = 0;
              this.regionIds = new Set();
            }
            idFromName(name) { return name; }
            get(id) {
              return {
                fetch: async (request) => {
                  this.fetches += 1;
                  this.regionIds.add(id);
                  const regionId = request.headers.get("x-moyo-region-internal") ?? id;
                  return new Response(JSON.stringify({
                    regionId,
                    width: 40,
                    height: 24,
                    tick: 0,
                    revision: 0,
                    tiles: [],
                  }), {
                    status: 200,
                    headers: { "content-type": "application/json" },
                  });
                },
              };
            }
          }

          function configuredIds(count) {
            const ids = ["garden-1", "garden-2", "garden-3"];
            for (let index = ids.length; index < count; index += 1) {
              ids.push(`hex-q${index + 10}-r${-(index + 3)}`);
            }
            return ids.join(",");
          }

          function baseEnv(regionIds, namespace = new CountingNamespace()) {
            return {
              DEFAULT_REGION_ID: "garden-1",
              REGION_IDS: regionIds,
              WORLD_SEED: "424242",
              TICK_MS: "10000",
              OPEN_COMMANDS: "false",
              REGIONS: namespace,
              ASSETS: { fetch: async () => new Response("not found", { status: 404 }) },
            };
          }

          test("radius-one production window keeps its request budget constant from 19 to 1000 configured regions", async (t) => {
            const scales = [19, 61, 127, 331, 1000];
            const rows = [];
            for (const scale of scales) {
              const namespace = new CountingNamespace();
              const env = baseEnv(configuredIds(scale), namespace);
              const started = performance.now();
              const response = await worker.fetch(new Request(
                "https://moyo.example/api/world/window?region=garden-1&radius=1&terrain=1",
              ), env);
              const elapsedMs = performance.now() - started;
              assert.equal(response.status, 200);
              const payload = await response.json();
              const payloadBytes = Buffer.byteLength(JSON.stringify(payload));
              assert.equal(payload.chunks.length, 7);
              assert.equal(namespace.fetches, 7);
              assert.equal(namespace.regionIds.size, 7);
              rows.push({ scale, doFetches: namespace.fetches, payloadBytes, elapsedMs: Number(elapsedMs.toFixed(3)) });
            }
            assert.deepEqual(new Set(rows.map((row) => row.doFetches)), new Set([7]));
            assert.equal(new Set(rows.map((row) => row.payloadBytes)).size, 1);
            t.diagnostic(`region-scale-budget ${JSON.stringify(rows)}`);
          });

          test("unprojectable canonical coordinates fail closed instead of throwing during public routing", async () => {
            const env = baseEnv("garden-1,garden-2,garden-3");
            const regionId = "hex-q9007199254740991-r0";

            const meta = await worker.fetch(new Request(
              `https://moyo.example/api/meta?region=${regionId}&radius=1`,
            ), env);
            assert.equal(meta.status, 404);
            assert.deepEqual(await meta.json(), { error: "unknown or disabled region" });

            const window = await worker.fetch(new Request(
              `https://moyo.example/api/world/window?region=${regionId}&radius=1`,
            ), env);
            assert.equal(window.status, 404);
            assert.deepEqual(await window.json(), { error: "unknown or disabled region" });
          });
          ''').lstrip())
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit product improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          git add src/worker.ts tests/region-scale-budget.test.mjs
          git commit -m "perf: bound sparse region routing budget"
          git push origin HEAD:main
