name: One-shot settlement structure summary

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-settlement-structure-summary.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: stage settlement structure-summary improvement'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply bounded active-structure summary improvement
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/hex-halo.ts',
              'import type { ResourceKind, Tile } from "./protocol.js";',
              'import type { ResourceKind, StructureType, Tile } from "./protocol.js";',
          )
          replace_once(
              'src/hex-halo.ts',
              '  resourceCapacity?: Record<ResourceKind, number>;\n  passableCells: number;\n  occupants: number;\n}',
              '  resourceCapacity?: Record<ResourceKind, number>;\n  // Optional during rolling deploys. Keep a constant-size count of established\n  // service footprint so neighboring planners can reason about settlement\n  // saturation without fetching remote structure snapshots.\n  activeStructures?: Record<StructureType, number>;\n  passableCells: number;\n  occupants: number;\n}',
          )
          replace_once(
              'src/hex-halo.ts',
              '          ...(observed.regionSummary.resourceCapacity === undefined ? {} : {\n            resourceCapacity: { ...observed.regionSummary.resourceCapacity },\n          }),\n          passableCells: observed.regionSummary.passableCells,',
              '          ...(observed.regionSummary.resourceCapacity === undefined ? {} : {\n            resourceCapacity: { ...observed.regionSummary.resourceCapacity },\n          }),\n          ...(observed.regionSummary.activeStructures === undefined ? {} : {\n            activeStructures: { ...observed.regionSummary.activeStructures },\n          }),\n          passableCells: observed.regionSummary.passableCells,',
          )

          replace_once(
              'src/halo-region.ts',
              '    const resourceCapacity: Record<ResourceKind, number> = { wood: 0, stone: 0, food: 0 };\n    let passableCells = 0;',
              '    const resourceCapacity: Record<ResourceKind, number> = { wood: 0, stone: 0, food: 0 };\n    const activeStructures = { camp: 0, storehouse: 0, market: 0, workshop: 0 };\n    for (const structure of state.structures) {\n      if (structure.status === "active") activeStructures[structure.type] += 1;\n    }\n    let passableCells = 0;',
          )
          replace_once(
              'src/halo-region.ts',
              '      resourceCapacity,\n      passableCells,\n      occupants: state.agents.length,',
              '      resourceCapacity,\n      activeStructures,\n      passableCells,\n      occupants: state.agents.length,',
          )

          replace_once(
              'src/settlement-migration.ts',
              'const SETTLEMENT_POPULATION_DENSITY_EPSILON = 1e-6;\nconst SETTLEMENT_RESOURCE_CAPACITY_EPSILON = 1e-6;',
              'const SETTLEMENT_POPULATION_DENSITY_EPSILON = 1e-6;\nconst SETTLEMENT_CAMP_DENSITY_EPSILON = 1e-6;\nconst SETTLEMENT_RESOURCE_CAPACITY_EPSILON = 1e-6;',
          )
          replace_once(
              'src/settlement-migration.ts',
              '  populationSampleCells: number;\n  occupants: number;\n  waterCells: number;',
              '  populationSampleCells: number;\n  occupants: number;\n  campSampleCells: number;\n  activeCamps: number;\n  waterCells: number;',
          )
          replace_once(
              'src/settlement-migration.ts',
              '    populationSampleCells: 0,\n    occupants: 0,\n    waterCells: 0,',
              '    populationSampleCells: 0,\n    occupants: 0,\n    campSampleCells: 0,\n    activeCamps: 0,\n    waterCells: 0,',
          )
          marker = '''function applyRegionPopulationSummary(
  support: SettlementNeighborSupport,
  summary: HexHaloRegionSummary,
): void {
  support.populationSampleCells = summary.passableCells;
  support.occupants = summary.occupants;
}
'''
          addition = marker + '''
function validRegionCampSummary(
  summary: HexHaloRegionSummary | undefined,
): summary is HexHaloRegionSummary & { activeStructures: NonNullable<HexHaloRegionSummary["activeStructures"]> } {
  return summary !== undefined
    && summary.activeStructures !== undefined
    && Number.isInteger(summary.passableCells)
    && summary.passableCells > 0
    && Number.isInteger(summary.activeStructures.camp)
    && summary.activeStructures.camp >= 0;
}

function sameRegionCampSummary(
  a: HexHaloRegionSummary & { activeStructures: NonNullable<HexHaloRegionSummary["activeStructures"]> },
  b: HexHaloRegionSummary & { activeStructures: NonNullable<HexHaloRegionSummary["activeStructures"]> },
): boolean {
  return a.passableCells === b.passableCells
    && a.activeStructures.camp === b.activeStructures.camp;
}

function applyRegionCampSummary(
  support: SettlementNeighborSupport,
  summary: HexHaloRegionSummary & { activeStructures: NonNullable<HexHaloRegionSummary["activeStructures"]> },
): void {
  support.campSampleCells = summary.passableCells;
  support.activeCamps = summary.activeStructures.camp;
}
'''
          replace_once('src/settlement-migration.ts', marker, addition)
          replace_once(
              'src/settlement-migration.ts',
              '  const populationSummaryByRegion = new Map<string, HexHaloRegionSummary>();\n  const inconsistentPopulationSummaryRegions = new Set<string>();\n  const seenNeighborCells = new Set<string>();',
              '  const populationSummaryByRegion = new Map<string, HexHaloRegionSummary>();\n  const inconsistentPopulationSummaryRegions = new Set<string>();\n  const campSummaryByRegion = new Map<\n    string,\n    HexHaloRegionSummary & { activeStructures: NonNullable<HexHaloRegionSummary["activeStructures"]> }\n  >();\n  const inconsistentCampSummaryRegions = new Set<string>();\n  const seenNeighborCells = new Set<string>();',
          )
          replace_once(
              'src/settlement-migration.ts',
              '''    if (validRegionPopulationSummary(regionSummary)) {
      const current = populationSummaryByRegion.get(entry.neighborRegionId);
      if (current === undefined) {
        populationSummaryByRegion.set(entry.neighborRegionId, regionSummary);
      } else if (!sameRegionPopulationSummary(current, regionSummary)) {
        // Population can change independently of resource totals across adjacent
        // edge reads. Avoid manufacturing a regional density from mixed ticks.
        inconsistentPopulationSummaryRegions.add(entry.neighborRegionId);
      }
    }
''',
              '''    if (validRegionPopulationSummary(regionSummary)) {
      const current = populationSummaryByRegion.get(entry.neighborRegionId);
      if (current === undefined) {
        populationSummaryByRegion.set(entry.neighborRegionId, regionSummary);
      } else if (!sameRegionPopulationSummary(current, regionSummary)) {
        // Population can change independently of resource totals across adjacent
        // edge reads. Avoid manufacturing a regional density from mixed ticks.
        inconsistentPopulationSummaryRegions.add(entry.neighborRegionId);
      }
    }
    if (validRegionCampSummary(regionSummary)) {
      const current = campSummaryByRegion.get(entry.neighborRegionId);
      if (current === undefined) {
        campSummaryByRegion.set(entry.neighborRegionId, regionSummary);
      } else if (!sameRegionCampSummary(current, regionSummary)) {
        // Structure completion can land between independent edge reads. Keep
        // mixed-tick service-footprint observations neutral for this plan.
        inconsistentCampSummaryRegions.add(entry.neighborRegionId);
      }
    }
''',
          )
          replace_once(
              'src/settlement-migration.ts',
              '''  for (const [regionId, summary] of populationSummaryByRegion) {
    if (inconsistentPopulationSummaryRegions.has(regionId)) continue;
    const support = supportByRegion.get(regionId);
    if (support !== undefined) applyRegionPopulationSummary(support, summary);
  }
  return supportByRegion;
}''',
              '''  for (const [regionId, summary] of populationSummaryByRegion) {
    if (inconsistentPopulationSummaryRegions.has(regionId)) continue;
    const support = supportByRegion.get(regionId);
    if (support !== undefined) applyRegionPopulationSummary(support, summary);
  }
  for (const [regionId, summary] of campSummaryByRegion) {
    if (inconsistentCampSummaryRegions.has(regionId)) continue;
    const support = supportByRegion.get(regionId);
    if (support !== undefined) applyRegionCampSummary(support, summary);
  }
  return supportByRegion;
}''',
          )
          replace_once(
              'src/settlement-migration.ts',
              '  support.populationSampleCells = support.passableCells;\n  support.occupants = state.agents.length;\n  return support;',
              '  support.populationSampleCells = support.passableCells;\n  support.occupants = state.agents.length;\n  support.campSampleCells = support.passableCells;\n  support.activeCamps = state.structures.filter((structure) =>\n    structure.type === "camp" && structure.status === "active"\n  ).length;\n  return support;',
          )
          marker = '''function comparePopulationDensity(
  a: SettlementNeighborSupport,
  b: SettlementNeighborSupport,
): number {
  if (a.populationSampleCells === 0 || b.populationSampleCells === 0) return 0;
  const delta = populationDensity(a) - populationDensity(b);
  return Math.abs(delta) > SETTLEMENT_POPULATION_DENSITY_EPSILON ? delta : 0;
}
'''
          addition = marker + '''
function campDensity(support: SettlementNeighborSupport): number {
  return support.campSampleCells > 0
    ? support.activeCamps / support.campSampleCells
    : 0;
}

function compareCampDensity(
  a: SettlementNeighborSupport,
  b: SettlementNeighborSupport,
): number {
  if (a.campSampleCells === 0 || b.campSampleCells === 0) return 0;
  const delta = campDensity(a) - campDensity(b);
  return Math.abs(delta) > SETTLEMENT_CAMP_DENSITY_EPSILON ? delta : 0;
}
'''
          replace_once('src/settlement-migration.ts', marker, addition)
          replace_once(
              'src/settlement-migration.ts',
              '    || comparePopulationDensity(a, b)\n    || compareResourceAmountDensity(a, b, "food")',
              '    || comparePopulationDensity(a, b)\n    || compareCampDensity(a, b)\n    || compareResourceAmountDensity(a, b, "food")',
          )
          replace_once(
              'src/settlement-migration.ts',
              '''  if (candidate.populationSampleCells > 0 && local.populationSampleCells > 0) {
    const candidatePopulation = populationDensity(candidate);
    const localPopulation = populationDensity(local);
    if (candidatePopulation < localPopulation - SETTLEMENT_POPULATION_DENSITY_EPSILON) return true;
    if (candidatePopulation > localPopulation + SETTLEMENT_POPULATION_DENSITY_EPSILON) return false;
  }

  const waterFractionDelta = surfaceWaterFraction(candidate) - surfaceWaterFraction(local);''',
              '''  if (candidate.populationSampleCells > 0 && local.populationSampleCells > 0) {
