name: One-shot terrain environment seam improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-terrain-environment-seam.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply cross-region terrain environment lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          terrain = Path('public/client/terrain.js')
          s = terrain.read_text()
          old = 'import { HEX_GRID_STEPS, hexGridDistance } from "./hex-grid.js";'
          assert old in s
          s = s.replace(
              old,
              'import { HEX_GRID_STEPS, hexGridDistance, isHexGridCell } from "./hex-grid.js";',
              1,
          )
          marker = """function clamp01(value) {
            return Math.max(0, Math.min(1, value));
          }
          """
          helper = """function clamp01(value) {
            return Math.max(0, Math.min(1, value));
          }

          // Resolve terrain samples through the shared global cell frame. This lets
          // moisture and axial relief read exact cells from an adjacent loaded chunk
          // instead of treating a macro-region boundary as the edge of the world.
          export function createTerrainWindowTileLookup(chunks) {
            const globalTiles = new Map();
            for (const chunk of chunks ?? []) {
              const tiles = chunk?.state?.tiles;
              const width = Number(chunk?.state?.width);
              const height = Number(chunk?.state?.height);
              const origin = chunk?.globalCellOrigin;
              if (
                !Array.isArray(tiles)
                || !Number.isInteger(width)
                || !Number.isInteger(height)
                || width <= 0
                || height <= 0
                || !Number.isInteger(origin?.x)
                || !Number.isInteger(origin?.y)
              ) continue;
              for (const tile of tiles) {
                // Rectangular compatibility storage overlaps between regions. Only
                // index cells owned by the active simulation hex so one region's
                // inactive corner cannot shadow another region's real terrain.
                if (!isHexGridCell(tile, width, height)) continue;
                globalTiles.set(`${origin.x + tile.x}:${origin.y + tile.y}`, tile);
              }
            }

            return (chunk, x, y) => {
              if (!Number.isInteger(x) || !Number.isInteger(y)) return null;
              const origin = chunk?.globalCellOrigin;
              if (Number.isInteger(origin?.x) && Number.isInteger(origin?.y)) {
                return globalTiles.get(`${origin.x + x}:${origin.y + y}`) ?? null;
              }
              const width = Number(chunk?.state?.width);
              const height = Number(chunk?.state?.height);
              if (
                !Number.isInteger(width)
                || !Number.isInteger(height)
                || x < 0
                || y < 0
                || x >= width
                || y >= height
              ) return null;
              return chunk?.state?.tiles?.[y * width + x] ?? null;
            };
          }
          """
          assert marker in s
          terrain.write_text(s.replace(marker, helper, 1))

          app = Path('public/app.js')
          s = app.read_text()
          old = 'import { environmentalTerrainColor } from "./client/terrain.js";'
          assert old in s
          s = s.replace(
              old,
              'import { createTerrainWindowTileLookup, environmentalTerrainColor } from "./client/terrain.js";',
              1,
          )
          old = "  const land = [];\n  const water = [];\n  let neighborChunks = 0;"
          assert old in s
          s = s.replace(
              old,
              "  const land = [];\n  const water = [];\n  const windowStateTile = createTerrainWindowTileLookup(chunks);\n  let neighborChunks = 0;",
              1,
          )
          pattern = re.compile(
              r"    const chunkStateTile = \(x, y\) => x >= 0 && y >= 0 && x < chunkWidth && y < chunkHeight\n"
              r"\s+\? chunk\.state\.tiles\[y \* chunkWidth \+ x\]\n"
              r"\s+: null;"
          )
          s, count = pattern.subn(
              "    const chunkStateTile = (x, y) => windowStateTile(chunk, x, y);",
              s,
              count=1,
          )
          assert count == 1
          app.write_text(s)

          test = Path('tests/hex-terrain-environment.test.mjs')
          s = test.read_text()
          old = """import {
            environmentalMoisture,
            environmentalRelief,
            environmentalTerrainColor,
          } from "../public/client/terrain.js";
          """
          assert old in s
          s = s.replace(
              old,
              """import {
            createTerrainWindowTileLookup,
            environmentalMoisture,
            environmentalRelief,
            environmentalTerrainColor,
          } from "../public/client/terrain.js";
          """,
              1,
          )
          marker = 'test("active hex terrain renderer consumes the shared environmental tint", async () => {'
          assert marker in s
          regression = """test("terrain window lookup carries water influence across a macro-region seam", () => {
            const source = tile(30, 11, 0.35);
            const remoteWater = tile(8, 22, 0, "water");
            const chunks = [
              {
                regionId: "hex-q0-r0",
                globalCellOrigin: { x: -19, y: -11 },
                state: { width: 40, height: 24, tiles: [source] },
              },
              {
                regionId: "hex-q1-r0",
                // This synthetic origin maps the remote active cell to the exact
                // global E neighbor of source while keeping local coordinates distinct.
                globalCellOrigin: { x: 4, y: -22 },
                state: { width: 40, height: 24, tiles: [remoteWater] },
              },
            ];
            const windowTile = createTerrainWindowTileLookup(chunks);
            const sourceLookup = (x, y) => windowTile(chunks[0], x, y);
            assert.equal(sourceLookup(31, 11), remoteWater);
            assert.ok(
              environmentalMoisture(sourceLookup, source)
                > environmentalMoisture(lookup([source]), source),
            );
          });

          """
          s = s.replace(marker, regression + marker, 1)
          old = 'assert.match(source, /import \\{ environmentalTerrainColor \\} from "\\.\\/client\\/terrain\\.js"/);'
          assert old in s
          s = s.replace(old, 'assert.match(source, /createTerrainWindowTileLookup, environmentalTerrainColor/);', 1)
          old = 'assert.match(body, /const chunkStateTile = \\(x, y\\) =>/);'
          assert old in s
          s = s.replace(
              old,
              'assert.match(body, /const windowStateTile = createTerrainWindowTileLookup\\(chunks\\)/);\n  assert.match(body, /const chunkStateTile = \\(x, y\\) => windowStateTile\\(chunk, x, y\\)/);',
              1,
          )
          test.write_text(s)
          PY
      - name: Validate
        run: npm run build
      - name: Commit improvement
        run: |
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add public/client/terrain.js public/app.js tests/hex-terrain-environment.test.mjs
          git diff --cached --check
          git commit -m "visual: carry terrain environment across region seams"
          git push origin HEAD:main
