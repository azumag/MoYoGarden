name: One-shot terrain environment seam improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-terrain-environment-seam.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Apply cross-region terrain environment lookup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          terrain = Path('public/client/terrain.js')
          s = terrain.read_text()
          old = 'import { HEX_GRID_STEPS, hexGridDistance } from "./hex-grid.js";'
          new = 'import { HEX_GRID_STEPS, hexGridDistance, isHexGridCell } from "./hex-grid.js";'
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''function clamp01(value) {
            return Math.max(0, Math.min(1, value));
          }
          '''
          insert = '''function clamp01(value) {
            return Math.max(0, Math.min(1, value));
          }

          export function createTerrainWindowTileLookup(chunks) {
            const globalTiles = new Map();
            for (const chunk of chunks ?? []) {
              const tiles = chunk?.state?.tiles;
              const width = Number(chunk?.state?.width);
              const height = Number(chunk?.state?.height);
              const origin = chunk?.globalCellOrigin;
              if (
                !Array.isArray(tiles)
                || !Number.isInteger(width)
                || !Number.isInteger(height)
                || width <= 0
                || height <= 0
                || !Number.isInteger(origin?.x)
                || !Number.isInteger(origin?.y)
              ) continue;
              for (const tile of tiles) {
                if (!isHexGridCell(tile, width, height)) continue;
                globalTiles.set(`${origin.x + tile.x}:${origin.y + tile.y}`, tile);
              }
            }

            return (chunk, x, y) => {
              const width = Number(chunk?.state?.width);
              const height = Number(chunk?.state?.height);
              if (
                !Number.isInteger(x)
                || !Number.isInteger(y)
                || !Number.isInteger(width)
                || !Number.isInteger(height)
                || x < 0
                || y < 0
                || x >= width
                || y >= height
              ) return null;
              const origin = chunk?.globalCellOrigin;
              if (Number.isInteger(origin?.x) && Number.isInteger(origin?.y)) {
                return globalTiles.get(`${origin.x + x}:${origin.y + y}`) ?? null;
              }
              return chunk?.state?.tiles?.[y * width + x] ?? null;
            };
          }
          '''
          assert marker in s
          terrain.write_text(s.replace(marker, insert, 1))

          app = Path('public/app.js')
          s = app.read_text()
          old = 'import { environmentalTerrainColor } from "./client/terrain.js";'
          new = 'import { createTerrainWindowTileLookup, environmentalTerrainColor } from "./client/terrain.js";'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  const land = [];
            const water = [];
            let neighborChunks = 0;
          '''
          new = '''  const land = [];
            const water = [];
            const windowStateTile = createTerrainWindowTileLookup(chunks);
            let neighborChunks = 0;
          '''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    const chunkStateTile = (x, y) => x >= 0 && y >= 0 && x < chunkWidth && y < chunkHeight
              ? chunk.state.tiles[y * chunkWidth + x]
              : null;
          '''
          new = '''    const chunkStateTile = (x, y) => windowStateTile(chunk, x, y);
          '''
          assert old in s
          app.write_text(s.replace(old, new, 1))

          test = Path('tests/hex-terrain-environment.test.mjs')
          s = test.read_text()
          old = '''import {
            environmentalMoisture,
            environmentalRelief,
            environmentalTerrainColor,
          } from "../public/client/terrain.js";
          '''
          new = '''import {
            createTerrainWindowTileLookup,
            environmentalMoisture,
            environmentalRelief,
            environmentalTerrainColor,
          } from "../public/client/terrain.js";
          '''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''test("active hex terrain renderer consumes the shared environmental tint", async () => {
          '''
          addition = '''test("terrain window lookup carries water influence across a macro-region seam", () => {
            const source = tile(19, 11, 0.35);
            const remoteWater = tile(19, 11, 0, "water");
            const chunks = [
              {
                regionId: "hex-q0-r0",
                globalCellOrigin: { x: 0, y: 0 },
                state: { width: 40, height: 24, tiles: [source] },
              },
              {
                regionId: "hex-q1-r0",
                globalCellOrigin: { x: 1, y: 0 },
                state: { width: 40, height: 24, tiles: [remoteWater] },
              },
            ];
            const windowTile = createTerrainWindowTileLookup(chunks);
            assert.equal(windowTile(chunks[0], 20, 11), remoteWater);
            const crossRegionLookup = (x, y) => windowTile(chunks[0], x, y);
            assert.ok(
              environmentalMoisture(crossRegionLookup, source)
                > environmentalMoisture(lookup([source]), source),
            );
          });

          test("active hex terrain renderer consumes the shared environmental tint", async () => {
          '''
          assert marker in s
          s = s.replace(marker, addition, 1)
          old = 'assert.match(source, /import \\{ environmentalTerrainColor \\} from "\\.\\/client\\/terrain\\.js"/);'
          new = 'assert.match(source, /createTerrainWindowTileLookup, environmentalTerrainColor/);'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'assert.match(body, /const chunkStateTile = \\(x, y\\) =>/);'
          new = 'assert.match(body, /const windowStateTile = createTerrainWindowTileLookup\\(chunks\\)/);\n  assert.match(body, /const chunkStateTile = \\(x, y\\) => windowStateTile\\(chunk, x, y\\)/);'
          assert old in s
          test.write_text(s.replace(old, new, 1))
          PY
      - name: Validate
        run: npm run build
      - name: Commit improvement
        run: |
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add public/client/terrain.js public/app.js tests/hex-terrain-environment.test.mjs
          git diff --cached --check
          git commit -m "visual: carry terrain environment across region seams"
          git push origin HEAD:main
