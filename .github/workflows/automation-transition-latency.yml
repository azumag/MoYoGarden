name: One-shot transition latency improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-transition-latency.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply patch helper
        run: python3 scripts/automation-transition-latency.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Focused regression
        run: node --test tests/seamless-region-transition.test.mjs

      - name: Full validation
        run: |
          git diff --check
          npm run build

      - name: Commit product change and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-transition-latency.yml
          rm scripts/automation-transition-latency.py
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add public/app.js tests/seamless-region-transition.test.mjs
          git add -u .github/workflows/automation-transition-latency.yml scripts/automation-transition-latency.py
          git diff --cached --check
          git commit -m "perf: promote hex transitions before optional enrichment"
          git push origin HEAD:main
