name: Remote trade retention once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remote-trade-retention-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python tools/oneoff_remote_trade_retention.py
      - run: npm run build
      - name: Commit improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/simulation.ts src/agent-ownership.ts tests/agent-ownership-trade-reference.test.mjs tests/autonomous-remote-trade-retention.test.mjs
          git commit -m "sim: retain promoted remote trade promises"
          git push origin HEAD:main
