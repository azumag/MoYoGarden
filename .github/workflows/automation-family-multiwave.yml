name: Validate multi-wave family admission

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-family-multiwave.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply multi-wave family admission fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/settlement-migration.ts",
              '''  return result.candidateCount > 0 && result.agentIds.length === 0;''',
              '''  return result.agentIds.length < result.candidateCount;''',
          )

          replace_once(
              "src/autonomy-region.ts",
              '''    if (settlementFamilyRegistrationDeferred(result)) {
              return new Response(JSON.stringify({
                error: "settlement family admission deferred",
                targetRegionId: body.targetRegionId,
                candidateCount: result.candidateCount,
              }), {
                status: 409,
                headers: { "content-type": "application/json; charset=utf-8" },
              });
            }
            if (result.agentIds.length > 0) this.replaceRuntimeState(state);''',
              '''    if (result.agentIds.length > 0) this.replaceRuntimeState(state);
            if (settlementFamilyRegistrationDeferred(result)) {
              return new Response(JSON.stringify({
                error: "settlement family admission deferred",
                targetRegionId: body.targetRegionId,
                candidateCount: result.candidateCount,
              }), {
                status: 409,
                headers: { "content-type": "application/json; charset=utf-8" },
              });
            }''',
          )

          test_path = Path("tests/settlement-family-admission-atomic.test.mjs")
          text = test_path.read_text()
          marker = 'test("family migration keeps pioneer retry open across partial follower waves", () => {'
          if marker in text:
              raise SystemExit("multi-wave regression already present")
          addition = r'''

test("family migration keeps pioneer retry open across partial follower waves", () => {
  const source = createInitialWorld({
    seed: 260926,
    width: 40,
    height: 24,
    regionId: "garden-1",
  });
  clearHex(source);
  const template = structuredClone(source.agents[0]);
  assert.ok(template);
  const pioneerId = globalHandoffAgentId("pioneer", source.regionId);
  const partner = {
    ...structuredClone(template),
    id: "partner",
    factionId: template.factionId,
    hp: 100,
    pregnancy: undefined,
    position: { x: 20, y: 11 },
  };
  const child = {
    ...structuredClone(template),
    id: "child",
    factionId: template.factionId,
    hp: 100,
    autonomy: false,
    lifeStage: "infant",
    pregnancy: undefined,
    parents: [pioneerId, partner.id],
    position: { x: 20, y: 11 },
  };
  const pregnantRelative = {
    ...structuredClone(template),
    id: "pregnant-relative",
    factionId: template.factionId,
    hp: 100,
    lifeStage: "adult",
    pregnancy: {
      partnerId: pioneerId,
      conceivedAtTick: 10,
      dueAtTick: 100,
    },
    position: { x: 20, y: 11 },
  };
  source.agents = [partner, child, pregnantRelative];

  const firstWave = registerSettlementFamilyFollowers(
    source,
    pioneerId,
    "hex-q1-r0",
    template.factionId,
    globalHandoffAgentId(partner.id, source.regionId),
    2,
  );
  assert.deepEqual(firstWave.agentIds, ["partner", "child"]);
  assert.equal(firstWave.candidateCount, 3);
  assert.equal(settlementFamilyRegistrationDeferred(firstWave), true);
  assert.equal(partner.settlementFamilyTargetRegionId, "hex-q1-r0");
  assert.equal(child.settlementFamilyTargetRegionId, "hex-q1-r0");
  assert.equal(pregnantRelative.settlementFamilyTargetRegionId, undefined);

  // Once the first atomic unit has left the source region, a later retry can
  // admit the remaining unit without reopening or duplicating the first wave.
  source.agents = [pregnantRelative];
  const secondWave = registerSettlementFamilyFollowers(
    source,
    pioneerId,
    "hex-q1-r0",
    template.factionId,
    globalHandoffAgentId(partner.id, source.regionId),
    1,
  );
  assert.deepEqual(secondWave.agentIds, ["pregnant-relative"]);
  assert.equal(secondWave.candidateCount, 1);
  assert.equal(settlementFamilyRegistrationDeferred(secondWave), false);
  assert.equal(pregnantRelative.settlementFamilyTargetRegionId, "hex-q1-r0");
});
'''
          test_path.write_text(text.rstrip() + addition + "\n")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          git diff --check
          npm run build

      - name: Commit validated product change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/automation-family-multiwave.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settlement-migration.ts src/autonomy-region.ts tests/settlement-family-admission-atomic.test.mjs .github/workflows/automation-family-multiwave.yml
          git commit -m "sim: keep family migration open across partial waves"
          git push origin HEAD:main
