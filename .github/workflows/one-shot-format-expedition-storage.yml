name: One-shot format expedition storage safety

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-format-expedition-storage.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path("src/autonomy-region.ts")
          text = src.read_text()
          old_capacity = "    const availableSourceReturnStorage = Math.max(\n  0,\n  factionStorageCapacityLeft(state, agent.factionId)\n    - reservedReturnStorageForFaction(state, claims, agent.factionId),\n);\n"
          new_capacity = "    const availableSourceReturnStorage = Math.max(\n      0,\n      factionStorageCapacityLeft(state, agent.factionId)\n        - reservedReturnStorageForFaction(state, claims, agent.factionId),\n    );\n"
          if old_capacity not in text:
              raise SystemExit("source capacity formatting anchor missing")
          text = text.replace(old_capacity, new_capacity, 1)
          old_route = "      const remoteStorageHeadroom = destinationStorageHeadroom.get(entry.neighborRegionId);\n  // Do not launch cargo toward a destination that is explicitly known to\n  // have no storage when this source also has no unreserved return capacity.\n  // Missing remote metadata stays neutral for rolling compatibility: only\n  // two concrete capacity observations can prove the expedition has no sink.\n  if (remoteStorageHeadroom === 0 && availableSourceReturnStorage <= 0) return [];\n        return [{\n        entry,\n        travelDistance: pathScore.distance,\n        pathCrowding: pathScore.crowding,\n        destinationCrowding: entry.neighborOccupants ?? 0,\n        destinationStorageHeadroom: remoteStorageHeadroom,\n      }];\n"
          new_route = "      const remoteStorageHeadroom = destinationStorageHeadroom.get(entry.neighborRegionId);\n      // Do not launch cargo toward a destination that is explicitly known to\n      // have no storage when this source also has no unreserved return capacity.\n      // Missing remote metadata stays neutral for rolling compatibility: only\n      // two concrete capacity observations can prove the expedition has no sink.\n      if (remoteStorageHeadroom === 0 && availableSourceReturnStorage <= 0) return [];\n      return [{\n        entry,\n        travelDistance: pathScore.distance,\n        pathCrowding: pathScore.crowding,\n        destinationCrowding: entry.neighborOccupants ?? 0,\n        destinationStorageHeadroom: remoteStorageHeadroom,\n      }];\n"
          if old_route not in text:
              raise SystemExit("source route formatting anchor missing")
          src.write_text(text.replace(old_route, new_route, 1))
          test = Path("tests/autonomy-region-storage-headroom-summary.test.mjs")
          test.write_text(test.read_text().replace("});\n\n\nfunction fillFactionStorage", "});\n\nfunction fillFactionStorage", 1))
          PY
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          git commit -m "style: format expedition storage safety guard"
          git push origin HEAD:main
