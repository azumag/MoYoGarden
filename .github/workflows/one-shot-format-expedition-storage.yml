name: One-shot format expedition storage safety

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-format-expedition-storage.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Normalize formatting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path("src/autonomy-region.ts")
          text = src.read_text()
          old = '''    const availableSourceReturnStorage = Math.max(
  0,
  factionStorageCapacityLeft(state, agent.factionId)
    - reservedReturnStorageForFaction(state, claims, agent.factionId),
);
'''
          new = '''    const availableSourceReturnStorage = Math.max(
      0,
      factionStorageCapacityLeft(state, agent.factionId)
        - reservedReturnStorageForFaction(state, claims, agent.factionId),
    );
'''
          if old not in text:
              raise SystemExit("source capacity formatting anchor missing")
          text = text.replace(old, new, 1)
          old = '''      const remoteStorageHeadroom = destinationStorageHeadroom.get(entry.neighborRegionId);
  // Do not launch cargo toward a destination that is explicitly known to
  // have no storage when this source also has no unreserved return capacity.
  // Missing remote metadata stays neutral for rolling compatibility: only
  // two concrete capacity observations can prove the expedition has no sink.
  if (remoteStorageHeadroom === 0 && availableSourceReturnStorage <= 0) return [];
        return [{
        entry,
        travelDistance: pathScore.distance,
        pathCrowding: pathScore.crowding,
        destinationCrowding: entry.neighborOccupants ?? 0,
        destinationStorageHeadroom: remoteStorageHeadroom,
      }];
'''
          new = '''      const remoteStorageHeadroom = destinationStorageHeadroom.get(entry.neighborRegionId);
      // Do not launch cargo toward a destination that is explicitly known to
      // have no storage when this source also has no unreserved return capacity.
      // Missing remote metadata stays neutral for rolling compatibility: only
      // two concrete capacity observations can prove the expedition has no sink.
      if (remoteStorageHeadroom === 0 && availableSourceReturnStorage <= 0) return [];
      return [{
        entry,
        travelDistance: pathScore.distance,
        pathCrowding: pathScore.crowding,
        destinationCrowding: entry.neighborOccupants ?? 0,
        destinationStorageHeadroom: remoteStorageHeadroom,
      }];
'''
          if old not in text:
              raise SystemExit("source route formatting anchor missing")
          src.write_text(text.replace(old, new, 1))

          test = Path("tests/autonomy-region-storage-headroom-summary.test.mjs")
          t = test.read_text().replace("});\n\n\nfunction fillFactionStorage", "});\n\nfunction fillFactionStorage", 1)
          test.write_text(t)
          PY
          git diff --check
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Commit formatting cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          git commit -m "style: format expedition storage safety guard"
          git push origin HEAD:main

# trigger after registration
