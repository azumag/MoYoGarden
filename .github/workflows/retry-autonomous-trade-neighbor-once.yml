name: Retry autonomous trade neighbor improvement once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-autonomous-trade-neighbor-once.yml'

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply corrected staged patch
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/autonomous-trade-neighbor-once.yml').read_text()
          marker = '      - name: Patch bounded one-hop autonomous trade routing\n        shell: python\n        run: |\n'
          end_marker = '      - name: Build and test\n'
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit('staged patch block not found')
          block = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          script = script.replace('from pathlib import Path\n', 'from pathlib import Path\nimport textwrap\n', 1)
          script = script.replace(
              'Path("tests/autonomy-trade-neighbor-routing.test.mjs").write_text(r\'\'\'',
              'Path("tests/autonomy-trade-neighbor-routing.test.mjs").write_text(textwrap.dedent(r\'\'\'',
              1,
          )
          script = script.replace("'''.replace(/^          /gm, \"\"))", "'''))", 1)
          compile(script, '<staged-trade-patch>', 'exec')
          exec(script, {})
      - name: Build and test
        run: npm run build
      - name: Commit improvement and remove staging workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/autonomous-trade-neighbor-once.yml .github/workflows/retry-autonomous-trade-neighbor-once.yml
          git add src/protocol.ts src/simulation.ts src/agent-ownership.ts src/autonomy-region.ts tests/autonomy-trade-neighbor-routing.test.mjs
          git commit -m "feat: route autonomous trades to neighboring owners"
          git push origin HEAD:main
