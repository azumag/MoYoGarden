name: One-shot clean generated build artifacts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-clean-generated-build-artifacts.yml

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove generated build output and restore build metadata placeholder
        run: |
          git rm -rf public/assets/authored package-lock.json
          git checkout 56de781a4c385bcc1796254f29d0ebaa075dfb56 -- src/build-meta.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify typecheck and tests without vendoring build output
        run: |
          npm run check
          npm test
      - name: Keep dependency lockfile untracked and remove one-shot workflow
        run: |
          rm -f package-lock.json
          rm .github/workflows/one-shot-clean-generated-build-artifacts.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: keep generated build assets out of main"
          git push origin HEAD:main
