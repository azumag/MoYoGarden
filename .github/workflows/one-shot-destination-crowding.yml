name: One-shot destination crowding improvement

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-destination-crowding.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded destination crowding
        run: python .github/scripts/one-shot-destination-crowding.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full validation
        run: npm run build

      - name: Commit verified changes to main
        run: |
          rm -f .github/workflows/one-shot-destination-crowding.yml .github/scripts/one-shot-destination-crowding.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sim: spread destinations by bounded congestion"
          git push origin HEAD:main
