name: MoYo family capacity retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-family-capacity-retry.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply family capacity reservation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/autonomy-region.ts')
          text = path.read_text()

          def insert_after(anchor: str, addition: str) -> None:
              global text
              if text.count(anchor) != 1:
                  raise SystemExit(f'anchor count {text.count(anchor)} for {anchor!r}')
              text = text.replace(anchor, anchor + addition, 1)

          insert_after(
              '} from "./settlement-migration.js";\n',
              dedent('''\
              import {
                normalizeSettlementFamilyAdmissionReservations,
                settlementFamilyReservedSlots,
                upsertSettlementFamilyAdmissionReservation,
                type SettlementFamilyAdmissionReservation,
              } from "./settlement-family-reservation.js";
              '''),
          )
          insert_after(
              'const AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY = "handoff:autonomy:destination-storage:v1";\n',
              'const SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY = "handoff:autonomy:settlement-family-admission:v1";\n',
          )
          insert_after(
              'const DESTINATION_STORAGE_RESERVATION_TTL_MS = 15 * 60 * 1_000;\n',
              dedent('''\
              // Family followers can traverse several warm/cold regions after admission.
              // Keep promised housing/food capacity for a bounded wall-clock day so a
              // second pioneer cannot overbook the same slots while the first wave is
              // physically in flight. Arrival reconciliation releases slots immediately.
              const SETTLEMENT_FAMILY_ADMISSION_RESERVATION_TTL_MS = 24 * 60 * 60 * 1_000;
              '''),
          )

          method_anchor = '  private async registerSettlementFamilyFollow(request: Request): Promise<Response> {'
          if text.count(method_anchor) != 1:
              raise SystemExit(f'register method anchor count {text.count(method_anchor)}')
          methods = dedent('''\
            private async activeSettlementFamilyAdmissionReservations(
              state: WorldState,
              now = Date.now(),
            ): Promise<SettlementFamilyAdmissionReservation[]> {
              const stored = await this.autonomyState.storage.get<unknown>(
                SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY,
              );
              const presentAgentIds = new Set(state.agents.map((agent) => agent.id));
              const normalized = normalizeSettlementFamilyAdmissionReservations(stored, presentAgentIds, now);
              if (normalized.changed) {
                await this.autonomyState.storage.put(
                  SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY,
                  normalized.reservations,
                );
              }
              return normalized.reservations;
            }

            private async reserveSettlementFamilyAdmissions(
              state: WorldState,
              sourceRegionId: string,
              pioneerId: string,
              factionId: string,
              sourceAgentIds: readonly string[],
            ): Promise<void> {
              const agentIds = [...new Set(sourceAgentIds.map((agentId) =>
                globalHandoffAgentId(agentId, sourceRegionId)
              ))];
              if (agentIds.length === 0) return;
              const reservationId = `family:${sourceRegionId}:${pioneerId}:${state.regionId}`;
              const now = Date.now();
              await this.autonomyState.blockConcurrencyWhile(async () => {
                const stored = await this.autonomyState.storage.get<unknown>(
                  SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY,
                );
                const presentAgentIds = new Set(state.agents.map((agent) => agent.id));
                const normalized = normalizeSettlementFamilyAdmissionReservations(stored, presentAgentIds, now);
                const next = upsertSettlementFamilyAdmissionReservation(
                  normalized.reservations,
                  {
                    reservationId,
                    sourceRegionId,
                    pioneerId,
                    factionId,
                    agentIds,
                    expiresAtMs: now + SETTLEMENT_FAMILY_ADMISSION_RESERVATION_TTL_MS,
                  },
                );
                await this.autonomyState.storage.put(SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY, next);
              });
            }

          ''')
          text = text.replace(method_anchor, methods + method_anchor, 1)

          reg_start = text.index(method_anchor)
          reg_end = text.index('  private async notifySettledPioneers', reg_start)
          reg = text[reg_start:reg_end]
          deferred_anchor = '        targetRegionId: body.targetRegionId,\n        candidateCount: result.candidateCount,\n'
          if reg.count(deferred_anchor) != 1:
              raise SystemExit(f'deferred response anchor count {reg.count(deferred_anchor)}')
          reg = reg.replace(
              deferred_anchor,
              '        targetRegionId: body.targetRegionId,\n        registeredAgentIds: result.agentIds,\n        candidateCount: result.candidateCount,\n',
              1,
          )
          text = text[:reg_start] + reg + text[reg_end:]

          notify_start = text.index('  private async notifySettledPioneers')
          notify_end = text.index('  private async advanceSettlementFamilyFollow', notify_start)
          notify = text[notify_start:notify_end]
          headroom_line = '      const familyAdmissionHeadroom = settlementFamilyAdmissionHeadroom(state, pioneer.factionId);\n'
          if notify.count(headroom_line) != 1:
              raise SystemExit(f'headroom anchor count {notify.count(headroom_line)}')
          notify = notify.replace(
              headroom_line,
              dedent('''\
                    const familyReservations = await this.activeSettlementFamilyAdmissionReservations(state);
                    const familyAdmissionHeadroom = Math.max(
                      0,
                      settlementFamilyAdmissionHeadroom(state, pioneer.factionId)
                        - settlementFamilyReservedSlots(familyReservations, pioneer.factionId),
                    );
              '''),
              1,
          )
          response_anchor = '        if (!response.ok) continue;\n        delete pioneer.settlementMigrationOriginRegionId;\n'
          if notify.count(response_anchor) != 1:
              raise SystemExit(f'response anchor count {notify.count(response_anchor)}')
          notify = notify.replace(
              response_anchor,
              dedent('''\
                      let payload: unknown;
                      try {
                        payload = await response.clone().json();
                      } catch {
                        payload = undefined;
                      }
                      const registeredAgentIds = isRecord(payload) && Array.isArray(payload.registeredAgentIds)
                        ? payload.registeredAgentIds.filter((agentId): agentId is string => typeof agentId === "string")
                        : [];
                      if (registeredAgentIds.length > 0) {
                        await this.reserveSettlementFamilyAdmissions(
                          state,
                          sourceRegionId,
                          pioneer.id,
                          pioneer.factionId,
                          registeredAgentIds,
                        );
                      }
                      if (!response.ok) continue;
                      delete pioneer.settlementMigrationOriginRegionId;
              '''),
              1,
          )
          text = text[:notify_start] + notify + text[notify_end:]
          path.write_text(text)

          Path('src/settlement-family-reservation.ts').write_text(dedent('''\
          export interface SettlementFamilyAdmissionReservation {
            reservationId: string;
            sourceRegionId: string;
            pioneerId: string;
            factionId: string;
            agentIds: string[];
            expiresAtMs: number;
          }

          function isRecord(value: unknown): value is Record<string, unknown> {
            return typeof value === "object" && value !== null && !Array.isArray(value);
          }

          function isReservation(value: unknown): value is SettlementFamilyAdmissionReservation {
            return isRecord(value)
              && typeof value.reservationId === "string" && value.reservationId.length > 0
              && typeof value.sourceRegionId === "string" && value.sourceRegionId.length > 0
              && typeof value.pioneerId === "string" && value.pioneerId.length > 0
              && typeof value.factionId === "string" && value.factionId.length > 0
              && Array.isArray(value.agentIds) && value.agentIds.length > 0
              && value.agentIds.every((agentId) => typeof agentId === "string" && agentId.length > 0)
              && typeof value.expiresAtMs === "number" && Number.isFinite(value.expiresAtMs)
              && value.expiresAtMs > 0;
          }

          export function normalizeSettlementFamilyAdmissionReservations(
            stored: unknown,
            presentAgentIds: ReadonlySet<string>,
            now: number,
          ): { reservations: SettlementFamilyAdmissionReservation[]; changed: boolean } {
            const input = Array.isArray(stored) ? stored : [];
            let changed = stored !== undefined && !Array.isArray(stored);
            const reservations: SettlementFamilyAdmissionReservation[] = [];
            for (const value of input) {
              if (!isReservation(value) || value.expiresAtMs <= now) {
                changed = true;
                continue;
              }
              const pendingAgentIds = [...new Set(value.agentIds)]
                .filter((agentId) => !presentAgentIds.has(agentId));
              if (pendingAgentIds.length === 0) {
                changed = true;
                continue;
              }
              if (
                pendingAgentIds.length !== value.agentIds.length
                || pendingAgentIds.some((agentId, index) => agentId !== value.agentIds[index])
              ) changed = true;
              reservations.push({ ...value, agentIds: pendingAgentIds });
            }
            return { reservations, changed };
          }

          export function settlementFamilyReservedSlots(
            reservations: readonly SettlementFamilyAdmissionReservation[],
            factionId: string,
          ): number {
            const reserved = new Set<string>();
            for (const reservation of reservations) {
              if (reservation.factionId !== factionId) continue;
              for (const agentId of reservation.agentIds) reserved.add(agentId);
            }
            return reserved.size;
          }

          export function upsertSettlementFamilyAdmissionReservation(
            reservations: readonly SettlementFamilyAdmissionReservation[],
            incoming: SettlementFamilyAdmissionReservation,
          ): SettlementFamilyAdmissionReservation[] {
            const existing = reservations.find((entry) => entry.reservationId === incoming.reservationId);
            const merged = existing === undefined
              ? { ...incoming, agentIds: [...new Set(incoming.agentIds)] }
              : {
                  ...incoming,
                  agentIds: [...new Set([...existing.agentIds, ...incoming.agentIds])],
                  expiresAtMs: Math.max(existing.expiresAtMs, incoming.expiresAtMs),
                };
            return [...reservations.filter((entry) => entry.reservationId !== incoming.reservationId), merged];
          }
          '''))

          Path('tests/settlement-family-reservation.test.mjs').write_text(dedent('''\
          import assert from "node:assert/strict";
          import test from "node:test";
          import {
            normalizeSettlementFamilyAdmissionReservations,
            settlementFamilyReservedSlots,
            upsertSettlementFamilyAdmissionReservation,
          } from "../dist-ts/src/settlement-family-reservation.js";

          const reservation = (overrides = {}) => ({
            reservationId: "family:garden-1:pioneer-1:garden-2",
            sourceRegionId: "garden-1",
            pioneerId: "pioneer-1",
            factionId: "faction-a",
            agentIds: ["agent-global:garden-1:adult", "agent-global:garden-1:infant"],
            expiresAtMs: 20_000,
            ...overrides,
          });

          test("family reservations release arrived followers and expire stale promises", () => {
            const normalized = normalizeSettlementFamilyAdmissionReservations(
              [
                reservation(),
                reservation({ reservationId: "expired", agentIds: ["stale"], expiresAtMs: 9_000 }),
              ],
              new Set(["agent-global:garden-1:adult"]),
              10_000,
            );
            assert.equal(normalized.changed, true);
            assert.deepEqual(normalized.reservations, [
              reservation({ agentIds: ["agent-global:garden-1:infant"] }),
            ]);
          });

          test("family reservation retries are idempotent and shared capacity counts unique followers", () => {
            const first = reservation({ agentIds: ["agent-global:garden-1:adult"] });
            const retried = upsertSettlementFamilyAdmissionReservation([first], reservation({
              agentIds: ["agent-global:garden-1:adult", "agent-global:garden-1:infant"],
              expiresAtMs: 30_000,
            }));
            const duplicated = [
              ...retried,
              reservation({
                reservationId: "family:garden-1:pioneer-2:garden-2",
                pioneerId: "pioneer-2",
                agentIds: ["agent-global:garden-1:infant"],
                expiresAtMs: 30_000,
              }),
            ];
            assert.deepEqual(retried[0].agentIds, [
              "agent-global:garden-1:adult",
              "agent-global:garden-1:infant",
            ]);
            assert.equal(retried[0].expiresAtMs, 30_000);
            assert.equal(settlementFamilyReservedSlots(duplicated, "faction-a"), 2);
            assert.equal(settlementFamilyReservedSlots(duplicated, "faction-b"), 0);
          });
          '''))
          PY
      - name: Validate
        run: |
          git diff --check
          npm run build
      - name: Commit validated improvement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts src/settlement-family-reservation.ts tests/settlement-family-reservation.test.mjs
          git rm .github/workflows/moyo-family-capacity-once.yml .github/workflows/moyo-family-capacity-retry.yml
          git commit -m "sim: reserve family capacity while followers travel"
          git push origin HEAD:main
