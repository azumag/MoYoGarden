name: Apply demographic aging patch

on:
  push:
    branches:
      - main
    paths:
      - tools/apply-demographic-aging.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply patch
        run: node tools/apply-demographic-aging.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.ts src/demography.ts tests/population-aging.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "sim: add deterministic aging and natural death"
          git push origin HEAD:main
