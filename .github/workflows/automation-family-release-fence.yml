name: Automation family release fence

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: moyo-automation-family-release-fence
  cancel-in-progress: false

jobs:
  patch-validate-push:
    if: github.event.head_commit.message == 'ci: validate stale family release fence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fence stale family admission releases
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reservation = Path('src/settlement-family-reservation.ts')
          text = reservation.read_text()
          old = '''export function releaseSettlementFamilyAdmissionAgent(
            reservations: readonly SettlementFamilyAdmissionReservation[],
            agentId: string,
          ): SettlementFamilyAdmissionReservation[] {
            if (agentId.length === 0) return [...reservations];
            return reservations.flatMap((reservation) => {
              if (!reservation.agentIds.includes(agentId)) return [reservation];
              const agentIds = reservation.agentIds.filter((entry) => entry !== agentId);
              return agentIds.length > 0 ? [{ ...reservation, agentIds }] : [];
            });
          }
          '''
          new = '''export function releaseSettlementFamilyAdmissionAgent(
            reservations: readonly SettlementFamilyAdmissionReservation[],
            agentId: string,
            expiresAtCutoffMs: number,
          ): SettlementFamilyAdmissionReservation[] {
            // A release can cross a retry that refreshes the same stable follower's
            // admission lease. Refuse to erase any promise renewed after the source
            // issued this release; a bounded stale reservation is safer than silently
            // overbooking destination housing/food capacity.
            if (agentId.length === 0 || !Number.isFinite(expiresAtCutoffMs)) return [...reservations];
            return reservations.flatMap((reservation) => {
              if (
                !reservation.agentIds.includes(agentId)
                || reservation.expiresAtMs > expiresAtCutoffMs
              ) return [reservation];
              const agentIds = reservation.agentIds.filter((entry) => entry !== agentId);
              return agentIds.length > 0 ? [{ ...reservation, agentIds }] : [];
            });
          }
          '''
          if old not in text:
              raise SystemExit('release helper anchor not found')
          reservation.write_text(text.replace(old, new, 1))

          autonomy = Path('src/autonomy-region.ts')
          text = autonomy.read_text()

          old_validation = '''    || body.agentId.length > 192
              || !body.agentId.startsWith("agent-global:")
            ) {
              return new Response(JSON.stringify({ error: "agentId must be a world-global agent ID" }), { status: 400 });
            }

            const state = runtimeAccess(this).runtime.snapshot();
            const now = Date.now();
          '''
          new_validation = '''    || body.agentId.length > 192
              || !body.agentId.startsWith("agent-global:")
              || typeof body.releaseIssuedAtMs !== "number"
              || !Number.isFinite(body.releaseIssuedAtMs)
              || body.releaseIssuedAtMs <= 0
            ) {
              return new Response(JSON.stringify({
                error: "agentId must be a world-global agent ID and releaseIssuedAtMs must be finite",
              }), { status: 400 });
            }

            const state = runtimeAccess(this).runtime.snapshot();
            const now = Date.now();
            const reservationExpiresAtCutoffMs = body.releaseIssuedAtMs
              + SETTLEMENT_FAMILY_ADMISSION_RESERVATION_TTL_MS;
          '''
          if old_validation not in text:
              raise SystemExit('release validation anchor not found')
          text = text.replace(old_validation, new_validation, 1)

          old_call = '''    const next = releaseSettlementFamilyAdmissionAgent(
              normalized.reservations,
              body.agentId as string,
            );
          '''
          new_call = '''    const next = releaseSettlementFamilyAdmissionAgent(
              normalized.reservations,
              body.agentId as string,
              reservationExpiresAtCutoffMs,
            );
          '''
          if old_call not in text:
              raise SystemExit('release helper call anchor not found')
          text = text.replace(old_call, new_call, 1)

          body_anchor = 'body: JSON.stringify({ agentId }),' 
          if text.count(body_anchor) != 1:
              raise SystemExit(f'unexpected release request body count: {text.count(body_anchor)}')
          text = text.replace(
              body_anchor,
              'body: JSON.stringify({ agentId, releaseIssuedAtMs: Date.now() }),',
              1,
          )
          autonomy.write_text(text)

          Path('tests/settlement-family-reservation-release.test.mjs').write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { releaseSettlementFamilyAdmissionAgent } from "../dist-ts/src/settlement-family-reservation.js";

          const OLD_EXPIRY = 2_000_000_000_000;

          function reservation(id, agentIds, expiresAtMs = OLD_EXPIRY) {
            return {
              reservationId: id,
              sourceRegionId: "garden-1",
              pioneerId: "agent-global:garden-1:pioneer",
              factionId: "faction-1",
              agentIds,
              expiresAtMs,
            };
          }

          test("family admission release removes only the abandoned follower slot", () => {
            const abandoned = "agent-global:garden-1:child";
            const partner = "agent-global:garden-1:partner";
            const next = releaseSettlementFamilyAdmissionAgent(
              [reservation("family:1", [abandoned, partner])],
              abandoned,
              OLD_EXPIRY,
            );
            assert.equal(next.length, 1);
            assert.deepEqual(next[0].agentIds, [partner]);
          });

          test("family admission release drops an empty reservation and is idempotent", () => {
            const abandoned = "agent-global:garden-1:child";
            const first = releaseSettlementFamilyAdmissionAgent(
              [reservation("family:1", [abandoned])],
              abandoned,
              OLD_EXPIRY,
            );
            assert.deepEqual(first, []);
            assert.deepEqual(
              releaseSettlementFamilyAdmissionAgent(first, abandoned, OLD_EXPIRY),
              [],
            );
          });

          test("family admission release clears duplicate stale promises without touching other followers", () => {
            const abandoned = "agent-global:garden-1:child";
            const other = "agent-global:garden-1:other";
            const next = releaseSettlementFamilyAdmissionAgent([
              reservation("family:1", [abandoned, other]),
              reservation("family:2", [abandoned]),
            ], abandoned, OLD_EXPIRY);
            assert.equal(next.length, 1);
            assert.equal(next[0].reservationId, "family:1");
            assert.deepEqual(next[0].agentIds, [other]);
          });

          test("a delayed release cannot erase a family lease refreshed after it was issued", () => {
            const follower = "agent-global:garden-1:child";
            const releaseCutoff = OLD_EXPIRY;
            const refreshedExpiry = OLD_EXPIRY + 60_000;
            const next = releaseSettlementFamilyAdmissionAgent([
              reservation("family:old", [follower], OLD_EXPIRY),
              reservation("family:refreshed", [follower], refreshedExpiry),
            ], follower, releaseCutoff);

            assert.equal(next.length, 1);
            assert.equal(next[0].reservationId, "family:refreshed");
            assert.deepEqual(next[0].agentIds, [follower]);
            assert.equal(next[0].expiresAtMs, refreshedExpiry);
          });

          test("invalid release cutoffs fail closed instead of dropping capacity promises", () => {
            const follower = "agent-global:garden-1:child";
            const current = [reservation("family:1", [follower])];
            assert.deepEqual(
              releaseSettlementFamilyAdmissionAgent(current, follower, Number.NaN),
              current,
            );
          });
          '''.replace(/^          /gm, ''))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          npm run build

      - name: Commit validated product change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/automation-family-release-fence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sim: fence stale family admission releases'
          git push origin HEAD:main
