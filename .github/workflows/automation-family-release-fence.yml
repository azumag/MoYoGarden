name: Automation family release fence

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: moyo-automation-family-release-fence
  cancel-in-progress: false

jobs:
  patch-validate-push:
    if: github.event.head_commit.message == 'ci: validate stale family release fence'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch product code
        run: python3 .github/scripts/automation-family-release-fence.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          git diff --check
          npm run build

      - name: Commit validated product change
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/automation-family-release-fence.yml
          rm -f .github/scripts/automation-family-release-fence.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sim: fence stale family admission releases'
          git push origin HEAD:main
