name: Stage bounded pathogen retry improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-pathogen-retry-budget.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Patch bounded retry fan-out
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 .github/scripts/patch_pathogen_retry.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          set -euo pipefail
          npm run build
          git diff --check

      - name: Commit improvement and remove staging files
        run: |
          set -euo pipefail
          rm .github/workflows/automation-pathogen-retry-budget.yml
          rm .github/scripts/patch_pathogen_retry.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "perf: bound pathogen reservoir retry fan-out"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
