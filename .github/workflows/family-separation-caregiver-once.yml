name: Caregiver-aware migration scoring one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-separation-caregiver-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Apply caregiver-aware family separation scoring
        run: echo '' | base64 -d | python3
      - name: Validate
        run: npm run build
      - name: Commit implementation
        run: |
          git rm .github/workflows/family-separation-caregiver-once.yml
          git add src/settlement-migration.ts tests/settlement-family-pioneer.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sim: keep migration aware of living caregivers"
          git push origin HEAD:main
