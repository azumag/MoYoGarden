name: Caregiver-aware migration scoring one-shot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/family-separation-caregiver-once.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply caregiver-aware family separation scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/settlement-migration.ts")
          text = path.read_text()
          old = '''function familySeparationCost(state: WorldState, agent: Agent): number {
  let cost = 0;
  if (agent.pregnancy !== undefined && agent.pregnancy.dueAtTick > state.tick) {
    cost += 4;
  }
  for (const relative of state.agents) {
    if (
      relative.id === agent.id
      || relative.factionId !== agent.factionId
      || relative.hp <= 0
    ) {
      continue;
    }
    if (
      (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
      && relative.parents?.includes(agent.id)
    ) {
      cost += relative.lifeStage === "infant" ? 3 : 2;
    }
    if (
      relative.pregnancy?.partnerId === agent.id
      && relative.pregnancy.dueAtTick > state.tick
    ) {
      cost += 4;
    }
  }
  return cost;
}
'''
          new = '''function familySeparationCost(state: WorldState, agent: Agent): number {
  const livingSameFaction = new Set(
    state.agents
      .filter((relative) => relative.factionId === agent.factionId && relative.hp > 0)
      .map((relative) => relative.id),
  );
  let cost = 0;
  if (
    agent.pregnancy !== undefined
    && agent.pregnancy.dueAtTick > state.tick
    && livingSameFaction.has(agent.pregnancy.partnerId)
  ) {
    // Pregnancy itself travels with the gestational parent. Count separation
    // only when the living partner would actually remain in this region.
    cost += 4;
  }
  for (const relative of state.agents) {
    if (
      relative.id === agent.id
      || relative.factionId !== agent.factionId
      || relative.hp <= 0
    ) {
      continue;
    }
    if (
      (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
      && relative.parents?.includes(agent.id)
    ) {
      const alternateLivingParent = relative.parents.some((parentId) =>
        parentId !== agent.id && livingSameFaction.has(parentId)
      );
      // Leaving a dependent with another living parent is disruptive but still
      // safer than making the migration remove the child's only living parent.
      cost += relative.lifeStage === "infant"
        ? (alternateLivingParent ? 3 : 5)
        : (alternateLivingParent ? 2 : 3);
    }
    if (
      relative.pregnancy?.partnerId === agent.id
      && relative.pregnancy.dueAtTick > state.tick
    ) {
      cost += 4;
    }
  }
  return cost;
}
'''
          if old not in text:
            raise SystemExit("familySeparationCost anchor not found")
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/settlement-family-pioneer.test.mjs")
          test_text = test_path.read_text()
          marker = 'test("pregnancy does not count as separation when the partner is absent from the region"'
          if marker not in test_text:
            test_text += '''\n\ntest("pregnancy does not count as separation when the partner is absent from the region", () => {
  const state = migrationWorld();
  const template = state.agents.find((agent) => agent.role === "builder");
  assert.ok(template);
  const pregnant = migrationBuilder(template, "agent-a-pregnant", 95);
  pregnant.pregnancy = {
    partnerId: "agent-partner-already-away",
    conceivedAtTick: 10,
    dueAtTick: 100,
  };
  const unattached = migrationBuilder(template, "agent-z-unattached", 70);
  state.agents = [pregnant, unattached];

  const plan = planAutonomousSettlementMigration(state, frontierHalo());
  assert.ok(plan);
  assert.equal(plan.agentId, pregnant.id);
});

test("a sole living parent is costlier to migrate than a parent leaving a co-parent", () => {
  const state = migrationWorld();
  const template = state.agents.find((agent) => agent.role === "builder");
  assert.ok(template);
  const soleParent = migrationBuilder(template, "agent-a-sole-parent", 95);
  const coParentCandidate = migrationBuilder(template, "agent-z-coparent", 70);
  const residentCoParent = structuredClone(template);
  residentCoParent.id = "agent-resident-coparent";
  residentCoParent.autonomy = false;
  residentCoParent.energy = 80;
  residentCoParent.position = { x: 18, y: 11 };
  delete residentCoParent.task;
  delete residentCoParent.pregnancy;

  const soleChild = structuredClone(template);
  soleChild.id = "agent-sole-child";
  soleChild.autonomy = false;
  soleChild.lifeStage = "infant";
  soleChild.birthTick = 1;
  soleChild.position = { x: 19, y: 10 };
  soleChild.parents = [soleParent.id, "agent-missing-parent"];
  delete soleChild.task;
  delete soleChild.pregnancy;

  const sharedChild = structuredClone(template);
  sharedChild.id = "agent-shared-child";
  sharedChild.autonomy = false;
  sharedChild.lifeStage = "infant";
  sharedChild.birthTick = 1;
  sharedChild.position = { x: 20, y: 10 };
  sharedChild.parents = [coParentCandidate.id, residentCoParent.id];
  delete sharedChild.task;
  delete sharedChild.pregnancy;

  state.agents = [soleParent, coParentCandidate, residentCoParent, soleChild, sharedChild];

  const plan = planAutonomousSettlementMigration(state, frontierHalo());
  assert.ok(plan);
  assert.equal(plan.agentId, coParentCandidate.id);
});
'''
            test_path.write_text(test_text)
          PY
      - name: Validate
        run: npm run build
      - name: Commit implementation
        run: |
          git rm .github/workflows/family-separation-caregiver-once.yml
          git add src/settlement-migration.ts tests/settlement-family-pioneer.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "sim: keep migration aware of living caregivers"
          git push origin HEAD:main
