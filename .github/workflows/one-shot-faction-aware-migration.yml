name: One-shot faction-aware migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-faction-aware-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply faction-aware migration patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/hex-halo.ts",
              '''  // Optional during rolling deploys. This bounded observed-headroom map can\n  // contain zero for a faction whose active storage is known to be full. An\n  // omitted faction stays unknown (for example after top-N truncation).\n  storageHeadroomByFaction?: Record<string, number>;\n  passableCells: number;\n  occupants: number;\n''',
              '''  // Optional during rolling deploys. This bounded observed-headroom map can\n  // contain zero for a faction whose active storage is known to be full. An\n  // omitted faction stays unknown (for example after top-N truncation).\n  storageHeadroomByFaction?: Record<string, number>;\n  // Optional bounded population composition. Counts are whole-region residents,\n  // not remote Agent snapshots. Consumers must treat a missing faction as\n  // unknown unless the summarized counts add up to `occupants`, because top-N\n  // truncation can omit small factions in highly mixed regions.\n  occupantsByFaction?: Record<string, number>;\n  passableCells: number;\n  occupants: number;\n''')

          replace_once(
              "src/hex-halo.ts",
              '''          ...(observed.regionSummary.storageHeadroomByFaction === undefined ? {} : {\n            storageHeadroomByFaction: { ...observed.regionSummary.storageHeadroomByFaction },\n          }),\n          passableCells: observed.regionSummary.passableCells,\n''',
              '''          ...(observed.regionSummary.storageHeadroomByFaction === undefined ? {} : {\n            storageHeadroomByFaction: { ...observed.regionSummary.storageHeadroomByFaction },\n          }),\n          ...(observed.regionSummary.occupantsByFaction === undefined ? {} : {\n            occupantsByFaction: { ...observed.regionSummary.occupantsByFaction },\n          }),\n          passableCells: observed.regionSummary.passableCells,\n''')

          replace_once(
              "src/halo-region.ts",
              '''const MAX_SUMMARIZED_STORAGE_FACTIONS = 8;\n''',
              '''const MAX_SUMMARIZED_STORAGE_FACTIONS = 8;\nconst MAX_SUMMARIZED_OCCUPANT_FACTIONS = 8;\n''')

          replace_once(
              "src/halo-region.ts",
              '''    const storageHeadroomByFaction = Object.fromEntries(\n      [...storageHeadroom.entries()]\n        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n        .slice(0, MAX_SUMMARIZED_STORAGE_FACTIONS),\n    );\n    let passableCells = 0;\n''',
              '''    const storageHeadroomByFaction = Object.fromEntries(\n      [...storageHeadroom.entries()]\n        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n        .slice(0, MAX_SUMMARIZED_STORAGE_FACTIONS),\n    );\n    const occupantCounts = new Map<string, number>();\n    for (const agent of state.agents) {\n      occupantCounts.set(\n        agent.factionId,\n        (occupantCounts.get(agent.factionId) ?? 0) + 1,\n      );\n    }\n    const occupantsByFaction = Object.fromEntries(\n      [...occupantCounts.entries()]\n        .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))\n        .slice(0, MAX_SUMMARIZED_OCCUPANT_FACTIONS),\n    );\n    let passableCells = 0;\n''')

          replace_once(
              "src/halo-region.ts",
              '''      activeStructures,\n      storageHeadroomByFaction,\n      passableCells,\n      occupants: state.agents.length,\n''',
              '''      activeStructures,\n      storageHeadroomByFaction,\n      occupantsByFaction,\n      passableCells,\n      occupants: state.agents.length,\n''')

          replace_once(
              "src/settlement-migration.ts",
              '''interface SettlementSeamCandidate {\n  entry: HexHaloTile;\n  distance: number;\n  pathCrowding: number;\n  crowding: number;\n  support: SettlementNeighborSupport;\n  factionStorageHeadroom: number | undefined;\n}\n''',
              '''interface SettlementFactionOccupancy {\n  own: number;\n  foreign: number;\n}\n\ninterface SettlementSeamCandidate {\n  entry: HexHaloTile;\n  distance: number;\n  pathCrowding: number;\n  crowding: number;\n  support: SettlementNeighborSupport;\n  factionStorageHeadroom: number | undefined;\n  factionOccupancy: SettlementFactionOccupancy | undefined;\n}\n''')

          replace_once(
              "src/settlement-migration.ts",
              '''function compareSettlementStorageHeadroom(\n  a: number | undefined,\n  b: number | undefined,\n): number {\n  const preferenceDelta = settlementStorageHeadroomPreference(b)\n    - settlementStorageHeadroomPreference(a);\n  if (preferenceDelta !== 0) return preferenceDelta;\n  if (a === undefined || b === undefined) return 0;\n  return b - a;\n}\n\nfunction haloRegionFactionStorageHeadroom(\n''',
              '''function compareSettlementStorageHeadroom(\n  a: number | undefined,\n  b: number | undefined,\n): number {\n  const preferenceDelta = settlementStorageHeadroomPreference(b)\n    - settlementStorageHeadroomPreference(a);\n  if (preferenceDelta !== 0) return preferenceDelta;\n  if (a === undefined || b === undefined) return 0;\n  return b - a;\n}\n\nfunction sameFactionOccupancy(\n  a: SettlementFactionOccupancy | undefined,\n  b: SettlementFactionOccupancy | undefined,\n): number {\n  if (a === undefined || b === undefined) return 0;\n  // Whole-region population density is already compared as ecological pressure.\n  // When that total pressure ties, prefer fewer foreign residents and then an\n  // existing same-faction foothold. This is a soft tie-break: richer/safer land\n  // still wins, and rolling summaries without composition remain neutral.\n  return a.foreign - b.foreign\n    || Number(b.own > 0) - Number(a.own > 0);\n}\n\nfunction haloRegionFactionOccupancy(\n  halo: readonly HexHaloTile[],\n  neighborRegionId: string,\n  factionId: string,\n): SettlementFactionOccupancy | undefined {\n  let observation: { occupants: number; counts: Record<string, number> } | undefined;\n  for (const entry of halo) {\n    if (entry.neighborRegionId !== neighborRegionId) continue;\n    const summary = entry.neighborRegionSummary;\n    const counts = summary?.occupantsByFaction;\n    if (summary === undefined || counts === undefined) continue;\n    if (!Number.isInteger(summary.occupants) || summary.occupants < 0) continue;\n    const entries = Object.entries(counts);\n    if (entries.some(([, count]) => !Number.isInteger(count) || count < 0)) continue;\n    const summarized = entries.reduce((sum, [, count]) => sum + count, 0);\n    if (summarized > summary.occupants) continue;\n    if (observation !== undefined) {\n      const previousEntries = Object.entries(observation.counts);\n      if (\n        observation.occupants !== summary.occupants\n        || previousEntries.length !== entries.length\n        || previousEntries.some(([id, count]) => counts[id] !== count)\n      ) {\n        // Independent edge reads can straddle a remote tick. Mixed population\n        // composition is not a coherent observation, so keep this tie-break\n        // neutral rather than manufacturing a faction balance.\n        return undefined;\n      }\n      continue;\n    }\n    observation = { occupants: summary.occupants, counts };\n  }\n  if (observation === undefined) return undefined;\n  const own = observation.counts[factionId];\n  const summarized = Object.values(observation.counts).reduce((sum, count) => sum + count, 0);\n  // Absence means zero only when the bounded summary is complete. Otherwise the\n  // faction may simply have fallen below the top-N export cutoff.\n  if (own === undefined && summarized !== observation.occupants) return undefined;\n  const ownCount = own ?? 0;\n  return { own: ownCount, foreign: Math.max(0, observation.occupants - ownCount) };\n}\n\nfunction haloRegionFactionStorageHeadroom(\n''')

          replace_once(
              "src/settlement-migration.ts",
              '''    compareSettlementSupport(a.support, b.support)\n    // Only after ecological support and existing development tie, prefer a\n''',
              '''    compareSettlementSupport(a.support, b.support)\n    || sameFactionOccupancy(a.factionOccupancy, b.factionOccupancy)\n    // Only after ecological support and existing development tie, prefer a\n''')

          # The same comparator prefix appears twice; patch the second one too.
          p = Path("src/settlement-migration.ts")
          text = p.read_text()
          old = '''    compareSettlementSupport(a.support, b.support)\n    // Only after ecological support and existing development tie, prefer a\n'''
          if text.count(old) != 1:
              raise SystemExit(f"src/settlement-migration.ts: expected second comparator match, got {text.count(old)}")
          p.write_text(text.replace(old, '''    compareSettlementSupport(a.support, b.support)\n    || sameFactionOccupancy(a.factionOccupancy, b.factionOccupancy)\n    // Only after ecological support and existing development tie, prefer a\n''', 1))

          replace_once(
              "src/settlement-migration.ts",
              '''        factionStorageHeadroom: haloRegionFactionStorageHeadroom(\n          halo,\n          entry.neighborRegionId,\n          agent.factionId,\n        ),\n      };\n''',
              '''        factionStorageHeadroom: haloRegionFactionStorageHeadroom(\n          halo,\n          entry.neighborRegionId,\n          agent.factionId,\n        ),\n        factionOccupancy: haloRegionFactionOccupancy(\n          halo,\n          entry.neighborRegionId,\n          agent.factionId,\n        ),\n      };\n''')

          test_path = Path("tests/settlement-migration-faction-occupancy.test.mjs")
          test_path.write_text(r'''import assert from "node:assert/strict";
import test from "node:test";
import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
import { planAutonomousSettlementMigration } from "../dist-ts/src/settlement-migration.js";
import { createInitialWorld } from "../dist-ts/src/world.js";

function fixture() {
  const state = createInitialWorld({ seed: 260916, width: 40, height: 24 });
  for (const tile of state.tiles) {
    if (!isHexGridCell(state, tile)) continue;
    tile.terrain = "plain";
    delete tile.resource;
  }
  const builder = state.agents.find((agent) => agent.role === "builder");
  assert.ok(builder);
  state.agents = [builder];
  state.structures = [];
  state.tick = 25;
  builder.autonomy = true;
  builder.energy = 100;
  builder.position = { x: 19, y: 11 };
  builder.inventory = { wood: 8, stone: 4, food: 0 };
  builder.task = {
    source: "autonomy",
    issuedAtTick: state.tick,
    type: "build",
    structureType: "camp",
  };
  for (let index = 0; index < 9; index += 1) {
    const resident = structuredClone(builder);
    resident.id = `resident-${index}`;
    resident.autonomy = false;
    delete resident.task;
    state.agents.push(resident);
  }
  return { state, builder };
}

function candidate(direction, sourcePosition, regionId, neighborPosition, summary) {
  return {
    direction,
    sourcePosition,
    neighborRegionId: regionId,
    neighborPosition,
    tile: {
      ...neighborPosition,
      terrain: "plain",
      elevation: 0.5,
    },
    neighborRegionSummary: summary,
  };
}

function summary(occupants, occupantsByFaction) {
  return {
    resources: { wood: 0, stone: 0, food: 0 },
    resourceCapacity: { wood: 0, stone: 0, food: 0 },
    activeStructures: { camp: 0, storehouse: 0, market: 0, workshop: 0 },
    passableCells: 100,
    occupants,
    ...(occupantsByFaction === undefined ? {} : { occupantsByFaction }),
  };
}

test("migration prefers a same-faction foothold when total pressure and ecology tie", () => {
  const { state, builder } = fixture();
  const seam = { x: 30, y: 11 };
  const plan = planAutonomousSettlementMigration(state, [
    candidate(
      "E",
      seam,
      "hex-q1-r0",
      { x: 8, y: 11 },
      summary(2, { [builder.factionId]: 1, rival: 1 }),
    ),
    candidate(
      "W",
      seam,
      "hex-q-1-r0",
      { x: 30, y: 11 },
      summary(2, { rival: 2 }),
    ),
  ]);

  assert.ok(plan);
  assert.equal(plan.agentId, builder.id);
  assert.equal(plan.neighborRegionId, "hex-q1-r0");
  assert.equal(plan.direction, "E");
});

test("truncated faction composition stays neutral when the pioneer faction is omitted", () => {
  const { state, builder } = fixture();
  const seam = { x: 30, y: 11 };
  const plan = planAutonomousSettlementMigration(state, [
    candidate(
      "E",
      seam,
      "hex-q1-r0",
      { x: 8, y: 11 },
      summary(3, { rival: 2 }),
    ),
    candidate(
      "W",
      seam,
      "hex-q-1-r0",
      { x: 30, y: 11 },
      summary(3, { rival: 3 }),
    ),
  ]);

  assert.ok(plan);
  assert.equal(plan.agentId, builder.id);
  assert.equal(
    plan.neighborRegionId,
    "hex-q1-r0",
    "an omitted faction in an incomplete top-N summary must not be treated as zero residents",
  );
});
''')
          PY
      - name: Validate
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex-halo.ts src/halo-region.ts src/settlement-migration.ts tests/settlement-migration-faction-occupancy.test.mjs
          git commit -m "sim: make settlement migration faction-aware"
          git push origin main
