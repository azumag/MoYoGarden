name: One-shot faction-aware migration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-faction-aware-migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Apply faction-aware migration patch
        run: python3 .github/scripts/apply-faction-aware-migration.py
      - name: Complete faction occupancy wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/settlement-migration.ts")
          text = path.read_text()
          old = '''      support: candidate.support,\n      factionStorageHeadroom: candidate.factionStorageHeadroom,\n    };\n'''
          new = '''      support: candidate.support,\n      factionStorageHeadroom: candidate.factionStorageHeadroom,\n      factionOccupancy: candidate.factionOccupancy,\n    };\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one plan candidate match, got {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/settlement-migration-faction-occupancy.test.mjs")
          test_text = test_path.read_text()
          replacements = {
              'summary(3, { rival: 2 })': 'summary(2, { rival: 1 })',
              'summary(3, { rival: 3 })': 'summary(2, { rival: 2 })',
          }
          for old_test, new_test in replacements.items():
              if test_text.count(old_test) != 1:
                  raise SystemExit(f"expected one test fixture match for {old_test!r}")
              test_text = test_text.replace(old_test, new_test, 1)

          marker = '''test("truncated faction composition stays neutral when the pioneer faction is omitted", () => {\n  const { state, builder } = fixture();\n  const seam = { x: 30, y: 11 };\n  const plan = planAutonomousSettlementMigration(state, [\n'''
          expanded = '''test("truncated faction composition stays neutral when the pioneer faction is omitted", () => {\n  const { state, builder } = fixture();\n  const seam = { x: 30, y: 11 };\n  const baseline = planAutonomousSettlementMigration(state, [\n    candidate(\n      "E",\n      seam,\n      "hex-q1-r0",\n      { x: 8, y: 11 },\n      summary(2),\n    ),\n    candidate(\n      "W",\n      seam,\n      "hex-q-1-r0",\n      { x: 30, y: 11 },\n      summary(2),\n    ),\n  ]);\n  assert.ok(baseline);\n  const plan = planAutonomousSettlementMigration(state, [\n'''
          if test_text.count(marker) != 1:
              raise SystemExit("expected one truncated-summary test marker")
          test_text = test_text.replace(marker, expanded, 1)
          old_assert = '''  assert.equal(\n    plan.neighborRegionId,\n    "hex-q1-r0",\n    "an omitted faction in an incomplete top-N summary must not be treated as zero residents",\n  );\n'''
          new_assert = '''  assert.equal(\n    plan.neighborRegionId,\n    baseline.neighborRegionId,\n    "an omitted faction in an incomplete top-N summary must remain neutral",\n  );\n'''
          if test_text.count(old_assert) != 1:
              raise SystemExit("expected one truncated-summary assertion")
          test_path.write_text(test_text.replace(old_assert, new_assert, 1))
          PY
      - name: Validate
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: faction-aware-migration-build-log
          path: build.log
      - name: Commit implementation and remove one-shot helpers
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hex-halo.ts src/halo-region.ts src/settlement-migration.ts tests/settlement-migration-faction-occupancy.test.mjs
          git rm .github/scripts/apply-faction-aware-migration.py .github/workflows/one-shot-faction-aware-migration.yml
          git commit -m "sim: make settlement migration faction-aware"
          git push origin main
