name: One-shot stale region request guard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-stale-region-requests.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply product patch
        run: python scripts/automation-stale-region-requests.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          npm run build
          git diff --check

      - name: Commit validated product change
        run: |
          rm .github/workflows/automation-stale-region-requests.yml
          rm scripts/automation-stale-region-requests.py
          git add public/app.js tests/seamless-region-transition.test.mjs .github/workflows/automation-stale-region-requests.yml scripts/automation-stale-region-requests.py
          git diff --cached --check
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git commit -m "fix: ignore stale region loading responses"
          git push origin HEAD:main
