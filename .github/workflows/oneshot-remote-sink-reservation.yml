name: One-shot remote sink reservation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-remote-sink-reservation.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Patch reservation lifecycle and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/autonomy-region.ts')
          source = source_path.read_text()

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, found {count}: {old[:120]!r}')
              source = source.replace(old, new, 1)

          replace_once(
          '''  returnToSourceStorage?: boolean;
            settlementMigration?: boolean;
            settlementFamilyFollow?: boolean;
          }''',
          '''  returnToSourceStorage?: boolean;
            destinationStorageReserved?: boolean;
            settlementMigration?: boolean;
            settlementFamilyFollow?: boolean;
          }''')

          replace_once(
          '''  gatheredAmount?: number;
            settledAmount?: number;
            returnToSourceStorage?: boolean;
          }''',
          '''  gatheredAmount?: number;
            settledAmount?: number;
            returnToSourceStorage?: boolean;
            // True when the destination DO admitted concrete storage headroom for
            // this expedition. Keep the slot until the gathered cargo actually
            // leaves the arriving BOT inventory, not merely until gathering ends.
            destinationStorageReserved?: boolean;
          }''')

          replace_once(
          '''    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean");
          }''',
          '''    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")
            && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");
          }''')

          replace_once(
          '''      ...(claimId === undefined ? {} : { claimId }),
                ...(candidate.claim?.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
              };''',
          '''      ...(claimId === undefined ? {} : { claimId }),
                ...(candidate.claim?.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
                ...(candidate.claim?.destinationStorageReserved === true
                  ? { destinationStorageReserved: true }
                  : {}),
              };''')

          old_release = '''  private async releaseDestinationStorage(request: Request): Promise<Response> {
            let body: unknown;
            try {
              body = await request.json();
            } catch {
              return new Response(JSON.stringify({ error: "request body must be valid JSON" }), { status: 400 });
            }
            if (
              !isRecord(body)
              || typeof body.claimId !== "string"
              || body.claimId.trim() === ""
              || typeof body.sourceRegionId !== "string"
              || !isAutonomyClaimSourceRegionId(configuredRegionIds(this.autonomyEnv), body.sourceRegionId)
            ) {
              return new Response(JSON.stringify({ error: "claimId and sourceRegionId are required" }), {
                status: 400,
              });
            }
            const claimId = body.claimId;
            const sourceRegionId = body.sourceRegionId;
            const now = Date.now();
            await this.autonomyState.blockConcurrencyWhile(async () => {
              const stored = await this.autonomyState.storage.get<unknown>(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY);
              const reservations = Array.isArray(stored)
                ? stored
                  .filter(isDestinationStorageReservation)
                  .filter((entry) => entry.expiresAtMs > now)
                : [];
              const next = reservations.filter((entry) =>
                entry.claimId !== claimId || entry.sourceRegionId !== sourceRegionId
              );
              if (!Array.isArray(stored) || next.length !== stored.length) {
                await this.autonomyState.storage.put(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY, next);
              }
            });
            return new Response(JSON.stringify({ ok: true, claimId: body.claimId }), {
              headers: { "content-type": "application/json; charset=utf-8" },
            });
          }'''
          new_release = '''  private async releaseDestinationStorageReservation(
            claimId: string,
            sourceRegionId: string,
          ): Promise<void> {
            const now = Date.now();
            await this.autonomyState.blockConcurrencyWhile(async () => {
              const stored = await this.autonomyState.storage.get<unknown>(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY);
              const reservations = Array.isArray(stored)
                ? stored
                  .filter(isDestinationStorageReservation)
                  .filter((entry) => entry.expiresAtMs > now)
                : [];
              const next = reservations.filter((entry) =>
                entry.claimId !== claimId || entry.sourceRegionId !== sourceRegionId
              );
              if (!Array.isArray(stored) || next.length !== stored.length) {
                await this.autonomyState.storage.put(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY, next);
              }
            });
          }

          private async releaseDestinationStorage(request: Request): Promise<Response> {
            let body: unknown;
            try {
              body = await request.json();
            } catch {
              return new Response(JSON.stringify({ error: "request body must be valid JSON" }), { status: 400 });
            }
            if (
              !isRecord(body)
              || typeof body.claimId !== "string"
              || body.claimId.trim() === ""
              || typeof body.sourceRegionId !== "string"
              || !isAutonomyClaimSourceRegionId(configuredRegionIds(this.autonomyEnv), body.sourceRegionId)
            ) {
              return new Response(JSON.stringify({ error: "claimId and sourceRegionId are required" }), {
                status: 400,
              });
            }
            await this.releaseDestinationStorageReservation(body.claimId, body.sourceRegionId);
            return new Response(JSON.stringify({ ok: true, claimId: body.claimId }), {
              headers: { "content-type": "application/json; charset=utf-8" },
            });
          }'''
          replace_once(old_release, new_release)

          replace_once(
          '''      !isResourceKind(body.resource) ||
                (body.returnToSourceStorage !== undefined && typeof body.returnToSourceStorage !== "boolean")
              ) {''',
          '''      !isResourceKind(body.resource) ||
                (body.returnToSourceStorage !== undefined && typeof body.returnToSourceStorage !== "boolean") ||
                (body.destinationStorageReserved !== undefined && typeof body.destinationStorageReserved !== "boolean")
              ) {''')

          replace_once(
          '''      settledAmount: existing?.settledAmount ?? 0,
                returnToSourceStorage: existing?.returnToSourceStorage ?? body.returnToSourceStorage === true,
              };''',
          '''      settledAmount: existing?.settledAmount ?? 0,
                returnToSourceStorage: existing?.returnToSourceStorage ?? body.returnToSourceStorage === true,
                destinationStorageReserved:
                  existing?.destinationStorageReserved ?? body.destinationStorageReserved === true,
              };''')

          replace_once(
          '''          resource: pending.resource,
                    ...(pending.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
                  }),''',
          '''          resource: pending.resource,
                    ...(pending.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
                    ...(pending.destinationStorageReserved === true
                      ? { destinationStorageReserved: true }
                      : {}),
                  }),''')

          marker = '''      if (reservationExhausted) {
                dirty = true;
                continue;
              }
              if (stillGathering) {
                keep.push(updatedClaim);
                continue;
              }
          '''
          replacement = '''      if (stillGathering) {
                keep.push(updatedClaim);
                continue;
              }

              // A remote sink reservation protects physical storage, not just the
              // gather phase. Keep it while any cargo produced by this expedition
              // is still carried by the arriving BOT; otherwise another source can
              // reserve the same slots before the local deposit actually commits.
              const destinationCargoOutstanding =
                updatedClaim.destinationStorageReserved === true
                && gatheredAmount > 0
                && agent !== undefined
                && agent.inventory[updatedClaim.resource] > 0;
              if (destinationCargoOutstanding) {
                keep.push(updatedClaim);
                continue;
              }
              if (updatedClaim.destinationStorageReserved === true) {
                await this.releaseDestinationStorageReservation(
                  updatedClaim.claimId,
                  updatedClaim.sourceRegionId,
                );
                dirty = true;
              }

              if (reservationExhausted) {
                dirty = true;
                continue;
              }
          '''
          replace_once(marker, replacement)

          replace_once(
          '''          ...(plan.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
                };''',
          '''          ...(plan.returnToSourceStorage === true ? { returnToSourceStorage: true } : {}),
                  ...(plan.destinationStorageReserved === true
                    ? { destinationStorageReserved: true }
                    : {}),
                };''')

          source_path.write_text(source)

          test_path = Path('tests/autonomous-concurrent-travel-do.test.mjs')
          tests = test_path.read_text()
          test_name = 'remote sink reservation remains until gathered cargo leaves the arriving inventory'
          if test_name in tests:
              raise SystemExit('regression test already present')
          tests += r'''

          test("remote sink reservation remains until gathered cargo leaves the arriving inventory", async () => {
            const env = environment();
            await assignRegion(env, "garden-1");
            const destination = await assignRegion(env, "garden-2");
            let state = destination.object.runtime.snapshot();
            const agent = state.agents[0];
            assert.ok(agent);
            agent.autonomy = true;
            agent.role = "woodcutter";
            agent.capacity = 10;
            agent.energy = 100;
            agent.inventory = { wood: 2, stone: 0, food: 0 };
            agent.task = {
              source: "autonomy",
              issuedAtTick: state.tick,
              type: "gather",
              resource: "wood",
            };
            const factionId = agent.factionId;

            for (const structure of state.structures) {
              if (structure.factionId !== factionId || structure.status !== "active") continue;
              structure.storage = {
                wood: BUILD_RECIPES[structure.type].storageCapacity,
                stone: 0,
                food: 0,
              };
            }
            state.structures.push({
              id: "reserved-arrival-storehouse",
              factionId,
              type: "storehouse",
              position: hexGridCenter(state),
              status: "active",
              progress: 1,
              requiredProgress: 1,
              storage: { wood: BUILD_RECIPES.storehouse.storageCapacity - 2, stone: 0, food: 0 },
            });
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            const reservationResponse = await destination.object.fetch(new Request(
              "https://moyo.internal/api/internal/autonomy/storage/reserve",
              {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-moyo-region-internal": "garden-2",
                },
                body: JSON.stringify({
                  claimId: "remote-sink-cargo",
                  sourceRegionId: "garden-1",
                  factionId,
                  amount: 2,
                }),
              },
            ));
            assert.equal(reservationResponse.status, 200);
            assert.equal((await reservationResponse.json()).grantedAmount, 2);

            const arrivalResponse = await destination.object.fetch(new Request(
              "https://moyo.internal/api/internal/autonomy/claim/register",
              {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-moyo-region-internal": "garden-2",
                },
                body: JSON.stringify({
                  claimId: "remote-sink-cargo",
                  sourceRegionId: "garden-1",
                  agentId: agent.id,
                  resource: "wood",
                  destinationStorageReserved: true,
                }),
              },
            ));
            assert.equal(arrivalResponse.status, 200);
            const registered = await destination.state.storage.get(ARRIVAL_CLAIMS_KEY);
            assert.equal(registered[0].destinationStorageReserved, true);
            registered[0].gatheredAmount = 2;
            registered[0].settledAmount = 2;
            await destination.state.storage.put(ARRIVAL_CLAIMS_KEY, registered);

            state = destination.object.runtime.snapshot();
            const carrying = state.agents.find((entry) => entry.id === agent.id);
            assert.ok(carrying);
            carrying.autonomy = false;
            delete carrying.task;
            for (const structure of state.structures) {
              if (structure.factionId !== factionId || structure.status !== "active") continue;
              structure.storage = {
                wood: BUILD_RECIPES[structure.type].storageCapacity,
                stone: 0,
                food: 0,
              };
            }
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            await destination.object.alarm();
            assert.equal((await destination.state.storage.get(DESTINATION_STORAGE_RESERVATIONS_KEY)).length, 1);
            assert.equal((await destination.state.storage.get(ARRIVAL_CLAIMS_KEY)).length, 1);

            state = destination.object.runtime.snapshot();
            const delivered = state.agents.find((entry) => entry.id === agent.id);
            assert.ok(delivered);
            delivered.inventory.wood = 0;
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            await destination.object.alarm();
            assert.deepEqual(await destination.state.storage.get(DESTINATION_STORAGE_RESERVATIONS_KEY), []);
            assert.deepEqual(await destination.state.storage.get(ARRIVAL_CLAIMS_KEY), []);
          });
          '''
          test_path.write_text(tests)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Full build and tests
        run: npm run build
      - name: Commit implementation directly to main
        shell: bash
        run: |
          rm .github/workflows/oneshot-remote-sink-reservation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomous-concurrent-travel-do.test.mjs .github/workflows/oneshot-remote-sink-reservation.yml
          git commit -m 'sim: retain remote storage reservations through delivery'
          git push origin HEAD:main
