name: One-shot building access and population fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-building-access-population.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect production population
        run: |
          node -e '(async()=>{for(const region of ["garden-1","garden-2","garden-3"]){try{const r=await fetch(`https://moyo.bluemoon.works/api/world/snapshot?region=${region}`,{headers:{"cache-control":"no-cache"}});if(!r.ok){console.log(`POP ${region} http=${r.status}`);continue;}const s=await r.json();const a=Array.isArray(s.agents)?s.agents:[];const generated=a.filter(x=>String(x.id??"").includes("-generation-")).length;const camps=Array.isArray(s.structures)?s.structures.filter(x=>x.type==="camp"&&x.status==="active").length:0;const factions={};for(const x of a)factions[x.factionId]=(factions[x.factionId]??0)+1;console.log(`POP ${region} tick=${s.tick} agents=${a.length} generated=${generated} camps=${camps} factions=${JSON.stringify(factions)}`);}catch(e){console.log(`POP ${region} error=${e instanceof Error?e.message:String(e)}`);}}})()'

      - name: Apply focused simulation changes
        run: python .github/scripts/one-shot-building-access-population.py

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full validation
        run: npm run build

      - name: Commit verified changes to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-building-access-population.yml
          git rm .github/scripts/one-shot-building-access-population.py
          git add src/runtime.ts src/simulation.ts tests/population-housing-capacity.test.mjs tests/simulation.test.mjs tests/population-growth-cadence.test.mjs tests/simulation-building-access.test.mjs
          git commit -m "sim: preserve building access and slow population growth"
          git push origin HEAD:main
