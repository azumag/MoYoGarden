name: Dependent caregiver follow one-shot

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dependent-caregiver-follow-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply dependent caregiver follow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/runtime.ts")
          text = path.read_text()
          old_import = 'import { applyPopulationAging } from "./demography.js";\n'
          new_import = 'import { applyPopulationAging, dependentCaregiverId } from "./demography.js";\nimport { hexGridDistance } from "./hex-grid.js";\n'
          if old_import not in text:
              raise SystemExit("demography import anchor not found")
          text = text.replace(old_import, new_import, 1)

          old_constant = 'const POPULATION_RESIDENT_CAPACITY_PER_CAMP = 6;\n'
          new_constant = old_constant + 'const POPULATION_DEPENDENT_CARE_RADIUS = 1;\n'
          if old_constant not in text:
              raise SystemExit("population constant anchor not found")
          text = text.replace(old_constant, new_constant, 1)

          anchor = '''function applyAutonomousNeeds(\n  state: WorldState,\n  commandedAgentIds: ReadonlySet<string>,\n): Map<string, string> {\n'''
          helper = '''function applyDependentCaregiverFollow(\n  state: WorldState,\n  commandedAgentIds: ReadonlySet<string>,\n): void {\n  const dependents = [...state.agents]\n    .filter((agent) =>\n      agent.hp > 0 &&\n      (agent.lifeStage === "infant" || agent.lifeStage === "juvenile")\n    )\n    .sort((a, b) => a.id.localeCompare(b.id));\n\n  for (const dependent of dependents) {\n    // Explicit commands remain authoritative. Dependent following is only a\n    // low-level autonomous care behavior, not a replacement for the command API.\n    if (commandedAgentIds.has(dependent.id) || dependent.task?.source === "external") continue;\n\n    const caregiverId = dependentCaregiverId(state, dependent);\n    const caregiver = caregiverId === undefined ? undefined : getAgent(state, caregiverId);\n    if (caregiver === undefined) continue;\n\n    const distance = hexGridDistance(dependent.position, caregiver.position);\n    if (distance <= POPULATION_DEPENDENT_CARE_RADIUS) {\n      // Non-autonomous dependents do not receive normal worker autonomy tasks, so\n      // an autonomous move here can only be the bounded caregiver-follow intent.\n      if (dependent.task?.source === "autonomy" && dependent.task.type === "move") {\n        delete dependent.task;\n      }\n      continue;\n    }\n\n    dependent.task = {\n      source: "autonomy",\n      issuedAtTick: state.tick,\n      type: "move",\n      target: { ...caregiver.position },\n    };\n    dependent.status = `following caregiver ${caregiver.name}`;\n  }\n}\n\n'''
          if anchor not in text:
              raise SystemExit("applyAutonomousNeeds anchor not found")
          text = text.replace(anchor, helper + anchor, 1)

          old_tick = '''    const commandedAgentIds = new Set(commands.map((command) => command.agentId));\n    const fedAgents = applyAutonomousNeeds(this.#state, commandedAgentIds);\n'''
          new_tick = '''    const commandedAgentIds = new Set(commands.map((command) => command.agentId));\n    applyDependentCaregiverFollow(this.#state, commandedAgentIds);\n    const fedAgents = applyAutonomousNeeds(this.#state, commandedAgentIds);\n'''
          if old_tick not in text:
              raise SystemExit("tick anchor not found")
          text = text.replace(old_tick, new_tick, 1)
          path.write_text(text)
          PY

          cat > tests/dependent-caregiver-follow.test.mjs <<'TEST'
          import test from "node:test";
          import assert from "node:assert/strict";
          import {
            HEX_GRID_DIRECTION_STEPS,
            hexGridDistance,
            isHexGridCell,
          } from "../dist-ts/src/hex-grid.js";
          import { WorldRuntime } from "../dist-ts/src/runtime.js";
          import { createInitialWorld, isPassable } from "../dist-ts/src/world.js";

          function setupFamily() {
            const state = createInitialWorld({
              worldId: "dependent-follow-test",
              regionId: "garden-1",
              seed: 77123,
              width: 40,
              height: 24,
            });
            for (const agent of state.agents) {
              agent.autonomy = false;
              delete agent.task;
            }

            const caregiver = state.agents[0];
            assert.ok(caregiver);
            const cells = state.tiles.filter((tile) =>
              isHexGridCell(state, tile) && isPassable(state, tile)
            );
            const caregiverCell = cells[0];
            assert.ok(caregiverCell);
            const dependentCell = cells.find((tile) =>
              hexGridDistance(tile, caregiverCell) >= 5
            );
            assert.ok(dependentCell);
            caregiver.position = { x: caregiverCell.x, y: caregiverCell.y };
            caregiver.energy = 90;

            const dependent = {
              id: "agent-dependent-follow-test",
              name: "Young Follower",
              factionId: caregiver.factionId,
              role: "forager",
              position: { x: dependentCell.x, y: dependentCell.y },
              hp: 100,
              energy: 70,
              capacity: 8,
              inventory: { wood: 0, stone: 0, food: 0 },
              autonomy: false,
              goal: "Grow safely before joining settlement work",
              status: "infant; dependent on parents",
              birthTick: 0,
              lifeStage: "infant",
              parents: [caregiver.id, "missing-parent"],
            };
            state.agents.push(dependent);
            return { state, caregiver, dependent };
          }

          test("dependent takes one hex step toward its current caregiver", () => {
            const { state, caregiver, dependent } = setupFamily();
            const before = hexGridDistance(dependent.position, caregiver.position);

            const next = new WorldRuntime({ state }).tick().state;
            const moved = next.agents.find((agent) => agent.id === dependent.id);
            const residentCaregiver = next.agents.find((agent) => agent.id === caregiver.id);
            assert.ok(moved);
            assert.ok(residentCaregiver);
            assert.equal(hexGridDistance(moved.position, residentCaregiver.position), before - 1);
            assert.equal(moved.autonomy, false);
          });

          test("dependent caregiver follow never overrides an external task", () => {
            const { state, caregiver, dependent } = setupFamily();
            const outward = Object.values(HEX_GRID_DIRECTION_STEPS)
              .map((step) => ({
                x: dependent.position.x + step.x,
                y: dependent.position.y + step.y,
              }))
              .find((candidate) =>
                isPassable(state, candidate) &&
                hexGridDistance(candidate, caregiver.position) >
                  hexGridDistance(dependent.position, caregiver.position)
              );
            assert.ok(outward);
            dependent.task = {
              source: "external",
              issuedAtTick: state.tick,
              type: "move",
              target: { ...outward },
            };

            const next = new WorldRuntime({ state }).tick().state;
            const moved = next.agents.find((agent) => agent.id === dependent.id);
            assert.ok(moved);
            assert.deepEqual(moved.position, outward);
          });

          test("dependent already beside its caregiver does not get a follow move", () => {
            const { state, caregiver, dependent } = setupFamily();
            const adjacent = Object.values(HEX_GRID_DIRECTION_STEPS)
              .map((step) => ({
                x: caregiver.position.x + step.x,
                y: caregiver.position.y + step.y,
              }))
              .find((candidate) => isPassable(state, candidate));
            assert.ok(adjacent);
            dependent.position = { ...adjacent };

            const next = new WorldRuntime({ state }).tick().state;
            const stayed = next.agents.find((agent) => agent.id === dependent.id);
            assert.ok(stayed);
            assert.deepEqual(stayed.position, adjacent);
            assert.equal(stayed.task, undefined);
          });
          TEST

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit improvement to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime.ts tests/dependent-caregiver-follow.test.mjs
          git commit -m "sim: keep dependents near active caregivers"
          git push origin HEAD:main
