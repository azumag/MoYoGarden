name: One-shot relationship pairing gate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add relationship regression test
        run: python .github/scripts/apply-population-hex-pairing.py test

      - name: Confirm proximity-only conception regression is red
        shell: bash
        run: |
          set -euo pipefail
          npm run build:ts
          set +e
          node --test --test-concurrency=1 tests/population-relationship-gate.test.mjs
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::Expected proximity-only conception to fail the new relationship regression before the fix."
            exit 1
          fi
          echo "Regression reproduced: proximity alone still allowed conception."

      - name: Require an established relationship for conception
        run: python .github/scripts/apply-population-hex-pairing.py fix

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-population-hex-pairing.yml
          git rm .github/scripts/apply-population-hex-pairing.py
          git add src/runtime.ts tests/population-relationship-gate.test.mjs
          git diff --cached --check
          git commit -m 'sim: require relationship before conception'
          git push origin HEAD:main
