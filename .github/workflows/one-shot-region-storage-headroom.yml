name: One-shot region storage headroom summary

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: moyo-one-shot-region-storage-headroom
  cancel-in-progress: false

jobs:
  patch-test-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded storage-headroom patch
        run: node scripts/one-shot-region-storage-headroom.mjs

      - name: Keep optional headroom exact under TypeScript semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/autonomy-region.ts')
          text = path.read_text()
          before = '''      destinationCrowding: candidate.destinationCrowding,
      destinationStorageHeadroom: candidate.destinationStorageHeadroom,
      costPerUnit: candidate.costPerUnit,'''
          after = '''      destinationCrowding: candidate.destinationCrowding,
      ...(candidate.destinationStorageHeadroom === undefined
        ? {}
        : { destinationStorageHeadroom: candidate.destinationStorageHeadroom }),
      costPerUnit: candidate.costPerUnit,'''
          if before not in text:
              raise SystemExit('optional-headroom patch anchor missing')
          path.write_text(text.replace(before, after, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit tested application changes and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hex-halo.ts src/halo-region.ts src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          git rm .github/workflows/one-shot-region-storage-headroom.yml scripts/one-shot-region-storage-headroom.mjs
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; } || true
          git commit -m 'sim: prefer expeditions with remote storage headroom'
          git push origin HEAD:main
