name: Validate family admission retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-family-admission-retry.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply bounded family-admission retry fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/settlement-migration.ts",
              "export interface SettlementFamilyRegistrationResult {\n  agentIds: string[];\n  candidateCount: number;\n}\n",
              "export interface SettlementFamilyRegistrationResult {\n  agentIds: string[];\n  candidateCount: number;\n}\n\nexport function settlementFamilyRegistrationDeferred(\n  result: SettlementFamilyRegistrationResult,\n): boolean {\n  return result.candidateCount > 0 && result.agentIds.length === 0;\n}\n",
          )

          replace_once(
              "src/autonomy-region.ts",
              "  settlementFamilyAdmissionHeadroom,\n",
              "  settlementFamilyAdmissionHeadroom,\n  settlementFamilyRegistrationDeferred,\n",
          )

          replace_once(
              "src/autonomy-region.ts",
              "    if (result.agentIds.length > 0) this.replaceRuntimeState(state);\n",
              "    if (settlementFamilyRegistrationDeferred(result)) {\n      return new Response(JSON.stringify({\n        error: \"settlement family admission deferred\",\n        targetRegionId: body.targetRegionId,\n        candidateCount: result.candidateCount,\n      }), {\n        status: 409,\n        headers: { \"content-type\": \"application/json; charset=utf-8\" },\n      });\n    }\n    if (result.agentIds.length > 0) this.replaceRuntimeState(state);\n",
          )

          replace_once(
              "tests/settlement-family-admission-atomic.test.mjs",
              "import { registerSettlementFamilyFollowers } from \"../dist-ts/src/settlement-migration.js\";\n",
              "import {\n  registerSettlementFamilyFollowers,\n  settlementFamilyRegistrationDeferred,\n} from \"../dist-ts/src/settlement-migration.js\";\n",
          )

          replace_once(
              "tests/settlement-family-admission-atomic.test.mjs",
              "  assert.equal(child.settlementFamilyTargetRegionId, undefined);\n\n  const twoSlots = registerSettlementFamilyFollowers(\n",
              "  assert.equal(child.settlementFamilyTargetRegionId, undefined);\n  assert.equal(oneSlot.candidateCount, 2);\n  assert.equal(settlementFamilyRegistrationDeferred(oneSlot), true);\n\n  const twoSlots = registerSettlementFamilyFollowers(\n",
          )

          replace_once(
              "tests/settlement-family-admission-atomic.test.mjs",
              "  assert.equal(child.settlementFamilyTargetRegionId, \"hex-q1-r0\");\n});\n",
              "  assert.equal(child.settlementFamilyTargetRegionId, \"hex-q1-r0\");\n  assert.equal(settlementFamilyRegistrationDeferred(twoSlots), false);\n});\n",
          )
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          git diff --check
          npm run build

      - name: Commit validated product change and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/automation-family-admission-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts src/settlement-migration.ts tests/settlement-family-admission-atomic.test.mjs .github/workflows/automation-family-admission-retry.yml
          git commit -m "sim: retry atomic family admission"
          git push origin HEAD:main
