name: Apply family generation fence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-family-generation-fence.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply product patch
        run: python3 .github/automation/apply-family-generation-fence.py
      - name: Validate
        run: npm run build
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/automation-family-generation-fence.yml .github/automation/apply-family-generation-fence.py
          git add src/settlement-family-reservation.ts src/autonomy-region.ts tests/settlement-family-reservation-generation.test.mjs
          git commit -m "sim: fence delayed family registration generations"
          git push origin HEAD:main
