name: One-shot pioneer storage routing

on:
  push:
    paths:
      - .github/workflows/one-shot-pioneer-storage.yml

permissions:
  contents: write

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch migration storage routing
        run: python3 scripts/one-shot-pioneer-storage.py
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit validated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settlement-migration.ts tests/settlement-migration-support-density.test.mjs
          git diff --cached --check
          git commit -m "sim: route pioneers toward usable storage capacity"
          git push origin HEAD:main
# retry after exactOptionalPropertyTypes fix
