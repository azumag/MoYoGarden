name: MoYoGarden pathogen contact index improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-pathogen-contact-index-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 scripts/moyo-pathogen-contact-index-once.py
      - name: Typecheck test and build
        run: npm run build
      - name: Commit verified improvement
        shell: bash
        run: |
          rm .github/workflows/moyo-pathogen-contact-index-once.yml
          rm scripts/moyo-pathogen-contact-index-once.py
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/pathogen.ts tests/pathogen-contact-index-budget.test.mjs .github/workflows/moyo-pathogen-contact-index-once.yml scripts/moyo-pathogen-contact-index-once.py
          git commit -m "perf: index only infectious pathogen sources"
          git push origin HEAD:main
