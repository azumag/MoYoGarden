name: Automation return-storage relay renewal

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: moyo-automation-return-storage-renew
  cancel-in-progress: false

jobs:
  improve:
    if: github.event.head_commit.message == 'chore: stage return-storage relay renewal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch relay lease renewal
        shell: python
        run: |
          from pathlib import Path

          src_path = Path('src/autonomy-region.ts')
          src = src_path.read_text()

          def replace_once(old, new):
              global src
              count = src.count(old)
              assert count == 1, f'expected one match, got {count}: {old[:80]!r}'
              src = src.replace(old, new, 1)

          replace_once(
              'const RETURN_STORAGE_RESERVATION_TTL_MS = 6 * 60 * 60 * 1_000;\n',
              'const RETURN_STORAGE_RESERVATION_TTL_MS = 6 * 60 * 60 * 1_000;\n'
              '// A courier carrying promised return cargo periodically refreshes the source-side\n'
              '// lease. This is deliberately much slower than simulation ticks, so multi-hop\n'
              '// relays survive long warm/cold journeys without turning every tick into a cross-DO write.\n'
              'const RETURN_STORAGE_RENEW_INTERVAL_MS = 60 * 60 * 1_000;\n',
          )

          replace_once(
              '  settledAmount?: number;\n  returnToSourceStorage?: boolean;\n  // Destination-local admitted capacity; optional for rolling compatibility.\n',
              '  settledAmount?: number;\n  returnToSourceStorage?: boolean;\n  // Wall-clock time of the last confirmed source-side return-storage lease refresh.\n'
              '  // Optional so arrival claims persisted by older deployments remain valid.\n'
              '  returnStorageLeaseRenewedAtMs?: number;\n  // Destination-local admitted capacity; optional for rolling compatibility.\n',
          )

          replace_once(
              '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")\n    && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");\n',
              '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")\n'
              '    && (value.returnStorageLeaseRenewedAtMs === undefined || (\n'
              '      typeof value.returnStorageLeaseRenewedAtMs === "number"\n'
              '      && Number.isFinite(value.returnStorageLeaseRenewedAtMs)\n'
              '      && value.returnStorageLeaseRenewedAtMs > 0\n'
              '    ))\n'
              '    && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");\n',
          )

          replace_once(
              '      returnToSourceStorage: existing?.returnToSourceStorage ?? body.returnToSourceStorage === true,\n      destinationStorageReserved: existing?.destinationStorageReserved ?? destinationStorageReserved,\n',
              '      returnToSourceStorage: existing?.returnToSourceStorage ?? body.returnToSourceStorage === true,\n'
              '      ...(existing?.returnStorageLeaseRenewedAtMs === undefined\n'
              '        ? {}\n'
              '        : { returnStorageLeaseRenewedAtMs: existing.returnStorageLeaseRenewedAtMs }),\n'
              '      destinationStorageReserved: existing?.destinationStorageReserved ?? destinationStorageReserved,\n',
          )

          replace_once(
              '        remainingAmount: 0,\n      }), {\n',
              '        remainingAmount: 0,\n        returnStorageReserved: false,\n      }), {\n',
          )

          replace_once(
              '      remainingAmount,\n    }), {\n',
              '      remainingAmount,\n      returnStorageReserved: keepReturnStorageReservation,\n    }), {\n',
          )

          replace_once(
              '      let settledAmount = Math.min(claim.settledAmount ?? 0, gatheredAmount);\n      let reservationExhausted = false;\n',
              '      let settledAmount = Math.min(claim.settledAmount ?? 0, gatheredAmount);\n'
              '      let returnStorageLeaseRenewedAtMs = claim.returnStorageLeaseRenewedAtMs;\n'
              '      let reservationExhausted = false;\n',
          )

          replace_once(
              '          if (response.ok) {\n            settledAmount = gatheredAmount;\n            dirty = true;\n',
              '          if (response.ok) {\n            settledAmount = gatheredAmount;\n'
              '            if (claim.returnToSourceStorage === true) {\n'
              '              returnStorageLeaseRenewedAtMs = Date.now();\n'
              '            }\n'
              '            dirty = true;\n',
          )

          replace_once(
              '      const updatedClaim: AutonomousArrivalClaim = {\n        ...claim,\n        gatheredAmount,\n        settledAmount,\n      };\n      const stillGathering =\n',
              '      const updatedClaim: AutonomousArrivalClaim = {\n'
              '        ...claim,\n'
              '        gatheredAmount,\n'
              '        settledAmount,\n'
              '        ...(returnStorageLeaseRenewedAtMs === undefined\n'
              '          ? {}\n'
              '          : { returnStorageLeaseRenewedAtMs }),\n'
              '      };\n'
              '      const returnCargoOutstanding =\n'
              '        updatedClaim.returnToSourceStorage === true\n'
              '        && agent !== undefined\n'
              '        && agent.inventory[updatedClaim.resource] > 0;\n'
              '      const now = Date.now();\n'
              '      if (\n'
              '        returnCargoOutstanding\n'
              '        && now - (updatedClaim.returnStorageLeaseRenewedAtMs ?? 0) >= RETURN_STORAGE_RENEW_INTERVAL_MS\n'
              '      ) {\n'
              '        try {\n'
              '          const response = await this.autonomyStub(updatedClaim.sourceRegionId).fetch(new Request(\n'
              '            `https://moyo.internal${INTERNAL_CLAIM_SETTLE_PATH}`,\n'
              '            {\n'
              '              method: "POST",\n'
              '              headers: {\n'
              '                "content-type": "application/json",\n'
              '                "x-moyo-region-internal": updatedClaim.sourceRegionId,\n'
              '              },\n'
              '              body: JSON.stringify({ claimId: updatedClaim.claimId, settledAmount }),\n'
              '            },\n'
              '          ));\n'
              '          if (response.ok) {\n'
              '            const payload = await response.json() as unknown;\n'
              '            if (isRecord(payload) && payload.returnStorageReserved === true) {\n'
              '              updatedClaim.returnStorageLeaseRenewedAtMs = now;\n'
              '              dirty = true;\n'
              '            }\n'
              '          }\n'
              '        } catch {\n'
              '          // Keep the arrival claim and physical cargo. The existing bounded source\n'
              '          // lease remains the crash-safe fallback and the next cadence retries.\n'
              '        }\n'
              '      }\n'
              '      const stillGathering =\n',
          )

          replace_once(
              '      const returnCargoOutstanding =\n        updatedClaim.returnToSourceStorage === true\n        && gatheredAmount > 0\n        && agent !== undefined\n        && agent.inventory[updatedClaim.resource] > 0;\n      if (returnCargoOutstanding) {\n',
              '      if (returnCargoOutstanding) {\n',
          )

          src_path.write_text(src)

          test_path = Path('tests/autonomy-material-return-relay.test.mjs')
          test_src = test_path.read_text()
          marker = '\ntest("wall-clock return-storage lease survives source tick skew and still expires crash-safely", async () => {'
          assert marker in test_src
          new_test = r'''

test("multi-hop return cargo refreshes its source storage lease while relaying", async () => {
  const env = environment();
  const relay = await assignRegion(env, "garden-2");
  const origin = await assignRegion(env, "hex-q2-r0");

  const relayState = relay.object.runtime.snapshot();
  relayState.structures = [];
  makeActiveHexPassable(relayState);
  for (const candidate of relayState.agents) candidate.autonomy = false;
  const courier = relayState.agents[0];
  assert.ok(courier);
  courier.autonomy = true;
  courier.position = hexGridCenter(relayState);
  courier.inventory = { wood: 4, stone: 0, food: 0 };
  courier.task = { source: "autonomy", issuedAtTick: relayState.tick, type: "deposit" };
  relay.object.runtime = new WorldRuntime({ state: relayState });
  await relay.object.persist();

  const originState = origin.object.runtime.snapshot();
  for (const candidate of originState.agents) candidate.autonomy = false;
  origin.object.runtime = new WorldRuntime({ state: originState });
  await origin.object.persist();

  const initialLease = Date.now() + 60_000;
  await origin.state.storage.put(SUPPLY_CLAIMS_KEY, [{
    claimId: "relay-renew-return",
    agentId: courier.id,
    resource: "wood",
    direction: "W",
    neighborRegionId: "garden-2",
    amount: 0,
    settledAmount: 4,
    expiresAtTick: originState.tick + 100,
    sourceFactionId: courier.factionId,
    returnToSourceStorage: true,
    returnStorageAmount: 4,
    returnStorageLeaseExpiresAtMs: initialLease,
  }]);
  await relay.state.storage.put(ARRIVAL_CLAIMS_KEY, [{
    claimId: "relay-renew-return",
    sourceRegionId: "hex-q2-r0",
    agentId: courier.id,
    resource: "wood",
    registeredAtTick: relayState.tick,
    gatheredAmount: 4,
    settledAmount: 4,
    returnToSourceStorage: true,
  }]);

  await relay.object.alarm();

  const sourceClaims = await origin.state.storage.get(SUPPLY_CLAIMS_KEY);
  const renewed = sourceClaims?.find((entry) => entry.claimId === "relay-renew-return");
  assert.ok(renewed, "physical cargo in a relay should retain its promised source sink");
  assert.ok(
    renewed.returnStorageLeaseExpiresAtMs > initialLease,
    "relay progress should refresh the bounded source-side wall-clock lease",
  );
  const relayClaims = await relay.state.storage.get(ARRIVAL_CLAIMS_KEY);
  const tracked = relayClaims?.find((entry) => entry.claimId === "relay-renew-return");
  assert.ok(Number.isFinite(tracked?.returnStorageLeaseRenewedAtMs));

  const leaseAfterFirstAlarm = renewed.returnStorageLeaseExpiresAtMs;
  await relay.object.alarm();
  const throttledClaims = await origin.state.storage.get(SUPPLY_CLAIMS_KEY);
  const throttled = throttledClaims?.find((entry) => entry.claimId === "relay-renew-return");
  assert.equal(
    throttled?.returnStorageLeaseExpiresAtMs,
    leaseAfterFirstAlarm,
    "the one-hour renewal cadence should avoid a cross-DO storage write every simulation tick",
  );
});
'''
          test_src = test_src.replace(marker, new_test + marker, 1)
          test_path.write_text(test_src)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit validated improvement
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-return-storage-renew.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomy-material-return-relay.test.mjs .github/workflows/automation-return-storage-renew.yml
          git commit -m 'sim: renew return storage leases during relay'
          git push origin HEAD:main
