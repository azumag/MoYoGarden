name: One-shot remote sink reservation fix v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/oneshot-remote-sink-reservation-v2.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Patch destination reservation lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/autonomy-region.ts')
          s = p.read_text()

          def replace_once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, got {n}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '  settledAmount?: number;\n  returnToSourceStorage?: boolean;\n}\n\ninterface AutonomousDestinationStorageReservation',
              '  settledAmount?: number;\n  returnToSourceStorage?: boolean;\n  // A destination-local admission slot. Optional for rolling compatibility.\n  destinationStorageReserved?: boolean;\n}\n\ninterface AutonomousDestinationStorageReservation',
          )

          start = s.index('function isAutonomousArrivalClaim')
          end = s.index('function isDestinationStorageReservation', start)
          part = s[start:end]
          old = '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean");'
          if part.count(old) != 1:
              raise SystemExit('arrival validator marker not unique')
          part = part.replace(
              old,
              '    && (value.returnToSourceStorage === undefined || typeof value.returnToSourceStorage === "boolean")\n'
              '    && (value.destinationStorageReserved === undefined || typeof value.destinationStorageReserved === "boolean");',
              1,
          )
          s = s[:start] + part + s[end:]

          release_start = s.index('  private async releaseDestinationStorage(request: Request): Promise<Response> {')
          release_end = s.index('  private async registerSettlementFamilyFollow', release_start)
          old_release = s[release_start:release_end]
          new_release = '''  private async releaseDestinationStorageReservation(
            claimId: string,
            sourceRegionId: string,
          ): Promise<void> {
            const now = Date.now();
            await this.autonomyState.blockConcurrencyWhile(async () => {
              const stored = await this.autonomyState.storage.get<unknown>(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY);
              const reservations = Array.isArray(stored)
                ? stored
                  .filter(isDestinationStorageReservation)
                  .filter((entry) => entry.expiresAtMs > now)
                : [];
              const next = reservations.filter((entry) =>
                entry.claimId !== claimId || entry.sourceRegionId !== sourceRegionId
              );
              if (!Array.isArray(stored) || next.length !== stored.length) {
                await this.autonomyState.storage.put(AUTONOMOUS_DESTINATION_STORAGE_RESERVATIONS_KEY, next);
              }
            });
          }

          private async releaseDestinationStorage(request: Request): Promise<Response> {
            let body: unknown;
            try {
              body = await request.json();
            } catch {
              return new Response(JSON.stringify({ error: "request body must be valid JSON" }), { status: 400 });
            }
            if (
              !isRecord(body)
              || typeof body.claimId !== "string"
              || body.claimId.trim() === ""
              || typeof body.sourceRegionId !== "string"
              || !isAutonomyClaimSourceRegionId(configuredRegionIds(this.autonomyEnv), body.sourceRegionId)
            ) {
              return new Response(JSON.stringify({ error: "claimId and sourceRegionId are required" }), {
                status: 400,
              });
            }
            await this.releaseDestinationStorageReservation(body.claimId, body.sourceRegionId);
            return new Response(JSON.stringify({ ok: true, claimId: body.claimId }), {
              headers: { "content-type": "application/json; charset=utf-8" },
            });
          }

'''
          s = s[:release_start] + new_release + s[release_end:]

          start = s.index('  private async registerArrivalClaim')
          end = s.index('  private async settleArrivalSourceClaim', start)
          part = s[start:end]
          marker = '    const claims = await this.arrivalClaims();\n'
          if part.count(marker) != 1:
              raise SystemExit('arrival claims marker not unique')
          part = part.replace(
              marker,
              '    const destinationReservations = await this.activeDestinationStorageReservations();\n'
              '    const destinationStorageReserved = destinationReservations.some((entry) =>\n'
              '      entry.claimId === body.claimId && entry.sourceRegionId === body.sourceRegionId\n'
              '    );\n'
              '    const claims = await this.arrivalClaims();\n',
              1,
          )
          marker = '      returnToSourceStorage: existing?.returnToSourceStorage ?? body.returnToSourceStorage === true,\n'
          if part.count(marker) != 1:
              raise SystemExit('arrival claim field marker not unique')
          part = part.replace(
              marker,
              marker + '      destinationStorageReserved: existing?.destinationStorageReserved ?? destinationStorageReserved,\n',
              1,
          )
          s = s[:start] + part + s[end:]

          start = s.index('  private async reconcileArrivalClaims')
          end = s.index('  private replaceRuntimeState', start)
          part = s[start:end]
          old = '''      if (reservationExhausted) {
                dirty = true;
                continue;
              }
              if (stillGathering) {
                keep.push(updatedClaim);
                continue;
              }

              try {'''
          new = '''      if (stillGathering) {
                keep.push(updatedClaim);
                continue;
              }

              // A remote sink reservation protects physical storage until the
              // gathered cargo leaves the arriving BOT inventory. Releasing it
              // at gather completion would let another source overbook the same
              // slots before the local deposit actually commits.
              const destinationCargoOutstanding =
                updatedClaim.destinationStorageReserved === true
                && gatheredAmount > 0
                && agent !== undefined
                && agent.inventory[updatedClaim.resource] > 0;
              if (destinationCargoOutstanding) {
                keep.push(updatedClaim);
                continue;
              }
              if (updatedClaim.destinationStorageReserved === true) {
                await this.releaseDestinationStorageReservation(
                  updatedClaim.claimId,
                  updatedClaim.sourceRegionId,
                );
                dirty = true;
              }

              if (reservationExhausted) {
                dirty = true;
                continue;
              }

              try {'''
          if part.count(old) != 1:
              raise SystemExit('arrival reconciliation marker not unique')
          part = part.replace(old, new, 1)
          s = s[:start] + part + s[end:]
          p.write_text(s)

          tp = Path('tests/autonomous-concurrent-travel-do.test.mjs')
          t = tp.read_text()
          name = 'remote sink reservation remains until gathered cargo leaves the arriving inventory'
          if name in t:
              raise SystemExit('regression test already present')
          t += r'''

          test("remote sink reservation remains until gathered cargo leaves the arriving inventory", async () => {
            const env = environment();
            await assignRegion(env, "garden-1");
            const destination = await assignRegion(env, "garden-2");
            let state = destination.object.runtime.snapshot();
            const agent = state.agents[0];
            assert.ok(agent);
            agent.autonomy = true;
            agent.role = "woodcutter";
            agent.capacity = 10;
            agent.energy = 100;
            agent.inventory = { wood: 0, stone: 0, food: 0 };
            agent.task = {
              source: "autonomy",
              issuedAtTick: state.tick,
              type: "gather",
              resource: "wood",
            };
            const factionId = agent.factionId;

            for (const structure of state.structures) {
              if (structure.factionId !== factionId || structure.status !== "active") continue;
              structure.storage = {
                wood: BUILD_RECIPES[structure.type].storageCapacity,
                stone: 0,
                food: 0,
              };
            }
            state.structures.push({
              id: "reserved-arrival-storehouse",
              factionId,
              type: "storehouse",
              position: hexGridCenter(state),
              status: "active",
              progress: 1,
              requiredProgress: 1,
              storage: { wood: BUILD_RECIPES.storehouse.storageCapacity - 2, stone: 0, food: 0 },
            });
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            const reservationResponse = await destination.object.fetch(new Request(
              "https://moyo.internal/api/internal/autonomy/storage/reserve",
              {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-moyo-region-internal": "garden-2",
                },
                body: JSON.stringify({
                  claimId: "remote-sink-cargo",
                  sourceRegionId: "garden-1",
                  factionId,
                  amount: 2,
                }),
              },
            ));
            assert.equal(reservationResponse.status, 200);
            assert.equal((await reservationResponse.json()).grantedAmount, 2);

            const arrivalResponse = await destination.object.fetch(new Request(
              "https://moyo.internal/api/internal/autonomy/claim/register",
              {
                method: "POST",
                headers: {
                  "content-type": "application/json",
                  "x-moyo-region-internal": "garden-2",
                },
                body: JSON.stringify({
                  claimId: "remote-sink-cargo",
                  sourceRegionId: "garden-1",
                  agentId: agent.id,
                  resource: "wood",
                }),
              },
            ));
            assert.equal(arrivalResponse.status, 200);
            const registered = await destination.state.storage.get(ARRIVAL_CLAIMS_KEY);
            assert.equal(registered[0].destinationStorageReserved, true);
            registered[0].gatheredAmount = 2;
            registered[0].settledAmount = 2;
            await destination.state.storage.put(ARRIVAL_CLAIMS_KEY, registered);

            state = destination.object.runtime.snapshot();
            const carrying = state.agents.find((entry) => entry.id === agent.id);
            assert.ok(carrying);
            carrying.autonomy = false;
            carrying.inventory.wood = 2;
            delete carrying.task;
            for (const structure of state.structures) {
              if (structure.factionId !== factionId || structure.status !== "active") continue;
              structure.storage = {
                wood: BUILD_RECIPES[structure.type].storageCapacity,
                stone: 0,
                food: 0,
              };
            }
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            await destination.object.alarm();
            assert.equal((await destination.state.storage.get(DESTINATION_STORAGE_RESERVATIONS_KEY)).length, 1);
            assert.equal((await destination.state.storage.get(ARRIVAL_CLAIMS_KEY)).length, 1);

            state = destination.object.runtime.snapshot();
            const delivered = state.agents.find((entry) => entry.id === agent.id);
            assert.ok(delivered);
            delivered.inventory.wood = 0;
            destination.object.runtime = new WorldRuntime({ state });
            await destination.object.persist();

            await destination.object.alarm();
            assert.deepEqual(await destination.state.storage.get(DESTINATION_STORAGE_RESERVATIONS_KEY), []);
            assert.deepEqual(await destination.state.storage.get(ARRIVAL_CLAIMS_KEY), []);
          });
          '''
          tp.write_text(t)
          PY
      - name: Install dependencies
        run: npm install
      - name: Full build and tests
        run: npm run build
      - name: Commit implementation directly to main
        shell: bash
        run: |
          rm .github/workflows/oneshot-remote-sink-reservation.yml
          rm .github/workflows/oneshot-remote-sink-reservation-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomous-concurrent-travel-do.test.mjs .github/workflows/oneshot-remote-sink-reservation.yml .github/workflows/oneshot-remote-sink-reservation-v2.yml
          git commit -m 'sim: retain remote storage reservations through delivery'
          git push origin HEAD:main
