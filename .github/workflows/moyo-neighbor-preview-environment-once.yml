name: MoYo neighbor preview environment one-shot

on:
  push:
    paths:
      - .github/workflows/moyo-neighbor-preview-environment-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .github/scripts/apply-neighbor-preview-environment.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run build
      - name: Commit improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js tests/hex-terrain-environment.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "visual: tint neighbor hex previews from environment state"
          git push origin HEAD:main
