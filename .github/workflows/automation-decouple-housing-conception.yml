name: Stage housing-conception decoupling

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-decouple-housing-conception.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decouple conception from housing capacity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          runtime_path = Path("src/runtime.ts")
          runtime = runtime_path.read_text()

          constant = 'const POPULATION_RESIDENT_CAPACITY_PER_CAMP = 6;\n'
          if runtime.count(constant) != 1:
              raise SystemExit("resident-capacity constant anchor mismatch")
          runtime = runtime.replace(constant, '', 1)

          helper = '''function settlementResidentCapacity(state: WorldState, factionId: string): number {
            return activeFactionStructures(state, factionId)
              .filter((structure) => structure.type === "camp")
              .length * POPULATION_RESIDENT_CAPACITY_PER_CAMP;
          }

          '''
          helper = textwrap.dedent(helper)
          if runtime.count(helper) != 1:
              raise SystemExit("settlementResidentCapacity helper anchor mismatch")
          runtime = runtime.replace(helper, '', 1)

          runtime, gate_count = re.subn(
              r'    const pregnancies = population\.filter\(\(agent\) => agent\.pregnancy !== undefined\)\.length;\n'
              r'    if \(population\.length \+ pregnancies >= settlementResidentCapacity\(state, faction\.id\)\) continue;\n\n',
              '',
              runtime,
              count=1,
          )
          if gate_count != 1:
              raise SystemExit(f"conception housing gate replacement count={gate_count}")
          runtime_path.write_text(runtime)

          tests_path = Path("tests/simulation.test.mjs")
          tests = tests_path.read_text()
          anchor = 'test("population growth requires conception, gestation, and biological parentage", () => {\n'
          if tests.count(anchor) != 1:
              raise SystemExit("simulation test insertion anchor mismatch")

          new_test = r'''test("conception is not directly gated by settlement resident capacity", () => {
            const state = createInitialWorld({ seed: 2031 });
            const faction = state.factions.find((entry) => entry.id === "ember"); assert.ok(faction);
            const members = state.agents.filter((agent) => agent.factionId === faction.id);
            assert.ok(members.length >= 2);
            const parent = members[0]; assert.ok(parent);
            const partner = members[1]; assert.ok(partner);

            // Make housing exactly full while keeping the biological pair healthy.
            // Housing pressure should drive camp expansion / migration elsewhere in
            // the simulation, not act as a direct fertility switch.
            state.structures = state.structures.filter((structure) =>
              structure.factionId !== faction.id || structure.type !== "camp"
            );
            const targetPopulation = Math.ceil(members.length / 6) * 6;
            const campCount = targetPopulation / 6;
            const occupied = new Set(state.structures.map((structure) =>
              `${structure.position.x},${structure.position.y}`
            ));
            const campSites = state.tiles
              .filter((tile) => tile.terrain !== "water" && !occupied.has(`${tile.x},${tile.y}`))
              .slice(0, campCount);
            assert.equal(campSites.length, campCount);
            for (let index = 0; index < campCount; index += 1) {
              const site = campSites[index]; assert.ok(site);
              state.structures.push({
                id: `housing-full-camp-${index}`,
                factionId: faction.id,
                type: "camp",
                position: { x: site.x, y: site.y },
                status: "active",
                progress: 6,
                requiredProgress: 6,
                storage: { wood: 0, stone: 0, food: 100 },
              });
            }
            faction.resources.food = 100;

            for (const member of members) {
              member.hp = 100;
              member.energy = 100;
              member.autonomy = false;
              member.reproductiveRole = member.id === parent.id ? "gestational" : "partner";
              delete member.pregnancy;
              delete member.lastBirthTick;
              delete member.socialMemory;
              delete member.task;
            }
            for (let index = members.length; index < targetPopulation; index += 1) {
              const resident = structuredClone(partner);
              resident.id = `housing-full-resident-${index}`;
              resident.name = `Housing Resident ${index}`;
              resident.hp = 100;
              resident.energy = 100;
              resident.autonomy = false;
              resident.reproductiveRole = "partner";
              resident.socialMemory = [];
              delete resident.pregnancy;
              delete resident.lastBirthTick;
              delete resident.task;
              state.agents.push(resident);
            }
            parent.socialMemory = [{ agentId: partner.id, familiarity: 3, lastInteractionTick: 1 }];
            partner.socialMemory = [{ agentId: parent.id, familiarity: 3, lastInteractionTick: 1 }];
            partner.position = { ...parent.position };
            assert.equal(
              state.agents.filter((agent) => agent.factionId === faction.id).length,
              campCount * 6,
            );
            state.tick = 8_639;

            const conceived = new WorldRuntime({ state }).tick().state;
            const conceivedParent = conceived.agents.find((entry) => entry.id === parent.id); assert.ok(conceivedParent);
            assert.equal(conceivedParent.pregnancy?.partnerId, partner.id);
          });

          '''
          tests = tests.replace(anchor, textwrap.dedent(new_test) + anchor, 1)
          tests_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          set -euo pipefail
          npm run build
          git diff --check

      - name: Commit improvement and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          rm .github/workflows/automation-decouple-housing-conception.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sim: decouple conception from housing capacity"
          git push origin HEAD:main
