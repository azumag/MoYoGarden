name: MoYoGarden one-shot cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Remove unintended generated files
        shell: bash
        run: |
          set -euo pipefail
          BASE=e9c654a854b205a3c1506b1aac72aebc087206ea
          cleanup_generated() {
            while IFS= read -r path; do
              case "$path" in
                public/client/live-region-rendering.js|tests/live-region-window.test.mjs|.github/workflows/moyo-cleanup-once.yml)
                  continue
                  ;;
              esac
              if git cat-file -e "$BASE:$path" 2>/dev/null; then
                git checkout "$BASE" -- "$path"
              else
                git rm -f --ignore-unmatch -- "$path" >/dev/null || true
                rm -rf -- "$path"
              fi
            done < <(git diff --name-only "$BASE" --)
          }
          cleanup_generated

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Revalidate intended change
        run: npm run build

      - name: Commit clean verified tree
        shell: bash
        run: |
          set -euo pipefail
          BASE=e9c654a854b205a3c1506b1aac72aebc087206ea
          while IFS= read -r path; do
            case "$path" in
              public/client/live-region-rendering.js|tests/live-region-window.test.mjs|.github/workflows/moyo-cleanup-once.yml)
                continue
                ;;
            esac
            if git cat-file -e "$BASE:$path" 2>/dev/null; then
              git checkout "$BASE" -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path" >/dev/null || true
              rm -rf -- "$path"
            fi
          done < <(git diff --name-only "$BASE" --)
          rm -f .github/workflows/moyo-cleanup-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove generated validation artifacts"
          git push origin HEAD:main
