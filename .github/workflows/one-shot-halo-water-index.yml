name: One-shot halo water index optimization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-halo-water-index.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply halo water scan optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("src/halo-environment.ts")
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match, got {count}: {old[:120]!r}")
              text = text.replace(old, new, 1)

          replace_once(
          '''function haloWaterInfluence(
            state: Pick<WorldState, "regionId" | "width" | "height">,
            position: GridPosition,
            lookup: HaloLookup,
          ): number {''',
          '''function haloWaterGhostsFromLookup(lookup: HaloLookup): HexHaloTile[] {
            const waterGhosts: HexHaloTile[] = [];
            for (const ghost of lookup.values()) {
              if (ghost.tile.terrain === "water") waterGhosts.push(ghost);
            }
            return waterGhosts;
          }

          function haloWaterInfluence(
            state: Pick<WorldState, "regionId" | "width" | "height">,
            position: GridPosition,
            waterGhosts: readonly HexHaloTile[],
          ): number {''')

          replace_once(
          '''  for (const ghost of lookup.values()) {
              if (ghost.tile.terrain !== "water") continue;''',
          '''  for (const ghost of waterGhosts) {''')

          replace_once(
          '''function surfaceMoistureWithHaloLookup(
            state: Pick<WorldState, "regionId" | "width" | "height" | "tiles">,
            position: GridPosition,
            lookup: HaloLookup,
            catchmentContribution?: ReadonlyMap<string, number>,
            environment?: HaloEnvironmentFrame,
          ): number {''',
          '''function surfaceMoistureWithHaloLookup(
            state: Pick<WorldState, "regionId" | "width" | "height" | "tiles">,
            position: GridPosition,
            lookup: HaloLookup,
            catchmentContribution?: ReadonlyMap<string, number>,
            waterGhosts?: readonly HexHaloTile[],
            environment?: HaloEnvironmentFrame,
          ): number {''')

          replace_once(
          '''  waterInfluence = Math.max(waterInfluence, haloWaterInfluence(state, position, lookup));''',
          '''  waterInfluence = Math.max(
              waterInfluence,
              haloWaterInfluence(state, position, waterGhosts ?? haloWaterGhostsFromLookup(lookup)),
            );''')

          replace_once(
          '''function resourceRegrowthChanceWithHaloLookup(
            state: WorldState,
            tile: Tile,
            lookup: HaloLookup,
            catchmentContribution?: ReadonlyMap<string, number>,
            environment?: HaloEnvironmentFrame,
          ): number {''',
          '''function resourceRegrowthChanceWithHaloLookup(
            state: WorldState,
            tile: Tile,
            lookup: HaloLookup,
            catchmentContribution?: ReadonlyMap<string, number>,
            waterGhosts?: readonly HexHaloTile[],
            environment?: HaloEnvironmentFrame,
          ): number {''')

          replace_once(
          '''  const moisture = surfaceMoistureWithHaloLookup(
              state,
              tile,
              lookup,
              catchmentContribution,
              environment,
            );''',
          '''  const moisture = surfaceMoistureWithHaloLookup(
              state,
              tile,
              lookup,
              catchmentContribution,
              waterGhosts,
              environment,
            );''')

          replace_once(
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(state, lookup);
            return surfaceMoistureWithHaloLookup(
              state,
              position,
              lookup,
              catchmentContribution,
              environment,
            );''',
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(state, lookup);
            const waterGhosts = haloWaterGhostsFromLookup(lookup);
            return surfaceMoistureWithHaloLookup(
              state,
              position,
              lookup,
              catchmentContribution,
              waterGhosts,
              environment,
            );''')

          replace_once(
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(state, lookup);
            return resourceRegrowthChanceWithHaloLookup(
              state,
              tile,
              lookup,
              catchmentContribution,
              environment,
            );''',
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(state, lookup);
            const waterGhosts = haloWaterGhostsFromLookup(lookup);
            return resourceRegrowthChanceWithHaloLookup(
              state,
              tile,
              lookup,
              catchmentContribution,
              waterGhosts,
              environment,
            );''')

          replace_once(
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(after, lookup);
            const random = createRandom(after.rngState);''',
          '''  const lookup = hexHaloLookup(halo);
            const catchmentContribution = haloCatchmentContributionMapFromLookup(after, lookup);
            const waterGhosts = haloWaterGhostsFromLookup(lookup);
            const random = createRandom(after.rngState);''')

          replace_once(
          '''    const haloChance = resourceRegrowthChanceWithHaloLookup(
                after,
                tile,
                lookup,
                catchmentContribution,
                environment,
              );''',
          '''    const haloChance = resourceRegrowthChanceWithHaloLookup(
                after,
                tile,
                lookup,
                catchmentContribution,
                waterGhosts,
                environment,
              );''')

          path.write_text(text)

          Path("tests/halo-regrowth-water-scan.test.mjs").write_text('''import assert from "node:assert/strict";
          import test from "node:test";
          import { applyHaloRegrowthCompensation } from "../dist-ts/src/halo-environment.js";
          import { buildDynamicHexHaloLinks } from "../dist-ts/src/hex-halo.js";
          import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          test("halo regrowth indexes water ghosts once per compensation pass", () => {
            const before = createInitialWorld({ seed: 9408, width: 40, height: 24, regionId: "garden-1" });
            const after = structuredClone(before);

            for (const state of [before, after]) {
              for (const tile of state.tiles) {
                if (tile.resource?.kind === "wood" || tile.resource?.kind === "food") {
                  tile.resource.amount = tile.resource.maxAmount;
                }
              }
            }

            let prepared = 0;
            for (let index = 0; index < after.tiles.length && prepared < 16; index += 1) {
              const current = after.tiles[index];
              const previous = before.tiles[index];
              if (current === undefined || previous === undefined) continue;
              if (!isHexGridCell(after, current) || current.terrain === "water") continue;
              current.resource = { kind: "wood", amount: 0, maxAmount: 10 };
              previous.resource = { kind: "wood", amount: 0, maxAmount: 10 };
              prepared += 1;
            }
            assert.equal(prepared, 16);
            before.tick = 29;
            after.tick = 30;

            const link = buildDynamicHexHaloLinks(after, "garden-1")[0];
            assert.ok(link);
            let terrainReads = 0;
            const ghostTile = {
              x: link.neighborPosition.x,
              y: link.neighborPosition.y,
              elevation: 0.5,
              drainage: 0,
              get terrain() {
                terrainReads += 1;
                return "water";
              },
            };

            applyHaloRegrowthCompensation(before, after, [{ ...link, tile: ghostTile }], 30);

            assert.ok(
              terrainReads <= 3,
              `water classification should be indexed once for the pass, got ${terrainReads} terrain reads`,
            );
          });
          ''')
          PY

          git diff --check

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate full build
        run: npm run build

      - name: Commit verified improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-shot-halo-water-index.yml
          git add src/halo-environment.ts tests/halo-regrowth-water-scan.test.mjs .github/workflows/one-shot-halo-water-index.yml
          git diff --cached --check
          git commit -m "perf: index halo water once per regrowth pass"
          git push origin HEAD:main
