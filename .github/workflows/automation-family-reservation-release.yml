name: Automation family reservation release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: moyo-automation-family-reservation-release
  cancel-in-progress: false

jobs:
  patch-validate-push:
    if: github.event.head_commit.message == 'ci: stage family reservation release validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch family admission reservation reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          reservation = Path('src/settlement-family-reservation.ts')
          text = reservation.read_text()
          anchor = 'export function upsertSettlementFamilyAdmissionReservation(\n'
          helper = '''export function releaseSettlementFamilyAdmissionAgent(\n  reservations: readonly SettlementFamilyAdmissionReservation[],\n  agentId: string,\n): SettlementFamilyAdmissionReservation[] {\n  if (agentId.length === 0) return [...reservations];\n  return reservations.flatMap((reservation) => {\n    if (!reservation.agentIds.includes(agentId)) return [reservation];\n    const agentIds = reservation.agentIds.filter((entry) => entry !== agentId);\n    return agentIds.length > 0 ? [{ ...reservation, agentIds }] : [];\n  });\n}\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('reservation helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)
              reservation.write_text(text)

          autonomy = Path('src/autonomy-region.ts')
          text = autonomy.read_text()

          old_import = '''import {\n  normalizeSettlementFamilyAdmissionReservations,\n  settlementFamilyReservedSlots,\n  upsertSettlementFamilyAdmissionReservation,\n  type SettlementFamilyAdmissionReservation,\n} from "./settlement-family-reservation.js";'''
          new_import = '''import {\n  normalizeSettlementFamilyAdmissionReservations,\n  releaseSettlementFamilyAdmissionAgent,\n  settlementFamilyReservedSlots,\n  upsertSettlementFamilyAdmissionReservation,\n  type SettlementFamilyAdmissionReservation,\n} from "./settlement-family-reservation.js";'''
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('autonomy import anchor not found')

          old_const = 'const INTERNAL_SETTLEMENT_FAMILY_REGISTER_PATH = `${INTERNAL_AUTONOMY_PREFIX}settlement/family/register`;'
          new_const = old_const + '\nconst INTERNAL_SETTLEMENT_FAMILY_RELEASE_PATH = `${INTERNAL_AUTONOMY_PREFIX}settlement/family/release`;'
          if new_const not in text:
              if old_const not in text:
                  raise SystemExit('family path anchor not found')
              text = text.replace(old_const, new_const, 1)

          method_anchor = '''private async reserveSettlementFamilyAdmissions(\n  state: WorldState,'''
          methods = '''private async releaseSettlementFamilyAdmissionSlot(request: Request): Promise<Response> {\n  let body: unknown;\n  try {\n    body = await request.json();\n  } catch {\n    return new Response(JSON.stringify({ error: "request body must be valid JSON" }), { status: 400 });\n  }\n  if (\n    !isRecord(body)\n    || typeof body.agentId !== "string"\n    || body.agentId.length === 0\n    || body.agentId.length > 192\n    || !body.agentId.startsWith("agent-global:")\n  ) {\n    return new Response(JSON.stringify({ error: "agentId must be a world-global agent ID" }), { status: 400 });\n  }\n\n  const state = runtimeAccess(this).runtime.snapshot();\n  const now = Date.now();\n  let released = false;\n  await this.autonomyState.blockConcurrencyWhile(async () => {\n    const stored = await this.autonomyState.storage.get<unknown>(\n      SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY,\n    );\n    const presentAgentIds = new Set(state.agents.map((agent) => agent.id));\n    const normalized = normalizeSettlementFamilyAdmissionReservations(stored, presentAgentIds, now);\n    released = normalized.reservations.some((reservation) =>\n      reservation.agentIds.includes(body.agentId as string)\n    );\n    const next = releaseSettlementFamilyAdmissionAgent(\n      normalized.reservations,\n      body.agentId as string,\n    );\n    if (normalized.changed || released) {\n      await this.autonomyState.storage.put(\n        SETTLEMENT_FAMILY_ADMISSION_RESERVATIONS_KEY,\n        next,\n      );\n    }\n  });\n  return new Response(JSON.stringify({ ok: true, agentId: body.agentId, released }), {\n    headers: { "content-type": "application/json; charset=utf-8" },\n  });\n}\n\nprivate async notifySettlementFamilyAdmissionRelease(\n  targetRegionId: string,\n  agentId: string,\n): Promise<boolean> {\n  try {\n    const response = await this.autonomyStub(targetRegionId).fetch(new Request(\n      `https://moyo.internal${INTERNAL_SETTLEMENT_FAMILY_RELEASE_PATH}`,\n      {\n        method: "POST",\n        headers: {\n          "content-type": "application/json",\n          "x-moyo-region-internal": targetRegionId,\n        },\n        body: JSON.stringify({ agentId }),\n      },\n    ));\n    return response.ok;\n  } catch {\n    // Destination reservation TTL remains the crash-safe fallback.\n    return false;\n  }\n}\n\nprivate async reconcileSettlementFamilyAdmissionRoutes(\n  before: WorldState,\n  after: WorldState,\n): Promise<void> {\n  const afterById = new Map(after.agents.map((agent) => [agent.id, agent]));\n  let dirty = false;\n  for (const previous of before.agents) {\n    const targetRegionId = previous.settlementFamilyTargetRegionId;\n    if (targetRegionId === undefined) continue;\n    const targetAxial = regionAxialCoordinate(targetRegionId);\n    const sourceAxial = regionAxialCoordinate(before.regionId);\n    if (\n      targetRegionId === before.regionId\n      || (\n        targetAxial !== undefined\n        && sourceAxial !== undefined\n        && targetAxial.q === sourceAxial.q\n        && targetAxial.r === sourceAxial.r\n      )\n    ) continue;\n\n    const current = afterById.get(previous.id);\n    // Ownership handoff is processed before `before` is captured. A missing\n    // agent here therefore has no safe local proof of death/cancellation; keep\n    // the destination lease and let arrival reconciliation/TTL resolve it.\n    if (current === undefined) continue;\n    const currentTarget = current.settlementFamilyTargetRegionId;\n    const currentTargetAxial = currentTarget === undefined\n      ? undefined\n      : regionAxialCoordinate(currentTarget);\n    const sameTarget = currentTarget === targetRegionId || (\n      currentTargetAxial !== undefined\n      && targetAxial !== undefined\n      && currentTargetAxial.q === targetAxial.q\n      && currentTargetAxial.r === targetAxial.r\n    );\n    if (current.hp > 0 && sameTarget) continue;\n\n    const globalAgentId = globalHandoffAgentId(previous.id, before.regionId);\n    const released = await this.notifySettlementFamilyAdmissionRelease(\n      targetRegionId,\n      globalAgentId,\n    );\n    if (!released) continue;\n\n    // A dead follower cannot resume this route. Clearing the stale marker also\n    // prevents one cross-DO release request on every later Alarm. If a live\n    // route was explicitly retargeted/cancelled, preserve its new marker/state.\n    if (current.hp <= 0 && sameTarget) {\n      delete current.settlementFamilyTargetRegionId;\n      dirty = true;\n    }\n  }\n  if (dirty) this.replaceRuntimeState(after);\n}\n\n'''
          if 'private async releaseSettlementFamilyAdmissionSlot(request: Request)' not in text:
              if method_anchor not in text:
                  raise SystemExit('family reservation method anchor not found')
              text = text.replace(method_anchor, methods + method_anchor, 1)

          route_anchor = '''    if (request.method === "POST" && url.pathname === INTERNAL_SETTLEMENT_FAMILY_REGISTER_PATH) {\n      return this.registerSettlementFamilyFollow(request);\n    }'''
          route_replacement = route_anchor + '''\n    if (request.method === "POST" && url.pathname === INTERNAL_SETTLEMENT_FAMILY_RELEASE_PATH) {\n      return this.releaseSettlementFamilyAdmissionSlot(request);\n    }'''
          if 'url.pathname === INTERNAL_SETTLEMENT_FAMILY_RELEASE_PATH' not in text:
              if route_anchor not in text:
                  raise SystemExit('internal route anchor not found')
              text = text.replace(route_anchor, route_replacement, 1)

          alarm_anchor = '''      await this.reconcileArrivalClaims(\n        simulationBefore,\n        runtimeAccess(this).runtime.snapshot(),\n      );'''
          alarm_replacement = alarm_anchor + '''\n      await this.reconcileSettlementFamilyAdmissionRoutes(\n        simulationBefore,\n        runtimeAccess(this).runtime.snapshot(),\n      );'''
          if 'await this.reconcileSettlementFamilyAdmissionRoutes(' not in text:
              if alarm_anchor not in text:
                  raise SystemExit('alarm reconciliation anchor not found')
              text = text.replace(alarm_anchor, alarm_replacement, 1)

          autonomy.write_text(text)

          test = Path('tests/settlement-family-reservation-release.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport {\n  releaseSettlementFamilyAdmissionAgent,\n} from "../dist-ts/src/settlement-family-reservation.js";\n\nfunction reservation(id, agentIds) {\n  return {\n    reservationId: id,\n    sourceRegionId: "garden-1",\n    pioneerId: "agent-global:garden-1:pioneer",\n    factionId: "faction-1",\n    agentIds,\n    expiresAtMs: 2_000_000_000_000,\n  };\n}\n\ntest("family admission release removes only the abandoned follower slot", () => {\n  const abandoned = "agent-global:garden-1:child";\n  const partner = "agent-global:garden-1:partner";\n  const next = releaseSettlementFamilyAdmissionAgent(\n    [reservation("family:1", [abandoned, partner])],\n    abandoned,\n  );\n  assert.equal(next.length, 1);\n  assert.deepEqual(next[0].agentIds, [partner]);\n});\n\ntest("family admission release drops an empty reservation and is idempotent", () => {\n  const abandoned = "agent-global:garden-1:child";\n  const first = releaseSettlementFamilyAdmissionAgent(\n    [reservation("family:1", [abandoned])],\n    abandoned,\n  );\n  assert.deepEqual(first, []);\n  assert.deepEqual(releaseSettlementFamilyAdmissionAgent(first, abandoned), []);\n});\n\ntest("family admission release clears duplicate stale promises without touching other followers", () => {\n  const abandoned = "agent-global:garden-1:child";\n  const other = "agent-global:garden-1:other";\n  const next = releaseSettlementFamilyAdmissionAgent([\n    reservation("family:1", [abandoned, other]),\n    reservation("family:2", [abandoned]),\n  ], abandoned);\n  assert.equal(next.length, 1);\n  assert.equal(next[0].reservationId, "family:1");\n  assert.deepEqual(next[0].agentIds, [other]);\n});\n''')
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate
        run: |
          set -euo pipefail
          git diff --check
          npm run build

      - name: Commit validated product change
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/automation-family-reservation-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sim: release abandoned family admission slots'
          git push origin HEAD:main
