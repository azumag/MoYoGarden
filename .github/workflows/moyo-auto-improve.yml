name: MoYoGarden one-shot improvement

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: moyo-one-shot-improve
  cancel-in-progress: false

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply focused logistics patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/halo-region.ts',
              '''      if (headroom <= 0) continue;\n      storageHeadroom.set(''',
              '''      // Keep zero for factions whose active storage is known to be full. An\n      // omitted faction still means "unknown" after bounded top-N truncation,\n      // which lets remote planners distinguish full from merely unobserved.\n      storageHeadroom.set(''',
          )

          replace_once(
              'src/hex-halo.ts',
              '''  // Optional during rolling deploys. This is a bounded positive-headroom map\n  // (at most a handful of factions), used only as a planning preference; an\n  // omitted faction is unknown rather than proof that remote storage is full.\n  storageHeadroomByFaction?: Record<string, number>;''',
              '''  // Optional during rolling deploys. This bounded observed-headroom map can\n  // contain zero for a faction whose active storage is known to be full. An\n  // omitted faction stays unknown (for example after top-N truncation).\n  storageHeadroomByFaction?: Record<string, number>;''',
          )

          replace_once(
              'src/autonomy-region.ts',
              '''    const headroom = entry.neighborRegionSummary?.storageHeadroomByFaction?.[factionId];\n    if (typeof headroom !== "number" || !Number.isFinite(headroom) || headroom <= 0) continue;\n    // Multiple seam reads can straddle ticks. Treat this as a routing hint, not\n    // a reservation, and use the most conservative positive observation.\n    minimumHeadroom = Math.min(minimumHeadroom ?? headroom, headroom);''',
              '''    const byFaction = entry.neighborRegionSummary?.storageHeadroomByFaction;\n    if (byFaction === undefined || !Object.prototype.hasOwnProperty.call(byFaction, factionId)) continue;\n    const headroom = byFaction[factionId];\n    if (typeof headroom !== "number" || !Number.isFinite(headroom) || headroom < 0) continue;\n    // Multiple seam reads can straddle ticks. Treat this as a routing hint, not\n    // a reservation, and use the most conservative observation, including zero\n    // when the remote faction's active storage is explicitly known to be full.\n    minimumHeadroom = Math.min(minimumHeadroom ?? headroom, headroom);''',
          )

          replace_once(
              'src/autonomy-region.ts',
              '''  return minimumHeadroom;\n}\n\nfunction availableHaloSupplyForAgent(''',
              '''  return minimumHeadroom;\n}\n\nfunction storageHeadroomPreference(headroom: number | undefined): number {\n  // Positive observed capacity is best; missing bounded metadata stays neutral;\n  // an explicit zero is actionable evidence that the destination is full.\n  if (headroom === undefined) return 1;\n  return headroom > 0 ? 2 : 0;\n}\n\nfunction availableHaloSupplyForAgent(''',
          )

          p = Path('src/autonomy-region.ts')
          text = p.read_text()
          b = 'Number((b.destinationStorageHeadroom ?? 0) > 0)'
          a = 'Number((a.destinationStorageHeadroom ?? 0) > 0)'
          if text.count(b) != 2 or text.count(a) != 2:
              raise SystemExit(f"unexpected storage sort occurrences: b={text.count(b)} a={text.count(a)}")
          text = text.replace(b, 'storageHeadroomPreference(b.destinationStorageHeadroom)')
          text = text.replace(a, 'storageHeadroomPreference(a.destinationStorageHeadroom)')
          p.write_text(text)

          replace_once(
              'tests/autonomy-region-storage-headroom-summary.test.mjs',
              '''      ...(headroom > 0 ? { storageHeadroomByFaction: { [factionId]: headroom } } : {}),''',
              '''      ...(headroom === undefined ? {} : { storageHeadroomByFaction: { [factionId]: headroom } }),''',
          )
          replace_once(
              'tests/autonomy-region-storage-headroom-summary.test.mjs',
              '''    storageHeadroomByFaction: { settlers: 12 },''',
              '''    storageHeadroomByFaction: { settlers: 0, traders: 12 },''',
          )
          replace_once(
              'tests/autonomy-region-storage-headroom-summary.test.mjs',
              '''  assert.deepEqual(materialized[0].neighborRegionSummary?.storageHeadroomByFaction, { settlers: 12 });\n  materialized[0].neighborRegionSummary.storageHeadroomByFaction.settlers = 1;\n  assert.equal(summary.storageHeadroomByFaction.settlers, 12);''',
              '''  assert.deepEqual(materialized[0].neighborRegionSummary?.storageHeadroomByFaction, { settlers: 0, traders: 12 });\n  materialized[0].neighborRegionSummary.storageHeadroomByFaction.settlers = 1;\n  assert.equal(summary.storageHeadroomByFaction.settlers, 0);''',
          )
          replace_once(
              'tests/autonomy-region-storage-headroom-summary.test.mjs',
              '''  const east = halo(state, "east", "garden-2", agent.factionId, 0);\n  const west = halo(state, "west", "hex-q-1-r0", "other-faction", 20);\n  const plan = planAutonomousHaloTravel(state, [west, east]);\n  assert.ok(plan);\n  assert.equal(plan.direction, "east", "legacy deterministic route order should remain when own-faction headroom is unknown");''',
              '''  const east = halo(state, "east", "garden-2", agent.factionId, undefined);\n  const west = halo(state, "west", "hex-q-1-r0", "other-faction", 20);\n  const plan = planAutonomousHaloTravel(state, [west, east]);\n  assert.ok(plan);\n  assert.equal(plan.direction, "east", "legacy deterministic route order should remain when own-faction headroom is unknown");''',
          )
          p = Path('tests/autonomy-region-storage-headroom-summary.test.mjs')
          text = p.read_text()
          marker = '''test("storage headroom for another faction does not bias expedition routing", () => {'''
          if text.count(marker) != 1:
              raise SystemExit(f"test insertion marker mismatch: {text.count(marker)}")
          addition = '''test("equivalent expeditions prefer unknown storage over a destination known to be full", () => {\n  const { state, agent } = fixture();\n  const east = halo(state, "east", "garden-2", agent.factionId, 0);\n  const west = halo(state, "west", "hex-q-1-r0", agent.factionId, undefined);\n  const plan = planAutonomousHaloTravel(state, [east, west]);\n  assert.ok(plan);\n  assert.equal(plan.direction, "west");\n  assert.equal(plan.neighborRegionId, "hex-q-1-r0");\n});\n\n'''
          p.write_text(text.replace(marker, addition + marker, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/halo-region.ts src/hex-halo.ts src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          git commit -m 'sim: avoid known-full expedition storage'
          git push origin HEAD:main
