name: Stage living migration occupancy fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-living-migration-occupancy.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply living-occupancy semantics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          import re

          def guard_occupant_loops(path, expected):
              p = Path(path)
              text = p.read_text()
              pattern = re.compile(r'(?m)^(\s*)for \(const occupant of state\.agents\) \{\n')
              matches = list(pattern.finditer(text))
              if len(matches) != expected:
                  raise SystemExit(f"{path}: expected {expected} occupant loops, found {len(matches)}")
              text = pattern.sub(
                  lambda m: f"{m.group(1)}for (const occupant of state.agents) {{\n{m.group(1)}  if (occupant.hp <= 0) continue;\n",
                  text,
              )
              p.write_text(text)

          guard_occupant_loops("src/settlement-migration.ts", 2)
          guard_occupant_loops("src/autonomy-region.ts", 1)

          migration = Path("src/settlement-migration.ts")
          text = migration.read_text()
          old = "support.occupants = state.agents.length;"
          if text.count(old) != 1:
              raise SystemExit(f"settlement support occupant anchor count={text.count(old)}")
          migration.write_text(text.replace(
              old,
              "support.occupants = state.agents.filter((agent) => agent.hp > 0).length;",
          ))

          halo = Path("src/halo-region.ts")
          text = halo.read_text()
          pattern = re.compile(
              r'(?m)^(\s*)const occupantCounts = new Map<string, number>\(\);\n'
              r'\1const occupantsByPosition = new Map<string, number>\(\);\n'
              r'\1for \(const agent of state\.agents\) \{\n'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"halo occupant summary anchor count={len(matches)}")
          text = pattern.sub(
              lambda m: (
                  f"{m.group(1)}const occupantCounts = new Map<string, number>();\n"
                  f"{m.group(1)}const occupantsByPosition = new Map<string, number>();\n"
                  f"{m.group(1)}let livingOccupants = 0;\n"
                  f"{m.group(1)}for (const agent of state.agents) {{\n"
                  f"{m.group(1)}  if (agent.hp <= 0) continue;\n"
                  f"{m.group(1)}  livingOccupants += 1;\n"
              ),
              text,
          )
          old = "occupants: state.agents.length,"
          if text.count(old) != 1:
              raise SystemExit(f"halo total occupant anchor count={text.count(old)}")
          halo.write_text(text.replace(old, "occupants: livingOccupants,"))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product tree
        run: |
          set -euo pipefail
          npm run build
          git diff --check

      - name: Commit improvement and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          rm .github/workflows/automation-living-migration-occupancy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "sim: count only living occupants across regions"
          git push origin HEAD:main
