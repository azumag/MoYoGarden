name: One-shot expedition storage safety improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-expedition-storage-safety.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply focused simulation safety patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path("src/autonomy-region.ts")
          text = src.read_text()
          candidate_anchor = "    const candidates = halo.flatMap((entry) => {\n"
          if text.count(candidate_anchor) != 1:
              raise SystemExit(f"candidate anchor count={text.count(candidate_anchor)}")
          text = text.replace(candidate_anchor, '''    const availableSourceReturnStorage = Math.max(
            0,
            factionStorageCapacityLeft(state, agent.factionId)
              - reservedReturnStorageForFaction(state, claims, agent.factionId),
          );
          const candidates = halo.flatMap((entry) => {
          ''', 1)
          return_anchor = '''      return [{
            entry,
            travelDistance: pathScore.distance,
            pathCrowding: pathScore.crowding,
            destinationCrowding: entry.neighborOccupants ?? 0,
            destinationStorageHeadroom: destinationStorageHeadroom.get(entry.neighborRegionId),
          }];'''
          if text.count(return_anchor) != 1:
              raise SystemExit(f"return anchor count={text.count(return_anchor)}")
          text = text.replace(return_anchor, '''      const remoteStorageHeadroom = destinationStorageHeadroom.get(entry.neighborRegionId);
          // Do not launch cargo toward a destination that is explicitly known to
          // have no storage when this source also has no unreserved return capacity.
          // Missing remote metadata stays neutral for rolling compatibility: only
          // two concrete capacity observations can prove the expedition has no sink.
          if (remoteStorageHeadroom === 0 && availableSourceReturnStorage <= 0) return [];
          return [{
            entry,
            travelDistance: pathScore.distance,
            pathCrowding: pathScore.crowding,
            destinationCrowding: entry.neighborOccupants ?? 0,
            destinationStorageHeadroom: remoteStorageHeadroom,
          }];''', 1)
          src.write_text(text)

          test = Path("tests/autonomy-region-storage-headroom-summary.test.mjs")
          t = test.read_text()
          anchor = 'import { createInitialWorld } from "../dist-ts/src/world.js";\n'
          if t.count(anchor) != 1:
              raise SystemExit(f"test import anchor count={t.count(anchor)}")
          t = t.replace(anchor, 'import { BUILD_RECIPES } from "../dist-ts/src/protocol.js";\n' + anchor, 1)
          t += '''

          function fillFactionStorage(state, factionId) {
            for (const structure of state.structures) {
              if (structure.factionId !== factionId || structure.status !== "active") continue;
              structure.storage = {
                wood: BUILD_RECIPES[structure.type].storageCapacity,
                stone: 0,
                food: 0,
              };
            }
          }

          test("known-full destination is rejected when the source has no return storage", () => {
            const { state, agent } = fixture();
            fillFactionStorage(state, agent.factionId);
            const east = halo(state, "east", "garden-2", agent.factionId, 0);
            const plan = planAutonomousHaloTravel(state, [east]);
            assert.equal(plan, undefined);
          });

          test("unknown destination remains eligible when the source has no return storage", () => {
            const { state, agent } = fixture();
            fillFactionStorage(state, agent.factionId);
            const east = halo(state, "east", "garden-2", agent.factionId, undefined);
            const plan = planAutonomousHaloTravel(state, [east]);
            assert.ok(plan);
            assert.equal(plan.neighborRegionId, "garden-2");
          });

          test("known-full destination remains eligible when source return capacity exists", () => {
            const { state, agent } = fixture();
            fillFactionStorage(state, agent.factionId);
            state.structures.push({
              id: "expedition-return-buffer",
              factionId: agent.factionId,
              type: "storehouse",
              position: hexGridCenter(state),
              status: "active",
              progress: 1,
              requiredProgress: 1,
              storage: { wood: 0, stone: 0, food: 0 },
            });
            const east = halo(state, "east", "garden-2", agent.factionId, 0);
            const plan = planAutonomousHaloTravel(state, [east]);
            assert.ok(plan);
            assert.equal(plan.neighborRegionId, "garden-2");
          });
          '''
          test.write_text(t)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified improvement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy-region.ts tests/autonomy-region-storage-headroom-summary.test.mjs
          git diff --cached --check
          git commit -m "fix: avoid expeditions without a cargo sink"
          git push origin HEAD:main
