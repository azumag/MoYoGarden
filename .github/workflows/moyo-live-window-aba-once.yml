name: MoYo live region window ABA one-shot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-live-window-aba-once.yml

permissions:
  contents: write

concurrency:
  group: moyo-live-window-aba-once
  cancel-in-progress: false

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch live region window request versioning
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('public/app.js')
          app = app_path.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          app = replace_once(
              app,
              'let terrainWindowRequestVersion = 0;\nlet regionTransitionVersion = 0;',
              'let terrainWindowRequestVersion = 0;\nlet liveRegionWindowRequestVersion = 0;\nlet regionTransitionVersion = 0;',
              'request version declarations',
          )

          app = replace_once(
              app,
              '''async function loadRegionWindow() {
            if (!app.state || app.regions.length < 2) {
              liveNeighborSimulation?.setCenter(app.region);
              return;
            }
            const requestedRegion = app.region;
            try {
              const payload = await requestJson("/api/world/window?radius=1&live=1", {}, 10_000);
              if (requestedRegion !== app.region) return;
              liveNeighborSimulation?.syncWindow(payload, app.region, LIVE_REGION_WINDOW_REFRESH_MS);
              refreshNearTerrainFromLive(payload);
            } catch (error) {
              console.debug("MoYoGarden live neighbor window skipped", error);
            }
          }''',
              '''async function loadRegionWindow() {
            if (!app.state || app.regions.length < 2) {
              liveNeighborSimulation?.setCenter(app.region);
              return;
            }
            const requestedRegion = app.region;
            const requestVersion = ++liveRegionWindowRequestVersion;
            try {
              const payload = await requestJson("/api/world/window?radius=1&live=1", {}, 10_000);
              if (requestVersion !== liveRegionWindowRequestVersion || requestedRegion !== app.region) return;
              liveNeighborSimulation?.syncWindow(payload, app.region, LIVE_REGION_WINDOW_REFRESH_MS);
              refreshNearTerrainFromLive(payload);
            } catch (error) {
              console.debug("MoYoGarden live neighbor window skipped", error);
            }
          }''',
              'loadRegionWindow',
          )

          app = replace_once(
              app,
              '''async function connect() {
            regionTransitionVersion += 1;
            terrainWindowRequestVersion += 1;''',
              '''async function connect() {
            regionTransitionVersion += 1;
            terrainWindowRequestVersion += 1;
            liveRegionWindowRequestVersion += 1;''',
              'connect invalidation',
          )

          app = replace_once(
              app,
              '''  const transitionVersion = ++regionTransitionVersion;
            terrainWindowRequestVersion += 1;''',
              '''  const transitionVersion = ++regionTransitionVersion;
            terrainWindowRequestVersion += 1;
            liveRegionWindowRequestVersion += 1;''',
              'transition invalidation',
          )

          app_path.write_text(app)

          test_path = Path('tests/seamless-region-transition.test.mjs')
          test = test_path.read_text()
          test = replace_once(
              test,
              '''  assert.match(appSource, /let terrainWindowRequestVersion = 0;/);
            assert.match(appSource, /let regionTransitionVersion = 0;/);''',
              '''  assert.match(appSource, /let terrainWindowRequestVersion = 0;/);
            assert.match(appSource, /let liveRegionWindowRequestVersion = 0;/);
            assert.match(appSource, /let regionTransitionVersion = 0;/);''',
              'test declarations',
          )
          test = replace_once(
              test,
              '''  const connectBody = functionBody(appSource, "connect", "async function transitionRegion");
            assert.match(connectBody, /regionTransitionVersion \\+= 1;/);
            assert.match(connectBody, /terrainWindowRequestVersion \\+= 1;/);''',
              '''  const liveWindowBody = functionBody(appSource, "loadRegionWindow", "function startRegionWindowRefresh");
            assert.match(liveWindowBody, /const requestVersion = \\+\\+liveRegionWindowRequestVersion;/);
            assert.match(
              liveWindowBody,
              /requestVersion !== liveRegionWindowRequestVersion \\|\\| requestedRegion !== app\\.region/,
            );

            const connectBody = functionBody(appSource, "connect", "async function transitionRegion");
            assert.match(connectBody, /regionTransitionVersion \\+= 1;/);
            assert.match(connectBody, /terrainWindowRequestVersion \\+= 1;/);
            assert.match(connectBody, /liveRegionWindowRequestVersion \\+= 1;/);''',
              'test live window guard',
          )
          test = replace_once(
              test,
              '''  assert.match(transitionBody, /const transitionVersion = \\+\\+regionTransitionVersion;/);
            assert.match(transitionBody, /terrainWindowRequestVersion \\+= 1;/);''',
              '''  assert.match(transitionBody, /const transitionVersion = \\+\\+regionTransitionVersion;/);
            assert.match(transitionBody, /terrainWindowRequestVersion \\+= 1;/);
            assert.match(transitionBody, /liveRegionWindowRequestVersion \\+= 1;/);''',
              'test transition invalidation',
          )
          test_path.write_text(test)
          PY
      - name: Focused regression
        run: node --test tests/seamless-region-transition.test.mjs
      - name: Full validation
        run: |
          git diff --check
          npm run build
      - name: Commit validated product change
        shell: bash
        run: |
          rm .github/workflows/moyo-live-window-aba-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js tests/seamless-region-transition.test.mjs .github/workflows/moyo-live-window-aba-once.yml
          git diff --cached --check
          git commit -m 'fix: ignore stale live region window responses'
          git push origin HEAD:main
