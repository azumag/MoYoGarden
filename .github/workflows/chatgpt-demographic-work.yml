name: ChatGPT demographic work availability

on:
  push:
    paths:
      - ".github/workflows/chatgpt-demographic-work.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply patch
        run: python3 scripts/chatgpt-demographic-work.py
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit product change
        run: |
          git config user.name "chatgpt-codex-connector[bot]"
          git config user.email "chatgpt-codex-connector[bot]@users.noreply.github.com"
          rm .github/workflows/chatgpt-demographic-work.yml
          rm scripts/chatgpt-demographic-work.py
          git add src/demography.ts src/simulation.ts tests/population-maintenance.test.mjs tests/population-work-availability.test.mjs .github/workflows/chatgpt-demographic-work.yml scripts/chatgpt-demographic-work.py
          git commit -m "sim: let care pressure reduce work availability"
          git push origin HEAD:main
