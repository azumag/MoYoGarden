name: One-shot live-neighbor animation throttling

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-live-neighbor-animation.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Throttle contextual neighbor animation work
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('public/client/live-region-rendering.js')
          text = path.read_text()

          old = '''const controllers = new WeakMap();\nconst FRAME_PATCH_KEY = "__moyoLiveRegionFramePatched";\n'''
          new = '''const controllers = new WeakMap();\nconst FRAME_PATCH_KEY = "__moyoLiveRegionFramePatched";\n// Radius-one neighbors are contextual scenery rather than the focused simulation.\n// Cap their cheap interpolation/bob pass at 30 Hz so a 60/120/144 Hz display does\n// not multiply CPU work across every BOT in up to six surrounding regions. Root\n// interpolation still samples the current timestamp, so throttling never changes\n// arrival timing or simulation state.\nconst LIVE_NEIGHBOR_ANIMATION_INTERVAL_MS = 1000 / 30;\n'''
          if old not in text:
              raise SystemExit('animation constant insertion point not found')
          text = text.replace(old, new, 1)

          old = '''    this.entries = new Map();\n    this.centerRegionId = null;\n    view.worldRoot.add(this.root);\n'''
          new = '''    this.entries = new Map();\n    this.centerRegionId = null;\n    this.lastAnimationAt = Number.NEGATIVE_INFINITY;\n    view.worldRoot.add(this.root);\n'''
          if old not in text:
              raise SystemExit('constructor insertion point not found')
          text = text.replace(old, new, 1)

          old = '''  animate(time) {\n    for (const entry of this.entries.values()) {\n      for (const agent of entry.proxy.agentObjects.values()) {\n        entry.proxy.animateAgent(agent, time);\n      }\n    }\n  }\n'''
          new = '''  animate(time) {\n    // Soft handoff hides the neighbor root while the next center is prepared; do\n    // no per-BOT work while those objects cannot contribute to the frame.\n    if (!this.root.visible) return;\n    if (time - this.lastAnimationAt < LIVE_NEIGHBOR_ANIMATION_INTERVAL_MS) return;\n    this.lastAnimationAt = time;\n    for (const entry of this.entries.values()) {\n      for (const agent of entry.proxy.agentObjects.values()) {\n        entry.proxy.animateAgent(agent, time);\n      }\n    }\n  }\n'''
          if old not in text:
              raise SystemExit('animate method insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY

          cat >> tests/live-region-window.test.mjs <<'TEST'

          test("contextual live-neighbor BOT animation is capped below the display frame rate", () => {
            assert.match(liveRegionSource, /LIVE_NEIGHBOR_ANIMATION_INTERVAL_MS\s*=\s*1000 \/ 30/);
            assert.match(liveRegionSource, /this\.lastAnimationAt = Number\.NEGATIVE_INFINITY/);
            const animateStart = liveRegionSource.indexOf("  animate(time) {");
            const clearStart = liveRegionSource.indexOf("  clear() {", animateStart);
            assert.ok(animateStart >= 0 && clearStart > animateStart);
            const animateSource = liveRegionSource.slice(animateStart, clearStart);
            assert.match(animateSource, /if \(!this\.root\.visible\) return/);
            assert.match(
              animateSource,
              /time - this\.lastAnimationAt < LIVE_NEIGHBOR_ANIMATION_INTERVAL_MS/,
            );
            assert.match(animateSource, /this\.lastAnimationAt = time/);
            const throttleGuard = animateSource.indexOf("time - this.lastAnimationAt");
            const agentLoop = animateSource.indexOf("for (const entry of this.entries.values())");
            assert.ok(throttleGuard >= 0 && agentLoop > throttleGuard);
          });
          TEST

      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full build and tests
        run: npm run build
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/client/live-region-rendering.js tests/live-region-window.test.mjs
          git rm .github/workflows/one-shot-live-neighbor-animation.yml
          git commit -m "perf: throttle live-neighbor animation work"
          git push origin HEAD:main
