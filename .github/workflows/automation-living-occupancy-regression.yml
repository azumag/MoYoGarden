name: Stage living occupancy regressions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-living-occupancy-regression.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Add regressions
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          settlement_path = Path("tests/settlement-route-crowding.test.mjs")
          settlement = settlement_path.read_text()
          marker = 'dead residents do not bias pioneer seam crowding'
          if marker in settlement:
              raise SystemExit("settlement living-crowding regression already exists")
          settlement_test = textwrap.dedent(r'''
          test("dead residents do not bias pioneer seam crowding", () => {
            const baseline = transitBuilderFixture(26091921);
            baseline.builder.position = { x: 19, y: 11 };
            baseline.state.agents = [baseline.builder];
            const corridorA = { x: 30, y: 9 };
            const corridorB = { x: 30, y: 11 };
            const baselinePlan = planAutonomousSettlementMigration(
              baseline.state,
              eastHalo(corridorA, corridorB),
            );
            assert.ok(baselinePlan);

            const fixture = transitBuilderFixture(26091921);
            fixture.builder.position = { x: 19, y: 11 };
            const dead = fixture.state.agents.filter((agent) => agent.id !== fixture.builder.id).slice(0, 2);
            assert.equal(dead.length, 2);
            for (const resident of dead) {
              resident.autonomy = false;
              resident.hp = 0;
            }
            dead[0].position = { x: 29, y: 9 };
            dead[1].position = { x: 29, y: 10 };
            fixture.state.agents = [fixture.builder, ...dead];

            const plan = planAutonomousSettlementMigration(
              fixture.state,
              eastHalo(corridorA, corridorB),
            );
            assert.ok(plan);
            assert.deepEqual(plan.boundaryTarget, baselinePlan.boundaryTarget);
          });
          ''').lstrip()
          settlement_path.write_text(settlement.rstrip() + "\n\n" + settlement_test)

          autonomy_path = Path("tests/autonomous-halo-travel.test.mjs")
          autonomy = autonomy_path.read_text()
          marker = 'dead BOTs do not bias cross-region resource expedition crowding'
          if marker in autonomy:
              raise SystemExit("autonomy living-crowding regression already exists")
          autonomy_test = textwrap.dedent(r'''
          test("dead BOTs do not bias cross-region resource expedition crowding", () => {
            const baseline = depletedInteriorWoodcutter();
            baseline.state.agents = [baseline.agent];
            const baselineEastCells = hexGridBoundaryCells(baseline.state, "east");
            const baselineWestCells = hexGridBoundaryCells(baseline.state, "west");
            const baselineEast = haloResource(baseline.state, "east", Math.floor(baselineEastCells.length / 2), "garden-2", "wood", 8);
            const baselineWest = haloResource(baseline.state, "west", Math.floor(baselineWestCells.length / 2), "garden-4", "wood", 8);
            const baselinePlan = planAutonomousHaloTravel(baseline.state, [baselineEast, baselineWest]);
            assert.ok(baselinePlan);

            const fixture = depletedInteriorWoodcutter();
            const eastCells = hexGridBoundaryCells(fixture.state, "east");
            const westCells = hexGridBoundaryCells(fixture.state, "west");
            const east = haloResource(fixture.state, "east", Math.floor(eastCells.length / 2), "garden-2", "wood", 8);
            const west = haloResource(fixture.state, "west", Math.floor(westCells.length / 2), "garden-4", "wood", 8);
            const corpse = fixture.state.agents.find((candidate) => candidate.id !== fixture.agent.id);
            assert.ok(corpse);
            corpse.hp = 0;
            corpse.autonomy = false;
            corpse.position = { ...east.sourcePosition };
            fixture.state.agents = [fixture.agent, corpse];

            const plan = planAutonomousHaloTravel(fixture.state, [east, west]);
            assert.ok(plan);
            assert.equal(plan.direction, baselinePlan.direction);
            assert.deepEqual(plan.boundaryTarget, baselinePlan.boundaryTarget);
          });
          ''').lstrip()
          autonomy_path.write_text(autonomy.rstrip() + "\n\n" + autonomy_test)

          halo_path = Path("tests/hex-halo-do.test.mjs")
          halo = halo_path.read_text()
          marker = 'halo support summaries expose only living occupants'
          if marker in halo:
              raise SystemExit("halo living-occupants regression already exists")
          halo_test = textwrap.dedent(r'''
          test("halo support summaries expose only living occupants", async () => {
            const env = environment();
            const initial = await call(env, "/api/world/snapshot?region=garden-2");
            assert.equal(initial.response.status, 200);
            const entry = env.REGIONS.entries.get("garden-2");
            assert.ok(entry);
            await entry.state.ready;

            const state = entry.object.runtime.snapshot();
            const living = state.agents.filter((agent) => agent.hp > 0);
            assert.ok(living.length > 0);
            const corpse = structuredClone(living[0]);
            corpse.id = "dead-halo-occupant";
            corpse.hp = 0;
            state.agents.push(corpse);
            entry.object.runtime = new WorldRuntime({ state });

            const response = await entry.object.fetch(new Request(
              "https://moyo.internal/api/internal/halo/edge?direction=west",
              {
                method: "GET",
                headers: { "x-moyo-region-internal": "garden-2" },
              },
            ));
            assert.equal(response.status, 200);
            const edge = await response.json();
            assert.equal(edge.regionSummary.occupants, living.length);
            assert.equal(
              Object.values(edge.regionSummary.occupantsByFaction ?? {}).reduce((sum, count) => sum + count, 0),
              living.length,
            );
          });
          ''').lstrip()
          halo_path.write_text(halo.rstrip() + "\n\n" + halo_test)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate regressions and build
        run: |
          set -euo pipefail
          npm run build
          git diff --check

      - name: Commit regressions and remove staging workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          rm .github/workflows/automation-living-occupancy-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: lock living cross-region occupancy semantics"
          git push origin HEAD:main
