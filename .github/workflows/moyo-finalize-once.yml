name: MoYoGarden finalize return storage relay lease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-finalize-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply corrected wall-clock lease patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path

          prefix = ""
          source = Path('.github/workflows/moyo-improve-once.yml').read_text()
          match = re.search(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', source)
          if match is None:
              raise SystemExit('embedded patch payload not found')
          code = base64.b64decode(prefix + match.group(1)).decode()
          obsolete = '''one(
"""      // Source-return capacity follows the physical cargo too. Supply
      // settlement means the resource was gathered; it does not mean the
      // promised source storage is free for another expedition yet.
      const returnCargoOutstanding =
        updatedClaim.returnToSourceStorage === true
        && gatheredAmount > 0
        && agent !== undefined
        && agent.inventory[updatedClaim.resource] > 0;
      if (returnCargoOutstanding) {
""",
"""      // Source-return capacity follows the physical cargo too. Supply
      // settlement means the resource was gathered; it does not mean the
      // promised source storage is free for another expedition yet.
      if (returnCargoOutstanding) {
""")

'''
          if code.count(obsolete) != 1:
              raise SystemExit(f'expected one obsolete replacement block, got {code.count(obsolete)}')
          code = code.replace(obsolete, '', 1)
          exec(compile(code, '<moyo-improve-once>', 'exec'))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified implementation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/moyo-improve-once.yml .github/workflows/moyo-fix-once.yml .github/workflows/moyo-diagnose-once.yml .github/workflows/moyo-finalize-once.yml .moyo-patch-error
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'sim: renew return storage across relay delays'
          git push origin HEAD:main
