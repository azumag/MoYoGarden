name: MoYoGarden retry demographic traits

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-traits-retry-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply corrected bounded heritable traits patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/moyo-traits-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          script = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          )
          bad = "Path(\"tests/population-traits.test.mjs\").write_text(r'''"
          good = "Path(\"tests/population-traits.test.mjs\").write_text('''"
          if bad not in script:
              raise SystemExit('expected raw test writer not found')
          script = script.replace(bad, good, 1)
          exec(compile(script, 'embedded-trait-patch.py', 'exec'))
          PY
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified improvement
        shell: bash
        run: |
          rm .github/workflows/moyo-traits-once.yml .github/workflows/moyo-traits-retry-once.yml
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git add src/protocol.ts src/demography.ts src/runtime.ts tests/population-traits.test.mjs .github/workflows/moyo-traits-once.yml .github/workflows/moyo-traits-retry-once.yml
          git diff --cached --check
          git commit -m "sim: inherit bounded demographic traits"
          git push origin HEAD:main
