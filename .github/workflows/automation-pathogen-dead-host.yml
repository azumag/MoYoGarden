name: Automation pathogen dead-host patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/automation-pathogen-dead-host.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply dead-host pathogen lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pathogen.ts')
          text = path.read_text()

          old = '''    const climatePersistence = pathogenClimatePersistence(agent.position, environment);\n    const directContact = localContactExposure(contactIndex, agent, environment);\n    const environmentalExposure = localReservoirExposure(previousReservoir, agent.position);\n    const contact = unionPressure(directContact, environmentalExposure) *\n      clamp01(1 - currentImmunity * PATHOGEN_IMMUNITY_MAX_EFFECT);\n'''
          new = '''    const climatePersistence = pathogenClimatePersistence(agent.position, environment);\n    // A dead Agent is no longer an active host. Existing burden may continue to\n    // decay as residual biological/environmental state, but neither local contact\n    // nor contaminated ground can create new burden after death. This mirrors the\n    // existing no-shedding rule and keeps death as one shared epidemiological gate.\n    const isAlive = agent.hp > 0;\n    const directContact = isAlive ? localContactExposure(contactIndex, agent, environment) : 0;\n    const environmentalExposure = isAlive\n      ? localReservoirExposure(previousReservoir, agent.position)\n      : 0;\n    const contact = unionPressure(directContact, environmentalExposure) *\n      clamp01(1 - currentImmunity * PATHOGEN_IMMUNITY_MAX_EFFECT);\n'''
          if old not in text:
              raise SystemExit('local exposure target not found')
          text = text.replace(old, new, 1)

          old = '''    if (next >= PATHOGEN_SYMPTOM_THRESHOLD && agent.energy > 0) {\n'''
          new = '''    if (isAlive && next >= PATHOGEN_SYMPTOM_THRESHOLD && agent.energy > 0) {\n'''
          if old not in text:
              raise SystemExit('symptom energy target not found')
          text = text.replace(old, new, 1)

          old = '''  for (const agent of state.agents) {\n    const pressure = haloPressure.get(positionKey(agent.position)) ?? 0;\n'''
          new = '''  for (const agent of state.agents) {\n    // Halo contact follows the same host-liveness rule as local contact. A dead\n    // BOT can share a seam with a living one without absorbing new remote burden.\n    if (agent.hp <= 0) continue;\n    const pressure = haloPressure.get(positionKey(agent.position)) ?? 0;\n'''
          if old not in text:
              raise SystemExit('halo exposure target not found')
          text = text.replace(old, new, 1)

          old = ''' * infectious burden builds bounded, slowly waning protection that reduces direct,\n * environmental and halo exposure.\n */\n'''
          new = ''' * infectious burden builds bounded, slowly waning protection that reduces direct,\n * environmental and halo exposure. Dead Agents neither shed nor acquire new\n * contact/reservoir burden; any burden already present only decays.\n */\n'''
          if old not in text:
              raise SystemExit('documentation target not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('tests/pathogen-propagation.test.mjs')
          tests = test_path.read_text()
          addition = r'''

test("dead agents do not acquire new local, reservoir, or halo pathogen burden", () => {
  const directTarget = agent("dead-direct", { x: 1, y: 0 });
  directTarget.hp = 0;
  applyPathogenSteps({
    agents: [agent("living-carrier", { x: 0, y: 0 }, 1), directTarget],
  }, 1);
  assert.equal(
    agentPathogenLoad(directTarget),
    0,
    "death should gate ordinary six-neighbor acquisition as well as shedding",
  );

  const reservoirTarget = agent("dead-reservoir", { x: 0, y: 0 });
  reservoirTarget.hp = 0;
  applyPathogenSteps({
    agents: [reservoirTarget],
    tiles: [{ x: 0, y: 0, pathogenReservoir: 1 }],
  }, 1);
  assert.equal(
    agentPathogenLoad(reservoirTarget),
    0,
    "a corpse on contaminated ground must not become newly infected",
  );

  const haloTarget = agent("dead-halo", { x: 30, y: 11 });
  haloTarget.hp = 0;
  applyPathogenSteps(
    { agents: [haloTarget] },
    0,
    undefined,
    new Map([["30,11", 1]]),
    1,
    new Map([["30,11", 1]]),
  );
  assert.equal(
    agentPathogenLoad(haloTarget),
    0,
    "living seam neighbors may still trigger a halo read without mutating a co-located corpse",
  );
});
'''
          marker = 'test("pathogen halo maps exact neighbor edge pressure onto the paired local boundary cell", () => {'
          if addition.strip() in tests:
              raise SystemExit('test already present')
          if marker not in tests:
              raise SystemExit('test insertion marker not found')
          tests = tests.replace(marker, addition + '\n' + marker, 1)
          test_path.write_text(tests)
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit tested patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tsubasa Azumagakito"
          git config user.email "azumag@users.noreply.github.com"
          git rm .github/workflows/automation-pathogen-dead-host.yml
          git add src/pathogen.ts tests/pathogen-propagation.test.mjs
          git commit -m "sim: keep dead agents from acquiring pathogens"
          git push origin HEAD:main
