name: MoYoGarden one-shot test diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-test-diagnose-once.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply corrected patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import re
          from pathlib import Path
          prefix = ""
          source = Path('.github/workflows/moyo-improve-once.yml').read_text()
          match = re.search(r'base64\.b64decode\("([A-Za-z0-9+/=]+)"\)', source)
          code = base64.b64decode(prefix + match.group(1)).decode()
          obsolete = base64.b64decode("").decode()
          code = code.replace(obsolete, '', 1)
          exec(compile(code, '<moyo-improve-once>', 'exec'))
          p = Path('src/autonomy-region.ts')
          s = p.read_text()
          needle = 'const returnCargoOutstanding ='
          positions = []
          cursor = 0
          while True:
              pos = s.find(needle, cursor)
              if pos < 0: break
              positions.append(pos); cursor = pos + len(needle)
          if len(positions) != 2: raise SystemExit(f'expected 2 declarations, got {len(positions)}')
          second = positions[1]
          line_start = s.rfind('\n', 0, second) + 1
          statement_end = s.find(';\n', second)
          s = s[:line_start] + s[statement_end + 2:]
          p.write_text(s)
          PY
      - name: Capture build output
        shell: bash
        run: |
          set +e
          npm install --no-audit --no-fund >/tmp/install.log 2>&1
          npm run build >/tmp/build.log 2>&1
          status=$?
          { echo "BUILD_STATUS=$status"; tail -n 400 /tmp/build.log; } > .moyo-build-error2
          exit 0
      - name: Persist build diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .moyo-build-error2
          git commit -m 'chore: capture return-storage test diagnostic'
          git push origin HEAD:main
