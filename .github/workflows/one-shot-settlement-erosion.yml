name: One-shot settlement erosion improvement

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-settlement-erosion.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connect erosion pressure to settlement migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/settlement-migration.ts')
          text = path.read_text()

          replacements = [
            (
              'const SETTLEMENT_DRAINAGE_EPSILON = 1e-6;\nconst SETTLEMENT_PATHOGEN_EPSILON = 1e-6;\n',
              'const SETTLEMENT_DRAINAGE_EPSILON = 1e-6;\nconst SETTLEMENT_EROSION_EPSILON = 1e-6;\nconst SETTLEMENT_PATHOGEN_EPSILON = 1e-6;\n',
            ),
            (
              '  drainageTotal: number;\n  drainageSamples: number;\n  pathogenReservoirTotal: number;\n',
              '  drainageTotal: number;\n  drainageSamples: number;\n  erosionPressureTotal: number;\n  erosionPressureSamples: number;\n  pathogenReservoirTotal: number;\n',
            ),
            (
              '    drainageTotal: 0,\n    drainageSamples: 0,\n    pathogenReservoirTotal: 0,\n',
              '    drainageTotal: 0,\n    drainageSamples: 0,\n    erosionPressureTotal: 0,\n    erosionPressureSamples: 0,\n    pathogenReservoirTotal: 0,\n',
            ),
            (
              '  if (Number.isFinite(tile.drainage ?? Number.NaN)) {\n    support.drainageTotal += Math.max(0, Math.min(1, tile.drainage ?? 0));\n    support.drainageSamples += 1;\n  }\n  const pathogenReservoir = pathogenReservoirSample(tile);\n',
              '  if (Number.isFinite(tile.drainage ?? Number.NaN)) {\n    support.drainageTotal += Math.max(0, Math.min(1, tile.drainage ?? 0));\n    support.drainageSamples += 1;\n  }\n  if (Number.isFinite(tile.erosionPressure ?? Number.NaN)) {\n    support.erosionPressureTotal += Math.max(0, Math.min(1, tile.erosionPressure ?? 0));\n    support.erosionPressureSamples += 1;\n  }\n  const pathogenReservoir = pathogenReservoirSample(tile);\n',
            ),
            (
              'function averagePathogenReservoir(support: SettlementNeighborSupport): number {\n',
              'function averageErosionPressure(support: SettlementNeighborSupport): number {\n  return support.erosionPressureSamples > 0\n    ? support.erosionPressureTotal / support.erosionPressureSamples\n    : 0;\n}\n\nfunction compareAverageErosionPressure(\n  a: SettlementNeighborSupport,\n  b: SettlementNeighborSupport,\n): number {\n  if (a.erosionPressureSamples === 0 || b.erosionPressureSamples === 0) return 0;\n  const delta = averageErosionPressure(a) - averageErosionPressure(b);\n  return Math.abs(delta) > SETTLEMENT_EROSION_EPSILON ? delta : 0;\n}\n\nfunction averagePathogenReservoir(support: SettlementNeighborSupport): number {\n',
            ),
            (
              '  if (candidate.pathogenReservoirSamples > 0 && local.pathogenReservoirSamples > 0) {\n    const candidatePathogen = averagePathogenReservoir(candidate);\n    const localPathogen = averagePathogenReservoir(local);\n    if (candidatePathogen < localPathogen - SETTLEMENT_PATHOGEN_EPSILON) return true;\n    if (candidatePathogen > localPathogen + SETTLEMENT_PATHOGEN_EPSILON) return false;\n  }\n\n  const waterFractionDelta = surfaceWaterFraction(candidate) - surfaceWaterFraction(local);\n',
              '  if (candidate.pathogenReservoirSamples > 0 && local.pathogenReservoirSamples > 0) {\n    const candidatePathogen = averagePathogenReservoir(candidate);\n    const localPathogen = averagePathogenReservoir(local);\n    if (candidatePathogen < localPathogen - SETTLEMENT_PATHOGEN_EPSILON) return true;\n    if (candidatePathogen > localPathogen + SETTLEMENT_PATHOGEN_EPSILON) return false;\n  }\n\n  if (candidate.erosionPressureSamples > 0 && local.erosionPressureSamples > 0) {\n    const candidateErosion = averageErosionPressure(candidate);\n    const localErosion = averageErosionPressure(local);\n    if (candidateErosion < localErosion - SETTLEMENT_EROSION_EPSILON) return true;\n    if (candidateErosion > localErosion + SETTLEMENT_EROSION_EPSILON) return false;\n  }\n\n  const waterFractionDelta = surfaceWaterFraction(candidate) - surfaceWaterFraction(local);\n',
            ),
            (
              '    || compareAveragePathogenReservoir(a, b)\n    || compareResourceAmountDensity(a, b, "food")\n',
              '    || compareAveragePathogenReservoir(a, b)\n    || compareAverageErosionPressure(a, b)\n    || compareResourceAmountDensity(a, b, "food")\n',
            ),
          ]

          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'expected settlement migration fragment not found:\n{old}')
            text = text.replace(old, new, 1)
          path.write_text(text)

          docs = Path('src/settlement-migration-support.md')
          doc = docs.read_text()
          old = '''3. average pathogen reservoir when both sides have samples;\n4. live food / wood / stone density (`amount / passableCells`), using the same small-noise rule so negligible live-supply differences do not mask meaningful environmental differences;\n5. average drainage when both sides have samples;\n6. surface-water fraction (`waterCells / observedCells`).\n'''
          new = '''3. average pathogen reservoir when both sides have samples;\n4. average erosion pressure when both sides have samples, preferring land that is currently less exposed to drainage/slope-driven soil loss;\n5. live food / wood / stone density (`amount / passableCells`), using the same small-noise rule so negligible live-supply differences do not mask meaningful environmental differences;\n6. average drainage when both sides have samples;\n7. surface-water fraction (`waterCells / observedCells`).\n'''
          if old not in doc:
            raise SystemExit('expected support scoring documentation fragment not found')
          docs.write_text(doc.replace(old, new, 1))
          PY

          cat > tests/settlement-migration-erosion.test.mjs <<'TEST'
          import assert from "node:assert/strict";
          import test from "node:test";
          import { isHexGridCell } from "../dist-ts/src/hex-grid.js";
          import { planAutonomousSettlementMigration } from "../dist-ts/src/settlement-migration.js";
          import { createInitialWorld } from "../dist-ts/src/world.js";

          function transitPioneerFixture() {
            const state = createInitialWorld({ seed: 260914, width: 40, height: 24 });
            for (const tile of state.tiles) {
              if (!isHexGridCell(state, tile)) continue;
              tile.terrain = "plain";
              tile.drainage = 0.1;
              tile.erosionPressure = 0.5;
              tile.resource = { kind: "food", amount: 5, maxAmount: 20 };
            }

            const builder = state.agents.find((agent) => agent.role === "builder");
            assert.ok(builder);
            state.regionId = "hex-q0-r0";
            state.agents = [builder];
            state.structures = [];
            state.tick = 25;
            builder.autonomy = true;
            builder.energy = 100;
            builder.position = { x: 19, y: 11 };
            builder.inventory = { wood: 8, stone: 4, food: 0 };
            builder.task = {
              source: "autonomy",
              issuedAtTick: state.tick,
              type: "build",
              structureType: "camp",
            };
            return { state, builder };
          }

          function frontier(direction, regionId, sourcePosition, neighborPosition, erosionPressure) {
            return {
              direction,
              sourcePosition,
              neighborRegionId: regionId,
              neighborPosition,
              tile: {
                ...neighborPosition,
                terrain: "plain",
                elevation: 0.5,
                drainage: 0.1,
                erosionPressure,
                resource: { kind: "food", amount: 5, maxAmount: 20 },
              },
            };
          }

          test("transit pioneer continues toward lower erosion pressure when durable support ties", () => {
            const { state, builder } = transitPioneerFixture();
            const plan = planAutonomousSettlementMigration(state, [
              frontier("E", "hex-q1-r0", { x: 30, y: 11 }, { x: 8, y: 11 }, 0.2),
              frontier("W", "hex-q-1-r0", { x: 8, y: 11 }, { x: 30, y: 11 }, 0.1),
            ]);

            assert.ok(plan);
            assert.equal(plan.agentId, builder.id);
            assert.equal(plan.neighborRegionId, "hex-q-1-r0");
            assert.equal(plan.direction, "W");
          });

          test("higher erosion pressure blocks continuation when all earlier support signals tie", () => {
            const { state } = transitPioneerFixture();
            const plan = planAutonomousSettlementMigration(state, [
              frontier("E", "hex-q1-r0", { x: 30, y: 11 }, { x: 8, y: 11 }, 0.8),
            ]);

            assert.equal(plan, undefined);
          });
          TEST
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Full build and tests
        run: npm run build
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/settlement-migration.ts src/settlement-migration-support.md tests/settlement-migration-erosion.test.mjs
          git commit -m "sim: avoid erosion-prone settlement frontiers"
          git push origin HEAD:main
