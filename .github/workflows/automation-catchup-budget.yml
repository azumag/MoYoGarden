name: One-shot catch-up wall budget improvement

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automation-catchup-budget.yml

permissions:
  contents: write

jobs:
  improve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply bounded catch-up wall budget
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('src/autonomy-region.ts')
          source = source_path.read_text()
          old_constant = '''// Successful bounded catch-up batches can drain debt promptly without
          // putting dozens of full virtual ticks into one DO invocation. Failed
          // batches keep the normal tick retry to avoid a hot failure loop.
          const CATCH_UP_RETRY_MS = 1_000;
          '''
          new_constant = '''// Successful bounded catch-up batches can drain debt promptly without
          // putting dozens of full virtual ticks into one DO invocation. Failed
          // batches keep the normal tick retry to avoid a hot failure loop.
          const CATCH_UP_RETRY_MS = 1_000;
          // Tick count alone does not bound an Alarm when one historical tick is
          // slowed by cross-DO work. Yield after a modest wall-clock slice and
          // preserve the remaining virtual-time debt for the prompt retry. This
          // leaves headroom for outer pathogen/post-processing layers in the same
          // Durable Object invocation without skipping any simulation ticks.
          const CATCH_UP_WALL_BUDGET_MS = 8_000;
          '''
          if old_constant not in source:
              raise SystemExit('catch-up constant anchor changed; refusing to patch')
          source = source.replace(old_constant, new_constant, 1)

          old_alarm = '''  override async alarm(): Promise<void> {
              const now = Date.now();
              const ticks = this.virtualTicksForAlarm(now);
              const ownsEdgeReadBatch = this.beginHaloEdgeReadBatch();
              let completed = false;
              try {
                for (let index = 0; index < ticks; index += 1) {
                  this.setAlarmRescheduleDeferred(index + 1 < ticks);
                  await this.runSingleAlarmTick();
                }
                completed = true;
              } finally {
                this.setAlarmRescheduleDeferred(false);
                this.endHaloEdgeReadBatch(ownsEdgeReadBatch);
                if (!completed) await this.scheduleCatchUpIfBehind(Date.now());
              }
              await this.scheduleCatchUpIfBehind(Date.now(), CATCH_UP_RETRY_MS);
            }
          '''
          new_alarm = '''  override async alarm(): Promise<void> {
              const now = Date.now();
              const ticks = this.virtualTicksForAlarm(now);
              const batchStartedAt = now;
              const ownsEdgeReadBatch = this.beginHaloEdgeReadBatch();
              let completed = false;
              try {
                for (let index = 0; index < ticks; index += 1) {
                  this.setAlarmRescheduleDeferred(index + 1 < ticks);
                  await this.runSingleAlarmTick();
                  if (
                    index + 1 < ticks
                    && Date.now() - batchStartedAt >= CATCH_UP_WALL_BUDGET_MS
                  ) {
                    break;
                  }
                }
                completed = true;
              } finally {
                this.setAlarmRescheduleDeferred(false);
                this.endHaloEdgeReadBatch(ownsEdgeReadBatch);
                if (!completed) await this.scheduleCatchUpIfBehind(Date.now());
              }
              await this.scheduleCatchUpIfBehind(Date.now(), CATCH_UP_RETRY_MS);
            }
          '''
          if old_alarm not in source:
              raise SystemExit('catch-up alarm anchor changed; refusing to patch')
          source_path.write_text(source.replace(old_alarm, new_alarm, 1))

          test_path = Path('tests/virtual-catchup-do.test.mjs')
          tests = test_path.read_text()
          marker = '''test("caught-up cold regions deep-idle without an alarm and warm access wakes them", async () => {'''
          if marker not in tests:
              raise SystemExit('virtual catch-up test anchor changed; refusing to patch')
          new_test = '''test("slow catch-up yields on wall budget without discarding virtual-time debt", async () => {
            const originalNow = Date.now;
            let now = 1_800_002_500_000;
            Date.now = () => now;
            try {
              const ctx = new MemoryState();
              const object = new RegionDurableObject(ctx, env);
              await ctx.ready;
              await object.fetch(request("/api/world/snapshot"));
              const assignedAt = ctx.storage.values.get("region").lastSimulatedAt;

              now += 600_000;
              const baseTick = object.runtime.tick.bind(object.runtime);
              object.runtime.tick = (...args) => {
                const result = baseTick(...args);
                now += 4_500;
                return result;
              };

              await object.alarm();

              assert.equal(object.runtime.snapshot().tick, 2, "slow historical ticks should yield after the wall budget");
              assert.equal(ctx.storage.values.get("region").lastSimulatedAt, assignedAt + 20_000);
              const health = await (await object.fetch(request("/api/health"))).json();
              assert.ok(health.virtualTicksDue > 0, "unfinished virtual time must remain as debt");
              assert.equal(health.virtualTicksRunnable, 12, "next retry remains bounded by the normal tick cap");
              assert.equal(ctx.storage.alarm, now + 1_000, "yielded debt should retry promptly");
            } finally {
              Date.now = originalNow;
            }
          });

          ''' + marker
          test_path.write_text(tests.replace(marker, new_test, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate implementation
        run: npm run build

      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/automation-catchup-budget.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/virtual-catchup-do.test.mjs .github/workflows/automation-catchup-budget.yml
          git diff --cached --check
          git commit -m 'perf: yield long virtual catch-up batches'
          git push origin HEAD:main
