name: MoYoGarden bounded return storage lease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-finalize3-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply bounded return-storage lease patch
        run: python3 .moyo-return-storage-fix.py
      - name: Debug patched settlement path
        shell: bash
        run: |
          set -euo pipefail
          line=$(grep -n 'private async settleArrivalSourceClaim' src/autonomy-region.ts | cut -d: -f1)
          sed -n "$((line-10)),$((line+90))p" src/autonomy-region.ts
          line2=$(grep -n 'private async activeAutonomousSupplyClaims' src/autonomy-region.ts | cut -d: -f1)
          sed -n "$((line2-5)),$((line2+55))p" src/autonomy-region.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified implementation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .moyo-return-storage-fix.py \
            .github/workflows/moyo-improve-once.yml \
            .github/workflows/moyo-fix-once.yml \
            .github/workflows/moyo-diagnose-once.yml \
            .github/workflows/moyo-finalize-once.yml \
            .github/workflows/moyo-finalize2-once.yml \
            .github/workflows/moyo-finalize3-once.yml \
            .github/workflows/moyo-build-diagnose-once.yml \
            .github/workflows/moyo-test-diagnose-once.yml \
            .github/workflows/moyo-newtest-diagnose-once.yml \
            .github/workflows/moyo-relay-debug-once.yml \
            .github/workflows/moyo-complete-once.yml \
            .moyo-patch-error .moyo-build-error .moyo-build-error2 .moyo-focused-error
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomy-material-return-relay.test.mjs
          git add -A '.github/workflows/moyo-*.yml' '.moyo-*'
          git commit -m 'sim: bound return storage leases across tick skew'
          git push origin HEAD:main
