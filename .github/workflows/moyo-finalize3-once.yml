name: MoYoGarden bounded return storage lease

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/moyo-finalize3-once.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('.github/workflows/moyo-complete-once.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", source, re.S)
          if match is None:
              raise SystemExit('candidate patch script not found')
          lines = match.group(1).splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<bounded-return-storage-patch>', 'exec'))
          PY
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck, test, and build
        run: npm run build
      - name: Commit verified implementation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/moyo-improve-once.yml .github/workflows/moyo-fix-once.yml .github/workflows/moyo-diagnose-once.yml .github/workflows/moyo-finalize-once.yml .github/workflows/moyo-finalize2-once.yml .github/workflows/moyo-finalize3-once.yml .github/workflows/moyo-build-diagnose-once.yml .github/workflows/moyo-test-diagnose-once.yml .github/workflows/moyo-newtest-diagnose-once.yml .github/workflows/moyo-relay-debug-once.yml .github/workflows/moyo-complete-once.yml .moyo-patch-error .moyo-build-error .moyo-build-error2 .moyo-focused-error
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/autonomy-region.ts tests/autonomy-material-return-relay.test.mjs
          git add -A '.github/workflows/moyo-*.yml' '.moyo-*'
          git commit -m 'sim: decouple return storage lease from source ticks'
          git push origin HEAD:main
