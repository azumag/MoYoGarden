name: MoYoGarden prune generated artifacts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/moyo-prune-generated-once.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore only the verified source/test delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=e9c654a854b205a3c1506b1aac72aebc087206ea
          while IFS= read -r path; do
            case "$path" in
              public/client/live-region-rendering.js|tests/live-region-window.test.mjs|.github/workflows/moyo-prune-generated-once.yml)
                continue
                ;;
            esac
            if git cat-file -e "$BASE:$path" 2>/dev/null; then
              git checkout "$BASE" -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path" >/dev/null || true
            fi
          done < <(git diff --name-only "$BASE" HEAD --)
          rm -f .github/workflows/moyo-prune-generated-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prune generated build artifacts"
          git push origin HEAD:main
