name: CI

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moyo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

  one-shot-family-migration:
    name: Apply family migration bundle fix
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: run family migration bundle fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply atomic caregiver-dependent migration patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/settlement-migration.ts')
          source = source_path.read_text()
          old = '''  const priorities = new Map<string, number>();
          const add = (agent: Agent | undefined, priority: number): void => {
            if (
              agent === undefined
              || agent.hp <= 0
              || agent.factionId !== factionId
              || sourceResidentMatchesReference(state, agent, pioneerId)
            ) return;
            const previous = priorities.get(agent.id);
            if (previous === undefined || priority < previous) priorities.set(agent.id, priority);
          };

          for (const relative of state.agents) {
            if (relative.factionId !== factionId || relative.hp <= 0) continue;
            if (sourceResidentMatchesReference(state, relative, pioneerPartnerId)) add(relative, 0);
            if (relative.pregnancy?.partnerId === pioneerId) add(relative, 0);
            if (
              (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
              && relative.parents?.includes(pioneerId)
            ) {
              add(relative, 2);
              const caregiverId = dependentCaregiverId(state, relative);
              add(state.agents.find((agent) => agent.id === caregiverId), 0);
              for (const parentId of relative.parents) {
                if (parentId === pioneerId) continue;
                add(state.agents.find((agent) =>
                  sourceResidentMatchesReference(state, agent, parentId)
                ), 1);
              }
            }
          }

          const followerLimit = Number.isFinite(maxFollowers)
            ? Math.max(0, Math.min(MAX_SETTLEMENT_FAMILY_FOLLOWERS, Math.floor(maxFollowers)))
            : MAX_SETTLEMENT_FAMILY_FOLLOWERS;
          const selected = [...priorities]
            .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]))
            .slice(0, followerLimit)
            .map(([agentId]) => agentId);
'''
          new = '''  const priorities = new Map<string, number>();
          const requiredFollowerLinks = new Map<string, Set<string>>();
          const add = (agent: Agent | undefined, priority: number): void => {
            if (
              agent === undefined
              || agent.hp <= 0
              || agent.factionId !== factionId
              || sourceResidentMatchesReference(state, agent, pioneerId)
            ) return;
            const previous = priorities.get(agent.id);
            if (previous === undefined || priority < previous) priorities.set(agent.id, priority);
          };
          const linkFollowers = (leftId: string, rightId: string): void => {
            if (leftId === rightId || !priorities.has(leftId) || !priorities.has(rightId)) return;
            let left = requiredFollowerLinks.get(leftId);
            if (left === undefined) {
              left = new Set<string>();
              requiredFollowerLinks.set(leftId, left);
            }
            let right = requiredFollowerLinks.get(rightId);
            if (right === undefined) {
              right = new Set<string>();
              requiredFollowerLinks.set(rightId, right);
            }
            left.add(rightId);
            right.add(leftId);
          };

          for (const relative of state.agents) {
            if (relative.factionId !== factionId || relative.hp <= 0) continue;
            if (sourceResidentMatchesReference(state, relative, pioneerPartnerId)) add(relative, 0);
            if (relative.pregnancy?.partnerId === pioneerId) add(relative, 0);
            if (
              (relative.lifeStage === "infant" || relative.lifeStage === "juvenile")
              && relative.parents?.includes(pioneerId)
            ) {
              add(relative, 2);
              const caregiverId = dependentCaregiverId(state, relative);
              const caregiver = state.agents.find((agent) => agent.id === caregiverId);
              add(caregiver, 0);
              if (caregiver !== undefined) linkFollowers(relative.id, caregiver.id);
              for (const parentId of relative.parents) {
                if (parentId === pioneerId) continue;
                add(state.agents.find((agent) =>
                  sourceResidentMatchesReference(state, agent, parentId)
                ), 1);
              }
            }
          }

          const followerLimit = Number.isFinite(maxFollowers)
            ? Math.max(0, Math.min(MAX_SETTLEMENT_FAMILY_FOLLOWERS, Math.floor(maxFollowers)))
            : MAX_SETTLEMENT_FAMILY_FOLLOWERS;
          const ordered = [...priorities]
            .sort((a, b) => a[1] - b[1] || a[0].localeCompare(b[0]));
          const selected: string[] = [];
          const visited = new Set<string>();
          for (const [agentId] of ordered) {
            if (visited.has(agentId)) continue;
            const component: string[] = [];
            const queue = [agentId];
            visited.add(agentId);
            for (let cursor = 0; cursor < queue.length; cursor += 1) {
              const current = queue[cursor];
              if (current === undefined) continue;
              component.push(current);
              const linked = [...(requiredFollowerLinks.get(current) ?? [])]
                .sort((a, b) => a.localeCompare(b));
              for (const linkedId of linked) {
                if (visited.has(linkedId)) continue;
                visited.add(linkedId);
                queue.push(linkedId);
              }
            }
            component.sort((a, b) =>
              (priorities.get(a) ?? Number.MAX_SAFE_INTEGER)
                - (priorities.get(b) ?? Number.MAX_SAFE_INTEGER)
              || a.localeCompare(b)
            );
            // A dependent and the source-side caregiver that currently pays its
            // care cost are a single admission unit. If the destination cannot
            // admit the whole unit, wait for more headroom instead of stranding
            // the dependent by migrating the caregiver alone.
            if (selected.length + component.length > followerLimit) continue;
            selected.push(...component);
          }
'''
          if old not in source:
              raise SystemExit('source replacement target not found')
          source_path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/settlement-family-follow.test.mjs')
          tests = test_path.read_text()
          old_test = '''  assert.deepEqual(limited.agentIds, ["partner"]);
          assert.equal(partner.settlementFamilyTargetRegionId, "hex-q1-r0");
          assert.equal(child.settlementFamilyTargetRegionId, undefined);
          });
'''
          new_test = '''  assert.deepEqual(
            limited.agentIds,
            [],
            "one admission slot must not split an infant from its active caregiver",
          );
          assert.equal(partner.settlementFamilyTargetRegionId, undefined);
          assert.equal(child.settlementFamilyTargetRegionId, undefined);

          const admittedTogether = registerSettlementFamilyFollowers(
            source,
            pioneerId,
            "hex-q1-r0",
            template.factionId,
            globalHandoffAgentId(partner.id, source.regionId),
            2,
          );
          assert.deepEqual(admittedTogether.agentIds, ["partner", "child"]);
          assert.equal(partner.settlementFamilyTargetRegionId, "hex-q1-r0");
          assert.equal(child.settlementFamilyTargetRegionId, "hex-q1-r0");
          });
'''
          if old_test not in tests:
              raise SystemExit('test replacement target not found')
          test_path.write_text(tests.replace(old_test, new_test, 1))
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate full build
        run: npm run build

      - name: Commit validated improvement and restore CI
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/automation-family-migration-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settlement-migration.ts tests/settlement-family-follow.test.mjs .github/workflows/ci.yml .github/workflows/automation-family-migration-bundle.yml
          git commit -m 'sim: keep dependent family migration groups together'
          git push origin HEAD:main

  production:
    name: Verify production commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Wait for Cloudflare production to serve this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          META_URL: https://moyo.bluemoon.works/api/meta
          HEALTH_URL: https://moyo.bluemoon.works/api/health?region=garden-1
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 150); do
            response="$(
              curl -fsS --max-time 10 \
                -H 'cache-control: no-cache' \
                "${META_URL}?ci_run=${GITHUB_RUN_ID}&attempt=${attempt}" \
                || true
            )"
            actual_sha="$(
              printf '%s' "$response" |
                node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => { try { process.stdout.write(JSON.parse(value)?.build?.commit ?? ""); } catch {} });' \
                || true
            )"

            if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
              curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null
              {
                echo "### Production deployment verified"
                echo
                echo "- Commit: \`$EXPECTED_SHA\`"
                echo "- Endpoint: \`$META_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi

            echo "attempt ${attempt}/150: expected=$EXPECTED_SHA actual=${actual_sha:-unavailable}"
            sleep 10
          done

          echo "::error::Production did not serve commit $EXPECTED_SHA within 25 minutes."
          exit 1
