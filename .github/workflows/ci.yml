name: CI

on:
  push:
    branches:
      - main
      - deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moyo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      # No long simulations in CI. Retain the tested code for offline experiments.
      - name: Upload offline evolution canary bundle
        if: github.ref != 'refs/heads/deploy'
        uses: actions/upload-artifact@v6
        with:
          name: evolution-canary-offline-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist-ts/
            src/
            tools/
            tests/
            scripts/
            docs/
            package.json
            tsconfig.json
            README.md
            AGENTS.md

  production:
    name: Verify production commit
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Wait for Cloudflare production to serve this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          META_URL: https://moyo.bluemoon.works/api/meta
          HEALTH_URL: https://moyo.bluemoon.works/api/health?region=garden-1
        shell: bash
        run: |
          set -euo pipefail

          # Workers Builds can legitimately spend up to 20 minutes in a build.
          # Keep a little extra headroom so a healthy but slow production deploy
          # does not become a false-negative GitHub check.
          for attempt in $(seq 1 150); do
            response="$(
              curl -fsS --max-time 10 \
                -H 'cache-control: no-cache' \
                "${META_URL}?ci_run=${GITHUB_RUN_ID}&attempt=${attempt}" \
                || true
            )"
            actual_sha="$(
              printf '%s' "$response" |
                node -e 'let value=""; process.stdin.on("data", chunk => value += chunk).on("end", () => { try { process.stdout.write(JSON.parse(value)?.build?.commit ?? ""); } catch {} });' \
                || true
            )"

            if [[ "$actual_sha" == "$EXPECTED_SHA" ]]; then
              curl -fsS --max-time 10 "$HEALTH_URL" >/dev/null
              {
                echo "### Production deployment verified"
                echo
                echo "- Commit: \`$EXPECTED_SHA\`"
                echo "- Endpoint: \`$META_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Production is serving $EXPECTED_SHA"
              exit 0
            fi

            echo "attempt ${attempt}/150: expected=$EXPECTED_SHA actual=${actual_sha:-unavailable}"
            sleep 10
          done

          echo "::error::Production did not serve commit $EXPECTED_SHA within 25 minutes."
          exit 1
