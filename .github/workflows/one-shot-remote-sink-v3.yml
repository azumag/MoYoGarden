name: One-shot remote sink reservation v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-remote-sink-v3.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 .github/scripts/remote_sink_patch.py
      - name: Remove one-shot helpers
        run: |
          rm .github/scripts/remote_sink_patch.py
          rm .github/workflows/oneshot-remote-sink-reservation.yml
          rm .github/workflows/oneshot-remote-sink-reservation-v2.yml
          rm .github/workflows/one-shot-remote-sink-v3.yml
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify full build
        run: npm run build
      - name: Commit improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sim: retain remote storage reservations through delivery"
          git push origin HEAD:main
