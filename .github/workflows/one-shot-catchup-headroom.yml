name: One-shot catch-up headroom patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-catchup-headroom.yml

permissions:
  contents: write

concurrency:
  group: moyo-one-shot-catchup-headroom
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply catch-up headroom patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/autonomy-region.ts")
          text = source.read_text()

          marker = "    let completed = false;\n    try {\n"
          replacement = "    let completed = false;\n    let slowestTickMs = 0;\n    try {\n"
          if text.count(marker) != 1:
              raise SystemExit(f"expected one catch-up completed marker, found {text.count(marker)}")
          text = text.replace(marker, replacement, 1)

          old_loop = "\n".join([
              "      for (let index = 0; index < ticks; index += 1) {",
              "        this.setAlarmRescheduleDeferred(index + 1 < ticks);",
              "        await this.runSingleAlarmTick();",
              "        if (",
              "          index + 1 < ticks",
              "          && Date.now() - batchStartedAt >= CATCH_UP_WALL_BUDGET_MS",
              "        ) {",
              "          break;",
              "        }",
              "      }",
          ]) + "\n"
          new_loop = "\n".join([
              "      for (let index = 0; index < ticks; index += 1) {",
              "        // Reserve the slowest duration already observed in this batch before",
              "        // starting another historical tick. This cannot cap one unexpectedly",
              "        // slow tick, but it avoids knowingly compounding the overrun.",
              "        const elapsedBeforeTick = Math.max(0, Date.now() - batchStartedAt);",
              "        if (",
              "          index > 0",
              "          && elapsedBeforeTick + slowestTickMs >= CATCH_UP_WALL_BUDGET_MS",
              "        ) {",
              "          break;",
              "        }",
              "        this.setAlarmRescheduleDeferred(index + 1 < ticks);",
              "        const tickStartedAt = Date.now();",
              "        await this.runSingleAlarmTick();",
              "        slowestTickMs = Math.max(",
              "          slowestTickMs,",
              "          Math.max(0, Date.now() - tickStartedAt),",
              "        );",
              "      }",
          ]) + "\n"
          if text.count(old_loop) != 1:
              raise SystemExit(f"expected one catch-up loop, found {text.count(old_loop)}")
          source.write_text(text.replace(old_loop, new_loop, 1))

          test_file = Path("tests/virtual-catchup-do.test.mjs")
          test_text = test_file.read_text()
          replacements = [
              (
                  'test("slow catch-up yields on wall budget without discarding virtual-time debt", async () => {',
                  'test("slow catch-up reserves observed tick headroom without discarding virtual-time debt", async () => {',
              ),
              (
                  'assert.equal(object.runtime.snapshot().tick, 2, "slow historical ticks should yield after the wall budget");',
                  'assert.equal(object.runtime.snapshot().tick, 1, "a 4.5s tick should reserve headroom instead of starting a predictable 9s batch");',
              ),
              (
                  'assert.equal(ctx.storage.values.get("region").lastSimulatedAt, assignedAt + 20_000);',
                  'assert.equal(ctx.storage.values.get("region").lastSimulatedAt, assignedAt + 10_000);',
              ),
          ]
          for old, new in replacements:
              if test_text.count(old) != 1:
                  raise SystemExit(f"expected one test marker: {old!r}; found {test_text.count(old)}")
              test_text = test_text.replace(old, new, 1)
          test_file.write_text(test_text)
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck, test, and build
        run: npm run build

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-catchup-headroom.yml
          git add src/autonomy-region.ts tests/virtual-catchup-do.test.mjs .github/workflows/one-shot-catchup-headroom.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "perf: reserve catch-up tick headroom"
          git push origin HEAD:main
